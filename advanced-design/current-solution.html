# 2. 现有解决方案：拆成 1P / 2P 两套约束

> 面对「同一路径两种模式语义冲突」，最直接的办法就是**承认无法合并，分家**。
> 这一章讲清楚现在怎么拆、报告怎么组织、以及拆开的代价。

## 2.1 做法：两套约束，各自跑各自的

在 HV2M23 上，1P 与 2P 分别用两套约束跑 PT，产物按模式归档：

<div class="flow">
  <div class="fbox"><b>① 1P 约束</b><br/>DPSEL_I=0 · lane0 时钟<br/><code>latest_1p/</code></div>
  <div class="farrow">→</div>
  <div class="fbox"><b>② 2P 约束</b><br/>DPSEL_I=1 · 双 lane 时钟<br/><code>latest_2p/</code></div>
</div>

每个模式各跑 10 个 corner，报告目录结构（postPT 产物）：

```
SYNTHESIS/top/sta/post/pt/<corner>/
├── latest_1p/rpt/setup|hold|skew|trans/   ← 1P 模式报告
└── latest_2p/rpt/setup|hold|skew|trans/   ← 2P 模式报告
```

1P / 2P 报告的差异（真实数据）：

| 维度 | 1P（latest_1p） | 2P（latest_2p） |
|:---|:---|:---|
| 数据来源包 | PACK_TAR_0813V1（1P） | PACK_TAR_0813V0（2P） |
| lane 使用 | 单 lane L0 | 双 lane L0+L1 |
| 时钟组差异 | 多出 `RX0_CLK_DIV1P5_1P`（1P 用 1P5 分频） | `RX0_OD_CLK` / `RX1_OD_CLK` 双份 |
| setup 违例分布 | 时钟组少，分布不同 | 时钟组多，violation 更多样 |

## 2.2 为什么这样能"解决"问题

拆开之后，两个模式的约束互不干扰：

- **1P 约束**：可以对 `CLKGEN_U1/.../SAMP_CNT_reg_*` 设 false path（lane1 不工作，不查）；
- **2P 约束**：不设这个 false path，这些路径真实检查。

矛盾通过「约束分家」被消解——这是最朴素、最不易出错的思路，**也是它最大的优点**。

## 2.3 代价：四处不划算

<div class="pcard warn">
  <div class="prow"><span class="k">代价 1</span><span><b>双份维护</b>：两套 SDC 有大量重复内容，改一处约束往往要同步改另一套，漏改即隐患。</span></div>
  <div class="prow"><span class="k">代价 2</span><span><b>双份运行</b>：10 corner × 2 模式 = 20 次 PT + 2 倍报告归档、解析、汇总工作量。</span></div>
  <div class="prow"><span class="k">代价 3</span><span><b>漏检风险</b>：两条路径若在 1P 下被误删（false path 过宽），2P 下同样漏检——因为「合上 false path」这一步是手工的、易错的。</span></div>
  <div class="prow"><span class="k">代价 4</span><span><b>APR 不认账</b>：APR 只接受一个网表/一套物理实现，拆约束并不能减少后端物理工作量。</span></div>
</div>

其中「代价 3」最危险：false path 的作用域是**整个时序分析**，不分模式。当你 1P 下写
`set_false_path -to SAMP_CNT_reg_*`，如果 2P 那套约束漏了一行配套配置，lane1 真实路径就会
**被无声跳过**，等到流片后出问题才暴露。

## 2.4 拆分的真正本质：把"模式"当成"运行维度"

其实拆 1P/2P 已经隐含了业界标准做法（MMMC）的雏形——**用不同的约束表达不同的工作模式**。
区别只在于：

| 做法 | 约束组织 | 工具支持 | 自动程度 |
|:---|:---|:---|:---|
| 现状（手拆） | 两套独立 SDC，手工切换 | 任何版本 PT | 低（人肉同步） |
| MMMC（标准） | 一个网表 + 多个 mode | ICC2 / PT 原生 | 高（工具统一调度） |

> 所以现状方案并不是"错"，而是"原始"——它用人力换来了正确性。后三章就是在「不损失正确性」
> 的前提下，把人力成本降下来的三条路。

## 2.5 什么时候可以继续用拆分方案

| 场景 | 结论 |
|:---|:---|
| 模式很少（2 个）、模式间路径交集小 | 拆分够用，简单可靠 |
| 项目周期紧、MMMC 流程未建立 | 拆分是最稳的保底 |
| 模式多（≥3）、模式间路径大量重叠 | 拆分维护成本爆炸，必须上 MMMC |
| APR 需要多模式时序收敛 | 拆分无用，直接 MMMC |

<script>
const chapters = [
  ['index', '首页'],
  ['problem', '问题是什么'],
  ['current-solution', '现有方案'],
  ['merge-clock', '方案A·合并时钟'],
  ['maxdelay', '方案B·set_max_delay'],
  ['mmmc', '方案C·MMMC'],
  ['syntax', 'SDC语法库']
];
const currentPath = location.pathname.split('/').pop() || 'index.html';
const linksContainer = document.getElementById('navbar-links');
chapters.forEach(([slug, label]) => {
  const href = slug === 'index' ? './' : `./${slug}.html`;
  const filename = slug === 'index' ? 'index.html' : `${slug}.html`;
  const a = document.createElement('a');
  a.href = href;
  a.textContent = label;
  if (currentPath === filename || currentPath.endsWith('/' + filename)) a.classList.add('active');
  linksContainer.appendChild(a);
});
</script>
<script>
const md = document.getElementById('md').textContent;
document.getElementById('article').innerHTML = marked.parse(md);

const toc = document.getElementById('toc');
const headings = document.querySelectorAll('.article h2, .article h3');
const tocLinks = [];
headings.forEach(h => {
  const id = h.textContent.trim().replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fa5-]/g, '');
  h.id = id;
  const cls = h.tagName === 'H2' ? 'toc-h2' : 'toc-h3';
  const a = document.createElement('a');
  a.href = '#' + id;
  a.textContent = h.textContent;
  a.className = cls;
  toc.appendChild(a);
  tocLinks.push(a);
});

tocLinks.forEach((link, i) => {
  if (!link.classList.contains('toc-h2')) return;
  const children = [];
  for (let j = i + 1; j < tocLinks.length && tocLinks[j].classList.contains('toc-h3'); j++) children.push(tocLinks[j]);
  if (!children.length) return;
  link.classList.add('toc-parent');
  const arrow = document.createElement('span');
  arrow.className = 'toc-arrow';
  arrow.textContent = '▸';
  link.prepend(arrow);
  children.forEach(c => c.parentLink = link);
  arrow.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const collapsed = link.classList.toggle('collapsed');
    children.forEach(c => c.style.display = collapsed ? 'none' : '');
  });
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(l => l.classList.remove('active'));
      let active = tocLinks.find(a => a.getAttribute('href') === '#' + entry.target.id);
      if (active && active.style.display === 'none' && active.parentLink) active = active.parentLink;
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-10% 0px -75% 0px' });
headings.forEach(h => observer.observe(h));
</script>
<script>
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;
function openLightbox(src) { lbImg.src = src; scale = 1; translateX = 0; translateY = 0; updateTransform(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; }
function updateTransform() { lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }
document.addEventListener('click', (e) => { const img = e.target.closest('img'); if (!img || img.id === 'lightbox-img' || !img.closest('.article')) return; openLightbox(img.src); });
lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
lightbox.addEventListener('wheel', (e) => { e.preventDefault(); const d = e.deltaY > 0 ? -0.12 : 0.12; scale = Math.min(Math.max(0.5, scale + d), 5); updateTransform(); });
lbImg.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - translateX; startY = e.clientY - translateY; lbImg.classList.add('grabbing'); e.preventDefault(); });
document.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = e.clientX - startX; translateY = e.clientY - translateY; updateTransform(); });
document.addEventListener('mouseup', () => { isDragging = false; lbImg.classList.remove('grabbing'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox(); });
</script>

  <script>
(function() {
  const saved = localStorage.getItem('ad-theme');
  document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
  const btn = document.getElementById('theme-toggle');
  function sync() {
    const cur = document.documentElement.getAttribute('data-theme');
    btn.textContent = cur === 'dark' ? '☀️' : '🌙';
  }
  btn.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('ad-theme', next);
    sync();
  });
  sync();
})();
  </script>
