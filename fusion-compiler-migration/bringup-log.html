# FC 首跑排障实录：一个下午，五道关卡

> 前一篇《Fusion Compiler 引入评估实录》讲的是"为什么引入、怎么搭骨架"；这一篇讲骨架放到服务器上真正通电之后发生的事。时间：2026-09-02 下午；对象：HV2M23_digital_top 综合流程。**结论先行：NDM 参考库已建成，FC 流程已推进到 elaborate 之后的 link 阶段**——每一道坎的报错码、根因与处置都记录在案。

## 1. 下午时间线

| 序 | 事件 | 结果 |
|---|---|---|
| 起 | bsub 首跑 `run_fc` | ✅ 意外之喜：license 已被 IT 配好 |

| 关2 | check_workspace 要求 physical library（LM-010） | ❌ → 补读 cell LEF |

| 转机 | 在库里发现 `milkyway_techfiles/tech/*.tf` | ✅ 这套库是**双流程打包**的！ |

## 3. 三个认知

1. **db→NDM 是绕不过去的墙。** fc_shell 世界的"库"就是 NDM；.db 只能当原料，在 icc2_lm_shell 里一次性转成 NDM（`create_workspace → read_db/read_lef → check → commit`）。这是一次性投入，之后所有综合复用。
2. **库包是双流程的，"找不到"往往是"没找对地方"。** 顶层目录里 Cadence 系的 `cdk/lef` 一眼可见，Synopsys 系的 `milkyway_techfiles/ccs_db/nldm_db` 藏在旁边——找对视角，`create_workspace -technology` 的原料一直都在。
3. **工具迁移的差异集中在"流程动词"，"名词"基本平移。** `define_design_lib`/`set_top_module`/`link_block` 这些流程动词需要逐个对照 fc_shell 的说法；而约束、dont_use、报告这类"名词"直接搬过来就能跑。每次 CMD-005 就是在消一条迁移 TODO。

## 4. 心路历程（下午版）

> 这一段不谈技术，谈节奏和心态，写给未来同样要做工具迁移的自己。

**第一反应是"跑一下试试"。** 骨架搭完那天其实心里没底：66 处 `TODO(FC-CONFIRM)` 像悬着的雷。真正跑起来才发现，雷的分布比想象的友好——它不在"名词"里，而在"流程动词"和"库"里。

**license 通了的那一下是强心针。** 之前一直按"license 没好"做心理建设，结果 bsub 一跑 banner 直接出来了。但紧接着 read_db 就给我泼了冷水：连"读库"这个最基础的动作，fc_shell 都不认识。那一刻才真正理解了 FC 和 DC 的代差——**不是一个工具的升级，是一套世界观的切换**（.db 单文件世界 → NDM 库容器世界）。

**掉进 exploration 陷阱是下午最憋屈的一段。** `-flow logic_only` 不存在；照着报错把合法值列出来试 exploration，结果 check/commit 全是"废弃 no-op"，workspace 建了又"没有 workspace 可处理"，绕了一大圈才发现根 workspace 压根不能产出。教训：**报错信息给的合法值列表 ≠ 推荐用法**。

**"我们是 Cadence APR"这句话救了场。** 在我准备继续跟 LM 死磕的时候，同事一句"我们 APR 是 Innovus 的"点醒了搜索方向——不该找"Synopsys 专用的库"，而该在这套库里找"任何 Synopsys 能吃的东西"。`milkyway_techfiles` 一冒出来，整条路瞬间从死局变活局：工艺文件有，cell LEF 有，.db 有，normal 流程全套能跑。

**最后三道坎的节奏已经完全不同了。** define_design_lib → 注释；set_top_module → 插一行；set_register_merging → catch 一把。从"报错即停"到"报错即修一行再跑"，中午还在担心"要不要放弃 NDM 路线"，下午后半程已经进入流水线节奏。这种从"摸黑"到"手感"的转变，大概就是做一次工具评估最有价值的产出——**它证明这条路的每一步都是可复现的，而且有人走通过一遍**。

**还没到开香槟的时候。** 约束段（大量 DC 专有约束命令）是下一个雷区，RAM 库还没进 NDM，金属叠构还没和 APR 对齐。但今天的日志已经把"不确定性"压缩成了"待办清单"。

## 7. FC 与 DC 的差异清单（需要重视）

> 这一节是整篇实录的沉淀重点。差异分两类：**报错型**差异（一跑就炸，逼你当场修）和**静默型**差异（不报错，但你以为的行为和实际行为不一致——后者更危险）。DLY0 事件把两类都演全了。

### 7.1 已确认差异（全部服务器实测）

| # | 差异点 | DC 行为 | FC 行为 | 处置 |
|---|---|---|---|---|
| D1 | 库格式 | .db 单文件，`link_library` 直接挂 | 只认 NDM 参考库 | 一次性 `icc2_lm_shell` 建 NDM（`gen_ndm_lm.tcl`） |
| D2 | 顶层指定 | `current_design` 隐式即可 | elaborate 后必须 `set_top_module`（DES-203） | link 前插入 |
| D3 | WORK 库映射 | `define_design_lib WORK` | 命令不存在（CMD-005）；analyze 结果直接进 design library | 注释掉 |
| D4 | **空匹配语义** | `get_cells` 零匹配 → 警告 + `set_dont_touch` 静默 no-op | `get_cells` 零匹配 → `set_dont_touch` 报 SEL-005，**掐死整个 source 的脚本** | `set_dont_touch`/`set_disable_timing` 装 DC 语义桥（catch + skip） |
| D5 | set_register_merging 对象 | `[get_designs]` 可用 | `[get_designs]` 类型不匹配（SEL-002） | catch 容错跳过，留 TODO |
| D6 | 选项体系 | `set_compile_ultra_*` 等 DC 变量 | FC 用 `set_app_options`；`hdlin.enable_vpp` 不存在 | 逐条翻译 + catch 容错 |
| D7 | 综合命令 | `compile_ultra -to ...` | `compile_fusion -to ...`（clock gating 自动插入） | `kv_compile_fusion` |
| D8 | 错误检查 | `check_error` 内建 | fc_shell 没有 | 全部 catch/err_msg 守卫 |
| D9 | 输出格式 | 可写 DDC | 不支持 DDC；`save_block`/`save_lib` | 输出文件名与 DC 保持一致，下游零改动 |

### 7.2 最重要的一条：D4 空匹配语义（DLY0 事件还原）

`common/ip_cons/HV2M23_digital_top.tcl` 是 **DC/FC 共享的约束文件**（项目资产，任何一方都不能单独改它）。里面有一条：

```tcl
set_dont_touch [get_cells -hier *DLY0]
```

现场勘测结论（fc_shell 交互探针）：
- 设计里延时单元**都在**（`DLY_INDATA0_0/DLY_1`、`SDA_DLY_BUF/IDLY1~6`……）——elaborate 没丢东西
- `*DLY0` 零匹配——**DLY0 是上一代芯片 HV1V21 的遗留模式**（HV1V21 的 `DLY_5NS_CELL.v` 实例叫 DLY0；HV2M23 改名了），这条约束是继承下来的"僵尸模式"
- 也就是说：**DC 每天跑这条线也是零匹配，只是 DC 静默跳过；fc_shell 直接把 800 多行的共享约束文件掐死在第 405 行**

处置：不改共享文件，在 FC 侧给 `set_dont_touch` / `set_disable_timing` 装"DC 语义桥"——空匹配打 `FC-WARN` 继续跑，与 DC 行为对齐。

### 7.3 为什么需要重视

1. **报错会逼你修，静默差异会让你带着错误假设跑很远。** DES-203 这种报错型差异半天就清掉了；但如果没有 interactive probe 现场勘测，`*DLY0` 这种"DC 其实也匹配不到"的事实就永远不会浮出水面。
2. **共享文件是桥接的边界。** 约束文件、文件列表这些 DC/FC 共用的资产，任何适配都必须做在工具侧（包装器/预处理），这是评估方案里定死的纪律。
3. **这份清单会持续增长。** 约束段排雷还在进行（`set_wire_load_model`、`set_driving_cell` 等 DC 专有命令在预期中），每确认一条就追加一行——这张表就是 FC 评估报告的核心资产。

## 8. 0908 续篇：约束段通关与首次映射成功

> 接第 4 节的心路历程：set_top_module 修完之后，这一轮一口气推进了三关半——约束段全部通关、compile_fusion 的 initial_map（RTL→门级映射）跑通、然后倒在 logic_opto 的寄生参数上。

### 8.1 这一轮的关卡

| 关卡 | 现象 | 根因 | 处置 | 结果 |
|---|---|---|---|---|
| 约束段·僵尸模式 | `*DLY0`(L405)、`*DLY7/8/9×2`(L421-424) SEL-005 掐死脚本 | HV1V21 遗留模式，HV2M23 延时单元已是 IDLY1~6；DC 下同样零匹配但静默 no-op | 交互探针全量体检 74 条 dont_touch → 揪出全部 5 条僵尸，一次性注释（FC-FIX） | ✅ 其余 70 条全过 |
| 综合前报告 | `report_clock_gating` 报 "Errors detected during redirect"（CMD-013） | 综合前设计里还没有 CG cell，fc_shell 硬报错（DC 出空报告） | catch 包裹跳过（compile_fc.tcl + report_fc.tcl 两处） | ✅ |
| **映射目标全灭** | **OPT-1006**：Library analysis failure - cannot find minimum required gates (buffer/inverter) → designPreludeChecks 失败 | **NDM 合并改变了库名空间**：全部 cell 并入单一 clib `nexchip_145_9t`（*AL9=SL/LVT 662 + *AS9=SS/SVT 720 + 其他 28）；dont_use_fc.tcl 仍用旧 db 库名 `M31HSSC900EL150SL/SS_..._ccs/*` → 模式在 fc_shell 里过度匹配成"全部 cell"，除 remove_from_collection 显式摘除的 GCKHBQX8AL9 外**全被禁**（逐 cell 探针证实：BUFX03AS9/INVX03AS9 等 SVT 基础门也 dont_use=true） | nexchip 分支改用合并库名 + cell 后缀区分 flavor；12t 分支同款隐患一并修 | ✅ 修复 |
| logic_opto 启动 | SCN-1001：No valid parasitics for EARLY/LATE corner default → fc/logic_opto/mcmmStart 失败（FLW-2543/1762）；"Zero interconnect delay is used" | logic_opto 的 MCMM 流程强制要求 corner 寄生参数（`set_parasitics_parameters`，即 TLU+）；这套 Cadence 向 PDK 尚未找到 Synopsys 格式寄生库 | 三选一进行中：①继续找 TLU+（挖深+换关键词）；②.tf 若含每层 R/C 则走 `set_layer_rc`；③降级 `compile_fusion -to initial_map` 先出网表（零互连线延时，QoR 偏乐观） | ⏳ |

### 8.2 里程碑：initial_map 通关数据

- **映射结果：AREA 146688.53 / 5770 cells**——RTL 真正变成了门级
- 时钟门控（compile_fusion 自动插入，无需手写 insert_clock_gating）：**101 个 ICG，门控 1006 位 = 59.32%**；未门控主因是 enable 恒 1（632 位）与位宽不满足（52+6）
- 阶段耗时：initial_map 全程约 40 秒（High-Level Optimization and Technology Mapping 占 66%）
- **结论：FC 能吃下我们建的 NDM、修好的约束和 dont_use，把 HV2M23_digital_top 的 RTL 映成门级——方案 A 的核心可行性已经验证。剩下的（寄生精度、QoR 对比）是精度问题，不是可行性问题。**

### 8.3 工程方法论追加（这轮比报错更值钱的部分）

1. **集合 API 语义**：Synopsys collection 不是 Tcl list——`llength` 永远返回 1、`puts` 打出 `_selNNN` 句柄、`lindex` 取不出元素；正确姿势是 `sizeof_collection` / `foreach_in_collection` / `get_object_name`
2. **探针输出落 md**：交互勘测结果用 `open/puts/close` 直接写 markdown 文件再截图，比截终端可靠（也符合远程终端纯 ASCII 原则）
3. **fc_shell 内置命令不可 rename**（CMD-013）：想包装内置命令只剩"调用点文本重写"和"FC 专属副本"两条路——本项目由用户拍板选了后者（不要求复用 DC 约束文件）
4. **库名空间迁移是隐形雷**：db→NDM 合并后库名变了，DC 脚本里所有 `旧库名/cell` 模式都要按新库名重写；且 fc_shell 对"不存在的库前缀"的处理不是安静空匹配而是失控宽匹配，必须逐模式实测
5. **僵尸模式要全量体检而不是逐个踩**：一条探针循环把 74 条模式全部验一遍，5 条僵尸一次清完，省掉 N 个"改一行-重跑"的往返

### 8.4 差异清单增补（接第 7 节 D1–D9）

| # | 差异点 | DC 行为 | FC 行为 | 处置 |

### 8.11 层级保卫战：从 573 到 282 的定位与修复

LEC 首跑 573 个 NONEQ 之后，用"对照实验 + 逐层排他"又打了三轮：

| 轮次 | 动作 / 现象 | 结论 |
|---|---|---|
| R1 | `rtl_opt.conditioning.disable_boundary_optimization_and_auto_ungrouping` 设在 basic_setup | NDMUI-299：design-scoped 选项，设计未创建时不能设 |
| R2 | 移到 link 之后，选项成功设置，但 `.gv` 仍 15 个 module | 该选项不管编译期压平，且会误关 boundary optimization → 弃用 |
| R3 | 间歇性 `DPSEL_I` 报错（SEL-005）复现 | 规律：`save_lib` 存下的库被下次 `open_lib` 复用时 elaborate 状态脏 → **全量重跑前 `file delete -force` 清库**（fresh rebuild 策略，全量仅 ~90s） |
| R4 | 对照实验：`write_verilog -hierarchy all` vs `design` | 产物完全相同 → **write 无罪** |
| R5 | 网表原文 grep + 块内探针（open_block + get_cells 821/971 对勘） | 库内层级活、网表实例名被拼接成 `u_A_B_C`、总线位标量化 `reg_3_` |
| R6 | `info commands *ungroup*` 探针 | **命中 `set_ungroup` / `set_autoungroup_options`（-start_level）** |
| R7 | 双保险修复：`set_autoungroup_options -start_level 999` + `set_ungroup [get_cells -hier *] false` | **生效：module 数 15→221；LEC EQ 1601→1896、NON-EQ 573→282** |

当前残留 282 点已收敛为单一模式：时钟门控寄存器组的总线位命名（G `reg[9]` vs R `reg_9_/U$1`），且两侧层级路径已一致。深挖方向：RTL9 位部分赋值 + FC 时钟门控使能推断（LC_CSPIF_L0 的 `DATA_PS_ENC <= 9'b0` 分支）、RTL5.1 overlapped case（CSPI_CMD_ALIGN 的 `case(1'b1)` parallel_case）。

方法论沉淀：**"对照实验 + 排他法"比"猜选项名"快得多**——R4 的对照实验一轮就洗清了 write 的嫌疑；R5 的"库内状态 vs 文件原文"对勘锁定了压平发生的段落。另外：远程终端一律纯 ASCII（中文会乱码）；探针输出落 md 文件再回传，比截终端可靠。

<script>
const md = document.getElementById('md').textContent;
document.getElementById('article').innerHTML = marked.parse(md);

const toc = document.getElementById('toc');
const headings = document.querySelectorAll('.article h2, .article h3');
const tocLinks = [];
headings.forEach(h => {
  const id = h.textContent.trim().replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fa5-]/g, '');
  h.id = id;
  const cls = h.tagName === 'H2' ? 'toc-h2' : 'toc-h3';
  const a = document.createElement('a');
  a.href = '#' + id;
  a.textContent = h.textContent;
  a.className = cls;
  toc.appendChild(a);
  tocLinks.push(a);
});

tocLinks.forEach((link, i) => {
  if (!link.classList.contains('toc-h2')) return;
  const children = [];
  for (let j = i + 1; j < tocLinks.length && tocLinks[j].classList.contains('toc-h3'); j++) children.push(tocLinks[j]);
  if (!children.length) return;
  link.classList.add('toc-parent');
  const arrow = document.createElement('span');
  arrow.className = 'toc-arrow';
  arrow.textContent = '▸';
  link.prepend(arrow);
  children.forEach(c => c.parentLink = link);
  arrow.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const collapsed = link.classList.toggle('collapsed');
    children.forEach(c => c.style.display = collapsed ? 'none' : '');
  });
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(l => l.classList.remove('active'));
      let active = tocLinks.find(a => a.getAttribute('href') === '#' + entry.target.id);
      if (active && active.style.display === 'none' && active.parentLink) active = active.parentLink;
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-10% 0px -75% 0px' });
headings.forEach(h => observer.observe(h));
</script>
<script>
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;
function openLightbox(src) { lbImg.src = src; scale = 1; translateX = 0; translateY = 0; updateTransform(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; }
function updateTransform() { lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }
document.addEventListener('click', (e) => { const img = e.target.closest('img'); if (!img || img.id === 'lightbox-img' || !img.closest('.article')) return; openLightbox(img.src); });
lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
lightbox.addEventListener('wheel', (e) => { e.preventDefault(); const d = e.deltaY > 0 ? -0.12 : 0.12; scale = Math.min(Math.max(0.5, scale + d), 5); updateTransform(); });
lbImg.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - translateX; startY = e.clientY - translateY; lbImg.classList.add('grabbing'); e.preventDefault(); });
document.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = e.clientX - startX; translateY = e.clientY - startY; updateTransform(); });
document.addEventListener('mouseup', () => { isDragging = false; lbImg.classList.remove('grabbing'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox(); });
</script>
