# Fusion Compiler 引入评估实录：从 DC 流程到 FC 综合环境搭建

> 把 Fusion Compiler（FC）引进现有 DC 综合流程，不是「换条命令」那么简单：
> 真正的卡点是**库格式（.db → NDM）**、**环境部署（装错的 NanoTime 包）**和 **license 授权**。
> 本篇完整记录从现状评估、范围决策、环境踩坑到脚本架构设计的全过程。

## 1. 背景与现状：HV2M23 的 DC 综合流程

HV2M23 项目现有一套以 **Design Compiler（DC）** 为核心的成熟综合流程，`synthesis/` 目录结构如下：

```
synthesis/
├── common/
│   ├── ip_cons/                    # 设计约束（HV2M23_digital_top.tcl 55KB + input/output_delay.tcl）
│   ├── top_cons/                   # 顶层约束
│   └── tcl_dir/
│       ├── common/                 # common_db.tcl（库定义，全是 .db）、clk_period.tcl、kv_clkio.tcl
│       ├── dc/                     # DC 公共脚本（basic_setup_all / dc_user_proc / design_rule / dont_use_all）
│       ├── genus/                  # Genus 备选流程（平行先例）
│       ├── powerpro/               # PowerPro 低功耗脚本
│       └── pt/                     # PrimeTime 公共脚本
├── ip/syn_HV2M23_digital_top/
│   ├── dc/                         # DC 运行目录：run_dc（csh 入口）+ compile_dc.tcl（主流程）
│   ├── filelist/                   # RTL 文件列表（genfilelist 生成 advanced/gen_*.f）
│   ├── lec/ nlint/ powerpro/       # 一致性检查 / lint / 功耗优化
├── top/sta/                        # PT 静态时序分析（pre/post × 多 corner × 1P/2P）
├── top/power/                      # PTPX 功耗分析
└── ECO/                            # ECO 网表验证
```

关键配置（`design.set`）：

| 配置项 | 值 | 说明 |
|:---|:---|:---|
| `TOP_NAME` | `HV2M23_digital_top` | 综合顶层 |
| `LINK_LIB` / `TAR_LIB` | `nexchip_145_9t` | Nexchip 145nm 工艺库，SVT |
| `CORNER` | `wcl_cmax_m40_setup` | 综合 signoff corner |
| `SYN_TOOL` | `dc` | 当前工具（也有 genus 备选） |
| `SCAN_EN` / `USE_UPF` / `USE_SAIF` | `0 / 0 / 0` | 无 scan、无 UPF、无 SAIF |
| `INCR_OPT` / `BOND_OPT` | `1 / 1` | 增量优化 + boundary 优化开 |
| DC 环境 | `/eda/env/syn1709.cshrc` | `dc_shell-t -f compile_dc.tcl` |

DC 产物（`rep_dir/` 下的 `.ddc` / `.gv` / `.sdc`）直接喂给下游：**PT STA（pre/post 多 corner）、PTPX 功耗、LEC 一致性、PowerPro**——这条链路是评估 FC 时必须保住的底线。

## 2. 范围决策：方案 A（只做综合）vs 方案 B（全流程）

引入 FC 有两种深度，差别巨大：

| 维度 | 方案 A · FC 只做综合 | 方案 B · FC 全流程（RTL→GDSII） |
|:---|:---|:---|
| 流程范围 | RTL → `compile_fusion` → netlist + SDC | 综合 → floorplan → place → CTS → route → signoff |
| 与现有流程关系 | **替代 DC 那一步**，产物交给现有 APR | **把 APR 也吃掉** |
| 库要求 | .db 可过渡，NDM 更优 | **必须有 NDM**，没有完全动不了 |
| 额外输入 | 无 | die 尺寸、IO/pad 位置、macro 摆放、power plan |
| 脚本规模 | 9 个 | 20+ 个（place/cts/route/signoff 各一套） |
| 风险 | 可控，可与 DC 结果做 LEC/时序对照 | 高，签核配套（PT 收口、DRC/LVS）都要重建 |

<blockquote>
<strong>决策：先做方案 A。</strong>三条理由——① 与目标完全吻合（评估 FC / 出网表给 APR）；
② 风险可控，FC 结果可直接和 DC 结果做 LEC + 时序对照，先验证 FC 靠不靠谱；
③ <b>A 的产出物（NDM 配置、compile 脚本、约束移植）全是 B 的地基</b>，以后做 B 只是往后续接 place/cts/route，不返工。
</blockquote>

### 流程对比：DC 现状 vs FC 目标（方案 A）

**现状（DC 流程）：**

<div class="flow">
  <div class="fbox"><b>RTL</b><br>hdl/ 约 70+ 个 .v/.sv</div>
  <span class="farrow">→</span>
  <div class="fbox"><b>filelist</b><br>genfilelist 生成 gen_*.f</div>
  <span class="farrow">→</span>
  <div class="fbox"><b>dc_shell-t</b><br>compile_dc.tcl<br>compile_ultra 双段式</div>
  <span class="farrow">→</span>
  <div class="fbox"><b>rep_dir/</b><br>.ddc / .gv / .sdc</div>
  <span class="farrow">→</span>
  <div class="fbox"><b>下游</b><br>PT STA · PTPX · LEC · PowerPro</div>
</div>

**目标（FC 平行流程，灰色部分零改动）：**

<div class="flow">
  <div class="fbox"><b>RTL</b><br>同一批源码</div>
  <span class="farrow">→</span>
  <div class="fbox"><b>filelist</b><br>复用同一目录</div>
  <span class="farrow">→</span>
  <div class="fbox"><b>fc_shell</b><br>compile_fc.tcl<br>compile_fusion -to final_opto</div>
  <span class="farrow">→</span>
  <div class="fbox"><b>rep_dir/</b><br>.gv / .sdc（同名）<br>+ NDM（FC 特有）</div>
  <span class="farrow">→</span>
  <div class="fbox"><b>下游</b><br>PT STA · PTPX · LEC 不变</div>
</div>

> 核心设计原则：**输出文件名与 DC 完全一致**（`rep_dir/HV2M23_digital_top.gv` / `.sdc`），下游 PT/LEC 流程零改动；DC 流程保留做对照。

## 3. 环境确认实录：两个大坑（装错的包 + 缺的 license）

这一节是本次评估最有「实战价值」的部分——内网环境的信息查不到文档，只能一条条命令试出来。

### 时间线：找到真正的 fc_shell

<div class="timeline">
  <div class="titem"><span class="tdate">Step 1</span>三连查 <code>which fc_shell</code> / <code>fc_shell -version</code> / <code>ls /eda/env | grep -iE 'fc|fusion'</code> → <b>全部找不到</b>，FC 没进默认 PATH。</div>
  <div class="titem"><span class="tdate">Step 2</span>IT 告知：<code>/eda/env/NEXT/</code> 下有个 <code>fs_compiler_vW-2024.09-SP1.cshrc</code>。版本命名符合 Synopsys 规则（W = 2024.09），看起来有希望。</div>
  <div class="titem"><span class="tdate">Step 3</span><code>source</code> 之后再 <code>which fc_shell</code> → <b>还是找不到</b>。</div>
  <div class="titem"><span class="tdate">Step 4</span><code>cat</code> 该 cshrc，只有一行 set path，指向 <code>/eda/synopsys/NEXT/fs_compiler_vW-2024.09-SP3/nt/W-2024.09-SP1/bin</code> —— <b>目录名 SP3、子路径 SP1 混写，还夹了个可疑的 nt</b>。</div>
  <div class="titem"><span class="tdate">Step 5</span><code>ls</code> 该 bin → 只有 <code>nt_shell</code> / <code>nt_shell_cloud</code> / <code>scripts</code> / <code>snps_container</code> / <code>snps_platform</code>，<b>没有 fc_shell</b>；全包 <code>find -name fc_shell</code> 也为空。</div>
  <div class="titem"><span class="tdate">Step 6</span>旁证：<code>/eda/synopsys/NEXT/nt/</code> 下正好也有个 <code>W-2024.09-SP1</code> → <b>判定：这个 "fs_compiler" 包实际是 NanoTime</b>（详见下方知识框），FC 根本没装上。</div>
  <div class="titem"><span class="tdate">Step 7</span>反馈 IT（附证据：路径混写 + bin 内容是 nt_shell）→ IT 重新部署。</div>
  <div class="titem"><span class="tdate">Step 8</span>✅ 确认真实环境：<code>/eda/env/NEXT/fs_compiler_V-2023.12-SP5.cshrc</code> → <code>/eda/synopsys/fusioncompiler/V-2023.12-SP5/bin/fc_shell</code>，<code>fc_shell -version</code> 输出 <b>V-2023.12-SP5（build 2024-08-01）</b>。</div>
</div>

<div class="pcard">
  <div class="prow"><span class="k">知识框</span><span><b>NanoTime（NT）是什么</b>：Synopsys 的<b>晶体管级</b>静态时序分析工具，可以理解为「模拟/定制电路版的 PrimeTime」。PT 分析门级网表（标准单元数字电路），NT 分析 SPICE 网表（SRAM、PLL、LVDS、SerDes 等模拟/定制模块的内部时序）。对 HV2M23 这种带 LVDS/OSC 模拟硬核的芯片，NT 本来就有用——但它是另一个工具，不是 Fusion Compiler。</span></div>
</div>

### 第二坑：license 验证的三连报错

fc_shell 能启动了，但验证过程又踩了一串参数坑，最后停在真正的硬卡点上：

```csh
# 第 1 次：想当然加 -exit
fc_shell -no_init -exit
# → Error: unknown option '-exit' (CMD-010)，打印 Usage
#   （FC 没有 -exit 这个参数）

# 第 2 次：改用 -batch
fc_shell -no_init -batch
# → Error: The -batch option requires -file or -x
#   （-batch 必须搭配 -file 或 -x 使用）

# 第 3 次：正确写法，走完完整启动流程（含 license checkout）
fc_shell -no_init -x "exit" -batch
# → Unable to get shell start-up license keys. Cannot invoke shell.
#   Following license(s) must exist : Fusion-Compiler-NX
#   （等了 196 秒——在逐个问 license 服务器）
```

license 排查过程：

| 检查项 | 结果 | 结论 |
|:---|:---|:---|
| FC 的 cshrc 内容 | 只 `set path`，**没设任何 license 变量** | 环境脚本不完整 |
| 当前 shell 的 license 变量 | 有 `LM_LICENSE_FILE`（`5888@172.16.186.15`、`27001@172.16.186.193`、`27001@172.16.186.16`、`1717@…`、`5280@…` 等多台服务器） | FC 已自动问过这些服务器（196s 就是这么花的） |
| 能用的 DC 环境（syn1709.cshrc） | 里面 `SNPSLMD_LICENSE_FILE` **全是注释掉的**，DC 也靠 `LM_LICENSE_FILE` | license 配置方式无差异 |
| 显式补 `setenv SNPSLMD_LICENSE_FILE 27001@172.16.186.16` 重试 | **依然报同样的错**（这次只等 46s） | 不是配置问题 |

<blockquote>
<strong>结论：license 服务器上没有 <code>Fusion-Compiler-NX</code> 这个 feature</strong>——不是环境变量没配对，
而是授权本身缺失。已反馈 IT：确认公司是否购买了 FC license；若有，提供正确的
<code>SNPSLMD_LICENSE_FILE</code>；若没有，需走 license 采购/扩容流程。
</blockquote>

### ✅ 正确的 FC 环境验证命令清单（可直接复用）

```csh
# 1. source 环境（注意在 NEXT 子目录下，不在默认 PATH）
source /eda/env/NEXT/fs_compiler_V-2023.12-SP5.cshrc

# 2. 确认二进制位置与版本
which fc_shell
fc_shell -version

# 3. 完整启动验证（含 license checkout），正确写法：
fc_shell -no_init -x "exit" -batch

# 附：csh 下 find 的 stderr 重定向写法（2>/dev/null 是 bash 语法，csh 会报错）
find /eda/synopsys -maxdepth 6 -name "fc_shell" >& /dev/null
```

## 4. 脚本架构设计：9 个脚本的平行体系

设计原则：**不动现有 DC 流程，平行加一套**（与 genus 备选流程的先例一致），库路径等未确认信息全部用变量 + `TODO(FC-CONFIRM)` 占位。

### 目录结构

```
synthesis/
├── common/tcl_dir/fc/                        # 新增 · 公共脚本（5 个）
│   ├── basic_setup_fc.tcl                    #   对应 dc/basic_setup_all.tcl
│   ├── common_db_ndm.tcl                     #   对应 common/common_db.tcl（全新写法）
│   ├── fc_user_proc.tcl                      #   对应 dc/dc_user_proc.tcl
│   ├── design_rule_fc.tcl                    #   对应 dc/design_rule.tcl
│   └── dont_use_fc.tcl                       #   对应 dc/dont_use_all.tcl
└── ip/syn_HV2M23_digital_top/fc/             # 新增 · 运行目录（4 个）
    ├── run_fc                                #   对应 dc/run_dc（csh 入口）
    ├── compile_fc.tcl                        #   对应 dc/compile_dc.tcl（主流程）
    ├── fc_outputs.tcl                        #   输出段（从 DC 主流程后半段拆出）
    └── report_fc.tcl                         #   报告段（从 DC 主流程后半段拆出）
```

### 9 脚本清单

| # | 文件 | 对应 DC 文件 | 职责 |
|:--|:---|:---|:---|
| 1 | `basic_setup_fc.tcl` | `basic_setup_all.tcl` | 输出文件变量 + FC app options（翻译 `hdlin_*`/`compile_ultra_*` 变量）+ clock gating 风格 |
| 2 | `common_db_ndm.tcl` | `common_db.tcl` | **NDM 库配置**：FC_LIB_MODE 切换 ndm/db 模式，PVT corner 映射，全部路径留占位 |
| 3 | `fc_user_proc.tcl` | `dc_user_proc.tcl` | `read_filelist_all`、`kv_compile_fusion`（原 kv_compile_unltra）、`kv_change_names` 等自定义过程移植 |
| 4 | `design_rule_fc.tcl` | `design_rule.tcl` | max_fanout / max_transition / max_capacitance 等 DRC 约束 |
| 5 | `dont_use_fc.tcl` | `dont_use_all.tcl` | `set_dont_use` 集合（命令基本兼容，整份移植） |
| 6 | `run_fc` | `run_dc` | csh 入口：source FC 环境 → genfilelist → `fc_shell -f compile_fc.tcl -output_log_file` |
| 7 | `compile_fc.tcl` | `compile_dc.tcl` | 主流程：create_lib → 读 RTL → link → 约束 → compile_fusion → 输出 |
| 8 | `fc_outputs.tcl` | compile_dc.tcl 后半段 | 输出 .gv/.sdc（同名兼容下游）+ save_lib 保存 NDM |
| 9 | `report_fc.tcl` | compile_dc.tcl 报告段 | QoR 报告集：area/power/timing/clock_gating，对齐 DC 报告格式便于对比 |

### 变量契约（两条并行开发线之间的接口约定）

| 变量 | 含义 | 状态 |
|:---|:---|:---|
| `FC_LIB_MODE` | 库模式：`ndm`（有 NDM）/ `db`（用 .db 过渡），默认 `db` | 已定 |
| `FC_NDM_REF_LIBS` | NDM 参考库路径列表 | ⏳ 待库信息 |
| `FC_TECH_FILE` | tech file（建 NDM 用） | ⏳ 待库信息 |
| `FC_TLUPLUS` | TLU+ / captable | ⏳ 待库信息 |
| `FC_DB_FILES` / `FC_RAM_DB_FILES` | 标准单元 / RAM 的 .db 列表 | ⏳ 待库信息 |
| `NDM_DIR` | FC 库工作区，固定 `rep_dir/${TOP_NAME}_lib` | 已定 |

### 主流程骨架（compile_fc.tcl 的核心段落）

```tcl
# 1. Library: create NDM-based lib (ndm mode) or read_db fallback (db mode)
source $TCL_DIR/fc/common_db_ndm.tcl          # FC_LIB_MODE / FC_NDM_REF_LIBS / ...
#    ndm: create_lib -technology $FC_TECH_FILE -ref_libs $FC_NDM_REF_LIBS $NDM_DIR
#    db : read_db $FC_DB_FILES  (transitional, TODO(FC-CONFIRM))

# 2. Read RTL — reuse the SAME filelist mechanism as DC
read_filelist_all $FILELIST_DIR $NET_DEFINE   # analyze + elaborate, from fc_user_proc.tcl
link
check_design > $CHK_DESIGN_FILE

# 3. Constraints — SAME sources as DC, same order (zero-copy reuse)
source $TCL_DIR/fc/design_rule_fc.tcl
source $TCL_DIR/fc/dont_use_fc.tcl
source $TCL_DIR/common/clk_period.tcl
source $TCL_DIR/common/kv_clkio.tcl
source $IP_CONS_DIR/$TOP_NAME.tcl              # 55KB SDC, ~90% expected compatible
source $IP_CONS_DIR/input_delay.tcl
source $IP_CONS_DIR/output_delay.tcl
source $TCL_DIR/common/common_cons.tcl

# 4. Compile — FC fusion engine
kv_compile_fusion $INCR_OPT $USE_SAIF $BOND_OPT
#    internally: compile_fusion -to initial_opto → (-to final_opto)

# 5. Outputs & reports — SAME filenames as DC → downstream PT/LEC untouched
source fc_outputs.tcl    # write_verilog .gv / write_sdc .sdc / save_lib
source report_fc.tcl     # report_qor / area / power / timing / clock_gating
```

### 零改动复用清单

- `common/ip_cons/*.tcl`（55KB 主约束 + input/output delay）——预计 90% 兼容，试跑后按报错逐条修
- `common/tcl_dir/common/`：`clk_period.tcl`、`kv_clkio.tcl`、`common_cons.tcl`
- `ip/.../filelist/`、`design.set`（`SYN_TOOL` 加个 `fc` 分支即可）
- 下游 `top/sta/`（PT 多 corner STA）、`top/power/`（PTPX）——**完全不动**

## 5. DC → FC 关键差异对照

| 维度 | DC（现状） | FC（目标） | 移植注意 |
|:---|:---|:---|:---|
| 库格式 | `.db`（common_db.tcl） | **NDM**（.db 可过渡但非原生） | **最大卡点**，取决于 foundry 是否提供 NDM |
| 配置方式 | `set hdlin_*` / `compile_ultra_*` 变量 | `set_app_options` | 逐条翻译，无对应的标 TODO |
| 编译引擎 | `compile_ultra`（双段式 + `-incr`） | `compile_fusion -to initial_opto / final_opto` | kv_compile_unltra → kv_compile_fusion |
| 门控时钟 | `set_clock_gating_style` | `set_clock_gating_options` | 参数语义保留（min_bitwidth 3 / max_fanout 32） |
| 设计保存 | `write -format ddc` | `save_lib` / `save_block`（NDM） | ddc 不再产出，下游改用 .gv |
| 网表/约束输出 | `write -format verilog` / `write_sdc` | `write_verilog` / `write_sdc` | 命令名微调，文件名保持一致 |
| 入口 | `dc_shell-t -f xx.tcl \| tee log` | `fc_shell -f xx.tcl -output_log_file log` | FC 自带 log 参数 |
| 自定义过程 | `dc_user_proc.tcl`（report_vt_cell_usage 等） | 逐个移植 | FC 无对应物的标 TODO(FC-CONFIRM) |

<script>
const chapters = [
  ['index', '主题首页'],
  ['evaluation', 'FC引入实录'],
  ['handoff-guide', '回传上手指引']
];
const currentPath = location.pathname.split('/').pop() || 'index.html';
const linksContainer = document.getElementById('navbar-links');
chapters.forEach(([slug, label]) => {
  const href = slug === 'index' ? './' : `./${slug}.html`;
  const filename = slug === 'index' ? 'index.html' : `${slug}.html`;
  const a = document.createElement('a');
  a.href = href;
  a.textContent = label;
  if (currentPath === filename || currentPath.endsWith('/' + filename)) a.classList.add('active');
  linksContainer.appendChild(a);
});
</script>
<script>
const md = document.getElementById('md').textContent;
document.getElementById('article').innerHTML = marked.parse(md);

const toc = document.getElementById('toc');
const headings = document.querySelectorAll('.article h2, .article h3');
const tocLinks = [];
headings.forEach(h => {
  const id = h.textContent.trim().replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fa5-]/g, '');
  h.id = id;
  const cls = h.tagName === 'H2' ? 'toc-h2' : 'toc-h3';
  const a = document.createElement('a');
  a.href = '#' + id;
  a.textContent = h.textContent;
  a.className = cls;
  toc.appendChild(a);
  tocLinks.push(a);
});

tocLinks.forEach((link, i) => {
  if (!link.classList.contains('toc-h2')) return;
  const children = [];
  for (let j = i + 1; j < tocLinks.length && tocLinks[j].classList.contains('toc-h3'); j++) children.push(tocLinks[j]);
  if (!children.length) return;
  link.classList.add('toc-parent');
  const arrow = document.createElement('span');
  arrow.className = 'toc-arrow';
  arrow.textContent = '▸';
  link.prepend(arrow);
  children.forEach(c => c.parentLink = link);
  arrow.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const collapsed = link.classList.toggle('collapsed');
    children.forEach(c => c.style.display = collapsed ? 'none' : '');
  });
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(l => l.classList.remove('active'));
      let active = tocLinks.find(a => a.getAttribute('href') === '#' + entry.target.id);
      if (active && active.style.display === 'none' && active.parentLink) active = active.parentLink;
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-10% 0px -75% 0px' });
headings.forEach(h => observer.observe(h));
</script>
<script>
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;
function openLightbox(src) { lbImg.src = src; scale = 1; translateX = 0; translateY = 0; updateTransform(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; }
function updateTransform() { lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }
document.addEventListener('click', (e) => { const img = e.target.closest('img'); if (!img || img.id === 'lightbox-img' || !img.closest('.article')) return; openLightbox(img.src); });
lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
lightbox.addEventListener('wheel', (e) => { e.preventDefault(); const d = e.deltaY > 0 ? -0.12 : 0.12; scale = Math.min(Math.max(0.5, scale + d), 5); updateTransform(); });
lbImg.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - translateX; startY = e.clientY - translateY; lbImg.classList.add('grabbing'); e.preventDefault(); });
document.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = e.clientX - startX; translateY = e.clientY - translateY; updateTransform(); });
document.addEventListener('mouseup', () => { isDragging = false; lbImg.classList.remove('grabbing'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox(); });
</script>
