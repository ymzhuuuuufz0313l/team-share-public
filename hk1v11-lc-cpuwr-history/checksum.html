# 三、校验和机制演进

## 1. 三帧一致更新机制

LC_CPUWR 的寄存器更新核心机制：**写入一个寄存器需要连续 3 次 CHPI 帧 blank 期间数据一致，才会真正更新**。

### 1.1 机制来源

该机制最早来自 2026-04-30 的变更：增加寄存器判断功能，只有寄存器信息稳定且多帧得到相同信息时才更新进寄存器表。

### 1.2 死锁场景

0612 基线重构后发现一个 checksum 死锁场景：
- TX 端数据经过 scramble 加扰发送
- RX 端 `descramble_en` 本身也是一个受 checksum 保护的寄存器
- 如果初始 mismatch 导致 descramble 无法正确使能，RX 解出的数据会是乱数
- 乱数下 checksum 永远不匹配，寄存器永远无法更新
- 从而形成死锁

这一场景直接推动了 NG Unlock 机制的诞生。

### 1.3 时序冲突

| 冲突点 | 说明 |
|--------|------|
| PORSD / POL | 需要在第一帧结束就置位 1 或 0，但 checksum 要求 3 帧一致 |
| ch_sel | 环境发送指令时按新值选择 channel，但寄存器仍为旧默认值，导致后级模块处理错误 |

解决方案：这些关键信号改为**直写模式**，不走 checksum update。该变更是 0512 的一项重要修复。

## 2. REG07 与 checksum update

### 2.1 0511 新增 REG07 checksum update 功能

- 新增 `REG07` 寄存器控制 checksum update 行为
- 后续演变为 `CTRLF_CHECKSUM[3:0]`
- 该功能影响 20+ 个 checksum case

### 2.2 0519 CTRLF_CHECKSUM 定义

- `REG07[3:0]` 命名为 `CTRLF_CHECKSUM[3:0]`
- 默认值 `0x05`（使能校验和）

### 2.3 0520 最终方案

- `REG07` 默认值为 `0`（使能 checksum 检测）
- 写入 `0x05` 时关闭 checksum 检测（直写模式）
- **LSP 阶段结束至 K1 发起前**：此阶段不做 checksum，寄存器直写
- **K1 后**：做一个 latch，latch=1 后保持 checksum 功能

## 3. Seg2 checksum 删除与时钟域统一

### 3.1 0615 时钟域统一

早期 Seg2 checksum 使用独立的 `WCK1_A_TEST` 时钟，导致跨时钟域同步问题：

| 变更项 | 原实现 | 新实现 |
|--------|--------|--------|
| Seg2 时钟 | `WCK1_A_TEST` | 统一为 `WCK1_A` |
| 端口 | `input WCK1_A_TEST` | 已删除 |
| always 敏感列表 | `@(posedge WCK1_A_TEST ...)` | 全部改为 `@(posedge WCK1_A ...)` |
| CDC 问题 | `chksum_mode` 跨 `WCK1_A → WCK1_A_TEST` | 单一时钟域，无需同步器 |

涉及替换约 85 处。

### 3.2 0615 Seg2 checksum 删除

- 彻底移除 `CHKSUM_T_EN` 宏
- 删除 Seg2 shadow 寄存器及 XOR checksum 校验逻辑
- `0x20~0x38` 全部 25 个测试寄存器改为 `WCK1_A` 时钟域直写
- 移除跨 `WCK1_A` / `WCK1_A_TEST` 的 CDC 相关逻辑

代码量从约 3280 行精简到约 2060 行。

## 4. Seg1 扩展与 frame end 变更

### 4.1 0616 Seg1 地址扩展

- `R_REG09_F` / `R_REG10_F` / `R_REG29_F` / `R_REG30_F` 加入 Seg1 寄存器并参与 checksum
- Seg1 shadow 寄存器从 9 个扩展到 13 个

### 4.2 0703 frame end 改为 0x27

- 地址 `39(0x27)` 加入 Segment1 checksum，作为新的 frame end
- 地址 `31(0x1F)` 改为普通 shadow 寄存器，不再作为 frame end
- `0x27` 字段映射为 `ACS_EN(bit7)` / `Level_Skip_frame(bit1)` / `Skip_frame_count(bit0)`

## 5. NG Unlock 机制

为防止偶发误报导致寄存器长期被锁，引入 NG Unlock 机制。

### 5.1 方案演进

| 版本 | 方案 | 说明 |
|------|------|------|
| 0614 PlanA | 组合逻辑 | 连续 6 帧 mismatch 后解锁 |
| 0614 PlanB | 寄存器锁存 | 时序更稳定，但会 sticky |
| 0615 PlanB 修正 | 阈值 off-by-one 修复 | `<3'd6` 修正为 `<3'd5`，即 5 次连续 mismatch 后下一帧直写 |
| 0616 最终 | 连续 5 帧 mismatch | `unmatch_cnt_a` 计数器 + `unlock_latch_a` 锁存器 |
| 0618 | one-shot | 仅在连续 mismatch 条件满足时产生单周期脉冲，解锁后需重新计数 |

### 5.2 Caveat：首帧即累加

`unmatch_cnt_a` 在首帧 `match=0` 时也会 +1，因此 case 设计不应硬编码帧号，而应动态监测 `unlock_latch_a`。

### 5.3 one-shot unlock 验证陷阱

## 6. SCR_EN 与 SSFC 门控

### 6.1 0512 SCR_EN 复位逻辑

- `SCR_EN` 在 I2C model 下，即使 K3 检测到也不会 reset
- 新增该功能以满足 I2C 模式下的 scramble 控制需求

### 6.2 0622 SSFC 信号

- 新增 `SSFC` 输入端口
- `R_SCREN` 由 `R_REG00_F[4]` 直接输出改为 `R_REG00_F[4] & SSFC`
- scramble enable 仅在 `SSFC==1` 时有效

  <script>
    document.getElementById('article').innerHTML = marked.parse(document.getElementById('md').textContent.trim());
const chapters = [
      ['index', '首页'],
      ['intro', '引言'],
      ['timeline', '时间线'],
      ['checksum', '校验和'],
      ['regmap', '寄存器'],
      ['verification', '验证'],
      ['status', '后续']
    ];
    const currentPath = location.pathname.split('/').pop() || 'index.html';
    const linksContainer = document.getElementById('navbar-links');
    chapters.forEach(([slug, label]) => {
      const href = slug === 'index' ? './' : `./${slug}.html`;
      const filename = slug === 'index' ? 'index.html' : `${slug}.html`;
      const a = document.createElement('a');
      a.href = href;
      a.textContent = label;
      if (currentPath === filename || currentPath.endsWith('/' + filename) || (currentPath === '' && slug === 'index')) {
        a.classList.add('active');
      }
      linksContainer.appendChild(a);
    });
const article = document.getElementById('article');
    const toc = document.getElementById('toc');
    const h1 = article.querySelector('h1');
    if (h1) {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = h1.textContent;
      a.className = 'toc-h1';
      toc.appendChild(a);
    }
    const headings = article.querySelectorAll('h2, h3');
    headings.forEach((h, i) => {
      const id = 'toc-' + i;
      h.id = id;
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      a.className = h.tagName.toLowerCase() === 'h3' ? 'toc-h3' : 'toc-h2';
      toc.appendChild(a);
    });
    const tocLinks = Array.from(toc.querySelectorAll('a'));
    function updateTocActive() {
      let current = '';
      headings.forEach(h => { if (h.getBoundingClientRect().top < 100) current = h.id; });
      tocLinks.forEach(a => a.classList.remove('active'));
      if (current) {
        const active = tocLinks.find(a => a.getAttribute('href') === '#' + current);
        if (active) active.classList.add('active');
      }
    }
    window.addEventListener('scroll', updateTocActive);
    updateTocActive();
  </script>
