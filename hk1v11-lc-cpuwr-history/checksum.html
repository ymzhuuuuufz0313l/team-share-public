<head>

  <style>
:root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #0f766e;
      --accent-soft: #ccfbf1;
      --line: #e2e8f0;
      --shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #2dd4bf;
        --accent-soft: #115e59;
        --line: #334155;
        --shadow: 0 10px 40px rgba(0,0,0,0.35);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.75;
    }
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .navbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .navbar-brand {
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
      font-size: 15px;
    }
    .navbar-links {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      flex: 1;
      scrollbar-width: none;
    }
    .navbar-links::-webkit-scrollbar { display: none; }
    .navbar-links a {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      color: var(--text);
      white-space: nowrap;
      transition: background 0.15s;
    }
    .navbar-links a:hover { background: var(--bg); text-decoration: none; }
    .navbar-links a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    @media (max-width: 640px) {
      .navbar-inner { padding: 10px 16px; gap: 10px; }
      .navbar-brand { font-size: 14px; }
      .navbar-links a { font-size: 13px; padding: 5px 8px; }
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 48px 24px; }
    .container.with-toc { display: flex; gap: 32px; align-items: stretch; }
    .toc-wrapper { width: 260px; flex-shrink: 0; align-self: stretch; }
    .toc {
      position: sticky;
      top: 64px;
      max-height: calc(100vh - 88px);
      overflow-y: auto;
      padding: 16px;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--line);
      font-size: 14px;
      box-shadow: var(--shadow);
    }
    .toc a { display: block; padding: 6px 8px; border-radius: 6px; color: var(--muted); margin: 2px 0; transition: background 0.15s, color 0.15s; }
    .toc a:hover { background: var(--bg); color: var(--accent); text-decoration: none; }
    .toc a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .toc a.toc-h1 { font-weight: 700; color: var(--accent); margin-bottom: 8px; cursor: default; }
    .toc a.toc-h3 { padding-left: 18px; font-size: 13px; }
    h2, h3 { scroll-margin-top: 72px; }
    .content { flex: 1; min-width: 0; }
    .article {
      background: var(--surface);
      border-radius: 20px;
      padding: 56px 64px;
      box-shadow: var(--shadow);
    }
    @media (max-width: 640px) {
      .container { padding: 24px 16px; }
      .article { padding: 32px 24px; border-radius: 16px; }
      .toc-wrapper { display: none; }
      .container.with-toc { display: block; }
    }
    h1 { font-size: 36px; margin: 0 0 20px; color: var(--accent); font-weight: 700; letter-spacing: -0.5px; }
    h2 { font-size: 26px; margin: 48px 0 18px; padding-bottom: 10px; border-bottom: 1px solid var(--line); color: var(--text); font-weight: 600; }
    h3 { font-size: 20px; margin: 32px 0 14px; color: var(--text); font-weight: 600; }
    p { margin: 14px 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; display: block; margin: 28px auto; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 14.5px; }
    th, td { border: 1px solid var(--line); padding: 10px 14px; text-align: left; }
    th { background: var(--accent-soft); font-weight: 600; }
    tr:nth-child(even) { background: rgba(0,0,0,0.02); }
    code { background: var(--bg); padding: 3px 7px; border-radius: 5px; font-family: "SFMono-Regular", Consolas, monospace; font-size: 14px; color: var(--accent); }
    pre { background: var(--bg); padding: 18px; border-radius: 10px; overflow-x: auto; border: 1px solid var(--line); }
    pre code { padding: 0; background: transparent; color: var(--text); }
    blockquote { border-left: 4px solid var(--accent); margin: 20px 0; padding: 14px 20px; background: var(--accent-soft); border-radius: 0 10px 10px 0; }
    ul, ol { padding-left: 28px; }
    li { margin: 8px 0; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }
    .footer { text-align: center; color: var(--muted); margin-top: 48px; font-size: 13px; }
    .page-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 48px; }
    .page-nav a { display: block; padding: 16px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--text); transition: border-color 0.2s, box-shadow 0.2s; }
    .page-nav a:hover { border-color: var(--accent); box-shadow: var(--shadow); text-decoration: none; }
    .page-nav a.next { text-align: right; margin-left: auto; }
    .page-nav .label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .page-nav .title { font-weight: 600; color: var(--accent); }
    @media (max-width: 640px) { .page-nav { grid-template-columns: 1fr; } .page-nav a.next { text-align: left; margin-left: 0; } }
    .hero { text-align: center; margin-bottom: 40px; }
    .hero h1 { margin-bottom: 12px; }
    .hero .author { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
    .hero .lead { font-size: 17px; max-width: 720px; margin: 0 auto; }
    .section-title { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 40px 0 16px; }
    .chapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .chapter-card { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; color: var(--text); transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s; }
    .chapter-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); text-decoration: none; }
    .chapter-card .num { display: inline-block; width: 28px; height: 28px; line-height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; text-align: center; margin-bottom: 10px; }
    .chapter-card .title { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
    .chapter-card .desc { font-size: 13px; color: var(--muted); line-height: 1.5; }

    <aside class="toc-wrapper" id="toc-wrapper"><nav class="toc" id="toc"></nav></aside>

      <a class="next" href="./regmap.html"><span class="label">下一篇</span><span class="title">寄存器映射与命名规范化</span></a>
      </div>

    </div>
  </div>

  <script type="text/template" id="md">
# 三、校验和机制演进

## 1. 双段 checksum 设计

早期 LC_CPUWR 采用两段独立 XOR 校验和：

| 段 | 地址范围 | 说明 |
|----|----------|------|
| Seg1 | 0x00 ~ 0x1F | 第一段 XOR 校验 |
| Seg2 | 0x20 ~ 0x38 | 第二段 XOR 校验 |

CPU 写寄存器时，硬件自动计算并比对 checksum；mismatch 时触发保护或报警。

## 2. NG Unlock 机制

为防止偶发误报导致寄存器长期被锁，引入了 **NG Unlock** 机制。

### 2.1 PlanA 组合逻辑方案

最早在 0614 提出，用组合逻辑检测连续 6 帧 mismatch，然后输出解锁信号。

### 2.2 PlanB 锁存方案

改进为寄存器锁存版本，时序更稳定，但会引入 sticky 状态。

### 2.3 one-shot 最终方案

0618 版本将 NG Unlock 改为 **one-shot** 模式：
- 仅在连续 mismatch 条件满足时产生一个单周期脉冲
- 解锁后不会保持，需要重新计数
- 兼顾稳定性与安全性

## 3. Seg2 checksum 删除

0616v3 是一次重大精简：

- 删除 Seg2 checksum 逻辑（`CHKSUM_T_EN` 及相关寄存器）
- 代码从约 **3280 行缩减到约 2060 行**
- 校验机制收敛为仅 Seg1（0x00~0x1F）

这一改动降低了硬件复杂度，也简化了验证 checker。

## 4. 校验范围扩展

0617v2 之后，Seg1 校验范围逐步扩展：

- 0x09 / 0x0A / 0x1D / 0x1E 加入 Seg1 checksum
- 0703v2 将 0x27 加入 Seg1 checksum 作为新的 frame end
- 0x1F 从 checksum 寄存器改为普通 shadow 寄存器

验证侧同步更新了 `checker_for_checksum` 的地址掩码与期望值生成逻辑。

  </script>
  <script>
    document.getElementById('article').innerHTML = marked.parse(document.getElementById('md').textContent.trim());
const chapters = [
      ['index', '首页'],
      ['intro', '引言'],
      ['timeline', '时间线'],
      ['checksum', '校验和'],
      ['regmap', '寄存器'],
      ['verification', '验证'],
      ['status', '后续']
    ];
    const currentPath = location.pathname.split('/').pop() || 'index.html';
    const linksContainer = document.getElementById('navbar-links');
    chapters.forEach(([slug, label]) => {
      const href = slug === 'index' ? './' : `./${slug}.html`;
      const filename = slug === 'index' ? 'index.html' : `${slug}.html`;
      const a = document.createElement('a');
      a.href = href;
      a.textContent = label;
      if (currentPath === filename || currentPath.endsWith('/' + filename) || (currentPath === '' && slug === 'index')) {
        a.classList.add('active');
      }
      linksContainer.appendChild(a);
    });
const article = document.getElementById('article');
    const toc = document.getElementById('toc');
    const h1 = article.querySelector('h1');
    if (h1) {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = h1.textContent;
      a.className = 'toc-h1';
      toc.appendChild(a);
    }
    const headings = article.querySelectorAll('h2, h3');
    headings.forEach((h, i) => {
      const id = 'toc-' + i;
      h.id = id;
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      a.className = h.tagName.toLowerCase() === 'h3' ? 'toc-h3' : 'toc-h2';
      toc.appendChild(a);
    });
    const tocLinks = Array.from(toc.querySelectorAll('a'));
    function updateTocActive() {
      let current = '';
      headings.forEach(h => { if (h.getBoundingClientRect().top < 100) current = h.id; });
      tocLinks.forEach(a => a.classList.remove('active'));
      if (current) {
        const active = tocLinks.find(a => a.getAttribute('href') === '#' + current);
        if (active) active.classList.add('active');
      }
    }
    window.addEventListener('scroll', updateTocActive);
    updateTocActive();
  </script>
</body>
</html>
