  <style>
:root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --accent: #0f766e;
      --accent-soft: #ccfbf1;
      --line: #e2e8f0;
      --shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #2dd4bf;
        --accent-soft: #115e59;
        --line: #334155;
        --shadow: 0 10px 40px rgba(0,0,0,0.35);
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.75;
    }
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .navbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .navbar-brand {
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
      font-size: 15px;
    }
    .navbar-links {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      flex: 1;
      scrollbar-width: none;
    }
    .navbar-links::-webkit-scrollbar { display: none; }
    .navbar-links a {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 14px;
      color: var(--text);
      white-space: nowrap;
      transition: background 0.15s;
    }
    .navbar-links a:hover { background: var(--bg); text-decoration: none; }
    .navbar-links a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    @media (max-width: 640px) {
      .navbar-inner { padding: 10px 16px; gap: 10px; }
      .navbar-brand { font-size: 14px; }
      .navbar-links a { font-size: 13px; padding: 5px 8px; }
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 48px 24px; }
    .container.with-toc { display: flex; gap: 32px; align-items: stretch; }
    .toc-wrapper { width: 260px; flex-shrink: 0; align-self: stretch; }
    .toc {
      position: sticky;
      top: 64px;
      max-height: calc(100vh - 88px);
      overflow-y: auto;
      padding: 16px;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--line);
      font-size: 14px;
      box-shadow: var(--shadow);
    }
    .toc a { display: block; padding: 6px 8px; border-radius: 6px; color: var(--muted); margin: 2px 0; transition: background 0.15s, color 0.15s; }
    .toc a:hover { background: var(--bg); color: var(--accent); text-decoration: none; }
    .toc a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .toc a.toc-h1 { font-weight: 700; color: var(--accent); margin-bottom: 8px; cursor: default; }
    .toc a.toc-h3 { padding-left: 18px; font-size: 13px; }
    h2, h3 { scroll-margin-top: 72px; }
    .content { flex: 1; min-width: 0; }
    .article {
      background: var(--surface);
      border-radius: 20px;

      box-shadow: var(--shadow);
    }

      .container { padding: 24px 16px; }
      .article { padding: 32px 24px; border-radius: 16px; }
      .toc-wrapper { display: none; }
      .container.with-toc { display: block; }
    }
    h1 { font-size: 36px; margin: 0 0 20px; color: var(--accent); font-weight: 700; letter-spacing: -0.5px; }
    h2 { font-size: 26px; margin: 48px 0 18px; padding-bottom: 10px; border-bottom: 1px solid var(--line); color: var(--text); font-weight: 600; }
    h3 { font-size: 20px; margin: 32px 0 14px; color: var(--text); font-weight: 600; }
    p { margin: 14px 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; display: block; margin: 28px auto; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 14.5px; }
    th, td { border: 1px solid var(--line); padding: 10px 14px; text-align: left; }
    th { background: var(--accent-soft); font-weight: 600; }
    tr:nth-child(even) { background: rgba(0,0,0,0.02); }
    code { background: var(--bg); padding: 3px 7px; border-radius: 5px; font-family: "SFMono-Regular", Consolas, monospace; font-size: 14px; color: var(--accent); }
    pre { background: var(--bg); padding: 18px; border-radius: 10px; overflow-x: auto; border: 1px solid var(--line); }
    pre code { padding: 0; background: transparent; color: var(--text); }
    blockquote { border-left: 4px solid var(--accent); margin: 20px 0; padding: 14px 20px; background: var(--accent-soft); border-radius: 0 10px 10px 0; }
    ul, ol { padding-left: 28px; }
    li { margin: 8px 0; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }
    .footer { text-align: center; color: var(--muted); margin-top: 48px; font-size: 13px; }
    .page-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 48px; }
    .page-nav a { display: block; padding: 16px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--text); transition: border-color 0.2s, box-shadow 0.2s; }
    .page-nav a:hover { border-color: var(--accent); box-shadow: var(--shadow); text-decoration: none; }
    .page-nav a.next { text-align: right; margin-left: auto; }
    .page-nav .label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .page-nav .title { font-weight: 600; color: var(--accent); }
    @media (max-width: 640px) { .page-nav { grid-template-columns: 1fr; } .page-nav a.next { text-align: left; margin-left: 0; } }
    .hero { text-align: center; margin-bottom: 40px; }
    .hero h1 { margin-bottom: 12px; }
    .hero .author { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
    .hero .lead { font-size: 17px; max-width: 720px; margin: 0 auto; }
    .section-title { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 40px 0 16px; }
    .chapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .chapter-card { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; color: var(--text); transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s; }
    .chapter-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); text-decoration: none; }
    .chapter-card .num { display: inline-block; width: 28px; height: 28px; line-height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; text-align: center; margin-bottom: 10px; }
    .chapter-card .title { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
    .chapter-card .desc { font-size: 13px; color: var(--muted); line-height: 1.5; }

    /* Image lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      cursor: grab;
    }
    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }
    .lightbox img {
      max-width: none;
      max-height: none;
      border: none;
      border-radius: 4px;
      cursor: grab;
      transform-origin: center center;
      transition: none;
      margin: 0;
    }
    .lightbox img.grabbing { cursor: grabbing; }
    .lightbox .hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      pointer-events: none;
      user-select: none;
      background: rgba(0,0,0,0.4);
      padding: 6px 14px;
      border-radius: 20px;
    }
    .lightbox .close {
      position: absolute;
      top: 20px;
      right: 24px;
      color: rgba(255,255,255,0.8);
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .lightbox .close:hover { background: rgba(255,255,255,0.15); color: #fff; }

  <script type="text/template" id="md">
# 二、寄存器图解 Sheet（推荐先看）

> ⭐ **本章优先级最高**：建议在读完后文之前，先浏览本章五张全景图，建立 LC_CPUWR 寄存器空间的整体印象，再深入各个变更细节。
>
> 本页集中展示 LC_CPUWR 0714v1 寄存器相关的五张可视化大图：默认字节映射（chip_sel=0 / chip_sel=1）、checksum 覆盖、LSI 保护范围与复位域分类。所有图片均基于 `LC_CPUWR_20260714_v1_decimal.v` 提取生成。

## 1. chip_sel = 0 默认字节映射

这张图展示 0714v1 在 chip_sel=0 模式下 POR 后的寄存器默认值布局，与 `LC_CPUWR_history/chip_sel0_register_address_map.md` 及 RTL 中复位默认值完全一致，用于建立寄存器空间基线并支撑后续 chip_sel=1 回拼差异分析。

chip_sel=0 模式下 POR 后寄存器默认值全景；绿色为控制、黄色为电源、蓝紫为模拟相关字段。

![chip_sel=0 寄存器默认字节映射](./images/chip_sel0_register_map.svg)

## 2. chip_sel = 1 默认字节映射

这张图展示 0714v1 在 chip_sel=1 模式下 POR 后的寄存器默认值布局，与 `LC_CPUWR_history/chip_sel1_register_address_map.md` 及 `LC_REG_MAPPING_20260714_v1_decimal.v` 回拼机制一致，用于定位 chip_sel=1 相对于 chip_sel=0 发生默认值变化的字段。

chip_sel=1 模式下 POR 后默认值；红色标出与 chip_sel=0 不同、由 LC_REG_MAPPING 回拼的字段。

![chip_sel=1 寄存器默认字节映射](./images/chip_sel1_register_map.svg)

## 3. Checksum 地址覆盖

这张图基于 `LC_CPUWR_20260714_v1_decimal.v` Part 18 的 checksum 逻辑，标出参与 XOR 累加的地址范围，帮助确认 0x07 控制寄存器、0x27 frame end 边界以及 Seg1/Seg2 的 checksum 覆盖范围。

标出参与 checksum XOR 累加的地址；同一地址在两种 chip_sel 下字段不同时拆成双行展示。

![参与 checksum 的地址](./images/checksum_address_map.svg)

## 4. LSI 保护范围

这张图基于 `LC_CPUWR_20260714_v1_decimal.v` Part 16 的 LSI_PRTECT 逻辑，说明各地址读回/输出是否经过保护掩码，用于理解密码解锁前后的寄存器可见性差异。

标出各地址是否受 LSI_PRTECT 保护；紫色为密码寄存器 0x30，写入 0x72 可开启保护。

![LSI 保护范围](./images/lsi_unprotected_address_map.svg)

## 5. 复位域分类

这张图基于 `LC_CPUWR_20260714_v1_decimal.v` 寄存器声明中的复位域属性，用于判断全局复位或局部复位后哪些配置会被清零、哪些会保持。

标出各寄存器所属的复位域；紫色为 N_RST、青色为 RSTN_SCR_EN，其余多为 N_RST_NLOCK。

![复位域分类](./images/reset_domain_address_map.svg)

## 6. 数据说明

| 图 | 数据源 | 关键结论 |
|----|--------|---------|
| chip_sel 默认字节映射 | `LC_CPUWR_history/chip_sel*_register_address_map.md` | 0714v1 内部复位默认值统一为 chip_sel=0；chip_sel=1 由 LC_REG_MAPPING 回拼 |
| Checksum 地址覆盖 | `LC_CPUWR_20260714_v1_decimal.v` Part 18 | 参与 XOR 累加：0x00~0x06、0x08~0x0A、0x1D~0x1F；0x27 为 frame end；0x07 为控制寄存器 |
| LSI 保护范围 | `LC_CPUWR_20260714_v1_decimal.v` Part 16 | 0x00~0x1F、0x27、0x40~0x44 不保护；0x20~0x39（除 0x27）、0x90~0x92 保护 |
| 复位域分类 | `LC_CPUWR_20260714_v1_decimal.v` 寄存器声明 | 大部分为 N_RST_NLOCK；TEST_PRTCT 等少数为 N_RST；SCREN 为 RSTN_SCR_EN |

  </script>
  <script>
    document.getElementById('article').innerHTML = marked.parse(document.getElementById('md').textContent.trim());
const chapters = [
      ['index', '首页'],
      ['intro', '引言'],
      ['diagrams', '图解'],
      ['timeline', '时间线'],
      ['checksum', '校验和'],
      ['regmap', '寄存器'],
      ['verification', '验证'],
      ['status', '后续']
    ];
    const currentPath = location.pathname.split('/').pop() || 'index.html';
    const linksContainer = document.getElementById('navbar-links');
    chapters.forEach(([slug, label]) => {
      const href = slug === 'index' ? './' : `./${slug}.html`;
      const filename = slug === 'index' ? 'index.html' : `${slug}.html`;
      const a = document.createElement('a');
      a.href = href;
      a.textContent = label;
      if (currentPath === filename || currentPath.endsWith('/' + filename) || (currentPath === '' && slug === 'index')) {
        a.classList.add('active');
      }
      linksContainer.appendChild(a);
    });
const article = document.getElementById('article');
    const toc = document.getElementById('toc');
    const h1 = article.querySelector('h1');
    if (h1) {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = h1.textContent;
      a.className = 'toc-h1';
      toc.appendChild(a);
    }
    const headings = article.querySelectorAll('h2, h3');
    headings.forEach((h, i) => {
      const id = 'toc-' + i;
      h.id = id;
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      a.className = h.tagName.toLowerCase() === 'h3' ? 'toc-h3' : 'toc-h2';
      toc.appendChild(a);
    });
    const tocLinks = Array.from(toc.querySelectorAll('a'));
    function updateTocActive() {
      let current = '';
      headings.forEach(h => { if (h.getBoundingClientRect().top < 100) current = h.id; });
      tocLinks.forEach(a => a.classList.remove('active'));
      if (current) {
        const active = tocLinks.find(a => a.getAttribute('href') === '#' + current);
        if (active) active.classList.add('active');
      }
    }
    window.addEventListener('scroll', updateTocActive);
    updateTocActive();
  </script>

  <div class="lightbox" id="lightbox">
    <span class="close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
    <div class="hint">滚轮缩放 · 拖拽移动 · 点击空白处或右上角关闭</div>
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');
    let scale = 1, translateX = 0, translateY = 0;
    let isDragging = false, startX = 0, startY = 0, initialTranslateX = 0, initialTranslateY = 0;
    function updateTransform() { lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }
    function resetTransform() { scale = 1; translateX = 0; translateY = 0; updateTransform(); }
    function openLightbox(src) { lightboxImg.src = src; resetTransform(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; setTimeout(() => { lightboxImg.src = ''; }, 250); }
    document.querySelectorAll('.article img').forEach(img => img.addEventListener('click', () => openLightbox(img.src)));
    lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    lightbox.addEventListener('wheel', (e) => { e.preventDefault(); scale = Math.min(Math.max(0.5, scale + (e.deltaY > 0 ? -0.15 : 0.15)), 5); updateTransform(); }, { passive: false });
    lightboxImg.addEventListener('mousedown', (e) => { e.preventDefault(); isDragging = true; lightboxImg.classList.add('grabbing'); startX = e.clientX; startY = e.clientY; initialTranslateX = translateX; initialTranslateY = translateY; });
    window.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = initialTranslateX + (e.clientX - startX); translateY = initialTranslateY + (e.clientY - startY); updateTransform(); });
    window.addEventListener('mouseup', () => { isDragging = false; lightboxImg.classList.remove('grabbing'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  </script>
