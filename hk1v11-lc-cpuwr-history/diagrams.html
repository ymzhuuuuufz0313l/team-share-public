# 六、寄存器图解 Sheet

> 本页集中展示 LC_CPUWR 0714v1 寄存器相关的五张可视化大图，便于快速查阅默认字节映射、checksum 覆盖、LSI 保护范围与复位域分类。所有图片均基于 `LC_CPUWR_20260714_v1_decimal.v` 与 `LC_REG_MAPPING_20260714_v1_decimal.v` 提取生成。

## 1. chip_sel = 0 默认字节映射

绿色为控制/配置类，黄色为电源/PWRC，蓝紫为 CDR/PLL/模拟，浅蓝为状态/只读，粉红为 chip_sel=1 专用字段（本图中显示为 Reserved）。

![chip_sel=0 寄存器默认字节映射](./images/chip_sel0_register_map.svg)

## 2. chip_sel = 1 默认字节映射

红色边框/星标表示与 chip_sel=0 默认值不同；`0x09 / 0x0A / 0x1F` 旁标注“LC_REG_MAPPING 回拼”，表示这些地址的 chip_sel=1 默认值由 `LC_REG_MAPPING` 写标志 + 回拼字节实现。

![chip_sel=1 寄存器默认字节映射](./images/chip_sel1_register_map.svg)

## 3. Checksum 地址覆盖

绿色表示参与 Seg1 checksum XOR 累加的地址；橙色为 checksum 控制寄存器 `0x07`；黄色为 frame end 边界地址 `0x27`；灰色为不参与 checksum。连续全 Reserved 地址已折叠。

![参与 checksum 的地址](./images/checksum_address_map.svg)

## 4. LSI 保护范围

绿色表示读回/输出不经过 `LSI_PRTECT` 掩码；红色表示受 `LSI_PRTECT` 保护；紫色为密码寄存器 `0x30`（`TEST_PRTCT`，写入 `0x72` 可开启 LSI 保护）。

![LSI 保护范围](./images/lsi_unprotected_address_map.svg)

## 5. 复位域分类

蓝色表示 `N_RST_NLOCK` 复位；紫色表示 `N_RST` 复位；青色表示 `RSTN_SCR_EN` 复位。`0x00 SCREN` 为 `RSTN_SCR_EN`，`0x01 PORSD`、`0x05 CH_SEL`、`0x06 SDC/DPLC_MODE`、`0x20 R_TESTO_SEL`、`0x21 R_UTC`、`0x30 TEST_PRTCT` 等为 `N_RST`。

![复位域分类](./images/reset_domain_address_map.svg)

## 6. 数据说明

| 图 | 数据源 | 关键结论 |
|----|--------|---------|
| chip_sel 默认字节映射 | `LC_CPUWR_history/chip_sel*_register_address_map.md` | 0714v1 内部复位默认值统一为 chip_sel=0；chip_sel=1 由 LC_REG_MAPPING 回拼 |
| Checksum 地址覆盖 | `LC_CPUWR_20260714_v1_decimal.v` Part 18 | 参与 XOR 累加：0x00~0x06、0x08~0x0A、0x1D~0x1F；0x27 为 frame end；0x07 为控制寄存器 |
| LSI 保护范围 | `LC_CPUWR_20260714_v1_decimal.v` Part 16 | 0x00~0x1F、0x27、0x40~0x44 不保护；0x20~0x39（除 0x27）、0x90~0x92 保护 |
| 复位域分类 | `LC_CPUWR_20260714_v1_decimal.v` 寄存器声明 | 大部分为 N_RST_NLOCK；TEST_PRTCT 等少数为 N_RST；SCREN 为 RSTN_SCR_EN |

  <script>
    document.getElementById('article').innerHTML = marked.parse(document.getElementById('md').textContent.trim());
const chapters = [
      ['index', '首页'],
      ['intro', '引言'],
      ['timeline', '时间线'],
      ['checksum', '校验和'],
      ['regmap', '寄存器'],
      ['verification', '验证'],
      ['diagrams', '图解'],
      ['status', '后续']
    ];
    const currentPath = location.pathname.split('/').pop() || 'index.html';
    const linksContainer = document.getElementById('navbar-links');
    chapters.forEach(([slug, label]) => {
      const href = slug === 'index' ? './' : `./${slug}.html`;
      const filename = slug === 'index' ? 'index.html' : `${slug}.html`;
      const a = document.createElement('a');
      a.href = href;
      a.textContent = label;
      if (currentPath === filename || currentPath.endsWith('/' + filename) || (currentPath === '' && slug === 'index')) {
        a.classList.add('active');
      }
      linksContainer.appendChild(a);
    });
const article = document.getElementById('article');
    const toc = document.getElementById('toc');
    const h1 = article.querySelector('h1');
    if (h1) {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = h1.textContent;
      a.className = 'toc-h1';
      toc.appendChild(a);
    }
    const headings = article.querySelectorAll('h2, h3');
    headings.forEach((h, i) => {
      const id = 'toc-' + i;
      h.id = id;
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      a.className = h.tagName.toLowerCase() === 'h3' ? 'toc-h3' : 'toc-h2';
      toc.appendChild(a);
    });
    const tocLinks = Array.from(toc.querySelectorAll('a'));
    function updateTocActive() {
      let current = '';
      headings.forEach(h => { if (h.getBoundingClientRect().top < 100) current = h.id; });
      tocLinks.forEach(a => a.classList.remove('active'));
      if (current) {
        const active = tocLinks.find(a => a.getAttribute('href') === '#' + current);
        if (active) active.classList.add('active');
      }
    }
    window.addEventListener('scroll', updateTocActive);
    updateTocActive();
  </script>
