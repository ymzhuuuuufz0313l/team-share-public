<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="534" viewBox="0 0 1100 534" style="background:#ffffff">
<rect width="1100" height="534" fill="#ffffff"/>
<text x="550.0" y="42" text-anchor="middle" class="title" font-size="22" font-weight="bold" fill="#1e293b">复位规格 · 20261106（1106v2→v4 终版）</text>
<text x="550.0" y="70" text-anchor="middle" font-size="12.5" fill="#64748b">复位规格四条已落地（含 1106v4 PORSD 写门控修复） · 三路 DS 盲审四维度全过 · 两项裁定关闭 · 2026-11-10</text>
<rect class="head" x="40" y="100" width="1020" height="34" fill="#f1f5f9"/>
<text x="55.0" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">#</text>
<text x="185.0" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">复位规格维度</text>
<text x="546.0" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">关键内容（位段 / 地址 / 链路）</text>
<text x="832.0" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">RTL 状态</text>
<text x="966.0" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b">改动</text>
<rect class="row" style="animation-delay:0.15s" x="40" y="134" width="1020" height="84" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="55.0" y="181.0" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">1</text>
<text x="82" y="180.5" font-size="12.5" font-weight="600" fill="#1e293b">unlock reset 例外清单</text>
<text x="312" y="162.5" font-size="12" fill="#1e293b">13 组 CTRL_F 信号全 RSTN 域</text>
<text x="312" y="180.0" font-size="12" fill="#1e293b">AVE_RGBW / AVE_LAST / DPLC_GROUP / DPOLINV / AVE_MODE / CTRLF_</text>
<text x="312" y="197.5" font-size="12" fill="#1e293b">CHECKSUM + 其余 7 组</text>
<rect x="807.0" y="164.5" width="50" height="23" rx="11.5" fill="#f7e8d4" stroke="#b45309" stroke-width="1"/>
<text x="832.0" y="180.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">迁移</text>
<text x="886" y="180.5" font-size="12" font-weight="600" fill="#1e293b">6 组 t9 迁 RSTN</text>
<rect class="row" style="animation-delay:0.29s" x="40" y="218" width="1020" height="74" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="55.0" y="260.0" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">2</text>
<text x="82" y="259.5" font-size="12.5" font-weight="600" fill="#1e293b">I2C_EN=1 全免 unlock reset</text>
<text x="312" y="250.2" font-size="12" fill="#1e293b">I2C_EN_CTL → TEST_EN → I_TEST_REG_EN → RSTNGEN:50</text>
<text x="312" y="267.8" font-size="12" fill="#1e293b">I2C_EN=1 时寄存器不进入 unlock reset 语义</text>
<rect x="807.0" y="243.5" width="50" height="23" rx="11.5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
<text x="832.0" y="259.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c3aed">链路</text>
<text x="886" y="259.5" font-size="12" font-weight="600" fill="#1e293b">零改动（链路已存在）</text>
<rect class="row" style="animation-delay:0.43s" x="40" y="292" width="1020" height="84" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="55.0" y="339.0" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">3</text>
<text x="82" y="329.8" font-size="12.5" font-weight="600" fill="#1e293b">PORSD 不受 password &amp;</text>
<text x="82" y="347.2" font-size="12.5" font-weight="600" fill="#1e293b">checksum 保护</text>
<text x="312" y="320.5" font-size="12" fill="#1e293b">PORSD = RSTN 域 + 不在 LSI（password）集</text>
<text x="312" y="338.0" font-size="12" fill="#1e293b">1106v4：直写绕 chksum 门控 + update_en_a 回填移除</text>
<text x="312" y="355.5" font-size="12" fill="#1e293b">checksum 排除属 BCC 主端软件口径（非 RTL）</text>
<rect x="803.8" y="322.5" width="56" height="23" rx="11.5" fill="#ccfbf1" stroke="#0d9488" stroke-width="1"/>
<text x="832.0" y="338.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0d9488">已符合</text>
<text x="886" y="338.5" font-size="12" font-weight="600" fill="#1e293b">1106v4 写门控修复</text>
<rect class="row" style="animation-delay:0.57s" x="40" y="376" width="1020" height="74" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<text x="55.0" y="418.0" text-anchor="middle" font-size="14" font-weight="700" fill="#64748b">4</text>
<text x="82" y="408.8" font-size="12.5" font-weight="600" fill="#1e293b">password error reset</text>
<text x="82" y="426.2" font-size="12.5" font-weight="600" fill="#1e293b">例外地址段</text>
<text x="312" y="408.2" font-size="12" fill="#1e293b">受门控段 32-38 / 40-47 / 51 / 53-57 / 144-147（dec）</text>
<text x="312" y="425.8" font-size="12" fill="#1e293b">0x40~0x44 整块（dec 64~68）不做 password error reset</text>
<rect x="807.0" y="401.5" width="50" height="23" rx="11.5" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1"/>
<text x="832.0" y="417.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1d4ed8">一致</text>
<text x="886" y="417.5" font-size="12" font-weight="600" fill="#1e293b">零改动（=表 AC 列）</text>
<text x="550.0" y="476" text-anchor="middle" font-size="12" fill="#64748b">unlock reset 13 组明细（位段）：0x00[7:5] / 0x01[7] / 0x05[7:5] / 0x06[7,5,3,2,1] / 0x07[3:0] / 0x20[5:0] / 0x21[5:4] / 0x30[7:0] / I2C 0xF0·0xF1 ·</text>
<text x="550.0" y="493" text-anchor="middle" font-size="12" fill="#64748b">0xA0~0xA1 只读不参与 password error reset</text>
<style>
