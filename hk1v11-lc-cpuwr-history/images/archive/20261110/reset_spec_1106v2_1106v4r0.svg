<text x="312" y="250.2" font-size="12" fill="#1e293b">I2C_EN_CTL → TEST_EN → I_TEST_REG_EN → RSTNGEN:50</text>
<text x="312" y="267.8" font-size="12" fill="#1e293b">I2C_EN=1 时寄存器不进入 unlock reset 语义</text>
