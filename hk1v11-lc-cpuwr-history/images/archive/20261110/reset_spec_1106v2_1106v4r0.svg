<text x="82" y="180.5" font-size="12.5" font-weight="600" fill="#1e293b">unlock reset 例外清单</text>
<text x="312" y="162.5" font-size="12" fill="#1e293b">13 组 CTRL_F 信号全 RSTN 域</text>
<text x="312" y="180.0" font-size="12" fill="#1e293b">AVE_RGBW / AVE_LAST / DPLC_GROUP / DPOLINV / AVE_MODE / CTRLF_</text>
<text x="312" y="197.5" font-size="12" fill="#1e293b">CHECKSUM + 其余 7 组</text>
<rect x="807.0" y="164.5" width="50" height="23" rx="11.5" fill="#f7e8d4" stroke="#b45309" stroke-width="1"/>
