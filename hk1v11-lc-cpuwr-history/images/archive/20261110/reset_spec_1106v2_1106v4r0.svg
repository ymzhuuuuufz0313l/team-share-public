<text x="550.0" y="466" text-anchor="middle" font-size="12" fill="#64748b">unlock reset 13 组明细（位段）：0x00[7:5] / 0x01[7] / 0x05[7:5] / 0x06[7,5,3,2,1] / 0x07[3:0] / 0x20[5:0] / 0x21[5:4] / 0x30[7:0] / I2C 0xF0·0xF1 ·</text>
<text x="550.0" y="483" text-anchor="middle" font-size="12" fill="#64748b">0xA0~0xA1 只读不参与 password error reset</text>
