<text x="312" y="398.2" font-size="12" fill="#1e293b">受门控段 32-38 / 40-47 / 51 / 53-57 / 144-147（dec）</text>
<text x="312" y="415.8" font-size="12" fill="#1e293b">0x40~0x44 整块（dec 64~68）不做 password error reset</text>
