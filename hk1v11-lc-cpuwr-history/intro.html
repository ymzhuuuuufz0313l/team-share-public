# 一、引言与归档体系

> ⭐ **建议阅读顺序**：引言之后，请先看 **[二、寄存器图解 Sheet](./diagrams.html)**，通过五张全景图建立对 LC_CPUWR 寄存器默认字节映射、checksum 覆盖、LSI 保护与复位域的直观认识，再回来看后续详细变更分析。

## 1. 模块定位

**LC_CPUWR** 是 HK1V11 芯片 TCON 模块中负责 **CPU 写寄存器接口** 的核心 RTL 模块。
它接收 CPU 通过 I2C/SPI 等总线下发的配置，维护一组片内寄存器，并向后续链路（如 `LC_REG_MAPPING`、`LINK_LOGIC`）输出控制信号。

在 2026-04 至 2026-07 的开发周期中，LC_CPUWR 经历了大量迭代：校验和机制从双段演变为单段、NG Unlock 方案从 PlanA/PlanB 最终收敛为 one-shot、寄存器命名从十六进制后缀全面十进制化、并按 `chip_sel0/1` 重构了默认值体系。

为了管理这些密集变更，项目于 2026-06-15 建立了 `LC_CPUWR_history` 归档目录，集中保存 RTL 快照、changelist、modify plan、compliance report 及验证同步资料。

## 2. 为什么需要版本归档

由于 LC_CPUWR 与寄存器映射、LINK_LOGIC、验证 checker、case 配置深度耦合，每一次修改都需要同步多个文件。
为了：

- 保留每一次重要变更的完整 RTL 快照
- 便于回溯问题引入点
- 支持服务器回传前的 review

项目在 `E:\project\HK1V11\LC_CPUWR_history` 建立了独立的归档目录。

## 3. 目录结构说明

### 3.1 根目录（当前版本）

| 文件 | 用途 |
|------|------|
| `LC_CPUWR_20260714_v1_decimal.v` | 当前 LC_CPUWR RTL（约 104KB） |
| `LC_REG_MAPPING_20260714_v1_decimal.v` | 寄存器映射模块 |
| `LINK_LOGIC_20260714_v1_decimal.v` | 上层 LINK_LOGIC 实例化同步 |
| `LC_CPUWR_20260714_v1_changelist.md` | 当前版本变更清单 |
| `README.md` | 归档说明与历史版本索引 |
| `chip_sel0/1_register_address_map.md` | chip_sel 区分寄存器位字段表 |

### 3.2 verilog_hdl（历史 RTL）

按日期/版本保存了 LC_CPUWR、LC_REG_MAPPING、LINK_LOGIC、LINK_MISC、LOGIC_CENTER 等模块的历史快照，从 2026-05-07 的备份一直到 2026-07-09 的常规同步。

### 3.3 markdownfile（变更文档）

按版本分子目录保存：

- `*_changelist_*.md`：变更清单
- `*_code_changelist_*.md`：代码级变更清单
- `*_modify_plan_*.md`：修改计划
- `*_compliance_report_*.md`：合规报告
- `*_simulate_plan_*.md`：仿真计划

### 3.4 case（验证相关）

- `case_0626v1_sync.md`：0626v1 将 `checker_for_checksum` 统一迁移到公共 agent 的同步指引
- `checker_for_checksum_0626v1.sv`：迁移后的 checker 历史归档副本

  <script>
    document.getElementById('article').innerHTML = marked.parse(document.getElementById('md').textContent.trim());
const chapters = [
      ['index', '首页'],
      ['intro', '引言'],
      ['diagrams', '图解'],
      ['timeline', '时间线'],
      ['checksum', '校验和'],
      ['regmap', '寄存器'],
      ['verification', '验证'],
      ['status', '后续']
    ];
    const currentPath = location.pathname.split('/').pop() || 'index.html';
    const linksContainer = document.getElementById('navbar-links');
    chapters.forEach(([slug, label]) => {
      const href = slug === 'index' ? './' : `./${slug}.html`;
      const filename = slug === 'index' ? 'index.html' : `${slug}.html`;
      const a = document.createElement('a');
      a.href = href;
      a.textContent = label;
      if (currentPath === filename || currentPath.endsWith('/' + filename) || (currentPath === '' && slug === 'index')) {
        a.classList.add('active');
      }
      linksContainer.appendChild(a);
    });
const article = document.getElementById('article');
    const toc = document.getElementById('toc');
    const h1 = article.querySelector('h1');
    if (h1) {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = h1.textContent;
      a.className = 'toc-h1';
      toc.appendChild(a);
    }
    const headings = article.querySelectorAll('h2, h3');
    headings.forEach((h, i) => {
      const id = 'toc-' + i;
      h.id = id;
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      a.className = h.tagName.toLowerCase() === 'h3' ? 'toc-h3' : 'toc-h2';
      toc.appendChild(a);
    });
    const tocLinks = Array.from(toc.querySelectorAll('a'));
    function updateTocActive() {
      let current = '';
      headings.forEach(h => { if (h.getBoundingClientRect().top < 100) current = h.id; });
      tocLinks.forEach(a => a.classList.remove('active'));
      if (current) {
        const active = tocLinks.find(a => a.getAttribute('href') === '#' + current);
        if (active) active.classList.add('active');
      }
    }
    window.addEventListener('scroll', updateTocActive);
    updateTocActive();
  </script>

  <div class="lightbox" id="lightbox">
    <span class="close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
    <div class="hint">滚轮缩放 · 拖拽移动 · 点击空白处或右上角关闭</div>
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');
    let scale = 1, translateX = 0, translateY = 0;
    let isDragging = false, startX = 0, startY = 0, initialTranslateX = 0, initialTranslateY = 0;
    function updateTransform() { lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }
    function resetTransform() { scale = 1; translateX = 0; translateY = 0; updateTransform(); }
    function openLightbox(src) { lightboxImg.src = src; resetTransform(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; setTimeout(() => { lightboxImg.src = ''; }, 250); }
    document.querySelectorAll('.article img').forEach(img => img.addEventListener('click', () => openLightbox(img.src)));
    lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    lightbox.addEventListener('wheel', (e) => { e.preventDefault(); scale = Math.min(Math.max(0.5, scale + (e.deltaY > 0 ? -0.15 : 0.15)), 5); updateTransform(); }, { passive: false });
    lightboxImg.addEventListener('mousedown', (e) => { e.preventDefault(); isDragging = true; lightboxImg.classList.add('grabbing'); startX = e.clientX; startY = e.clientY; initialTranslateX = translateX; initialTranslateY = translateY; });
    window.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = initialTranslateX + (e.clientX - startX); translateY = initialTranslateY + (e.clientY - startY); updateTransform(); });
    window.addEventListener('mouseup', () => { isDragging = false; lightboxImg.classList.remove('grabbing'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  </script>
