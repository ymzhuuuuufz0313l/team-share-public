# 五、寄存器映射与命名规范化

## 1. 寄存器模块重写（0421）

- `LC_CPUWR.v` 读写寄存器模块重写
- 按地址顺序组织
- 对应寄存器 Excel 修改信号复位值与复位信号
- 总体结构与代码风格保持不变

## 1.5 寄存器稳定判断（0430）

- 增加寄存器判断功能：只有寄存器信息稳定且多帧得到相同信息时才更新进寄存器表
- 这一机制后来演变为 checksum 的"三帧一致"更新机制

## 2. I2C 地址与 LSI_PROTECT

### 2.1 0506 I2C only 区域 password 保护

- 按照 `LSI_PROTECT` 要求，对 I2C 专用地址 `0x50~0x56` 中所有可写寄存器增加 password error reset 保护

### 2.2 0615 I2C 地址译码十进制化

- I2C 专用地址译码信号 `ADDR50~56_I2C_TEST` 重命名为 `ADDR80~86_I2C_TEST`
- I2C readback case 地址字面量从 `8'h*` 改为 `8'd*`

### 2.3 0617 LSI_PRTECT 重构

- `LC_REG_MAPPING` 删除 `LSI_PRTECT` 输入
- `SP_S` / `VBK` / `VBK_EN` 直接由对应寄存器输出，不再受 `LSI_PRTECT` 掩码控制

## 3. 0507 寄存器大表更新

| 信号 | 旧位置 | 新位置 |
|------|--------|--------|
| `AVE_R` | `0x00[2:0]` | `0x00[7:5]` |
| `reg_lane_ck_inv_en` | `0x25[7]` | `0x50[1]` |

## 4. 0512 寄存器新增修改项

### 4.1 删除字段

| 信号 | 地址 |
|------|------|
| `SMART_CS[3:0]` | `0x02[7:6], [3:2]` |
| `VPS_EN[1:0]` | `0x03[7]`, `0x28[6]` |
| `PDF_EN` | `0x06[4]` |
| `PDF_CTRL` | `0x06[6]` |
| `R_BWDB_V_OFF` | `0x23[0]` |
| `R_LSP_DET_EN` | `0x50[0]` |

### 4.2 修改字段

| 信号 | 变更项 | 旧值 | 新值 |
|------|--------|------|------|
| `reg_pin_eq_auto[3:2]` | 地址 | `0x02[5:4]` | `0x02[3:2]` |
| `regr_lane_ctrl[4:0]` | 默认值 | `5'b00000` | `5'b11000` |

## 5. 0519/0520 REG07 相关

- `reg_kvco_ctrl[3:0]` 默认值从 `8` 改为 `A`，地址 `@0x26[7:4]`
- `REG07[3:0]` 更新为 `CTRLF_CHECKSUM[3:0]`，默认值 `0x05`
- 注释掉未使用的 `shadow1F` 寄存器，优化面积和时序

## 6. LC_REG_MAPPING 修复

### 6.1 模块间信号职责划分

0616 重构后明确了以下信号的职责边界：

| 信号 | 输出模块 | 说明 |
|------|----------|------|
| `R_BAC` | LC_CPUWR | 后移到 `R_REG40_F[2]` |
| `VBK_EN` | LC_CPUWR | 直接输出，不再受 LSI_PRTECT 掩码 |
| `SP_S` | LC_REG_MAPPING | 从 LC_CPUWR 移出 |
| `VBK` | LC_REG_MAPPING | 从 LC_CPUWR 移出 |

### 6.2 0519 PWRC 与 BKDU 相关性错误

- 原逻辑 `assign a = b & c`，删除 `b` 寄存器后等效 `assign a = c`
- 导致 PWRC 与 BKDU 呈现相关性
- 修复：赋值为 `0`

### 6.3 0521 DBC code 被错误删除

- DBC 功能与 PDF 寄存器关联，PDF 删除后 DBC 被级联误删除
- 修正：`DBC = 1'b1` 独立，KEEPLOW 已实现

### 6.4 0521 PWRC 寄存器映射同步

- `P2WRC` 映射由 `3'b001` 改为 `3'b000`

| `reg_cal_result_display_sel[1:0]` | `R_REG37_F[5:4]` | `R_REG35_F[1:0]` |
| `reg_cdr_rlpf[3:0]` | `R_REG39_F[3:0]` | `R_REG37_F[3:0]` |
| `reg_cdr_icp[3:0]` | `R_REG39_F[7:4]` | `R_REG37_F[7:4]` |
| `LSI_PRTECT` 源 | `R_REG30_F == 8'h72` | `R_REG48_F == 8'h72` |

### 7.2 命名十进制化

- `R_REG20~38_F` → `R_REG32~56_F`
- `R_REG50~56_I2C` → `R_REG80~86_I2C`

### 7.3 新增字段

- `R_REG09_F` / `R_REG10_F` / `R_REG29_F` / `R_REG30_F`
- `ACS_EN` @ `R_REG39_F[7]`

## 8. 0617 SMART_CS / Pattern Detect / 动态 PWRC 删除

- 移除 `PAT_DET_DYN`、`PAT_DET_STA`、`PTN_DET_ENB`、`POL_SW`、`POL_SW_PRE`
- 移除 `SMART_CS`、`R_SUBP_CS_OPT`、`R_SUBP_TPE_OPT`、`R_SMT_CS_EXT_TP`、`FALLING_CS_OPT`
- 移除 `R_STATIC_PWRC_OPT`、`R_TPW_EXTEND_EN`、`R_TPW_EXTEND`、`TPW_EXTEND`、`TP_EXTEND`
- `VPS_EN` 功能由 pattern detect 触发改为直接由 `VPS_EN & BKD` 控制

## 9. 0624 寄存器大规模重构

### 9.1 AVE 合并

- `AVE_R/G/B` 合并为 `AVE_RGBW` @ `0x00[7:5]`，默认 `000`
- 删除 `AVE_AUTO`、`AVE_G`、`AVE_B`、`AVE_DELTA`，改为 Reserved

### 9.2 字段移动

| 信号 | 旧位置 | 新位置 |
|------|--------|--------|
| `EQ_DC_L0[2:0]` | `0x03[4:2]` | `0x33[6:4]` |
| `reg_lane_ck_inv_en` | `0x50[1]` | `0x33[1]` |
| `CG_OFF` | `0x54[0]` | `0x33[0]` |
| 6 个 lane 状态 | `0x86` | `0x34[5:0]` |

### 9.3 lane_ctrl 统一

- 删除 `reg_lane_ctrl_00/01/10/11`
- 统一为 `sw_reg_lane_ctrl[4:0]` @ `0x32[4:0]`
- 新增 `reg_pin_eq` @ `0x32[7]`

### 9.4 autoEQ 字段删除

删除以下 I2C / autoEQ 相关字段：

- `reg_loop_cnt`、`reg_eq_mode`、`reg_win_sel`、`reg_eq_golden_time`
- `reg_eq_shift_sel`、`reg_eq_utc_thd_sel`、`reg_thd_sel`、`reg_rst_eq_en`
- `reg_eq_cal_sel`、`reg_eq_crc_count_en`、`reg_eq_golden_pin`、`reg_eq_crc_block_en`
- `regr_dfe_state`、`regr_autoeq_state`、`regr_lane_ctrl`、`regr_autoeq_update`

保留别名：`0x50/0x51/0x52` 作为 `0x32/0x33/0x34` 的 I2C 读回别名。

## 10. 0701~0708 细节更新

### 10.1 0701 CDR/UTC

- `reg_cr_done_cnt[5:0]` 默认值 `0x12` → `0x15`（@0x24）
- 新增 `reg56/57` 承载 UTC 相关字段，默认值 `0x05/0x03`
- 新增 `reg144~146` 直接映射 CDR fast/fine lock 参数

### 10.2 0702 PWRC_TSEL

- 新增 `PWRC_TSEL` @ `0x20[7]`，默认 `1'b0`

### 10.3 0703 EQ_DC_L0 删除

- `EQ_DC_L0` 寄存器删除，同步修改相关模块

### 10.4 0703 frame end 与寄存器重命名

- `0x27` 加入 Segment1 checksum，作为新 frame end
- `0x1F` 改为普通 shadow 寄存器
- `reg_lane_ctrl` 改名为 `sw_reg_lane_ctrl`

### 10.5 0705/0706 CHIP_SEL 默认值

- `R_REG10_F(0x0A)` 复位默认值改为 `{CHIP_SEL,1'b0,CHIP_SEL,1'b0,1'b0,CHIP_SEL,1'b0,CHIP_SEL}`，chip_sel=1 时 `8'hA5`
- `R_REG31_F(0x1F)` 复位默认值改为 `{CHIP_SEL,1'b0,CHIP_SEL,1'b0,CHIP_SEL,1'b0,CHIP_SEL,1'b0}`，chip_sel=1 时 `8'hAA`
- 0706 将 `CHPI_SEL` 统一重命名为 `CHIP_SEL`

### 10.6 0714 默认值最终方案：LC_REG_MAPPING 回拼机制

0714v1 将 `LC_CPUWR` 内部 `R_REG09_F` / `R_REG10_F` / `R_REG31_F` 的复位默认值统一改为 `8'h00`（chip_sel=0 默认值），而 chip_sel=1 的默认值改由 `LC_REG_MAPPING` 的**写标志 + 回拼字节**机制实现。

#### RTL 改动

**LC_CPUWR 新增端口：**
- 输出 `R_REG09_F_WR` / `R_REG10_F_WR` / `R_REG31_F_WR`：对应地址被 FCONFIG 或 I2C 写入时置 1
- 输入 `R_REG09_F_RECON` / `R_REG10_F_RECON` / `R_REG31_F_RECON`：来自 LC_REG_MAPPING 的回拼字节

**I2C 读回增加 CHIP_SEL mux：**
- `chip_sel=0`：读回内部 `R_REG09_F` / `R_REG10_F` / `R_REG31_F`（复位后 `8'h00`）
- `chip_sel=1`：读回 `LC_REG_MAPPING` 回拼的默认值/写入值

**LC_REG_MAPPING 回拼字节：**

```systemverilog
assign R_REG09_F_RECON = {SR_NF, SR_NR, SR_PF, SR_PR};          // 8'hFF
assign R_REG10_F_RECON = {PWRC_N, PWRC_P, PWRC_TB, PWRC_TA};    // 8'hA5
assign R_REG31_F_RECON = {PWRC_NB, PWRC_NA, PWRC_PB, PWRC_PA};  // 8'hAA
```

**输出逻辑：**
- 未写过时输出 chip_sel=1 默认值（`SR_*=2'b11`、`PWRC_TA/TB=2'b01`、`PWRC_PA/PB/NA/NB=2'b10`）
- 写过时输出对应 `R_REG*_F` 字段
- 不再依赖 `CHIP_SEL` 分支

### 10.7 0708 SMART_CS[3:0]

- `0x02` 增加 `SMART_CS[3:0]` 字段（`[7:6],[3:2]`），默认 `4'b0000`
- `LC_REG_MAPPING` 新增 `SMART_CS[3:0]` 输出，仅在 `CHIP_SEL=1` 时有效

## 11. 0714 默认值最终调整

- `R_REG09` / `R_REG10` / `R_REG31` 在 `LC_CPUWR` 内部复位默认值统一改为 `8'h00`
- chip_sel=1 的默认值通过 `LC_REG_MAPPING` 回拼机制实现：
  - `0x09` → `8'hFF`
  - `0x0A` → `8'hA5`
  - `0x1F` → `8'hAA`
- `chip_sel=0` 时 I2C 读回内部 R_REG 值；`chip_sel=1` 时读回 LC_REG_MAPPING 回拼值

## 12. 0716 FSEL[1:0] 新增

- `0x35` 新增 `FSEL[1:0]` 字段，用于选择 OSC 频率（9~12MHz）
  - `2'b00` → 10MHz
  - `2'b01` → 9MHz
  - `2'b10` → 12MHz
  - `2'b11` → 11MHz
- 默认值为 `2'b00`（字节级 `0x00`），对 chip_sel=0 与 chip_sel=1 均相同
- 原 `0x35[7:0]` 的 `Reserved` 拆分为 `FSEL[1:0]` + `Reserved[7:2]`

## 13. 0716 其他默认值调整

- `0x01` 字节默认值从 `0x04` 改为 `0x00`
- `0x04` 字节默认值从 `0x04` 改为 `0x00`
- `0x02`（CHIP_SEL=1）字节默认值从 `0x0F` 改为 `0x00`（与字段级 `SMART_CS[3:0]=4'b0000` 一致）

## 14. 0721 CONFIG_DATA 位宽扩展（寄存器映射不变）

0721v1 将 `LCONFIG_DATA`/`FCONFIG_DATA` 由 16bit 扩为 24bit，每个 ADD 步进写 3 个寄存器。**寄存器地址映射表本身不变**（地址、字段、默认值均未改动），变化的只是配置流中字节到拍的打包方式（2 字节/拍 → 3 字节/拍），详见：

- [四、校验和 §7 三字节拍重组与 XOR 不变性](./checksum.html)
- [二、寄存器图解 §6 配置拍重组对照图](./diagrams.html)

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');
    let scale = 1, translateX = 0, translateY = 0;
    let isDragging = false, startX = 0, startY = 0, initialTranslateX = 0, initialTranslateY = 0;
    function updateTransform() { lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }
    function resetTransform() { scale = 1; translateX = 0; translateY = 0; updateTransform(); }
    function openLightbox(src) { lightboxImg.src = src; resetTransform(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; setTimeout(() => { lightboxImg.src = ''; }, 250); }
    document.querySelectorAll('.article img').forEach(img => img.addEventListener('click', () => openLightbox(img.src)));
    lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    lightbox.addEventListener('wheel', (e) => { e.preventDefault(); scale = Math.min(Math.max(0.5, scale + (e.deltaY > 0 ? -0.15 : 0.15)), 5); updateTransform(); }, { passive: false });
    lightboxImg.addEventListener('mousedown', (e) => { e.preventDefault(); isDragging = true; lightboxImg.classList.add('grabbing'); startX = e.clientX; startY = e.clientY; initialTranslateX = translateX; initialTranslateY = translateY; });
    window.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = initialTranslateX + (e.clientX - startX); translateY = initialTranslateY + (e.clientY - startY); updateTransform(); });
    window.addEventListener('mouseup', () => { isDragging = false; lightboxImg.classList.remove('grabbing'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  </script>
