## 6. 1104v1 迭代（三件套升版）

> **1104 服务器同步之上的本地功能迭代**（reg-iter / t14，GLM-5.3 执行）：基线 = 1104 服务器态（commit 88d369c1，1029v1 血统 + 服务器 11-02 TP_F_AHEAD 停用），规格源 `HK1V11_Register_20261103.xlsm`（history 行 2026-11-03，与用户所列变更逐条核对一致）。**三件套全部升版 1104v1**（LC_CPUWR / LC_REG_MAPPING / **LINK_CONFIG_CTRL 首次加版本头**），验收三关全过。同日 **b49e5741 输出口归属修正**（§6.5，三关复评 0/0/0/0）与 **GLM-5.3 全量审查放行**（t3，critical=0）落地，1104 批寄存器变更收尾。

### 6.1 1104v1 迭代变更图

![1104v1 迭代变更 · 寄存器三件套升版](./images/anim/1104v1_reg_changes.svg?v=20261104r2)

> 四项移址 + 0x08 默认 0x00→0x30 + 旧位回 Reserved + **输出口归属修正（第 7 行，b49e5741）**。类型 / 状态见图中色标（移址=靛 / 默认=青 / 版本=灰 / 归属=蓝；✅ 绿=已采）。r0 旧版快照见 `images/archive/20261104/`（图版生命周期标准）。

### 6.2 四项移址明细

| # | 字段 | 旧（1104 服务器态） | 新（1104v1） |
|---|------|---------------------|--------------|
| 1 | **khead_20b_sel** | `R_KHEAD_20B_SEL[4:0] = LSI_PRTECT?R_REG51_F[6:2]:5'b00000`（0x33[6:2]，5bit，5'b10101=20bit） | `R_KHEAD_20B_SEL[2:0] = R_REG29_F[7:5]`（**0x1D[7:5]**，3bit，**3'b101=40bit、其余=20bit、默认 3'b000=20bit**，无 LSI 门控） |
| 2 | **TP_SEL[1:0]** | `R_TP_SEL[1:0] = LSI_PRTECT?R_REG52_F[7:6]:2'b00`（0x34[7:6]，默认 00） | `R_TP_SEL[1:0] = R_REG08_F[5:4]`（**0x08[5:4]**，默认 **2'b11**，无 LSI 门控） |
| 3 | **BACSCR_EOL** | `R_BACSCR_EOL = LSI_PRTECT?R_REG56_F[7]:1'b0`（0x38[7]） | `R_BACSCR_EOL = R_REG29_F[4]`（**0x1D[4]**，默认 0 不变，无 LSI 门控） |
| 4 | **VPS_EN[1]** | LC_CPUWR `VPS_EN_1 = R_REG03_F[7]`（F 0x03[7]） | LC_CPUWR 端口/assign **删除**；LC_REG_MAPPING **新增输出** `VPS_EN_1 = R_REG03_L[7]`（**L 0x43[7]**） |

**编码语义（新）**：TP_SEL 00=TP&PORSD / 01=TP / 10=K3 / **11=setting（默认）**；khead_20b_sel **3'b101=40bit、其余=20bit（默认）**；VPS_EN[1]：BKDU&VPS_EN[1]=1 → Sout short to vcom & DRA_OP OFF。

**0x08 字节默认 0x00 → 0x30**（TP_SEL 字段移入 [5:4]，R_REG08_F 与 shadow_08_F 三处复位同步改）。**旧位回 Reserved**：0x33[6:2] / 0x34[7:6] / 0x38[7] / 0x03[7]（存储保留、可写可读回，仅摘输出+注释，遵循 0827v1 0x33 先例）。

**输出口归属（b49e5741 修正后，详见 §6.5）**：上表前三项移址字段（khead_20b_sel@0x1D[7:5] / TP_SEL@0x08[5:4] / BACSCR_EOL@0x1D[4]）的**输出端口均在 LC_REG_MAPPING**（地址≤31 规则；存储 R_REG08_F / R_REG29_F 仍为 LC_CPUWR 字节输出口，LC_REG_MAPPING 既有输入直引）。

### 6.3 挂账（dangling account，写域外）

    document.getElementById('article').innerHTML = marked.parse(document.getElementById('md').textContent.trim());
const chapters = [

    ];
    const currentPath = location.pathname.split('/').pop() || 'index.html';
    const linksContainer = document.getElementById('navbar-links');
    chapters.forEach(([slug, label]) => {
      const href = slug === 'index' ? './' : `./${slug}.html`;
      const filename = slug === 'index' ? 'index.html' : `${slug}.html`;
      const a = document.createElement('a');
      a.href = href;

      if (currentPath === filename || currentPath.endsWith('/' + filename) || (currentPath === '' && slug === 'index')) {
        a.classList.add('active');
      }
      linksContainer.appendChild(a);
    });
const article = document.getElementById('article');
    const toc = document.getElementById('toc');
    const h1 = article.querySelector('h1');
    if (h1) {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = h1.textContent;
      a.className = 'toc-h1';
      toc.appendChild(a);
    }
    /* TOC 折叠（对齐 site-template/js/site.js）：带 h3 子标题的 h2 挂 ▸ 箭头，点箭头只折叠/展开不跳转；
       h3 成组缩进跟随；折叠时高亮落回父级 h2；默认全展开。标题 id 保持 toc-N 以不改既有锚点。 */
    const headings = Array.from(article.querySelectorAll('h2, h3'));
    headings.forEach((h, i) => { h.id = 'toc-' + i; });
    const tocLinks = [];
    const h3ToH2 = {};   /* h3 id -> 父 h2 id（折叠组激活时高亮回父级） */
    headings.forEach((h, i) => {
      if (h.tagName !== 'H2') return;
      const children = [];
      let j = i + 1;
      while (j < headings.length && headings[j].tagName === 'H3') { children.push(headings[j]); j++; }
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = 'toc-h2' + (children.length > 0 ? ' toc-parent' : '');
      toc.appendChild(a);
      tocLinks.push(a);
      if (children.length === 0) return;
      const group = document.createElement('div');
      group.className = 'toc-h3-group';
      group.setAttribute('data-parent', h.id);
      children.forEach(c => {
        h3ToH2[c.id] = h.id;
        const link = document.createElement('a');
        link.href = '#' + c.id;
        link.textContent = c.textContent;
        link.className = 'toc-h3';
        group.appendChild(link);
        tocLinks.push(link);
      });
      toc.appendChild(group);
      const arrow = document.createElement('span');
      arrow.className = 'toc-arrow';
      arrow.textContent = '▸';
      a.insertBefore(arrow, a.firstChild);
      arrow.addEventListener('click', (e) => {
        e.preventDefault(); /* 箭头 = 折叠/展开，不跳转 */
        const nowCollapsed = a.classList.toggle('collapsed');
        group.classList.toggle('collapsed', nowCollapsed);
        if (nowCollapsed) { /* 折叠时高亮移回父 h2 */
          const activeInGroup = group.querySelector('a.active');
          if (activeInGroup) { activeInGroup.classList.remove('active'); a.classList.add('active'); }
        }
      });
    });
    function updateTocActive() {
      let current = '';
      headings.forEach(h => { if (h.getBoundingClientRect().top < 100) current = h.id; });
      tocLinks.forEach(a => a.classList.remove('active'));
      if (!current) return;
      const parentId = h3ToH2[current];
      if (parentId) { /* 所在 h3 组已折叠 → 高亮落父级 h2 */
        const group = toc.querySelector('.toc-h3-group[data-parent="' + parentId + '"]');
        if (group && group.classList.contains('collapsed')) current = parentId;
      }
      const active = tocLinks.find(a => a.getAttribute('href') === '#' + current);
      if (active) active.classList.add('active');
    }
    window.addEventListener('scroll', updateTocActive);
    updateTocActive();
  </script>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');
    let scale = 1, translateX = 0, translateY = 0, baseW = 0, baseH = 0;
    let isDragging = false, startX = 0, startY = 0, initialTranslateX = 0, initialTranslateY = 0;
    /* v4.3 清晰缩放：放大用真实布局尺寸（width/height = base×scale），transform 只做平移。
       Chromium 按"布局尺寸×DPR"重栅格化 SVG；transform:scale 在高 DPR 屏会走纹理拉伸导致模糊。 */
    function updateTransform() {
      if (scale === 1) { lightboxImg.style.width = ''; lightboxImg.style.height = ''; }
      else {
        if (!baseW) { baseW = lightboxImg.clientWidth || lightboxImg.naturalWidth; baseH = lightboxImg.clientHeight || lightboxImg.naturalHeight; }
        if (baseW) { lightboxImg.style.width = baseW * scale + 'px'; lightboxImg.style.height = baseH * scale + 'px'; }
      }
      lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px)`;
    }
    function resetTransform() { scale = 1; translateX = 0; translateY = 0; baseW = 0; baseH = 0; updateTransform(); }
    function openLightbox(src) { lightboxImg.src = src; resetTransform(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; setTimeout(() => { lightboxImg.src = ''; }, 250); }
    document.querySelectorAll('.article img').forEach(img => img.addEventListener('click', () => openLightbox(img.src)));
    lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    lightbox.addEventListener('wheel', (e) => { e.preventDefault(); scale = Math.min(Math.max(0.5, scale + (e.deltaY > 0 ? -0.15 : 0.15)), 5); updateTransform(); }, { passive: false });
    lightboxImg.addEventListener('mousedown', (e) => { e.preventDefault(); isDragging = true; lightboxImg.classList.add('grabbing'); startX = e.clientX; startY = e.clientY; initialTranslateX = translateX; initialTranslateY = translateY; });
    window.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = initialTranslateX + (e.clientX - startX); translateY = initialTranslateY + (e.clientY - startY); updateTransform(); });
    window.addEventListener('mouseup', () => { isDragging = false; lightboxImg.classList.remove('grabbing'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  </script>
