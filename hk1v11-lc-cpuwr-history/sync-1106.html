# 十、1106 服务器同步 · 寄存器变更（1106v1）

> **本同步为服务器回传包批准覆盖（他人修改、diff-first 全采，非本地功能修改）**：内网工作站 1106 代三包 `PACK_TAR_1106V1`（HDL）/ `PACK_TAR_1106V0`（SYNTHESIS）/ `PACK_TAR_1106V2`（DV_TCON_C）覆盖到本地 `HDL/` / `SYNTHESIS/` / `DV_TCON_C/`，基线 = 本机 **1104v1**。三件套（LC_CPUWR / LC_REG_MAPPING / LINK_CONFIG_CTRL）md5 前 8 位 `604350ad` / `452041d4` / `2002f606`，**均与 V1 tar 原字节一致**。**三件套升版 1106v1**（文件头升版 + 双轨登记 + changelist NO56）。

## 1. 1106v1 服务器回传包 · 寄存器变更图

![1106v1 服务器回传包 · 寄存器变更](./images/anim/1106v1_reg_changes.svg?v=20261106r1)

| (b) | **LINK_CONFIG_CTRL 新增输出 `VPS_EN_0`**（164 行）：0x28[6] low-power（`VPS_EN_0=R_REG40_F[6]`）上抛供上层消费；四根寄存器输出连接（VPS_EN_1/khead/TP_SEL/BACSCR，`// 1104` 短注释）移至 LC_REG_MAPPING 实例**尾部**（590-593 行，**挂法与 1104v1 完全相同——仍挂 LC_REG_MAPPING 实例，非挂回 LC_CPUWR**） | 新增/归属 | LINK_CONFIG_CTRL | ✅ 功能零变化 |

## 3. SMART_CS 恒直出 · 寄存器表核对（t1）

> 读 `HK1V11_Register_20261103.xlsm`（DLP 加密，经 Excel COM）核对：**恒直出符合表**。

- **history R10（2026-10-01）** 显式声明 *"Address 0x02 is not controlled by CHIP_SEL; SMART_CS[3:0] unaffected by CHIP_SEL"*
- **Reg_1V11 R13 0X02 单行无 CHIP_SEL 拆分**（对照 0x09/0x0A/0x1F 双行拆分）：SMART_CS[3:2]@[7:6]、SMART_CS[1:0]@[3:2]、默认 0X00
- **Reg_description_F_CHIP_SEL=1 与 =0 两页 R13/R15 对 SMART_CS 定义逐字相同**（R/W、默认 2'b00、[0111]:256 packet / [1111]:128 packet）；对照组 chip_sel=0 页 R41 把 0x09 整字节标 Reserved，证明表会用 Reserved 标记 chip_sel=1 专属功能而 SMART_CS 未标
- **20261106 新表交叉验证语义未变**（仅改名 SMART_CS_3/2/1/0）；改动前「三态版（chip_sel=0 强制 0000）」反而与表不符

      ['index', '首页'],
      ['intro', '引言'],
      ['diagrams', '图解'],
      ['timeline', '时间线'],
      ['checksum', '校验和'],
      ['regmap', '寄存器'],
      ['register-research', '交叉验证'],
      ['verification', '验证'],
      ['status', '后续'],
      { label: '同步与规格', href: 'sync-1106v2.html', children: [
        ['sync-1104', '1104同步'],
        ['sync-1106', '1106同步'],
        ['sync-1106v2', '1106v2全链'],
        ['reset-spec', '复位规格']
      ] }
    ];
    const currentPath = location.pathname.split('/').pop() || 'index.html';
    const linksContainer = document.getElementById('navbar-links');
    function navFile(slug) { return slug === 'index' ? 'index.html' : slug + '.html'; }
    function isActive(slug) { return currentPath === navFile(slug) || currentPath.endsWith('/' + navFile(slug)) || (currentPath === '' && slug === 'index'); }
    chapters.forEach(item => {
      if (Array.isArray(item)) {
        const a = document.createElement('a');
        a.href = item[0] === 'index' ? './' : './' + item[0] + '.html';
        a.textContent = item[1];
        if (isActive(item[0])) a.classList.add('active');
        linksContainer.appendChild(a);
      } else {
        const wrap = document.createElement('div');
        wrap.className = 'nav-drop';
        const btn = document.createElement('a');
        btn.className = 'nav-drop-btn';
        btn.href = './' + item.href;
        btn.innerHTML = item.label + ' <span class="caret" role="button" tabindex="0" aria-expanded="false" aria-label="展开子菜单">▾</span>';
        const menu = document.createElement('div');
        menu.className = 'nav-drop-menu';
        let childActive = false;
        item.children.forEach(([slug, label]) => {
          const a = document.createElement('a');
          a.href = slug === 'index' ? './' : './' + slug + '.html';
          a.textContent = label;
          if (isActive(slug)) { a.classList.add('active'); childActive = true; }
          menu.appendChild(a);
        });
        if (childActive) wrap.classList.add('active-parent');
        const caret = btn.querySelector('.caret');
        caret.addEventListener('click', e => {
          e.preventDefault(); e.stopPropagation();
          const open = wrap.classList.toggle('open');
          caret.setAttribute('aria-expanded', String(open));
        });
        caret.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); caret.click(); }
        });
        wrap.appendChild(btn);
        wrap.appendChild(menu);
        linksContainer.appendChild(wrap);
      }
    });
    document.addEventListener('click', () => {
      document.querySelectorAll('.nav-drop.open').forEach(w => {
        w.classList.remove('open');
        const c = w.querySelector('.caret');
        if (c) c.setAttribute('aria-expanded', 'false');
      });
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.querySelectorAll('.nav-drop.open').forEach(w => w.classList.remove('open'));
    });
const article = document.getElementById('article');
    const toc = document.getElementById('toc');
    const h1 = article.querySelector('h1');
    if (h1) {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = h1.textContent;
      a.className = 'toc-h1';
      toc.appendChild(a);
    }
    /* TOC 折叠（对齐 site-template/js/site.js）：带 h3 子标题的 h2 挂 ▸ 箭头，点箭头只折叠/展开不跳转；
       h3 成组缩进跟随；折叠时高亮落回父级 h2；默认全展开。标题 id 保持 toc-N 以不改既有锚点。 */
    const headings = Array.from(article.querySelectorAll('h2, h3'));
    headings.forEach((h, i) => { h.id = 'toc-' + i; });
    const tocLinks = [];
    const h3ToH2 = {};   /* h3 id -> 父 h2 id（折叠组激活时高亮回父级） */
    headings.forEach((h, i) => {
      if (h.tagName !== 'H2') return;
      const children = [];
      let j = i + 1;
      while (j < headings.length && headings[j].tagName === 'H3') { children.push(headings[j]); j++; }
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = 'toc-h2' + (children.length > 0 ? ' toc-parent' : '');
      toc.appendChild(a);
      tocLinks.push(a);
      if (children.length === 0) return;
      const group = document.createElement('div');
      group.className = 'toc-h3-group';
      group.setAttribute('data-parent', h.id);
      children.forEach(c => {
        h3ToH2[c.id] = h.id;
        const link = document.createElement('a');
        link.href = '#' + c.id;
        link.textContent = c.textContent;
        link.className = 'toc-h3';
        group.appendChild(link);
        tocLinks.push(link);
      });
      toc.appendChild(group);
      const arrow = document.createElement('span');
      arrow.className = 'toc-arrow';
      arrow.textContent = '▸';
      a.insertBefore(arrow, a.firstChild);
      arrow.addEventListener('click', (e) => {
        e.preventDefault(); /* 箭头 = 折叠/展开，不跳转 */
        const nowCollapsed = a.classList.toggle('collapsed');
        group.classList.toggle('collapsed', nowCollapsed);
        if (nowCollapsed) { /* 折叠时高亮移回父 h2 */
          const activeInGroup = group.querySelector('a.active');
          if (activeInGroup) { activeInGroup.classList.remove('active'); a.classList.add('active'); }
        }
      });
    });
    function updateTocActive() {
      let current = '';
      headings.forEach(h => { if (h.getBoundingClientRect().top < 100) current = h.id; });
      tocLinks.forEach(a => a.classList.remove('active'));
      if (!current) return;
      const parentId = h3ToH2[current];
      if (parentId) { /* 所在 h3 组已折叠 → 高亮落父级 h2 */
        const group = toc.querySelector('.toc-h3-group[data-parent="' + parentId + '"]');
        if (group && group.classList.contains('collapsed')) current = parentId;
      }
      const active = tocLinks.find(a => a.getAttribute('href') === '#' + current);
      if (active) active.classList.add('active');
    }
    window.addEventListener('scroll', updateTocActive);
    updateTocActive();
  </script>

  <div class="lightbox" id="lightbox">
    <span class="close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
    <div class="hint">滚轮缩放 · 拖拽移动 · 点击空白处或右上角关闭</div>
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');
    let scale = 1, translateX = 0, translateY = 0, baseW = 0, baseH = 0;
    let isDragging = false, startX = 0, startY = 0, initialTranslateX = 0, initialTranslateY = 0;
    /* v4.3 清晰缩放：放大用真实布局尺寸（width/height = base×scale），transform 只做平移。
       Chromium 按"布局尺寸×DPR"重栅格化 SVG；transform:scale 在高 DPR 屏会走纹理拉伸导致模糊。 */
    function updateTransform() {
      if (scale === 1) { lightboxImg.style.width = ''; lightboxImg.style.height = ''; }
      else {
        if (!baseW) { baseW = lightboxImg.clientWidth || lightboxImg.naturalWidth; baseH = lightboxImg.clientHeight || lightboxImg.naturalHeight; }
        if (baseW) { lightboxImg.style.width = baseW * scale + 'px'; lightboxImg.style.height = baseH * scale + 'px'; }
      }
      lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px)`;
    }
    function resetTransform() { scale = 1; translateX = 0; translateY = 0; baseW = 0; baseH = 0; updateTransform(); }
    function openLightbox(src) { lightboxImg.src = src; resetTransform(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; setTimeout(() => { lightboxImg.src = ''; }, 250); }
    document.querySelectorAll('.article img').forEach(img => img.addEventListener('click', () => openLightbox(img.src)));
    lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    lightbox.addEventListener('wheel', (e) => { e.preventDefault(); scale = Math.min(Math.max(0.5, scale + (e.deltaY > 0 ? -0.15 : 0.15)), 5); updateTransform(); }, { passive: false });
    lightboxImg.addEventListener('mousedown', (e) => { e.preventDefault(); isDragging = true; lightboxImg.classList.add('grabbing'); startX = e.clientX; startY = e.clientY; initialTranslateX = translateX; initialTranslateY = translateY; });
    window.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = initialTranslateX + (e.clientX - startX); translateY = initialTranslateY + (e.clientY - startY); updateTransform(); });
    window.addEventListener('mouseup', () => { isDragging = false; lightboxImg.classList.remove('grabbing'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  </script>
