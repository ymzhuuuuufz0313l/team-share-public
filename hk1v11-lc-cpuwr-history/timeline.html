# 三、核心变更时间线

## 0. 2026-06-15：LC_CPUWR_history 归档目录建立

在迭代进入密集期之前，项目建立了独立的版本归档目录 `E:\\project\\HK1V11\\LC_CPUWR_history`，用于：

- 保存每一次重要变更的 RTL 快照
- 集中存放 changelist、modify plan、compliance report 等文档
- 支持服务器回传前的 review 与追溯

初始目录包含 `README.md`、changelist、plan 文档，后续逐步扩展为 `verilog_hdl/`、`markdownfile/`、`case/` 等子目录。

## 1. 2026-04：寄存器模块重写与 checksum 雏形

### 1.1 读写寄存器模块重写（0421）

- `LC_CPUWR.v` 按地址顺序重新组织
- 对应寄存器 Excel 修改信号复位值与复位信号
- 总体结构与代码风格保持不变

### 1.2 寄存器稳定判断（0430）

- 增加寄存器判断功能：只有寄存器信息稳定且多帧得到相同信息时才更新进寄存器表
- 为后续 checksum 的"三帧一致"机制打下基础

### 1.3 I2C only 区域 password 保护（0506）

- 按照 `LSI_PROTECT` 要求，对 I2C 专用地址 `0x50~0x56` 中所有可写寄存器增加 password error reset 保护

## 2. 2026-05：REG07 与 checksum 机制成型

### 2.1 0507 寄存器大表更新

- `AVE_R` 从 `0x00[2:0]` 移到 `0x00[7:5]`
- `reg_lane_ck_inv_en` 从 `0x25[7]` 移到 `0x50[1]`

### 2.2 0511 REG07 checksum update 功能

- 新增 `REG07` 寄存器相关的 checksum update 功能
- 后续演变为 `CTRLF_CHECKSUM[3:0]`，控制 checksum 使能

### 2.3 0512 部分寄存器不能进行 checksum update

发现三帧一致更新机制与时序冲突：
- `PORSD` / `POL` 等信号需要在第一帧结束就置位，但 checksum 要求 3 帧一致才生效
- `ch_sel` 寄存器响应滞后，导致后级模块按旧默认值处理新数据

**解决方案（最终演化为 0520 方案）**：
- **LSP 阶段结束至 K1 发起前**：此阶段不做 checksum，寄存器直写
- **K1 后做一个 latch**：latch=1 后保持 checksum 功能
- 即 **LSP 结束后第一次发送指令改为直写**，确保关键信号在第一帧即可生效，而不是永久绕过 checksum

### 2.4 0512 寄存器新增修改项

删除字段：
- `SMART_CS[3:0]` @ 0x02
- `VPS_EN[1:0]` @ 0x03 / 0x28
- `PDF_EN` / `PDF_CTRL` @ 0x06
- `R_BWDB_V_OFF` @ 0x23
- `R_LSP_DET_EN` @ 0x50

修改字段：
- `reg_pin_eq_auto[3:2]` 地址从 `0x02[5:4]` 改为 `0x02[3:2]`
- `regr_lane_ctrl[4:0]` 默认值改为 `5'b11000`

### 2.5 0519~0520 checksum 功能最终方案

- `REG07[3:0]` 命名为 `CTRLF_CHECKSUM[3:0]`，默认值 `0x05`（使能校验和）
- 最终方案：`REG07` 默认值为 `0`（使能 checksum 检测），写入 `0x05` 时关闭 checksum（直写模式）
- LSP 阶段结束至 K1 发起前不做 checksum，寄存器直写；K1 后 latch 保持 checksum 功能

### 4.8 0721 CONFIG_DATA 16bit → 24bit（每步 3 寄存器）

协议级"拍重组"变更：`LCONFIG_DATA` / `FCONFIG_DATA` 端口位宽由 16bit 扩为 24bit，每个 ADD 步进写 **3 个寄存器**。

- **流内字节顺序不变**：FCONFIG 60 字节 → 20 拍（`5'h01`~`5'h14`），LCONFIG 6 字节 → 2 拍（`3'h1`~`3'h2`），恰好整除、无需 pad
- **新增第 3 字节选择**：`DATA_E = LCONFIG_DATA[23:16]`、`DATA_F = FCONFIG_DATA[23:16]`；拍内位置定数据源（`addr%3==0→C, ==1→D, ==2→F`）
- **地址译码表整体重排**：I2C 比较部分不变，gap 字节依旧无译码行；127 行寄存器写数据源由脚本确定性替换（含 shadow 行）
- **checksum 按字节有效性折叠**：`0x1E/0x1F` 与 `0x20` 同拍跨 Segment1 边界，折叠逻辑按拍查表（`C^D^F` / `C^F` / `C^D` / `F` / `C`）；**XOR 总量与 0716_v1_work 完全相同**（结合律），checker 与 DV 回归行为不变
- **过渡方案**：上游 `CHPI_CONFIG_L0` 未升 24bit 前，`LINK_LOGIC` 将 `[23:16]` tie-off `8'h00` 防 X 传播，上游升版后删除
- 0716v1 备份为 `0716_v1_work`；DV env 升 0721v1 并补齐服务器 0716 同步遗漏的 FSEL 更新
- 对照图见「图解」章第 6 节：`config_data_beat_regroup_0721.svg`

服务器 0807 导出整体替换 HDL 与 DV_TCON_C，架构发生重大变化：

- **寄存器通路迁移**：旧版 `LINK_LOGIC` 承担 CLKGEN / LC_CPUWR / LC_REG_MAPPING / LINK_MISC 实例化；新版 `LINK_LOGIC` 变为**纯数据通路顶层**（672 行，无子模块实例化）

      }

const article = document.getElementById('article');

    if (h1) {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = h1.textContent;
      a.className = 'toc-h1';
      toc.appendChild(a);
    }
    const headings = article.querySelectorAll('h2, h3');
    headings.forEach((h, i) => {

      h.id = id;

    function updateTocActive() {
      let current = '';
      headings.forEach(h => { if (h.getBoundingClientRect().top < 100) current = h.id; });
      tocLinks.forEach(a => a.classList.remove('active'));

  <div class="lightbox" id="lightbox">
    <span class="close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
    <div class="hint">滚轮缩放 · 拖拽移动 · 点击空白处或右上角关闭</div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');
    let scale = 1, translateX = 0, translateY = 0;
    let isDragging = false, startX = 0, startY = 0, initialTranslateX = 0, initialTranslateY = 0;
    function updateTransform() { lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }
    function resetTransform() { scale = 1; translateX = 0; translateY = 0; updateTransform(); }
    function openLightbox(src) { lightboxImg.src = src; resetTransform(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; setTimeout(() => { lightboxImg.src = ''; }, 250); }
    document.querySelectorAll('.article img').forEach(img => img.addEventListener('click', () => openLightbox(img.src)));
    lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    lightbox.addEventListener('wheel', (e) => { e.preventDefault(); scale = Math.min(Math.max(0.5, scale + (e.deltaY > 0 ? -0.15 : 0.15)), 5); updateTransform(); }, { passive: false });
    lightboxImg.addEventListener('mousedown', (e) => { e.preventDefault(); isDragging = true; lightboxImg.classList.add('grabbing'); startX = e.clientX; startY = e.clientY; initialTranslateX = translateX; initialTranslateY = translateY; });
    window.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = initialTranslateX + (e.clientX - startX); translateY = initialTranslateY + (e.clientY - startY); updateTransform(); });
    window.addEventListener('mouseup', () => { isDragging = false; lightboxImg.classList.remove('grabbing'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  </script>
