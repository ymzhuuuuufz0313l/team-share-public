  <line x1="160" y1="320" x2="160" y2="335" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="160" y1="395" x2="160" y2="410" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="160" y1="470" x2="160" y2="485" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="850" y1="198" x2="850" y2="205" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="850" y1="320" x2="850" y2="335" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="890" y1="395" x2="890" y2="410" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="850" y1="470" x2="850" y2="485" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="750" y="570" width="580" height="40" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="770" y="595" font-size="12" fill="#166534">checker_420b.sv: collect 20-bit -> assemble 420-bit -> decode -> compare</text>
  <rect x="40" y="620" width="1320" height="430" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="70" y="655" font-size="18" font-weight="600" fill="#111827">Key Differences</text>
  <rect x="50" y="680" width="230" height="32" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="160" y="702" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Item</text>
  <rect x="280" y="680" width="400" height="32" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="702" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">8B/10B Mode</text>
  <rect x="680" y="680" width="360" height="32" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <text x="860" y="702" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">420B Mode</text>
  <rect x="50" y="712" width="230" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="734" font-size="12" fill="#111827">Mode Switch</text>
  <rect x="280" y="712" width="400" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="734" font-size="12" fill="#374151">No macro</text>
  <rect x="680" y="712" width="360" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="734" font-size="12" fill="#6b21a8">define CHPI_MODE_420B</text>
  <rect x="50" y="744" width="230" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="766" font-size="12" fill="#111827">Input Granularity</text>
  <rect x="280" y="744" width="400" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="766" font-size="12" fill="#374151">8-bit byte</text>
  <rect x="680" y="744" width="360" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="766" font-size="12" fill="#6b21a8">8-bit byte -> 7-bit groups (59 groups)</text>
  <rect x="50" y="776" width="230" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="798" font-size="12" fill="#111827">Encoding</text>
  <rect x="280" y="776" width="400" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="798" font-size="12" fill="#374151">8B/10B table -> 10-bit symbol</text>
  <rect x="680" y="776" width="360" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="798" font-size="12" fill="#6b21a8">413b -> 420b tag replacement + 70-bit alignment</text>
  <rect x="50" y="808" width="230" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="830" font-size="12" fill="#111827">K-code Width</text>
  <rect x="280" y="808" width="400" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="830" font-size="12" fill="#374151">10-bit K1/K2/K3/K4</text>
  <rect x="680" y="808" width="360" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="830" font-size="12" fill="#6b21a8">40-bit K1/K2/K3/K4</text>
  <rect x="50" y="840" width="230" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="862" font-size="12" fill="#111827">IDLE Pattern</text>
  <rect x="280" y="840" width="400" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="862" font-size="12" fill="#374151">No independent IDLE</text>
  <rect x="680" y="840" width="360" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="862" font-size="12" fill="#6b21a8">10-bit K5/K6/K7/K8</text>
  <rect x="50" y="872" width="230" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="894" font-size="12" fill="#111827">Scramble LFSR</text>
  <rect x="280" y="872" width="400" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="894" font-size="12" fill="#374151">24-bit G24(X)</text>
  <rect x="680" y="872" width="360" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="894" font-size="12" fill="#6b21a8">16-bit G16(X), 7-bit per step</text>
  <rect x="50" y="904" width="230" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="926" font-size="12" fill="#111827">LSP Scramble</text>
  <rect x="280" y="904" width="400" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="926" font-size="12" fill="#374151">Part of training</text>
  <rect x="680" y="904" width="360" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="926" font-size="12" fill="#6b21a8">Direct 413b/420b encode, no scramble</text>
  <rect x="50" y="936" width="230" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="958" font-size="12" fill="#111827">Send Direction</text>
  <rect x="280" y="936" width="400" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="958" font-size="12" fill="#374151">LSB-first</text>
  <rect x="680" y="936" width="360" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="958" font-size="12" fill="#6b21a8">MSB-first</text>
  <rect x="50" y="968" width="230" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="990" font-size="12" fill="#111827">Cross-lane Align</text>
  <rect x="280" y="968" width="400" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="990" font-size="12" fill="#374151">Byte aligned</text>
  <rect x="680" y="968" width="360" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="990" font-size="12" fill="#6b21a8">70-bit dummy alignment</text>
  <rect x="50" y="1000" width="230" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="1022" font-size="12" fill="#111827">Reference Model</text>
  <rect x="280" y="1000" width="400" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="1022" font-size="12" fill="#374151">encode_8b10b() in sequence</text>
  <rect x="680" y="1000" width="360" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="1022" font-size="12" fill="#6b21a8">Independent long_encoding_ref_model.sv</text>
  <rect x="50" y="1032" width="230" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="1054" font-size="12" fill="#111827">DUT Decode</text>
  <rect x="280" y="1032" width="400" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="1054" font-size="12" fill="#374151">8B/10B decode</text>
  <rect x="680" y="1032" width="360" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="1054" font-size="12" fill="#6b21a8">long_decoding_top / decoder_7b / descramble_7b</text>
  <rect x="50" y="1064" width="230" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="60" y="1086" font-size="12" fill="#111827">Output</text>
  <rect x="280" y="1064" width="400" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="290" y="1086" font-size="12" fill="#374151">8-bit data</text>
  <rect x="680" y="1064" width="360" height="32" rx="4" fill="#f9fafb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="690" y="1086" font-size="12" fill="#6b21a8">24-bit + 2-bit valid</text>
