<g class="head" style="animation-delay:0s">
<text x="600" y="40" font-size="21" fill="#1e293b" text-anchor="middle" font-weight="600">420b 收发结构框图 · 接收端不看 RTL 的脚本离线验证</text>
<text x="600" y="64" font-size="12" fill="#64748b" text-anchor="middle">在 K 码对齐点 tap 线上 20-bit 数据（DATA_ALIGN_PRE），Python 直接做 413b/420b 解码，与发送端原始字节逐区域比对</text>
</g>
