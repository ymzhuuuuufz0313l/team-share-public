<text x="230.0" y="161.5" font-size="9" fill="#64748b" text-anchor="middle">组帧：LSP / CTRL_F / Active / VBK / IDLE</text>
<text x="230.0" y="177.5" font-size="9" fill="#64748b" text-anchor="middle">K1~K4 40-bit · K5~K8 10-bit</text>
<rect x="64" y="204" width="332" height="60" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="230.0" y="221.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="600">long_encoding_ref_model.sv</text>
<text x="230.0" y="237.5" font-size="9" fill="#64748b" text-anchor="middle">413b → 420b 编码 · tag 替换</text>
<text x="230.0" y="253.5" font-size="9" fill="#64748b" text-anchor="middle">G16(X) 加扰（scramble_en = SCREN）</text>
<rect x="64" y="284" width="332" height="60" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="230.0" y="301.5" font-size="11.5" fill="#1e293b" text-anchor="middle" font-weight="600">isptx_driver.sv</text>
<text x="230.0" y="317.5" font-size="9" fill="#64748b" text-anchor="middle">20-bit 包 / 40-bit K 码 · LSB-first</text>
<text x="230.0" y="333.5" font-size="9" fill="#64748b" text-anchor="middle">→ vif.rxn0 / rxp0</text>
<rect x="64" y="364" width="332" height="60" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="230.0" y="389.5" font-size="9.5" fill="#7c3aed" text-anchor="middle" font-weight="600">dump_raw_bytes() → long_rawbyte_seq_lane0.md</text>
<text x="230.0" y="405.5" font-size="9" fill="#64748b" text-anchor="middle">编码前 raw byte 转储（期望值）</text>
</g>
