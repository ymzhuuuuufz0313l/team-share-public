<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
<style>
.row{opacity:0;animation:rowIn .55s cubic-bezier(.22,.7,.3,1) forwards}
.head{opacity:0;animation:rowIn .55s cubic-bezier(.22,.7,.3,1) forwards}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:100;animation:drawIn .6s cubic-bezier(.4,0,.2,1) forwards}
@keyframes drawIn{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fadeIn .6s ease forwards}
@keyframes fadeIn{to{opacity:1}}
.flowdot{fill:none;stroke-linecap:round;stroke-dasharray:9 91;stroke-width:3.5;animation:flow 1.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-100}}
.flowtail{fill:none;stroke-linecap:round;stroke-dasharray:4 96;stroke-width:8;opacity:.25;animation:flow 1.5s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(180,83,9,0))}50%{transform:scale(1.03);filter:drop-shadow(0 0 12px rgba(180,83,9,.8))}}
.pulse-t{transform-box:fill-box;transform-origin:center;animation:pulseT 2.8s ease-in-out infinite}
@keyframes pulseT{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(14,116,144,0))}50%{transform:scale(1.03);filter:drop-shadow(0 0 12px rgba(14,116,144,.8))}}
.pulse-b{transform-box:fill-box;transform-origin:center;animation:pulseB 2.8s ease-in-out infinite}
@keyframes pulseB{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(29,78,216,0))}50%{transform:scale(1.03);filter:drop-shadow(0 0 12px rgba(29,78,216,.8))}}
.sweepband{opacity:.85;animation:sweepMove 8s linear infinite}
@keyframes sweepMove{to{transform:translateX(var(--sweepP,160px))}}
.dashgrow{stroke-dasharray:7 5;animation:dashgrow 2.6s linear infinite}
@keyframes dashgrow{from{stroke-dashoffset:72}to{stroke-dashoffset:0}}
.march{animation:march 1.5s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
.cellwave{transform-box:fill-box;transform-origin:center;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.72;transform:scale(1.01)}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:1}50%{opacity:.55}}
.step{transform-box:fill-box;transform-origin:center;animation:stepLit 6s ease-in-out infinite}
@keyframes stepLit{0%,16%{filter:drop-shadow(0 0 9px rgba(29,78,216,.85));transform:scale(1.02)}24%,92%{filter:drop-shadow(0 0 0 rgba(29,78,216,0));transform:none}100%{filter:drop-shadow(0 0 9px rgba(29,78,216,.85));transform:scale(1.02)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.row,.head,.fade{opacity:1!important}.flowdot,.flowtail,.sweepband{display:none!important}}
</style>
  <defs>
    <marker id="ar-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
    <marker id="ar-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/></marker>
    <marker id="ar-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/></marker>
    <marker id="ar-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#9ca3af"/></marker>
  </defs>
  <rect width="1200" height="460" fill="#ffffff"/>
<g class="head">
<text x="600" y="40" font-size="21" fill="#1e293b" text-anchor="middle" font-weight="600">413b → 420b 分组标签替换</text>
<text x="600" y="64" font-size="12" fill="#64748b" text-anchor="middle">59 组 × 7-bit · 选取未出现的 6-bit 样式作 tag · 全 0/全 1 组替换为 tag+type · 编码效率 98.33%（413/420）· 最大连 0/连 1 ≤ 12</text>
</g>
<g class="row" style="animation-delay:0.2s">
<rect x="60" y="108" width="110" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="115.0" y="131.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="600">输入 413b</text>
<rect x="190" y="108" width="86" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="233.0" y="131.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="600">1001101</text>
<rect x="282" y="108" width="86" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="325.0" y="131.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="600">1110000</text>
<g class="pulse" style="animation-delay:0s">
<rect x="374" y="108" width="86" height="40" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="417.0" y="131.5" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="600">0000000</text>
</g>
<text x="488" y="134" font-size="13" fill="#64748b" text-anchor="middle">……</text>
<g class="pulse" style="animation-delay:-1.4s">
<rect x="516" y="108" width="86" height="40" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="559.0" y="131.5" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="600">1111111</text>
</g>
<rect x="608" y="108" width="86" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="651.0" y="131.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="600">1010010</text>
<text x="417" y="164" font-size="9.5" fill="#dc2626" text-anchor="middle">全 0</text>
<text x="559" y="164" font-size="9.5" fill="#dc2626" text-anchor="middle">全 1</text>
</g>
<g class="fade" style="animation-delay:1.1s">
<line class="draw" pathLength="100" style="animation-delay:1.1s" x1="442" y1="172" x2="442" y2="204" stroke="#2563eb" stroke-width="2" marker-end="url(#ar-blue)"/>
</g>
<g class="row" style="animation-delay:0.55s">
<g class="cellwave" style="animation-duration:3.4s;animation-delay:0.0s">
<rect x="60" y="208" width="110" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="115.0" y="231.5" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="600">输出 420b</text>
</g>
<g class="cellwave" style="animation-duration:3.4s;animation-delay:0.1s">
<rect x="190" y="208" width="40" height="40" rx="8" fill="#e9d5ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="210.0" y="231.5" font-size="11" fill="#5b21b6" text-anchor="middle" font-weight="600">0/1</text>
</g>
<g class="cellwave" style="animation-duration:3.4s;animation-delay:0.2s">
<rect x="236" y="208" width="64" height="40" rx="8" fill="#fef08a" stroke="#fde047" stroke-width="1.5"/>
<text x="268.0" y="231.5" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="600">101010</text>
</g>
<g class="cellwave" style="animation-duration:3.4s;animation-delay:0.3s">
<rect x="306" y="208" width="86" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="349.0" y="231.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="600">1001101</text>
</g>
<g class="cellwave" style="animation-duration:3.4s;animation-delay:0.4s">
<rect x="398" y="208" width="86" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="441.0" y="231.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="600">1110000</text>
</g>
<g class="cellwave" style="animation-duration:3.4s;animation-delay:0.5s">
<rect x="490" y="208" width="64" height="40" rx="8" fill="#fef08a" stroke="#fde047" stroke-width="1.5"/>
<text x="522.0" y="231.5" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="600">101010</text>
</g>
<g class="cellwave" style="animation-duration:3.4s;animation-delay:0.6s">
<rect x="560" y="208" width="30" height="40" rx="8" fill="#fecaca" stroke="#fca5a5" stroke-width="1.5"/>
<text x="575.0" y="231.5" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="600">0</text>
</g>
<text x="618" y="234" font-size="13" fill="#64748b" text-anchor="middle">……</text>
<g class="cellwave" style="animation-duration:3.4s;animation-delay:0.7s">
<rect x="646" y="208" width="64" height="40" rx="8" fill="#fef08a" stroke="#fde047" stroke-width="1.5"/>
<text x="678.0" y="231.5" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="600">101010</text>
</g>
<g class="cellwave" style="animation-duration:3.4s;animation-delay:0.8s">
<rect x="716" y="208" width="30" height="40" rx="8" fill="#fecaca" stroke="#fca5a5" stroke-width="1.5"/>
<text x="731.0" y="231.5" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="600">1</text>
</g>
<g class="cellwave" style="animation-duration:3.4s;animation-delay:0.9s">
<rect x="752" y="208" width="86" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="795.0" y="231.5" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="600">1010010</text>
</g>
</g>
<g class="row" style="animation-delay:0.85s">
<g class="fade" style="animation-delay:1.1s">
<line class="draw" pathLength="100" style="animation-delay:1.1s" x1="655" y1="196" x2="830" y2="196" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ar-blue)"/>
<path class="flowdot" d="M 655 196 L 830 196" stroke="#2563eb" pathLength="100" style="animation-duration:1.6s;animation-delay:-0.2s"/>
<path class="flowdot" d="M 655 196 L 830 196" stroke="#2563eb" pathLength="100" style="animation-duration:1.6s;animation-delay:-1.0s"/>
<path class="flowtail" d="M 655 196 L 830 196" stroke="#2563eb" pathLength="100" style="animation-duration:1.6s;animation-delay:-0.2s"/>
</g>
<text x="742" y="188" font-size="9.5" fill="#2563eb" text-anchor="middle">发送顺序 A → B</text>
<text x="678" y="264" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">A</text>
<text x="795" y="264" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">B</text>
</g>
<g class="head" style="animation-delay:0.9s">
<rect x="890" y="104" width="18" height="18" rx="4" fill="#e9d5ff" stroke="#c4b5fd" stroke-width="1"/>
<text x="916" y="118" font-size="11" fill="#64748b" text-anchor="start">1 比特跳变沿（前一数据包尾部取反）</text>
<rect x="890" y="136" width="18" height="18" rx="4" fill="#fef08a" stroke="#fde047" stroke-width="1"/>
<text x="916" y="150" font-size="11" fill="#64748b" text-anchor="start">6 比特标签（本包未出现的样式）</text>
<rect x="890" y="168" width="18" height="18" rx="4" fill="#fecaca" stroke="#fca5a5" stroke-width="1"/>
<text x="916" y="182" font-size="11" fill="#64748b" text-anchor="start">1 比特类型指示符（替换的是什么就放什么）</text>
</g>
<g class="row" style="animation-delay:1.1s">
<g class="step" style="animation-delay:0s">
<rect x="60" y="300" width="270" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="74" y="326" font-size="12" fill="#0f766e" text-anchor="start" font-weight="700">① 分组</text>
<text x="74" y="350" font-size="10.5" fill="#64748b" text-anchor="start">413b 分成 59 组 × 7-bit；保证每组都</text>
<text x="74" y="368" font-size="10.5" fill="#64748b" text-anchor="start">不是全 0/全 1，就一定不会出现 13 个</text>
<text x="74" y="386" font-size="10.5" fill="#64748b" text-anchor="start">连 0/连 1</text>
</g>
</g>
<g class="row" style="animation-delay:1.25s">
<g class="step" style="animation-delay:-1.5s">
<rect x="345" y="300" width="270" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="359" y="326" font-size="12" fill="#0f766e" text-anchor="start" font-weight="700">② 选 tag</text>
<text x="359" y="350" font-size="10.5" fill="#64748b" text-anchor="start">记录每组前 6-bit 样式（共 64 种），</text>
<text x="359" y="368" font-size="10.5" fill="#64748b" text-anchor="start">59 组必能找到未出现的样式作标签</text>
</g>
</g>
<g class="row" style="animation-delay:1.4s">
<g class="step" style="animation-delay:-3s">
<rect x="630" y="300" width="270" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="644" y="326" font-size="12" fill="#0f766e" text-anchor="start" font-weight="700">③ 替换</text>
<text x="644" y="350" font-size="10.5" fill="#64748b" text-anchor="start">全 0/全 1 组用 tag + 1-bit 类型指示符</text>
<text x="644" y="368" font-size="10.5" fill="#64748b" text-anchor="start">替换；tag 放到头部，解码时检测还原</text>
</g>
</g>
<g class="row" style="animation-delay:1.55s">
<g class="step" style="animation-delay:-4.5s">
<rect x="915" y="300" width="270" height="120" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="929" y="326" font-size="12" fill="#0f766e" text-anchor="start" font-weight="700">④ 直通</text>
<text x="929" y="350" font-size="10.5" fill="#64748b" text-anchor="start">若每组都不需要替换，头部放 1000000</text>
<text x="929" y="368" font-size="10.5" fill="#64748b" text-anchor="start">/ 0111111，表示该包不编码</text>
</g>
</g>
</svg>