# 五、Case 命名规则

> **2026-11-05 按当前 DV_TCON_C 环境（HEAD `a7130ba7`，1028 包后）全量重写**：07-13 基线页的「53 规划 case / 七分类」是建站时的规划稿，与现状完全脱节——现实是 **192 个实际入库 case**，命名族与维度矩阵见 §1~§4；基线规划保留在 §5 作历史对照。

## 1. 命名格式（现状）

统一命名族（0924 维度矩阵成型，1022 补 2 个特例），统一加 `_420b` 后缀：

```text
t_H{HACT}_V16_FPS{FPS}_PORT_NUM{PORT_NUM}[_{维度参数...}]_420b[_{用途后缀}]
```

- **维度参数**按需叠加：`DPLC_MODE1` / `DPLC_GROUP1` / `AVE_MODE1` / `AVE_LAST0|1` / `AVE_RGBW0~7` / `SD_CHOP_F{0..3}_SD_CHOP{0..5}` / `H4INV0|1` / `POL20` / `POL21` / `POLC0|1` / `CH_SEL0|2|3|4` / `SDC0` / `power`
- **用途后缀**：`_boe_test`（BOE 回放）、`_for_chengli_test`（SCREN1 特例）
- 07-13 基线规划的 `t_8b{lane}lane_420b_{function}` 命名族**未采用**

## 2. 数量与波次

| 时点 | 420b case 数 | 变化 |
|------|-------------|------|
| 07-13 基线 `66ecf97d` | 1（`t_H3840_V16_FPS120_420b`） | — |
| 0721v1 / 0807v1 / 0825 | 1 | 无新增 |
| **0924 `44e48592`** | **190** | **+189，维度矩阵一次性成型** |
| **1022 `5bf35dcf`** | **192** | +2：`t_H1440_..._DPLC_MODE1_420b_boe_test`（BOE 回放）、`t_H3840_V16_FPS120_SCREN1_420b_for_chengli_test`（SCREN=1 + BYTE0_BIT3_0） |
| 1028 / HEAD `a7130ba7` | 192 | — |

## 3. 维度矩阵总览（192 case）

![基线 vs 现状：case 规模与维度对比](./images/anim/delta_case_matrix.svg?v=20261105)

> **before → after**：基线只有 1 个 case、cfg 4 字段；0924 一次落地 +189，分辨率 ×6、FPS ×8、PORT ×4 全分布，再叠加 DPLC / SD_CHOP / 极性 / CH_SEL / SDC 等参数族构成维度矩阵；1022 补 BOE 回放与 SCREN1 两个特例达到 192。cfg 字段实测并集 **4 → 18**（t1 摘要的 17 为不计 `BYTE0_BIT3_0` 特例的口径）。

| 维度 | 取值分布（计数） |
|------|------------------|
| 分辨率 ×6 | H1440（47）/ H1920（52）/ H2560（6）/ H2880（18）/ H3456（10）/ H3840（59） |
| FPS ×8 | 60（1）/ 120（57）/ 144（20）/ 165（8）/ 180（1）/ 240（3）/ 280（98）/ 360（4） |
| PORT_NUM ×4 | 6（2）/ 8（6）/ 12（97）/ 24（1），其余默认 |
| DPLC 族 | `DPLC_MODE1`（173 处标注）× `DPLC_GROUP1`（33）× `AVE_MODE1` × `AVE_LAST0/1` × `AVE_RGBW0~7`（各 8）——H1440/H1920 为主全枚举行列 |
| SD_CHOP | H3840 下 `SD_CHOP_F0~F3 × CHOP0~5` 全枚举 24 个 |
| 极性 / 反相 | `H4INV0/1 × POL20 × POL21 × POLC0/1` 组合（28/20/20/25/13 计数） |
| SDC | `SDC0` 变体 55 |
| CH_SEL | `CH_SEL0/2/3/4`（12/12/6/10；决定 subpix_cnt 966/960/726/720/864） |
| 特殊 | `boe_test`（BOE 回放）、`SCREN1_for_chengli_test`、`power`（`t_H1920_..._power_420b`、`t_H3840_V16_FPS180_power_420b`、`t_H3840_V16_FPS60_PORT_NUM24_DPLC_MODE1_power_420b`） |

## 4. case 目录内容与 cfg 字段

- **每个 case 目录**：`cfg_frame0..8.txt` + `user_def.sv`（`CHPI_MODE_420B` 宏；boe 另有 `BOE_420B_TEST` / `PARTNUM` / `DOCNUM`）+ `ctrl_l_line_cfg.txt`（逐行 CTRL_L 覆盖，0825 起；实测 **188/192** 目录具备，缺失 4：基线原版 `t_H3840_V16_FPS120_420b`、SCREN1×2（for_chengli 与非 chengli 各 1）、`SD_CHOP_F3_SD_CHOP5`）
- **cfg 字段**：基线仅 POL / PORSD / CH_SEL / TEST_PRTCT 4 个 → 当前实测并集 **18**（新增 DPLC_MODE、AVE_MODE、AVE_LAST、AVE_RGBW、SDC、POL2、H4INV、POLC、DPLC_GROUP、SD_CHOP_F、SD_CHOP、SCREN（18 处）、DPOLINV（8 处）、BYTE0_BIT3_0（1 处，仅 SCREN1 特例）；POL 与 POL2 并存）

  <script>
    document.getElementById('article').innerHTML = marked.parse(document.getElementById('md').textContent.trim());
const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');
    let scale = 1, translateX = 0, translateY = 0, baseW = 0, baseH = 0;
    let isDragging = false, startX = 0, startY = 0, initialTranslateX = 0, initialTranslateY = 0;
    /* v4.3 清晰缩放：放大用真实布局尺寸（width/height = base×scale），transform 只做平移。
       Chromium 按"布局尺寸×DPR"重栅格化 SVG；transform:scale 在高 DPR 屏会走纹理拉伸导致模糊。 */
    function updateTransform() {
      if (scale === 1) { lightboxImg.style.width = ''; lightboxImg.style.height = ''; }
      else {
        if (!baseW) { baseW = lightboxImg.clientWidth || lightboxImg.naturalWidth; baseH = lightboxImg.clientHeight || lightboxImg.naturalHeight; }
        if (baseW) { lightboxImg.style.width = baseW * scale + 'px'; lightboxImg.style.height = baseH * scale + 'px'; }
      }
      lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px)`;
    }
    function resetTransform() { scale = 1; translateX = 0; translateY = 0; baseW = 0; baseH = 0; updateTransform(); }
    function openLightbox(src) { lightboxImg.src = src; resetTransform(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; setTimeout(() => { lightboxImg.src = ''; }, 250); }
    document.querySelectorAll('.article img').forEach(img => img.addEventListener('click', () => openLightbox(img.src)));
    lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    lightbox.addEventListener('wheel', (e) => { e.preventDefault(); scale = Math.min(Math.max(0.5, scale + (e.deltaY > 0 ? -0.15 : 0.15)), 5); updateTransform(); }, { passive: false });
    lightboxImg.addEventListener('mousedown', (e) => { e.preventDefault(); isDragging = true; lightboxImg.classList.add('grabbing'); startX = e.clientX; startY = e.clientY; initialTranslateX = translateX; initialTranslateY = translateY; });
    window.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = initialTranslateX + (e.clientX - startX); translateY = initialTranslateY + (e.clientY - startY); updateTransform(); });
    window.addEventListener('mouseup', () => { isDragging = false; lightboxImg.classList.remove('grabbing'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  // Left-side TOC: current page title + in-page headings only
    const article = document.getElementById('article');
    const toc = document.getElementById('toc');

    // Current page title (h1)
    const h1 = article.querySelector('h1');
    if (h1) {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = h1.textContent;
      a.className = 'toc-h1';
      toc.appendChild(a);
    }

    // In-page headings: h2 entry + its h3 group (arrow fold, default expanded)
    const headings = article.querySelectorAll('h2, h3');
    headings.forEach((h, i) => { h.id = 'toc-' + i; });
    const h3ToH2 = {};
    headings.forEach((h, i) => {
      if (h.tagName !== 'H2') return;
      const children = [];
      let j = i + 1;
      while (j < headings.length && headings[j].tagName === 'H3') { children.push(headings[j]); j++; }
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = 'toc-h2' + (children.length > 0 ? ' toc-parent' : '');
      toc.appendChild(a);
      if (children.length === 0) return;
      const group = document.createElement('div');
      group.className = 'toc-h3-group';
      group.setAttribute('data-parent', h.id);
      children.forEach(c => {
        h3ToH2[c.id] = h.id;
        const link = document.createElement('a');
        link.href = '#' + c.id;
        link.textContent = c.textContent;
        link.className = 'toc-h3';
        group.appendChild(link);
      });
      toc.appendChild(group);
      const arrow = document.createElement('span');
      arrow.className = 'toc-arrow';
      arrow.textContent = '▸';
      a.insertBefore(arrow, a.firstChild);
      arrow.addEventListener('click', (e) => {
        e.preventDefault(); // arrow = fold/unfold only, no jump
        const collapsed = a.classList.toggle('collapsed');
        group.classList.toggle('collapsed', collapsed);
        if (collapsed) { // folded group: highlight falls back to parent h2
          const activeInGroup = group.querySelector('a.active');
          if (activeInGroup) {
            activeInGroup.classList.remove('active');
            a.classList.add('active');
          }
        }
      });
    });

    // Scroll spy (heading inside a folded group lights the parent h2)
    const tocLinks = Array.from(toc.querySelectorAll('a'));
    function updateTocActive() {
      let current = '';
      headings.forEach(h => {
        if (h.getBoundingClientRect().top < 100) current = h.id;
      });
      const parentId = h3ToH2[current];
      if (parentId) {
        const group = toc.querySelector('.toc-h3-group[data-parent="' + parentId + '"]');
        if (group && group.classList.contains('collapsed')) current = parentId;
      }
      tocLinks.forEach(a => a.classList.remove('active'));
      if (current) {
        const active = tocLinks.find(a => a.getAttribute('href') === '#' + current);
        if (active) active.classList.add('active');
      }
    }
    window.addEventListener('scroll', updateTocActive);
    updateTocActive();
  </script>
