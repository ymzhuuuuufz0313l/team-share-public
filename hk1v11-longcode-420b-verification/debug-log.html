## 3. 问题定位记录

### 3.1 LSP 阶段 K-code 错解：enum 顺序不一致

<div class="pcard">
<div class="prow"><span class="k">状态</span><span><span class="badge badge-fixed">🔵 已解决</span> <span class="badge badge-dv">DV 侧</span> <span class="badge">07/15</span></span></div>
<div class="prow"><span class="k">现象</span><span>LSP 波形出现 5 次 <code>K1 K2</code> 重复 + 末尾 <code>K3 K4</code>，与 sequence 发出的 K2/K3 不符。</span></div>
<div class="prow"><span class="k">定位</span><span><code>isptx_transaction</code> 的 420B type_head enum 顺序为 <code>K2/K3/K4/K1</code>，与 driver 的 <code>K1/K2/K3/K4</code> 不一致，sequence 发 K2/K3 被 driver 错解为 K1/K2。</span></div>
<div class="prow"><span class="k">解决</span><span>transaction enum 顺序对齐 driver，clean rebuild 后 case 通过。</span></div>
</div>

### 3.2 "K1 K2 K2 K1 K2"：K1 被 BK_ST 与逻辑遮盖

<div class="pcard">
<div class="prow"><span class="k">状态</span><span><span class="badge badge-fixed">🔵 已移交</span> <span class="badge badge-rtl">RTL 侧</span> <span class="badge">07/17 · 俊杰</span></span></div>
<div class="prow"><span class="k">现象</span><span>driver 侧偶发两个 K2 之间缺一个 K1。</span></div>
<div class="prow"><span class="k">定位</span><span><code>CHPI_KCODE_ALIGN_LONG_L0.v</code> 中 <code>K1_FIND = K1_CODE2 &amp; K1_CODE1_D1 &amp; BK_ST</code>（K2/K3/K4 无 BK_ST 门控）；<code>BK_ST</code> 由 <code>BIT_ALIGN_PT | (R_BKDU &amp; K2_FIND)</code> 置位、K1_FIND 清零，而 <code>BIT_ALIGN_PT</code> 源自 8B/10B 的 CHPI_SD_CTRL 数据结束时序，420b 行结构下置位不匹配 → BK_ST 保持 0，后续 K1 被与逻辑遮盖。</span></div>
<div class="prow"><span class="k">解决</span><span>属 420b/8B10B mux 信号逻辑未更新问题，RTL 修复移交俊杰。</span></div>
</div>

### 3.3 解码输出与载荷无关：din_20b_aligned 误接

<div class="pcard">
<div class="prow"><span class="k">状态</span><span><span class="badge badge-fixed">🔵 已解决</span> <span class="badge badge-rtl">RTL 侧</span> <span class="badge">07/17</span></span></div>
<div class="prow"><span class="k">现象</span><span>LSP / CTRL_F / VBLK 三个区域解码输出同一套重复模式（<code>28 00 80 02</code>），与发送内容完全无关。</span></div>
<div class="prow"><span class="k">定位</span><span><code>LINK_LOGIC.v:1250</code> 将 <code>DATA_POINT_LAT</code>（对齐<b>位置标志</b>锁存，准静态）接到 <code>long_decoding_top.din_20b_aligned</code>；对齐数据 <code>DATA0_ALIGN</code> 只去了 8B/10B 消费端。</span></div>
<div class="prow"><span class="k">解决</span><span>改接 <code>DATA0_ALIGN_LONG</code> 后 LSP 立即解出原始训练码 <code>ed ec eb ea</code>，数据通路打通。</span></div>
</div>

### 3.4 CTRL_F / VBLK / ACT 密文：加扰策略不一致

<div class="pcard">
<div class="prow"><span class="k">状态</span><span><span class="badge badge-fixed">🔵 已解决</span> <span class="badge badge-tx">TX 侧</span> <span class="badge">07/17</span></span></div>
<div class="prow"><span class="k">现象</span><span>接线修复后 LSP 能对上，但 CTRL_F / VBLK / ACT 仍为随机状密文。</span></div>
<div class="prow"><span class="k">定位</span><span>TX sequence 对 payload 硬编码 <code>scramble_en=1'b1</code>，而 case <code>SCREN=0</code>（DUT R_SCREN=0 不解扰直通）；LSP 因 TX 本来就不加扰而能对上，反向印证。</span></div>
<div class="prow"><span class="k">解决</span><span>三处 <code>encode_with_70b_alignment()</code> 的 scramble_en 改为 <code>env_cfg.SCREN</code>（与 DUT R_SCREN 同源），LSP 保持不加扰。</span></div>
</div>

### 3.5 ACT 像素逐位反转：pixel/VBK 压流位序

<div class="pcard">
<div class="prow"><span class="k">状态</span><span><span class="badge badge-fixed">🔵 已解决</span> <span class="badge badge-tx">TX 侧</span> <span class="badge">07/17</span></span></div>
<div class="prow"><span class="k">现象</span><span>pydec 解码 ACT 行，像素 <code>00 01 02 03...</code> 变为 <code>00 80 40 c0...</code>（逐位反转），CTRL_L 前 5 字节正常。</span></div>
<div class="prow"><span class="k">定位</span><span>TX 的 pixel/VBK 压流循环按 MSB-first（<code>j=7..0</code>）推入 bit_stream，而 CTRL_L/CTRL_F/LSP 均为 LSB-first，发送侧位序不一致。</span></div>
<div class="prow"><span class="k">解决</span><span>两处循环改 LSB-first（<code>j=0..7</code>），修复后像素渐变与发送完全一致。</span></div>
</div>

### 3.7 ref model decode_420b_to_413b 与 encode 不一致

<div class="pcard">
<div class="prow"><span class="k">状态</span><span><span class="badge badge-fixed">🔵 已解决</span> <span class="badge badge-dv">DV 侧</span> <span class="badge">07/17 发现 · 07/20 修复</span></span></div>
<div class="prow"><span class="k">现象</span><span>decode 的 tag 提取与 encode 差一位（encode 把 tag 放 header bits1-6，decode 取 bits0-5），且 scren=1 时先解扰后判定替换的顺序错误。</span></div>
<div class="prow"><span class="k">影响</span><span>仅被 display-only 的 checker_420b 使用，从未暴露；Python 解码器已实现正确语义。</span></div>
<div class="prow"><span class="k">解决</span><span>0720v1 已修复：<code>tag = header[6:1]</code>；改为先在未解扰线上组判定替换（低 6 位 == tag、bit6 = type → 还原加扰域 0x00/0x7F），再对全部 59 组统一解扰（LFSR 每组推进）；线上组同时改按自然位序处理，消除原位反转导致的 scren=1 keystream 错位。已用 SV encode/decode 逐行直译的 Python roundtrip 复验（scren=0/1、416 块、含 244 块替换路径），并与 golden <code>decode_dap.py</code> 交叉一致。启用 checker 正式比对前仍需改造 <code>check_all()</code> 的 scramble_en 硬编码与每 block LFSR 重置。</span></div>
</div>
