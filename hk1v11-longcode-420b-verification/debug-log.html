# 九、排障实录：联调问题 · 定位 · 进展 · 结论

> 📌 **最终结论（0717）**：接收端使用 Python 对 `DATA_ALIGN_PRE` 进行离线 413b/420b 解码比对，**LSP / CTRL_F / CTRL_L / VBK / Video 线上数据全部正确** —— 剩余问题在 RTL 解码侧，不在发送数据。

## 1. 调试方法论：三级独立交叉验证

不依赖 DUT 自身解码结果，用独立路径证明"线上数据是否正确"：

| 步骤 | 内容 | 产出 |
|------|------|------|
| ① 抓取 | `long_rtl_tap_debug.sv` 以 `bind` 注入 DUT（零 RTL 修改），抓 K_FIND / BK_ST / INDATA / DATA0_ALIGN / 解码器输入输出 / DATA_ALIGN_PRE | `long_rtl_rx_lane0.md`、`long_rtl_dec_lane0.md`、`long_rtl_grp_lane0.md`、`long_rtl_dap_lane0.md` |
| ② 解码 | Python `decode_dap.py` 离线 413b/420b 解码（K 码对定位、tag 替换、G16 解扰；与 encode/DUT 语义一致，roundtrip 500 块随机数据全对） | `long_pydec_lane0.md` |
| ③ 比对 | 与发送端编码前原始字节 `long_rawbyte_seq_lane0.md` 逐区域 diff | `long_pydec_report_lane0.md` |

## 2. 问题定位记录

### 2.1 🔵 LSP 阶段 K-code 错解：enum 顺序不一致（0715）

- **现象**：LSP 波形出现 5 次 `K1 K2` 重复 + 末尾 `K3 K4`，与 sequence 发出的 `K2/K3` 不符。
- **定位**：`isptx_transaction` 的 420B `type_head` enum 顺序为 `K2/K3/K4/K1`，与 driver 的 `K1/K2/K3/K4` 不一致，sequence 发 K2/K3 被 driver 错解为 K1/K2。
- **解决**：transaction enum 顺序对齐 driver，clean rebuild 后 case 通过。

### 2.2 🔵 "K1 K2 K2 K1 K2"：K1 被 BK_ST 与逻辑遮盖（0717，RTL 移交俊杰）

- **现象**：driver 侧偶发两个 K2 之间缺一个 K1。
- **定位**：`CHPI_KCODE_ALIGN_LONG_L0.v` 中 `K1_FIND = K1_CODE2 & K1_CODE1_D1 & BK_ST`（K2/K3/K4 无 BK_ST 门控）；`BK_ST` 由 `BIT_ALIGN_PT | (R_BKDU & K2_FIND)` 置位、K1_FIND 清零，而 `BIT_ALIGN_PT` 源自 8B/10B 的 `CHPI_SD_CTRL` 数据结束时序，420b 行结构下置位不匹配 → `BK_ST` 保持 0，后续 K1 被与逻辑遮盖。
- **解决**：属 420b/8B10B mux 信号逻辑未更新问题，RTL 修复移交俊杰。

### 2.3 🔵 解码输出与载荷无关：`din_20b_aligned` 误接（0717）

- **现象**：LSP / CTRL_F / VBLK 三个区域解码输出同一套重复模式（`28 00 80 02`），与发送内容完全无关。
- **定位**：`LINK_LOGIC.v:1250` 将 `DATA_POINT_LAT`（对齐**位置标志**锁存，准静态）接到 `long_decoding_top.din_20b_aligned`；对齐数据 `DATA0_ALIGN` 只去了 8B/10B 消费端。
- **解决**：改接 `DATA0_ALIGN_LONG` 后 LSP 立即解出原始训练码 `ed ec eb ea`，数据通路打通。

### 2.4 🔵 CTRL_F / VBLK / ACT 密文：加扰策略不一致（0717，TX 侧）

- **现象**：接线修复后 LSP 能对上，但 CTRL_F/VBLK/ACT 仍为随机状密文。
- **定位**：TX sequence 对 payload 硬编码 `scramble_en=1'b1`，而 case `SCREN=0`（DUT `R_SCREN=0` 不解扰直通）；LSP 因 TX 本来就不加扰而能对上，反向印证。
- **解决**：三处 `encode_with_70b_alignment()` 的 `scramble_en` 改为 `env_cfg.SCREN`（与 DUT `R_SCREN` 同源），LSP 保持不加扰。

### 2.5 🔵 ACT 像素逐位反转：pixel/VBK 压流位序（0717，TX 侧）

- **现象**：pydec 解码 ACT 行，像素 `00 01 02 03...` 变为 `00 80 40 c0...`（逐位反转），CTRL_L 前 5 字节正常。
- **定位**：TX 的 pixel/VBK 压流循环按 MSB-first（`j=7..0`）推入 bit_stream，而 CTRL_L/CTRL_F/LSP 均为 LSB-first，发送侧位序不一致。
- **解决**：两处循环改 LSB-first（`j=0..7`），修复后像素渐变与发送完全一致。

### 2.6 🟡 RTL 解码区域边界异常（待跟进）

- **现象**：rtl_dec 区域起始 9 字节残流（上一区段滞后排出）、尾部字节溢出到下一区段、个别位错（如 `a4`→`a0`）。
- **定位**：DUT `decoder_7b` / `descramble_7b` / 24-bit 打包逻辑的窗口开闭与流水线时序问题；pydec（线上数据正确）可作对照证据。
- **进展**：待 RTL 侧跟进。

### 2.7 🟡 ref model `decode_420b_to_413b` 与 encode 不一致（DV 备注）

- tag 提取与 encode 差一位（encode 把 tag 放 header bits1-6，decode 取 bits0-5），且 scren=1 时先解扰后判定替换的顺序错误。
- 仅被 display-only 的 checker 使用，从未暴露；Python 解码器已实现正确语义，SV 侧待修正。

### 2.8 🟡 K3 使用条件（待 Spec 确认）

- DUT：`K4` 关闭解扰（`ctrl_f_scramble_en=0`），仅 `K3` 重新使能；当前 Active Line 统一以 K2 结束（spec 允许 K2 或 K3），K3 的引入条件待与 spec 确认。

## 4. 最终结论与证据

> ACT 行离线解码：`11 05 16 00 00`（CTRL_L，FSYNC=1）+ `00 01 02 03...` 像素渐变，与发送端原始字节完全一致。
> 线上数据正确 ⇒ 发送端（sequence/编码/driver/链路/对齐）排除；后续聚焦 RTL 解码链（第 2.6 节）。

    document.querySelectorAll('.article img').forEach(img => img.addEventListener('click', () => openLightbox(img.src)));
    lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    lightbox.addEventListener('wheel', (e) => { e.preventDefault(); scale = Math.min(Math.max(0.5, scale + (e.deltaY > 0 ? -0.15 : 0.15)), 5); updateTransform(); }, { passive: false });
    lightboxImg.addEventListener('mousedown', (e) => { e.preventDefault(); isDragging = true; lightboxImg.classList.add('grabbing'); startX = e.clientX; startY = e.clientY; initialTranslateX = translateX; initialTranslateY = translateY; });
    window.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = initialTranslateX + (e.clientX - startX); translateY = initialTranslateY + (e.clientY - startY); updateTransform(); });
    window.addEventListener('mouseup', () => { isDragging = false; lightboxImg.classList.remove('grabbing'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  // Left-side TOC: current page title + in-page headings only
    const article = document.getElementById('article');
    const toc = document.getElementById('toc');

    // Current page title (h1)
    const h1 = article.querySelector('h1');
    if (h1) {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = h1.textContent;
      a.className = 'toc-h1';
      toc.appendChild(a);
    }

    // In-page headings
    const headings = article.querySelectorAll('h2, h3');
    headings.forEach((h, i) => {
      const id = 'toc-' + i;
      h.id = id;
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      a.className = h.tagName.toLowerCase() === 'h3' ? 'toc-h3' : 'toc-h2';
      toc.appendChild(a);
    });

    // Scroll spy
    const tocLinks = Array.from(toc.querySelectorAll('a'));
    function updateTocActive() {
      let current = '';
      headings.forEach(h => {
        if (h.getBoundingClientRect().top < 100) current = h.id;
      });
      tocLinks.forEach(a => a.classList.remove('active'));
      if (current) {
        const active = tocLinks.find(a => a.getAttribute('href') === '#' + current);
        if (active) active.classList.add('active');
      }
    }
    window.addEventListener('scroll', updateTocActive);
    updateTocActive();
  </script>
</body>
