# 六、420b 解码

> **当前现状**：RTL 解码链仍在联调（区域边界问题待跟进），实际承担解码验证工作的是 **Python 离线解码器** —— 不看 RTL，直接对线上 20-bit 对齐数据做 413b/420b 解码，已证实 LSP / CTRL_F / CTRL_L / VBK / Video 线上数据全部正确。

## 1. 离线解码（当前实际工作路径）

![收发结构框图：脚本离线验证](./pydec_tx_rx_structure.svg?v=20260720)

### 1.1 工作流程

| 步骤 | 内容 | 产出 |
|------|------|------|
| 抓取 | `long_rtl_tap_debug.sv` bind 进 `CHPI_KCODE_ALIGN_LONG_L0`，每拍全量记录 `DATA_ALIGN_PRE` | `long_rtl_dap_lane0.md` |
| 解码 | `decode_dap.py` 离线 413b/420b 解码（与 encode / DUT 语义一致） | `long_pydec_lane0.md` |
| 比对 | 与发送端编码前原始字节 `long_rawbyte_seq_lane0.md` 逐区域 diff | `long_pydec_report_lane0.md` |

### 1.2 新增证据链脚本（0721~0722，用于定位 DUT 解码问题）

| 脚本 | 输入 | 输出 | 用途 |
|------|------|------|------|
| `check_rtl_tag.py` | `long_rtl_tag_lane0.md`（`bind decoder_7b` 逐拍判定） | 异常行 `[X]` 汇总 + 计数 | **替换点合法性判定**：`in!=out` 只允许是 `{0,tag}→0x00` / `{1,tag}→0x7F`；异常带 (blk,grp) 坐标 |
| `decode_max.py` | `long_rtl_max_lane0.md`（`dout_21b_max` 全量 dump） | `long_maxdec_lane0.md` + `long_maxdec_report_lane0.md` | **层级分离**：`maxdec == golden` 而 `rtl_dec != golden` → 替换后重组/解扰问题；`maxdec != golden` → 替换逻辑本身问题 |
| `compare_pkt20.py` | `long_pkt20_seq_lane0.md` vs `long_rtl_dap_lane0.md` | `long_pkt20_cmp_report_lane0.md` | **收发 20-bit 包流对比**：按 K 码对切分，先比 K 码序列、再逐字比数据段；默认源为 DAP 全量流 |

> 判定顺序：`decode_dap.py`（线上 golden）→ `check_rtl_tag.py`（替换点异常筛选）→ `decode_max.py`（层级分离）→ `compare_pkt20.py`（收发逐字比对）。本轮 `check_rtl_tag.py` 报告 0 异常、`compare_pkt20.py` 收发一致，配合 `decode_max.py` 定位到 DUT `tag_value` 块边界时序问题（见第 2 节）。

### 1.3 解码规则

- **K 码定位**：以两个连续 20-bit 字识别 K1~K4
- **区域分类**：`LSP = K2→K3`、`LINE = K1→K2`、`CTRL_F = K4→K2`，IDLE 跳过
- **替换还原**：tag 提取 + 全 0/全 1 组还原；替换判定在线上组 `{tag[0..5], type}` 上进行，随后全组统一解扰
- **长度判定**：内容只看期望长度，多余尾部标注 pad
- **自检**：Python encode/decode roundtrip，scren=0/1 各 500 块随机数据全对 <span class="badge badge-fixed">✅ 通过</span>

### 1.4 验证结论

| 区域 | 期望 | pydec 解码 | 结果 |
|------|------|-----------|------|
| LSP | `ed ec eb ea` ×8 | 完全一致 | ✅ |
| CTRL_F | 64B 帧配置 | 逐项一致 | ✅ |
| CTRL_L | 行控制（FSYNC/BKDU/POL） | 完全一致 | ✅ |
| VBK | dummy 全 0 | 完全一致 | ✅ |
| Video | 像素渐变 | 完全一致 | ✅ |

⇒ 发送端（sequence / 编码 / driver / 链路 / 对齐）排除；剩余问题在 RTL 解码侧（见第 2 节）。

## 2. RTL 解码链（联调中）

### 2.1 链路结构

```text
20-bit 对齐输入流
        │
        ▼
┌───────────────────┐
│   decoder_7b      │  420b → 413b 解码
│                   │  提取 tag、还原全 0/全 1、重组数据
│                   │  输出 7/14/21-bit 有效数据
└─────────┬─────────┘
          │
          ▼
┌───────────────────┐
│  descramble_7b    │  7-bit LFSR G16(X) 解扰
│                   │  K3 上升沿复位
│                   │  scramble_en=0 时旁路
└─────────┬─────────┘
          │
          ▼
┌───────────────────┐
│ long_decoding_top │  42-bit 缓存
│                   │  按 8/16/24-bit 切分打包输出
└───────────────────┘
```

### 2.2 关键信号

- `decode_en`：解码窗口使能；K1/K4 开，K2/K3 关
- `tag_value`：6-bit 标签，用于全 0/全 1 替换；`decode_ignore`（无编码旁路）应判 `tag ∈ {0,63}`（现有 RTL 以 6-bit 对 7-bit 常量比较，tag=0 标记漏判，待修，见排障 3.9）
- `dout_21b_valid`：有效位宽 01=7bit / 10=14bit / 11=21bit
- `scramble_en_k3`：K3 锁存的解扰使能
- `dout_24b / dout_valid`：最终 24-bit 输出及有效指示

  <script>
    document.getElementById('article').innerHTML = marked.parse(document.getElementById('md').textContent.trim());
const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');
    let scale = 1, translateX = 0, translateY = 0;
    let isDragging = false, startX = 0, startY = 0, initialTranslateX = 0, initialTranslateY = 0;
    function updateTransform() { lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }
    function resetTransform() { scale = 1; translateX = 0; translateY = 0; updateTransform(); }
    function openLightbox(src) { lightboxImg.src = src; resetTransform(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; setTimeout(() => { lightboxImg.src = ''; }, 250); }
    document.querySelectorAll('.article img').forEach(img => img.addEventListener('click', () => openLightbox(img.src)));
    lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    lightbox.addEventListener('wheel', (e) => { e.preventDefault(); scale = Math.min(Math.max(0.5, scale + (e.deltaY > 0 ? -0.15 : 0.15)), 5); updateTransform(); }, { passive: false });
    lightboxImg.addEventListener('mousedown', (e) => { e.preventDefault(); isDragging = true; lightboxImg.classList.add('grabbing'); startX = e.clientX; startY = e.clientY; initialTranslateX = translateX; initialTranslateY = translateY; });
    window.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = initialTranslateX + (e.clientX - startX); translateY = initialTranslateY + (e.clientY - startY); updateTransform(); });
    window.addEventListener('mouseup', () => { isDragging = false; lightboxImg.classList.remove('grabbing'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  // Left-side TOC: current page title + in-page headings only
    const article = document.getElementById('article');
    const toc = document.getElementById('toc');

    // Current page title (h1)
    const h1 = article.querySelector('h1');
    if (h1) {
      const a = document.createElement('a');
      a.href = '#';
      a.textContent = h1.textContent;
      a.className = 'toc-h1';
      toc.appendChild(a);
    }

    // In-page headings
    const headings = article.querySelectorAll('h2, h3');
    headings.forEach((h, i) => {
      const id = 'toc-' + i;
      h.id = id;
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      a.className = h.tagName.toLowerCase() === 'h3' ? 'toc-h3' : 'toc-h2';
      toc.appendChild(a);
    });

    // Scroll spy
    const tocLinks = Array.from(toc.querySelectorAll('a'));
    function updateTocActive() {
      let current = '';
      headings.forEach(h => {
        if (h.getBoundingClientRect().top < 100) current = h.id;
      });
      tocLinks.forEach(a => a.classList.remove('active'));
      if (current) {
        const active = tocLinks.find(a => a.getAttribute('href') === '#' + current);
        if (active) active.classList.add('active');
      }
    }
    window.addEventListener('scroll', updateTocActive);
    updateTocActive();
