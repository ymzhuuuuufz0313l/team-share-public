      margin: 0 auto;

      border-radius: 20px;

    h3 { font-size: 20px; margin: 32px 0 14px; color: var(--text); font-weight: 600; }
    p { margin: 14px 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img {
      max-width: 100%;

      border: 1px solid var(--line);
      cursor: zoom-in;
      display: block;
      margin: 28px auto;

    img:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
    table {
      width: 100%;

      font-size: 14.5px;
    }
    th, td {

      padding: 10px 14px;

    code {

      border-radius: 5px;

    pre code { padding: 0; background: transparent; color: var(--text); }
    blockquote {

      margin: 20px 0;
      padding: 14px 20px;
      background: var(--accent-soft);
      border-radius: 0 10px 10px 0;
      color: var(--text);
    }
    ul, ol { padding-left: 28px; }
    li { margin: 8px 0; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }
    .footer {
      text-align: center;
      color: var(--muted);
      margin-top: 48px;
      font-size: 13px;
    }

    /* Top nav */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding: 0 4px;
    }
    .top-nav a {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .top-nav .home { font-size: 15px; }

    /* Page nav */
    .page-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 48px;
    }
    .page-nav a {
      display: block;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;

    @media (max-width: 640px) {
      .page-nav { grid-template-columns: 1fr; }
      .page-nav a.next { text-align: left; margin-left: 0; }
    }

    /* Image lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      cursor: grab;
    }
    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }
    .lightbox img {
      max-width: none;
      max-height: none;
      border: none;
      border-radius: 4px;
      cursor: grab;
      transform-origin: center center;
      transition: none;
      margin: 0;
    }
    .lightbox img.grabbing { cursor: grabbing; }
    .lightbox .hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      pointer-events: none;
      user-select: none;
      background: rgba(0,0,0,0.4);
      padding: 6px 14px;
      border-radius: 20px;
    }
    .lightbox .close {
      position: absolute;
      top: 20px;
      right: 24px;
      color: rgba(255,255,255,0.8);
      font-size: 32px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .lightbox .close:hover { background: rgba(255,255,255,0.15); color: #fff; }

    /* Landing page cards */
    .hero { text-align: center; margin-bottom: 40px; }
    .hero h1 { margin-bottom: 12px; }

    .chapter-grid {

    .chapter-card:hover {

      transform: translateY(-2px);
      box-shadow: var(--shadow);

    .chapter-card .num {

      width: 28px;

      line-height: 28px;

      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;

    .chapter-card .title { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
    .chapter-card .desc { font-size: 13px; color: var(--muted); line-height: 1.5; }

    .overview-img { margin: 28px 0; }

  <script type="text/template" id="md">
# 六、420b 解码链 RTL

```text
20-bit 对齐输入流
        │
        ▼
┌───────────────────┐
│   decoder_7b      │  420b → 413b 解码
│                   │  提取 tag、还原全 0/全 1、重组数据
│                   │  输出 7/14/21-bit 有效数据
└─────────┬─────────┘
          │
          ▼
┌───────────────────┐
│  descramble_7b    │  7-bit LFSR G16(X) 解扰
│                   │  K3 上升沿复位
│                   │  scramble_en=0 时旁路
└─────────┬─────────┘
          │
          ▼
┌───────────────────┐
│ long_decoding_top │  42-bit 缓存
│                   │  按 8/16/24-bit 切分打包输出
└───────────────────┘
```

### 关键信号

| 信号 | 说明 |
|------|------|
| `decode_en` | 解码窗口使能；K1/K4 开，K2/K3 关 |
| `tag_value` | 6-bit 标签，用于全 0/全 1 替换 |
| `dout_21b_valid` | 有效位宽：01=7bit / 10=14bit / 11=21bit |
| `scramble_en_k3` | K3 锁存的解扰使能 |
| `dout_24b` / `dout_valid` | 最终 24-bit 输出及有效指示 |

---
  </script>

  <script>
    document.getElementById('article').innerHTML = marked.parse(document.getElementById('md').textContent.trim());
const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxClose = document.getElementById('lightbox-close');
    let scale = 1, translateX = 0, translateY = 0;
    let isDragging = false, startX = 0, startY = 0, initialTranslateX = 0, initialTranslateY = 0;
    function updateTransform() { lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }
    function resetTransform() { scale = 1; translateX = 0; translateY = 0; updateTransform(); }
    function openLightbox(src) { lightboxImg.src = src; resetTransform(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
    function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; setTimeout(() => { lightboxImg.src = ''; }, 250); }
    document.querySelectorAll('.article img').forEach(img => img.addEventListener('click', () => openLightbox(img.src)));
    lightboxClose.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
    lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
    lightbox.addEventListener('wheel', (e) => { e.preventDefault(); scale = Math.min(Math.max(0.5, scale + (e.deltaY > 0 ? -0.15 : 0.15)), 5); updateTransform(); }, { passive: false });
    lightboxImg.addEventListener('mousedown', (e) => { e.preventDefault(); isDragging = true; lightboxImg.classList.add('grabbing'); startX = e.clientX; startY = e.clientY; initialTranslateX = translateX; initialTranslateY = translateY; });
    window.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = initialTranslateX + (e.clientX - startX); translateY = initialTranslateY + (e.clientY - startY); updateTransform(); });
    window.addEventListener('mouseup', () => { isDragging = false; lightboxImg.classList.remove('grabbing'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  </script>
