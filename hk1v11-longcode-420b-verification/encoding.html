# 七、编码规则要点

## 1. 413b → 420b 编码

![413b → 420b 分组标签替换](./spec_tag_replacement.svg?v=20260720)

### 1.1 分组与 tag

413 bit 分成 59 组，每组 7 bit；找一个未出现的 6-bit 样式作为 tag。

### 1.2 全 0 / 全 1 替换

全 0 / 全 1 组替换为 `tag + 1-bit 类型指示符`。

## 2. 加扰规则

![Scramble key 滚动机制](./spec_scramble_rolling.svg?v=20260720)

### 2.1 payload 加扰

payload（CTRL_F / CTRL_L / RGB / VBK）**加扰**。

### 2.2 LSP 不加扰

LSP 训练数据**不加扰**。

### 2.3 IDLE 不加扰

IDLE K5~K8 **不加扰**。

## 3. 发送顺序

![数据传输方向（LSB-first）](./spec_bit_order.svg?v=20260720)

### 3.1 420b LSB-first

420b 模式为**LSB-first**（bit0 → bit6）。

### 3.2 Header 位序

Header 为 `{tag[5:0], toggle}`，toggle 位于 bit0，**toggle 先发**，随后 tag[0]→tag[5]。

**无编码标记（0721 确认）**：spec 的 `1000000` / `0111111` 按发送顺序读（最左 = 先发 = bit0）——`1000000` = toggle=1 + tag=`6'b000000`，`0111111` = toggle=0 + tag=`6'b111111`。env 无替换头部按 toggle 二选一发送，tag 搜索跳过保留值 0/63（此前曾误推为 {31,32}，已废弃）。tag 本身为**逐块**从本块 59 组低 6 位中搜索未使用的最小 6-bit 样式（64 样式 − 59 组必有空闲）。

### 3.3 替换组位序

替换组为 `{type, tag[5:0]}`，**tag 先发**，最后发 type。

### 3.4 普通 8B/10B 模式

普通 8B/10B 模式同样 LSB-first。

## 4. 跨 lane 70-bit 对齐

![非 413b 整数倍数据处理](./spec_dummy_70b.svg?v=20260720)

### 4.1 对齐原则

各 lane 编码后长度一致。

### 4.2 dummy 填充

统一按最大 lane 的 dummy 长度填充，保证 K-code 插入点在各 lane 对齐。

### 4.3 原始数据（编码前的 raw bytes）

| Region | 原始数据 | 来源 |
|--------|----------|------|
| LSP | 256-bit 训练码 `0xEA/EB/EC/ED ×8`（32B） | ref model 常量 |
| CTRL_F | 64B 帧配置寄存器（SCREN / PORSD / CH_SEL / TEST_PRTCT…） | `env_cfg.get_ctrlF_reg(frame)` |
| Active Line | CTRL_L 5B（FSYNC / POL / BKDU…）+ Video 像素 `hact×3` B/行 | `env_cfg.get_ctrlL_reg` + `pixels` |
| V blanking | CTRL_L 5B + VBK（可配置字节 × subpix_cnt） | `env_cfg.get_ctrlL_reg` + `vbk` |

### 4.4 dummy 填充与截取（0720v1 当前实现）

<div class="flow">
  <div class="fbox"><b>① 跨 lane 补零</b><br/><code>pad_bit_stream()</code><br/>补到 <code>max_lane_raw_bits()</code> = (6 + ⌈payload_B ÷ port_num⌉) × 8<br/>bit 级补 0，此时未对齐 413</div>
  <div class="farrow">→</div>
  <div class="fbox"><b>② 413b 块补齐</b><br/><code>encode_with_70b_alignment()</code><br/>⌈raw ÷ 413⌉ 块，末块补 0（Dmy 内嵌）<br/>逐块加扰 + 编码 → 每块 420-bit</div>
  <div class="farrow">→</div>
  <div class="fbox"><b>③ 140-bit 边缘截取</b><br/>保留刚好覆盖全部真实 7-bit group 的最小 140 整倍数<br/>被截掉的正是末尾 dummy（不发送）</div>
  <div class="farrow">→</div>
  <div class="fbox"><b>④ 20-bit 包发出</b><br/><code>send_420b_encoded_bits()</code><br/>140 是 20 的倍数，leftover = 0</div>
</div>

**截取边缘是 140-bit**（不是 420 / 70 / 20）：

- `140 = LCM(70, 20)`：同时满足 spec 的 70-bit 对齐与 DUT 的 20-bit 输入粒度
- `send_bits = ⌈7 × (⌈raw÷413⌉ + ⌈raw÷7⌉) ÷ 140⌉ × 140`，刚好保留全部真实 group（7-bit header + 59 组）
- LFSR 只按**实际发出**的 payload group 推进（`final_lfsr_key`），截断的 dummy group 不影响后续加扰同步；`final_tail_bit` = 实际最后发出位，保证跨 region 加扰连续

实例（1 lane · H3840 · 当前主调 case）：

| Region | raw（bit） | 413 块 | 编码后 | 140 截取 | 20-bit 包 |
|--------|-----------|--------|--------|----------|-----------|
| LSP | 256 | 1（补 157） | 420 | **280**（70×4） | 14 |
| CTRL_F | 512（64B） | 2（补 314） | 840 | **560**（420+140） | 28 |
| Active Line | 92200 → pad 92208 | 224 | 94080 | **93800** | 4690 |

## 5. 编码实现与联调现状（0720v1）

### 5.1 实现位置

编码由 `long_encoding_ref_model.sv` 独立实现（`encode_413b_to_420b()` / `encode_with_70b_alignment()` / `G16(X)` LFSR），由 `isptx_sequence.sv` 在各发送任务中调用；跨 lane 70-bit 对齐由 sequence 侧 `pad_bit_stream()` / `max_lane_raw_bits()` 配合完成。
