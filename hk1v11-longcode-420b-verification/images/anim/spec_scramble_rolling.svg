<g class="row" style="animation-delay:1.65s">
<rect x="120" y="414" width="410" height="10" rx="5" fill="#9ca3af" stroke="#9ca3af" stroke-width="1" class="draw" pathLength="100" style="animation-delay:1.65s"/>
<text x="540" y="423" font-size="9.5" fill="#6b7280" text-anchor="start">SCR_KEY 不推进（恒不加扰 · 不推 key）</text>
<rect x="120" y="436" width="334" height="10" rx="5" fill="#2563eb" stroke="#2563eb" stroke-width="1" class="draw" pathLength="100" style="animation-delay:1.75s"/>
<text x="462" y="445" font-size="9.5" fill="#6b7280" text-anchor="start">413/420 ENC（编码但恒不加扰）</text>
