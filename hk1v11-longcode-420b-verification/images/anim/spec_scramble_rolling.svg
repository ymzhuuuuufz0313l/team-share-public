<text x="364.0" y="289.5" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="600">Enc Data</text>
<text x="524" y="292" font-size="13" fill="#64748b" text-anchor="middle">…</text>
<rect x="120" y="318" width="394" height="8" rx="4" fill="#16a34a" stroke="#16a34a" stroke-width="1" class="draw" pathLength="100" style="animation-delay:1.25s"/>
<text x="524" y="326" font-size="9.5" fill="#16a34a" text-anchor="start">scramble 继续滚动</text>
</g>
<g class="row" style="animation-delay:1.4s">
<text x="60" y="352" font-size="12.5" fill="#1e293b" text-anchor="start" font-weight="600">② Config 行（第一条 VFP 行）——0924：CTRL_F 恒不加扰</text>
<text x="50" y="388" font-size="10.5" fill="#64748b" text-anchor="end">Config 行</text>
