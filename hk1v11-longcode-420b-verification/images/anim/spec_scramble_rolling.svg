<text x="876.0" y="129.5" font-size="10" fill="#854d0e" text-anchor="middle" font-weight="600">K8</text>
</g>
<text x="910" y="132" font-size="13" fill="#64748b" text-anchor="middle">…</text>
<g class="cellwave" style="animation-duration:2.4s;animation-delay:1.2s">
<rect x="936" y="106" width="40" height="40" rx="8" fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
