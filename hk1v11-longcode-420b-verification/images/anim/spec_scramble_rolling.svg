<text x="76" y="492" font-size="12" fill="#047857" text-anchor="start" font-weight="600">③ K3（SCREN=1 时 Config 行尾）</text>
<text x="76" y="510" font-size="10" fill="#047857" text-anchor="start">TX：lfsr_key_420b = 16'hFFFF（行尾同步复位） · RX：锁存 SCREN + 共享加扰 key 复位 0XFFFF</text>
<text x="76" y="526" font-size="10" fill="#047857" text-anchor="start">RX 复位 / 使能延 4 拍生效：K3_FIND_rp_d[3]（long_decoding_top.v）· SCREN=0 → 行尾 K2（不复位）</text>
