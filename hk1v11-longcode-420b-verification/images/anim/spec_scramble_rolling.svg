<path d="M 700 150 C 770 200 760 236 700 252 L 220 252 L 220 266" stroke="#059669" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#ar-green)" class="dashgrow"/>
<g class="pulse-t" style="animation-delay:-0.7s">
<text x="430" y="244" font-size="10" fill="#16a34a" text-anchor="middle">n 行截止状态 → n+1 行起始状态（LFSR 连续 · 不复位）</text>
</g>
</g>
