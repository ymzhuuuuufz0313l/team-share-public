<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
  <style>text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }</style>
  <defs>
    <marker id="ar-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#b45309"/></marker>
    <marker id="ar-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="600" y="40" font-size="22" fill="#1e293b" text-anchor="middle" font-weight="600">位序反转对照：文件真实 K 码 → RTL 模板（40-bit 整串位反转）</text>
  <text x="600" y="64" font-size="12" fill="#64748b" text-anchor="middle">RTL 模板 = bitrev40(文件真实 K 码)，四码全部精确相等 · 码本只有一个、位序约定相反 · v3 定案（2026-11-06）</text>

  <!-- table header -->
  <g>
    <rect x="40" y="86" width="1120" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="70"  y="108" font-size="13" fill="#1e293b" font-weight="700">K</text>
    <text x="150" y="108" font-size="13" fill="#1e293b" font-weight="700">文件真实 K 码（chpi_tx.txt · 4×10bit）</text>
    <text x="560" y="108" font-size="13" fill="#b91c1c" font-weight="700">RTL 模板当前值（40'h = bitrev40）</text>
    <text x="880" y="108" font-size="13" fill="#991b1b" font-weight="700">⚠ 旧"修复值"（v3 已推翻）</text>
  </g>

  <!-- K1 -->
  <g>
    <rect x="40" y="126" width="1120" height="52" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
    <text x="70"  y="158" font-size="15" fill="#1e293b" font-weight="700">K1</text>
    <rect x="150" y="136" width="380" height="32" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <text x="340" y="157" font-size="14" fill="#166534" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600">0FC  3FF  03C  003</text>
    <rect x="560" y="136" width="280" height="32" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="700" y="157" font-size="14" fill="#991b1b" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600">0xC00F0FFCFC</text>
    <rect x="880" y="136" width="260" height="32" rx="6" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="1010" y="157" font-size="14" fill="#065f46" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600">0x3F3FF0F003</text>
  </g>
  <!-- K2 -->
  <g>
    <rect x="40" y="182" width="1120" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="70"  y="214" font-size="15" fill="#1e293b" font-weight="700">K2</text>
    <rect x="150" y="192" width="380" height="32" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <text x="340" y="213" font-size="14" fill="#166534" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600">0CC  3FF  0C3  3FC</text>
    <rect x="560" y="192" width="280" height="32" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="700" y="213" font-size="14" fill="#991b1b" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600">0x3FF0CFFCCC</text>
    <rect x="880" y="192" width="260" height="32" rx="6" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="1010" y="213" font-size="14" fill="#065f46" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600">0x333FF30FFC</text>
  </g>
  <!-- K3 -->
  <g>
    <rect x="40" y="238" width="1120" height="52" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
    <text x="70"  y="270" font-size="15" fill="#1e293b" font-weight="700">K3</text>
    <rect x="150" y="248" width="380" height="32" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <text x="340" y="269" font-size="14" fill="#166534" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600">303  000  30C  003</text>
    <rect x="560" y="248" width="280" height="32" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="700" y="269" font-size="14" fill="#991b1b" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600">0xC00C300303</text>
    <rect x="880" y="248" width="260" height="32" rx="6" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="1010" y="269" font-size="14" fill="#065f46" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600">0xC0C00C3003</text>
  </g>
  <!-- K4 -->
  <g>
    <rect x="40" y="294" width="1120" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="70"  y="326" font-size="15" fill="#1e293b" font-weight="700">K4</text>
    <rect x="150" y="304" width="380" height="32" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
    <text x="340" y="325" font-size="14" fill="#166534" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600">00F  000  333  3FC</text>
    <rect x="560" y="304" width="280" height="32" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="700" y="325" font-size="14" fill="#991b1b" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600">0x3FF33003C0</text>
    <rect x="880" y="304" width="260" height="32" rx="6" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1.5"/>
    <text x="1010" y="325" font-size="14" fill="#065f46" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600">0x03C00CCFFC</text>
  </g>

  <!-- divider -->
  <line x1="40" y1="362" x2="1160" y2="362" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="600" y="390" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">K1 逐位对照（40-bit 整串位反转：RTL[i] = File[39−i]）</text>

  <!-- File 40-bit string -->
  <text x="60" y="426" font-size="12" fill="#166534" font-weight="700">文件真实 K1（原样）</text>
  <g font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="600">
    <text x="250" y="430" fill="#166534">0011111100 1111111111 0000111100 0000000011</text>
  </g>
  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#94a3b8">
    <text x="250" y="448">39 ────────── 30  29 ────────── 20  19 ────────── 10   9 ────────── 0</text>
  </g>

  <!-- arrow -->
  <line x1="600" y1="466" x2="600" y2="492" stroke="#b45309" stroke-width="2.5" marker-end="url(#ar-amber)"/>
  <text x="620" y="484" font-size="13" fill="#b45309" font-weight="700">bitrev40 整串位反转</text>

  <!-- RTL 40-bit string -->
  <text x="60" y="520" font-size="12" fill="#991b1b" font-weight="700">RTL 模板 K1（位反）</text>
  <g font-family="'IBM Plex Mono', monospace" font-size="15" font-weight="600">
    <text x="250" y="524" fill="#991b1b">1100000000 0011110000 1111111111 0011111100</text>
  </g>
  <g font-family="'IBM Plex Mono', monospace" font-size="11" fill="#94a3b8">
    <text x="250" y="542">39 ────────── 30  29 ────────── 20  19 ────────── 10   9 ────────── 0</text>
  </g>

  <!-- per-symbol breakdown -->
  <g>
    <rect x="40" y="558" width="1120" height="82" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
    <text x="60" y="582" font-size="12" fill="#475569" font-weight="700">40-bit 整数关系（验证）</text>
    <text x="60" y="606" font-size="13" fill="#166534" font-family="'IBM Plex Mono', monospace">bitrev40( 0x3F3FF0F003 )  =  0xC00F0FFCFC  =  RTL K1_CODE</text>
    <text x="60" y="626" font-size="12" fill="#64748b">四个 K 码全部满足 RTL == bitrev40(文件)：K1=0xC00F0FFCFC · K2=0x3FF0CFFCCC · K3=0xC00C300303 · K4=0x3FF33003C0</text>
  </g>
</svg>
