# BOE 420b KCODE 调试全过程：位序反转根因定案

> **一句话结论**：BOE 420b 回放 case 里 `K1_FIND~K4_FIND` 全不置位，**根因是 420b K 码模板的 40-bit 整串位序约定相反（`RTL = bitrev40(文件)`）**——其机理是 20-bit 滑窗的**符号顺序/配对错配**（S2/S3 被拆到两个 word），**不是 per-bit 位序（BIT_SWAP）问题**。码本只有一个，只是位序/符号顺序约定相反。真模块是 **`LONG_ENCODING_ALIGN`（LONG 路径）**，不是任务书/早期分析指向的 `u_CHPI_KCODE_ALIGN_L0`（SHORT 路径）。

![位序反转对照：文件真实 K 码 → RTL 模板](./images/kcode_bitrev_compare.svg?v=20261105)

---

## 1. 背景

### 1.1 同事请求

BOE 激励回放 case `t_H1440_V16_FPS280_PORT_NUM12_DPLC_MODE1_420b_boe_test` 中，420b K 码对齐器的 `K1_FIND / K2_FIND / K3_FIND / K4_FIND` **全时间不置位**——四码全部找不到。请求定位根因并给修复方向。

### 1.2 团队构成（多模型交叉验证）

- **8 路盲测**：1×glm-5.3 + 1×glm-5.3-flash + 6×Qwen，对同一任务独立分析（t1/t2/t3/t5/t6/t7/t8 等）
- **1 路仲裁**：qwen-i 交叉裁决三个矛盾点
- **3 路矛盾③裁决**：qwen-f / qwen-h / qwen-d 对"全 0 命中 vs 部分有 K 码对"并行复核
- **队长直接验证**：captain_linecheck / captain_probe2 / captain_verify_long / captain_verify_long2 四脚本，行槽位实测 + bitrev40 精确匹配 + 实例化确认

> ⚠️ **重要前提**：第一轮 8 路盲测里，多数路抓的是 **`u_CHPI_KCODE_ALIGN_L0`（SHORT 编码路径 / 旧命名）**——这其实是**读错了模块**。420b 通路真正的 K 码匹配器是 **`LONG_ENCODING_ALIGN`（LONG 路径）**。这一轮错位是"两套码本"假象的来源，也是整个 debug 曲折的起点。

---

## 2. 问题定义

### 2.1 K*_FIND 机制

K 码匹配在 `LONG_ENCODING_ALIGN` 内，核心是 **20-bit 半窗 + 40-bit 全命中 + BK_ST 门控**：

```
DATA_KCODE_00..19 = {I_INDATA_D1[19:0], I_INDATA[19:0]} 上 20 个 10-bit 滑动窗
DATA_POINT[n]  = (&DATA_KCODE_n) | (&~DATA_KCODE_n)      ← 全 0/全 1 的 10-bit 窗 = 420b 对齐锚点
Kx_CODE1  = (DATA_ALIGN_PRE[19:0] == Kx_CODE[19:0])   | (== Kx_CODE_1[19:0])   (下半 2 符号)
Kx_CODE2  = (DATA_ALIGN_PRE[19:0] == Kx_CODE[39:20])  | (== Kx_CODE_1[39:20])  (上半 2 符号)
KCODE_FIND = K1_CODE2 | K2_CODE2 | K3_CODE2 | K4_CODE2
K1_FIND    = K1_CODE2 & K1_CODE1_D1 & BK_ST            (40-bit 全命中 + BK_ST 门控)
K2/K3/K4_FIND = 各自 CODE2（另受 BK_ST / 状态机约束）
```

- **20-bit 半窗逻辑**：`CODE2` 比上半 20-bit（`Kx_CODE[39:20]`），`CODE1_D1` 比前拍下半 20-bit（`Kx_CODE[19:0]`）——流序要求 **下 20-bit 先行、上 20-bit 后行**。
- **DATA_POINT**：全 0 / 全 1 的 10-bit 窗是 420b 对齐锚点（K 码里含 `0x3ff` 全 1 / `0x0` 全 0）。
- **BK_ST**：位对齐状态门控（复位 1、K1_FIND 清、BIT_ALIGN_ST 置）；若 `BK_ST` 恒 0，即便 K 码匹配也不置位（H2，与位序正交）。

### 2.2 正确的 Verdi 层次

```
chip_tb_top.u_HK1V11.u_HK1V11_digital_top
  .u_LOGIC_CENTER.LINK_LOGIC.LC_CHPI_DECODE.LONG_ENCODING.LONG_ENCODING_ALIGN
```

> ⚠️ 任务书里的 `u_CHPI_KCODE_ALIGN_L0` 是 **SHORT 编码匹配器 / 旧命名**（`HK1V11_ref.v` 才实例化它）；**420b 通路实际是 `LONG_ENCODING_ALIGN`**。抓信号、对模板都用本层次，不要抓错模块。

## 3. 分析过程时间线（诚实呈现曲折）

![分析过程与矛盾裁决：从"两套码本"到"位序反转定案"](./images/kcode_debug_flow.svg?v=20261105)

| 阶段 | 发生了什么 | 结论 / 偏差 |
|---|---|---|
| **① 第一轮盲测（8 路）** | t1/t2/t6/t8 等收敛于"**两套码本**"框架（K1~K4 全找不到） | ✗ 实际读错模块：抓的是 SHORT 路径 `u_CHPI_KCODE_ALIGN_L0` |
| **② 矛盾点爆发** | ① 0x2A8 计数（f 称 0 / h 称 100）② 两码本 vs "BOE 不输出 K 符号" ③ qwen-d 突破：部分 pattern 有 K 码对 vs GLM 全 0 | 三个矛盾点，需裁决 |
| **③ 三路裁决 + 转写纠错** | t10/t11/t12 复数 23/27/102 次命中 → 全 ≤ 巧合基线；仲裁 qwen-i；转写漂移发现（K3=0x18F 非 0x16F、K4 序、BOE 首符 0x0FC 非 0x3FC） | 矛盾①②③裁决；但仍在 SHORT 模块里打转 |
| **④ 关键突破（t3/t7）** | 独立发现**位序反转** + **LONG 路径真模块** | ★ 推翻"两套码本"：码本只有一个、位序约定相反 |
| **⑤ 队长三重验证** | 行槽位实测 + bitrev40 精确匹配 + 实例化确认 | 定案证据链闭合 |
| **⑥ 定案** | 40-bit 整串位序约定相反 | 修复：模板改为文件原样值 |

## 4. 现象汇总

### 4.1 行结构

![真行结构示意图：文件 = 20 HBP 尾 + 136 行 × 899 = 122284](./images/kcode_line_structure.svg?v=20261105)

文件（Pat01/0001）= **20 个 HBP 尾符号 + 136 行 × 899 = 122284 符号**（全闭合，无余数）。单行 899 符号槽位：

| 槽位 | off | 符号数 | 内容 |
|---|---|---|---|
| HBP 尾 | 0..19 | 20 | 上一帧 HBP 尾 |
| **K1** | **20..23** | 4 | 行首 K 码（Active 行） |
| encData | 24..814 | 791 | CTRL_L + Video 420b 编码 + 加扰 |
| **K2** | **815..818** | 4 | 行尾 K 码 |
| HBP | 819..898 | 100 | 行尾 HBP |

### 4.2 真实 K 码值（chpi_tx.txt 实测）

![K 码槽位命中分布](./images/kcode_slot_hits.svg?v=20261105)

| K | 文件真实 K 码（4×10bit） | 40-bit 整数 | 出现次数 | 槽位 |
|---|---|---|---|---|
| K1 | `0FC 3FF 03C 003` | 0x0FC3FFF803 | **130** | @off20（每 Active 行） |
| K2 | `0CC 3FF 0C3 3FC` | 0x0CC3FF0C3FC | **130** | @off815（每 Active 行） |
| K3 | `303 000 30C 003` | 0x30300030C03 | 5 | LSP / 行尾 K3 槽 |
| K4 | `00F 000 333 3FC` | 0x00F0003333FC | 3 | CTRL_F 行首 |

> 注：K 码含 `0x3ff`（全 1）/ `0x0`（全 0）——非 8b/10b 合法符号，说明 420b 用**自定义 10-bit 编码**，对齐锚点正是这些全 0/全 1 窗（`DATA_POINT`）。

### 4.3 RTL LONG 模板值 + bitrev40 对照

| K | 文件真实 K 码 | RTL 模板当前值（40'h） | 40'b 源码 | 关系 |
|---|---|---|---|---|
| K1 | `0FC 3FF 03C 003` | `0xC00F0FFCFC` | `40'b11_0000000000_11110000_1111111111_0011111100` | **RTL = bitrev40(文件)** |
| K2 | `0CC 3FF 0C3 3FC` | `0x3FF0CFFCCC` | `40'b00_1111111111_00001100_1111111111_0011001100` | **RTL = bitrev40(文件)** |
| K3 | `303 000 30C 003` | `0xC00C300303` | `40'b11_0000000000_11000011_0000000000_1100000011` | **RTL = bitrev40(文件)** |
| K4 | `00F 000 333 3FC` | `0x3FF33003C0` | `40'b00_1111111111_00110011_0000000000_1111000000` | **RTL = bitrev40(文件)** |

> **四码全部精确满足 `RTL == bitrev40(文件真实 K 码)`，无一例外。** 码本只有一个，位序约定相反——不是"两套码本"。

### 4.4 已排除的公共环节

| 假设 | 结论 | 依据 |
|---|---|---|
| 串行位序（BIT_SWAP 开/关 × 极性 × 相位穷举） | 在 **SHORT 模块**上 0 命中 | 早期在错模块上穷举，均不置位 |
| 复位 / 使能 / BK_ST | 与位序正交（H2） | 需波形分离；位序修复后若 BK_ST 正常则四码置位 |
| DPLC_MODE1 只驱动 lane0 | 低（H4） | 420b 通路单 pair 承载 10-bit 符号流 |

> **关键**：在 SHORT 模块上"位序穷举 0 命中"不能否定位序根因——因为**在 LONG 模块上，位序恰恰就是根因**。错位到错模块的穷举是无效排除。

### 4.5 "100 次单符号"解释（矛盾①的误读来源）

encData 区存在**固定偏移的数据 pattern 符号**（如 `0x1FA@off150 ×100`、`0x2A8@off736 ×100`、`0x205@off654 ×100`）——这些是**确定性数据位置值**（420b 编码 + scramble 在固定线结构下的产物），**不是 K 码标记、也不在 K 码槽位**。早期把"单符号周期性出现"误读为"K 码存在但顺序/值不对"，是矛盾①（0x2A8 计数）的误读来源。

## 5. 根因定案

**40-bit 整串位序约定相反（`RTL = bitrev40(文件)`）**。终局仲裁（t21）进一步钉死其机理：`bitrev40 = 〔每 10bit 翻转〕+〔符号顺序反转〕`，其中**真正导致 K_FIND 恒 0 的是"符号顺序/配对"这一半，不是 per-bit 位序（BIT_SWAP）这一半**——详见 §6 终局复核。

> ⚠️ **更正早期表述**：早期说"40-bit 窗口（文件原样）≠ 模板（整串反转）"，把匹配当成"两个 40-bit 值直接比较"——这**过于简化**。RTL 实际是 **20-bit 滑窗** `DATA_ALIGN_PRE`（跨两个连续 word 各取 1 符号拼窗）；窗拼不出模板的 `{S3,S4}` / `{S1,S2}` 两半，根因是 **S2/S3 被文件拆到两个 word（配对错配）**，不是"40-bit 值整体位反"这么笼统。

证据链：

1. **逐码 bitrev40 精确匹配**：四码 `RTL == bitrev40(文件)`，无一例外（§4.3）。
2. **行槽位实测**：K1@20 ×130、K2@815 ×130，`20 + 136×899 = 122284` 全闭合（§4.1）。
3. **全量仿真**：`BIT_SWAP=OFF + I_INDATA[0]=首bit` → K1=130 / K2=138 / K3=5 / K4=3（与帧结构逐行吻合）；`BIT_SWAP=ON`（当前）→ **0 命中**（两种 serdes 约定皆 0）。
4. **实例化确认**：420b 通路走 `LONG_ENCODING_ALIGN`（LONG 路径），`CHPI_KCODE_ALIGN_LONG_L0.v` 为同值孤儿文件（未被实例化）。
5. **终局仲裁（t21）**：逐 bit 仿真确认两种 CDR 位序约定下 K1_FIND 均 = 0；根因 = 符号顺序/配对错配（详见 §6）。

> 这是**公共环节**（共享的 40-bit 位序 / 符号顺序约定），不是"单个 K 码模板写错"。四码同断正因为它是一条共享的位序 / 符号顺序约定不一致——四个模板各自都是"合法的 420b K 码（只是位序反了）"。

---

## 6. 终局复核：叠放序与用户变换对位

> 本节是 t15~t21 数据链 check + 终局仲裁（qwen-i）对"用户变换到底对不对"的逐 bit 复核。结论：**用户变换数学上完全正确，但与 RTL 真实叠放序不一致——真正根因是符号顺序/配对错配，不是 per-bit 位序（BIT_SWAP）问题。**

### 6.1 用户变换的逐 bit 验算

用户 KCODE 解法 = 〔每 10bit 翻转〕+〔首符号落最低 10bit〕。对文件 K1 = `0FC 3FF 03C 003`：

| 步骤 | 结果 |
|---|---|
| 每 10bit 翻转 | `0FC→0FC`（回文）· `3FF→3FF`（回文）· `03C→0F0` · `003→300` |
| 首符号落最低 10bit 叠放 | `[9:0]=0FC`、`[19:10]=3FF`、`[29:20]=0F0`、`[39:30]=300` |
| 40-bit 结果 | `0x300_0F0_3FF_0FC` = **`0xC00F0FFCFC`** |

**== RTL `K1_CODE` 模板**（`LONG_ENCODING_ALIGN.v:101`，亲读）== `True`；也 == `bitrev40(文件 K1)`。数学上完全正确（Python 逐 bit 验证，证据 `arb_t21_check.py`）。

> 注意：这里"RTL 模板"是 **LONG 模块**的模板。早期 t18 比的 `CHPI_KCODE_ALIGN_L0.v`（`seperated_code/`，`0x1FA_2A8_2A8_205`）是 **SHORT 模块**，420b 不走它——读错模块，"用户叠放 ≠ RTL 模板"不成立。

### 6.2 RTL 实际叠放序（引 t17 / t20）

RTL 匹配用 **20-bit 滑窗** `DATA_ALIGN_PRE`（`LONG_ENCODING_ALIGN.v:403` / `CHPI_KCODE_ALIGN_LONG_L0.v:171`）：

```
DATA_ALIGN_PRE[19:0] = { I_INDATA_D1[9:0], I_INDATA_D2[19:10] }   // off=10 符号边界
  窗[19:10]（高 10bit）= D1[9:0]   = 新 word（1 拍前）的低符号
  窗[9:0]  （低 10bit）= D2[19:10] = 旧 word（2 拍前）的高符号
```

- **半窗时序**：`CODE1` 比模板下半 `{S3,S4}`（T-1 拍）、`CODE2` 比上半 `{S1,S2}`（T 拍）→ 同一 20-bit 窗每拍推进 2 符号（= CDR 每拍 20-bit / 2 符号）。
- **旧符号（首符号）落窗低 10bit `[9:0]`，新符号落高 10bit `[19:10]`**（t19 判对、t17 判反）。
- 要 K_FIND=1，反推 RTL 期望 4 符号按 **`S4`（前 word `[19:10]`）→ `S2,S3`（同一 word：S2 高 `[19:10]`、S3 低 `[9:0]`）→ `S1`（后 word `[9:0]`）** 到达。

### 6.3 两者是否一致 + 真正根因

**不一致。** 文件 4 符号（每 10bit 翻转后，驱动序）= `S4,S3,S2,S1`，被 CDR 装成 word1=`{S4,S3}`、word2=`{S2,S1}`；而 RTL 要 word1=`{S2,S3}`（S2 高、S3 低）。

| 符号 | RTL 要求（要 K_FIND=1） | 文件实际 | 一致？ |
|---|---|---|---|
| S4 | 前 word `[19:10]` | word1 | ✓ 可对齐 |
| S2 | **中 word 高 `[19:10]`** | word2 高 | ✗ 错 word |
| S3 | **中 word 低 `[9:0]`** | word1 低 | ✗ 错 word |
| S1 | 后 word `[9:0]` | word2 低 | ✓ 可对齐 |

> **真正根因 = 符号顺序 / 配对错配**：S2 与 S3 被文件拆到两个 word（S3 在 word1、S2 在 word2），RTL 要它们同在一个 word（中 word，S2 高 S3 低）。**不是 per-bit 位序（BIT_SWAP）问题**：两种 CDR 位序约定下 K1_FIND 均 = 0（Python 仿真，`arb_t21_check.py`），与 case 现象一致。BIT_SWAP=ON（数据解码依赖）不是根因；CDR 位序 A/B 也不是根因。

### 6.4 审查盲区复盘（引 t19）

8 路全停在"文件 40-bit 值 vs 模板 40-bit 值"的**静态命中比对**，没有把 RTL 的 20-bit 滑窗 `DATA_ALIGN_PRE` 展开成"符号到达序 / 跨 word 配对"。审查把"符号顺序反转"当成"还差的一环（无人承担）"，其实它由 RTL 滑窗的跨 word 叠放承担——这一步静态比对根本看不到。t10/t11/t12 的穷举 / 命中统计也在"文件原始符号序"上做，未考虑滑窗跨 word 叠放，"0 命中 / 巧合命中"结论因此失真（详见 `m_qwen_g2.md`）。

## 7. 修复方案

**推荐：把 `LONG_ENCODING_ALIGN.v` 的 4 个 `K*_CODE` 与 `K*_CODE_1` 改为文件原样值（= 当前值的 bitrev40），保持 `BIT_SWAP` ON。**

| K | K*_CODE 当前值 | 改为（文件原样 = bitrev40） |
|---|---|---|
| K1 | `0xC00F0FFCFC` | `0x3F3FF0F003` |
| K2 | `0x3FF0CFFCCC` | `0x333FF30FFC` |
| K3 | `0xC00C300303` | `0xC0C00C3003` |
| K4 | `0x3FF33003C0` | `0x03C00CCFFC` |

> 注：上表"改为"列的 16 进制值为 t22 终局复核逐码重算（`bitrev40`）后更正（下方二进制串即文件原样 4 符号，与符号值 `0FC 3FF 03C 003` 等一致）。

```
K1_CODE  : 40'b11_0000000000_11110000_1111111111_0011111100  →  40'b0011111100_1111111111_0000111100_0000000011
K2_CODE  : 40'b00_1111111111_00001100_1111111111_0011001100  →  40'b0011001100_1111111111_0011000011_1111111100
K3_CODE  : 40'b11_0000000000_11000011_0000000000_1100000011  →  40'b1100000011_0000000000_1100001100_0000000011
K4_CODE  : 40'b00_1111111111_00110011_0000000000_1111000000  →  40'b0000001111_0000000000_1100110011_1111111100
```

**配套与注意：**

- **保持 `BIT_SWAP` ON**：数据解码 / 参考模型是 LSB-first，依赖它；**不要**改用 `BIT_SWAP` OFF（会破坏数据通路，像素比对 FAIL）。
- **`K*_CODE_1` 同步位反**：改 `K*_CODE` 时 `K*_CODE_1`（互补值）也要同步位反，保持互补关系。
- **可选同步孤儿文件**：`CHPI_KCODE_ALIGN_LONG_L0.v` 为同值孤儿（未被实例化），可选同步以保持一致。
- **下游影响**：K3 还驱动 `LONG_ENCODING_DESCRAMBLE` 的 scramble 状态提交（`LONG_ENCODING_DESCRAMBLE.v:125`「K3 commits the latched scramble state」）——位序修复后 K3_FIND 置位，下游 420b 解码 / 帧对齐一并恢复。
- **改 RTL 走三关**（AGENTS.md）：① iverilog 语法检查；② `rtl-code-review` 对抗评审（含重定时/成对消费审计）；③ `rtl-signal-trace` 信号链路追踪。

## 8. 给同事对齐的 3 个关键问题（更新版）

1. **ref model 侧 K 码位序约定以谁为准（文件原样 vs 位反）？**
   BOE 参考模型（`long_encoding_ref_model`）内部是 LSB-first（"reversed concat so wire carries fg[0] first"），而 RTL 模板是整串反转。需确认 ref model 侧的 K 码 40-bit 位序约定到底以哪个为准——这决定修复该"改模板"还是"改 ref model 驱动约定"。

2. **协议归谁定 / 量产其他 panel 是否同样位反（判 BOE 特例 vs 系统缺陷）？**
   量产时 Hi image 芯片对接其他 panel，K 码位序约定是否也相反？若**只有 BOE 相反** → BOE 集成特例（改模板或加 BOE 码本分支即可）；若**多家 panel 都相反** → 系统性位序约定缺陷（优先级提升，需架构层面统一）。

3. **SHORT 路径模板（`CHPI_KCODE_ALIGN_L0`）是否也有同样位序问题（内部 training 场景）？**
   SHORT 路径 `u_CHPI_KCODE_ALIGN_L0`（K1=0x1FA,0x2A8,0x2A8,0x205，8b/10b 风格 K28.x）在内部 training 场景下，其模板位序是否与数据流一致？需确认 SHORT 路径是否同样存在位序约定不一致——若一致则本 case 仅是 LONG 路径特例。
