  <text x="165" y="290" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">send_420b_lsp()</text>
  <text x="165" y="308" font-size="9" fill="#4b5563" text-anchor="middle">K2 + 0xEA..ED x8 + K3</text>
  <text x="165" y="324" font-size="9" fill="#4b5563" text-anchor="middle">no scramble</text>
  <rect x="80" y="330" width="170" height="50" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="165" y="350" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">send_420b_ctrl_f_line()</text>
  <text x="165" y="368" font-size="9" fill="#4b5563" text-anchor="middle">K4+CTRL_F(ENC)+Dmy+K2</text>
  <rect x="80" y="390" width="170" height="36" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="165" y="410" font-size="10" font-weight="600" fill="#111827" text-anchor="middle">send_420b_active_line()</text>
  <text x="165" y="428" font-size="9" fill="#4b5563" text-anchor="middle">K1 + CTRL_L + Video</text>
  <rect x="270" y="270" width="170" height="50" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="355" y="290" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">send_420b_vblank_line()</text>
  <text x="355" y="308" font-size="9" fill="#4b5563" text-anchor="middle">K1 + CTRL_L + VBK</text>
  <rect x="270" y="330" width="170" height="50" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="355" y="350" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">send_420b_idle_pattern()</text>
