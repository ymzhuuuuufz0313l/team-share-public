  <text x="74" y="622" font-size="13" font-weight="600" fill="#475569">checker_420b.sv</text>
  <text x="80" y="635" font-size="12" fill="#166534">1. Collect 20-bit chunks    2. Assemble 420-bit blocks    3. decode_420b_to_413b() and compare</text>
