  <rect x="270" y="390" width="170" height="36" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="355" y="410" font-size="10" font-weight="600" fill="#111827" text-anchor="middle">build_bit_stream()</text>
