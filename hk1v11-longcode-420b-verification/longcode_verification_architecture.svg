  <text x="510" y="534" font-size="10" fill="#4b5563" text-anchor="middle">drv_k1_key_420b() ~ drv_k4_key_420b()  40-bit K-code</text>
  <text x="510" y="550" font-size="10" fill="#4b5563" text-anchor="middle">-> vif.rxn0 / rxp0</text>
