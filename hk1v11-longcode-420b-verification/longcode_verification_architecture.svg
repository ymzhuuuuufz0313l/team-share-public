  <rect x="920" y="528" width="200" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="1020" y="548" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">descramble_7b.v</text>
  <text x="1020" y="566" font-size="9" fill="#4b5563" text-anchor="middle">G16(X) / K3 reset</text>
