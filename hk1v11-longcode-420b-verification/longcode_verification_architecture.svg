  <text x="810" y="534" font-size="10" fill="#4b5563" text-anchor="middle">42-bit buffer repack</text>
  <text x="810" y="550" font-size="10" fill="#4b5563" text-anchor="middle">24-bit output + 2-bit valid</text>
  <rect x="920" y="480" width="200" height="42" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
