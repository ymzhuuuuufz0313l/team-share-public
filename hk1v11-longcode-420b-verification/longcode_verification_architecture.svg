  <text x="210" y="518" font-size="10" fill="#4b5563" text-anchor="middle">bit[19:0] one_pkt_20b</text>
  <text x="210" y="534" font-size="10" fill="#4b5563" text-anchor="middle">bit[39:0] k1_420b ~ k4_420b</text>
  <text x="210" y="550" font-size="10" fill="#4b5563" text-anchor="middle">TYPE_DRV_ONE_PKT_20B</text>
