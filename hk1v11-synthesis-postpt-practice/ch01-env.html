# 一、环境与配置

> 骨架页：只写"位置、检查点、交付物"，实测数据后续补录（见文末数据待补）。

## 本章在 1V11 流程中的位置

环境是流程起点：一套配置喂三个工具（DC / pre-PT / postPT），口径不一致 = 白跑。

| 对象 | 路径（相对 `SYNTHESIS/`） | 用途 |
|---|---|---|
| pre-PT 配置 | `top/sta/pre/pt/design.set` | TOP_NAME / SDC_NAME / SDC_PATH / PR_PATH / VOLTAGE / POSTPT_EN |
| post-PT 配置 | `top/sta/post/pt/design.set` | 同上；POSTPT_EN=1 走签核分支 |
| 库配置 | `common/tcl_dir/common/common_db.tcl` | link_library / target_library（nexchip_145_9t） |
| corner 开关 | `top/sta/post/pt/<corner>/corner_set.tcl` | CONS_CHECK / SI_CHECK / CORNER |
| 时钟周期源 | `common/tcl_dir/common/clk_period.tcl` | RX_CLKP=3.81 / DPLC_CLKP=6.35 / OSC / I2C（MARGIN：DC×0.8 / PT×1.0） |

## 关键检查点

- 换项目只动 `design.set`（TOP_NAME / SDC_NAME / SDC_PATH / PR_PATH）
- **DC / prePT / postPT 三处 design.set 口径一致**（pre-PT `design.set` 的 POSTPT_EN 会改变 kv proc 是否注入 ideal_network，进而影响 write_sdc 内容——见 ch10 案例 1 的连锁证据）
- corner 开关核对：`SI_CHECK=1`（串扰/skew 分析开启）
- PT 版本：M-2017.06-SP3-3（pt1706 环境）

## 交付物 / 应看什么

- `design.set` 改动差分（前后对照）
- `common_db.tcl` 的 link_library 与 release 库版本对应关系
- 10 corner 的 `corner_set.tcl` 开关矩阵
