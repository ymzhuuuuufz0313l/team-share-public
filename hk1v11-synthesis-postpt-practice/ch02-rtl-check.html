# 二、RTL 检查

> 骨架页：位置、检查点、交付物；数据待补。

## 本章在 1V11 流程中的位置

综合前的 RTL 质量门：连接性与可综合性检查。

| 对象 | 路径（相对 `SYNTHESIS/`） | 用途 |
|---|---|---|
| CKF 报告 | `ip/syn_HK1V11_digital_top/ckf/` | 连接性检查产物 |
| nLint 配置 | `common/tcl_dir/nlint/`（`nlint_waive.list` / `cat_nlint_waive.list`） | 语法/风格检查与豁免清单 |

## 关键检查点

- CKF 报告无悬空连接 / 位宽失配
- nLint waive 清单随 RTL 迭代维护，不做无记录的堆砌
