# 三、综合

> 骨架页 + 一条本轮实证的关键认知（DC 分支纪律，详见 ch10 案例 4）。

## 本章在 1V11 流程中的位置

DC 综合。约束主文件 `common/ip_cons/HK1V11_digital_top.tcl`；库与优化配置在 `common/tcl_dir/dc/`（`dont_use_all.tcl`、`design_rule.tcl`）。

## 关键检查点

- **约束文件是 dc_shell / pt_shell 共享资产，按综合后命名写的约束必须待在 pt_shell 分支**：

```tcl
if {$synopsys_program_name != "pt_shell"} {
    # DC 分支：RTL 族通配（elaborate 阶段没有位拆分名和 /D* 引脚）
} else {
    # PT 分支：网表名 + get_cells / get_pins
}
```

逐条网表名约束写在公共区 → DC 侧失配丢约束（ch10 案例 4）。

- `set_dont_touch [get_cells -hier *u_gate*]` 保护手搭时钟单元（CLKGEN 的 u_gate_* 软 wrapper 在 post-route 网表实证存活，read_cons.log 零 SEL）
- 时钟/模块改名后的残留自检（ch10 案例 5：clock list / pin 通配）
