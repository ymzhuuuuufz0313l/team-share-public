# 五、APR SIGNOFF

> 骨架页 + 两个本轮实证的检查点（postcts.sdc 内容、网表/spef 同源）。

## 本章在 1V11 流程中的位置

APR 交付 = POSTPT 的输入。两个关键路径定义在 `top/sta/post/pt/design.set:8-10`：

| 变量 | 路径 | 内容 |
|---|---|---|
| `SDC_PATH` | `/XXW_PRJ01/HK1V11/DataBase/Digital/Release/Netlist/Prescan/HK1V11_digital_top_to_APR/latest` | `HK1V11_digital_top_postcts.sdc` |
| `PR_PATH` | `/project/HK1V11/designer/AD/yzhao/release/HK1V11_digital_top/timing/latest` | 网表 `.v.gz` + spef `.spef.gz` |

## 关键检查点

- **postcts.sdc 是否包含最新一轮约束**（约束链见 ch10 案例 1：`grep -c` 自检）
- **网表与 spef 同源同版**（异源 = 签核失真）
- 生成时钟节点在 post-route 网表的存活：`read_cons.log` 的 SEL-004/005 计数（本轮实测零告警：`u_gate_*/CG_CELL/Q`、`u_gate_*/CLKMUX2X2/O` 全部命中）
