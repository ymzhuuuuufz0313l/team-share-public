# 六、POSTPT

> 骨架页 + 约束链要点；本章排障案例最多（ch10 案例 1/2/3/5 都发生在这一环）。

## 本章在 1V11 流程中的位置

`top/sta/post/pt/<corner>/run_pt` → `corner_set.tcl` → `../common/pt_setup.tcl` → 报告 → `run_summary`（get/merge busskew → summary CSV）。

## 约束链（本章最重要的一张表）

`pt_setup.tcl:284-290` 只 source 三份约束：

| # | 文件 | 作用 |
|---|---|---|
| 1 | `common/tcl_dir/common/clk_period.tcl` | 周期变量（MARGIN 机制） |
| 2 | `common/tcl_dir/common/kv_clkio_postpt.tcl` | post 版 kv_* proc（无 ideal_network） |
| 3 | `${SDC_PATH}/${SDC_NAME}_postcts.sdc` | **设计约束本体（APR 发布）** |

**ip_cons 不直达 POSTPT**：ip_cons → pre-PT write_sdc → sdc_pr → APR → postcts.sdc → POSTPT（ch10 案例 1）。

## 运行结构

- `run_pt`：`RUN_ID=YYYYMMDD_N` → `history/<run_id>/{log,rpt,whole_session}` → `latest` 软链
- 10 corner：tt / lt / ml / wc × cbest / cworst / typical × 温度

## 关键检查点

- `latest/log/read_cons.log`：SEL-004/005 计数 = 0（约束真的落到网表）
- `latest/log/ignored_exceptions.rpt`：例外没有被静默忽略
- `rpt/summary/HK1V11_digital_top_cons.rpt`：违例分组（clock_gating / 各时钟组）
- `rpt/skew/*.rpt` → `summary/latest/report_sd_busskew.csv`：margin 在窗内（哨兵值警惕，ch10 案例 3）
- `rpt/summary/..._timing.rpt` / `check_timing` / `unconstrained_endpoints.rpt`
