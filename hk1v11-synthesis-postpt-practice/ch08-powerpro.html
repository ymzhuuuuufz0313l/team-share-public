# 八、PowerPro 功耗评估

&gt; 本章收录 PowerPro 低功耗评估的方法论框架（功耗构成、评估工具、环境搭建、report 检查），并记录 1V11 的**实测**：RTL level 前仿功耗已跑通（t_8b1lane + 4K180 两 case，功耗表 + 跨项目对比 2 图），数据率换算因子定为 **20bit**；1V11 vs 1V22（HV1V22）双边同流程数据侧归因见 **§4.5**（2026-10-15 新增）。

## 1. 功耗基础与评估工具

### 1.1 功耗构成

- **静态功耗（leakage）**：与工艺库、电压、温度相关；漏电关系 LVT > SVT > HVT，与温度成指数关系。
- **动态功耗**：switching power（`P = C·Vdd²·Fclock`）+ internal power（`P = tsc·Vdd·Ipeak·Fclock`）。

### 1.2 评估工具对比

| 工具 | 评估阶段 | 级别 | 读取文件 | 目标 |
|------|----------|------|----------|------|
| RedHawk | 设计后端 | whole chip（APR 同事） | post-netlist + 带 SDF 后仿 VCD | IR drop 影响，值偏大 |
| PTPX | 设计后端 | whole chip（综合同事） | 同 RedHawk | whole-chip 功耗，与回片对比 |
| PowerPro（RTL level） | IP RTL 阶段 | IP owner | RTL code、sdc、前仿波形 | 初步评估 + 低功耗优化 |
| PowerPro（Gate level） | 设计后端 | 专人 | 同 PTPX | 与 RTL level 及回片对比 |

评估条件：**1 个 idle mode + N 个 function mode**；TT corner、typical 电压、85°C（lib 无 85 用 125）。

KEY: 务必确保实测功耗时的条件与评估功耗时的条件一致，否则对比无意义。

## 2. 环境搭建与运行

PowerPro 已集成到 IP 综合环境，`gensyn` 自动创建 `powerpro/` 目录（`fsdb/`、`sdc/`、`WORK/`、`script/`、`run_power_opt`）。1V11 的实例目录：`SYNTHESIS/ip/syn_HK1V11_digital_top/powerpro/`（`WORK/`、`calypto/` 已在 package 中出现，证明环境可生成）。

搭建四步（详见 <a href="../synthesis-integration-flow-guide/powerpro.html" target="_blank">指南站同章 §2</a>）：

1. **RTL filelist**：维护 `syn_<ip>/filelist/` 下 `<ip>.f` 与 `<ip>.sv.f`
2. **link 波形**到 `fsdb/`，design.set 指定 `FSDB_FILE` / `FSDB_HIER`（可 `fsdbextract` 截取时间窗）
3. **design.set 指定约束**：`CLOCK_MCP_CASE_SDC`（IP 约束）+ `CORNER`（tt_typical_85）
4. **时钟约束与 gray box**：`sdc/<ip>.sdc` 中 create_clock / create_generated_clock；不优化 module 用 `set_gray_box –module ...`

运行与 report 检查：

```bash
source /eda/env/NEXT/powerpro2024.2.1.cshrc
bsub -Ip run_power_opt
python3 powerpro_script.py                    # 生成 report_info（逐项 check）
python3 powerpro_chk.py report_info report_info2
show_analyzer
```

report 检查三件事：`powerpro.log` **反标率 100%**；`sa.log` 未反标信号清理；`sa.log` X 态信号清理。之后看 IP Efficiency（Memory Gating / CG Efficiency / Power Summary）与 Dashboard。

## 4. 实测结果（RTL level，front-sim，no corner）

![HK1V11 vs 其他项目 PowerPro 功耗对比](./power_compare_hk11.png)

### 4.3 4K180 lane = 1L 判定（从 case 配置）

`t_H3840_V16_FPS180_power/user_def.sv` 与 `t_8b1lane/user_def.sv` 的 PORT_NUM=12 / PAIR_NUM=1 / TBK / HACT / VACT **全同**，唯一差异 FPS 120→180；实测 RX_CLK `148.386×(180/120)=222.6≈223.364 MHz` ✓ → 同 lane 架构（**1-lane**）。

### 4.4 功耗与场景的关系——为什么 4K180 是 1.81× 而不是 1.5×（完整版）

> 归因源文档：`script/_syn_1008_powerpro_4k180_归因.md`（HK1V11 库）；复算脚本说明见 §4.4.3。

#### 4.4.1 为什么：完整论证链

**第一步·总账分项（铁证表）**——1008 包 `rep_dir_{1lane,4k180}_1003/hier_pwr_detail.csv`，Initial Design `__Top_Node__`，µW：

| 分项 | 1lane (2.97G) | 4K180 (4.47G) | 倍数 | 判定 |
|---|---:|---:|---:|---|
| register | 11008.1 | 20217.5 | **1.837** | 超线性 |
| combinational | 2329.99 | 4800.49 | **2.060** | 超线性最重 |
| clock_network | 2965.34 | 4451.68 | **1.500** | **恰=频率比（锚点）** |
| leakage | 12.96 | 12.96 | 1.000 | 固定 |
| **total** | **16303.43** | **29469.66** | **1.807** | |

读法：**clock_network ×1.500 是锚点**（时钟每周期 toggle 一次，证明口径可信）；超线性**全部集中在数据通路**，即**每周期数据翻转更多**。

**第二步·分解式**：

```
29469.66 = 16303.43 × 1.5053(频率) × 1.2008(每周期数据活动率)
```

- **频率因子 1.5053**：RX_CLK 148.386→223.364 MHz（FPS 120→180）。若每周期翻转不变，功耗应为 24.54 mW；
- **活动率因子 1.2008**：4K180 实测 29.47 mW，多出的部分是**每周期数据翻转率上升 ~20%**——本质是**激励差异**：4K180 是全分辨率真实视频流（3840×16 逐拍有效数据），t_8b1lane 是单 lane 测试图样（消隐/重复数据占比高）；数据通路的 internal+switching 随真实数据随机度上升，combinational（纯数据逻辑）增幅最大（×2.06）与此机理自洽；
- **lane 因子 = 1（排除）**：两 case 同 1-lane、同 1006 RTL，模块集合完全一致、无"睡→醒"硬件（配置证据见 §4.3）。

**第三步·逐模块 top 增量**（全层级 diff，µW）：

| 模块 | 1lane | 4K180 | Δ | 倍数 |
|---|---:|---:|---:|---:|
| SHORT_ENCODING_OUTPUT | 2815.9 | 5125.7 | +2309.8 | 1.82 |
| SHORT_ENCODING_ALIGN | 2196.4 | 4273.9 | +2077.6 | 1.95 |
| CENTER1.DTCTL | 3122.6 | 5417.0 | +2294.4 | 1.73 |
| BUFFER_I | 1658.4 | 3534.9 | +1876.4 | **2.13** |
| SHORT_ENCODING_DECODE | 1194.8 | 2318.7 | +1123.9 | 1.94 |
| LC_CPUWR | 924.4 | 1759.8 | +835.4 | 1.90 |
| U_DPLC_DATA_GEN | 897.3 | 1723.5 | +826.2 | 1.92 |
| CHPI_SD_CTRL | 1442.3 | 2179.2 | +736.8 | 1.51 |
| **LONG_ENCODING_ALIGN** | 224.2 | 636.9 | +412.7 | **2.84 ⚑** |
| LC_CLK_RST_GEN.CLKGEN | 350.9 | 527.4 | +176.5 | **1.50（纯频率锚点）** |

**第四步·四桶分解（+13.166 mW 增量对账）**：

| level-1 模块 | ΔµW | 频率份额(×0.5053) | 活动率超额 |
|---|---:|---:|---:|
| LINK_LOGIC | +8412.8 | +5228.1 | +3184.7 |
| CENTER1 | +2491.1 | +1769.6 | +721.4 |
| BUFFER_I | +1876.4 | +838.0 | **+1038.4** |
| LC_CLK_RST_GEN | +176.5 | +177.9 | −1.4（纯频率） |
| I2C_CTL（固定） | 0.0 | — | 16.2µW 两边不变 |
| 未列明细余项 | +209.4 | — | —（报表层级深度截断） |
| **合计** | **+13166.2** | **+8013.6** | **+4943.2** |

| 桶 | mW | 占比 |
|---|---:|---:|
| (a) 频率抬升（同模块 ~f 线性） | **8.01** | **60.9%** |
| (b) 新激活硬件 | **0** | 0% |
| (c) 活动率差异（toggle/周期↑） | **4.94** | **37.6%** |
| (d) 固定（I2C/OSC/watchdog/leakage/余项） | **0.21** | 1.6% |

**Red flag**：① **LONG_ENCODING_ALIGN ×2.84**——LONG 通路两 case 都近休眠（总功耗 0.58/1.17 mW，大头 OUTPUT 仅 1.50×线性），唯独 ALIGN 子块 2.84×，其位对齐状态机在 4K 帧率下对齐事件密度不成比例地高；绝对量小（+0.41 mW）不碍总账，**若 LONG 模式成为主 case 建议单独复核激励**；② BUFFER_I ×2.13 / CDR_CRC_DET ×2.19：均为纯数据翻转敏感块（输入 pad 缓冲/CRC），与活动率因子方向一致，**非异常**。

#### 4.4.2 怎么解决：对策四条（带可行性分档与优先级）

| # | 对策 | 可行性分档 | 说明 |
|---|---|---|---|
| 1 | **对外口径注明"活动率因子 1.2 为激励相关"** | 设计侧可做（零成本，立刻） | 引用 1.81× 时写明"频率 1.5053 是物理量、活动率 1.2008 是本对激励实测值"——被追问"为何不是 1.5×"时此句即答案 |
| 2 | **LONG_ENCODING_ALIGN ×2.84 复核** | 需服务器 run（fsdb/toggle 分析）+ designer 确认（激励意图） | 方法：`report_module_toggle.csv` 按 case 对比 ALIGN 子块对齐事件密度；LONG 成主 case 前完成 |
| 3 | **频率-功耗曲线补 ~3.5G 中间点** | 需服务器 run（新一档前仿+powerpro，如 FPS150） | 现只有 2.97G/4.47G 两点；补一点若三点共线，则 1.2008 对同族激励稳定、外推可信 |
| 4 | **leakage 占比监控** | 设计侧可做（表格加列） | 当前 12.96µW（<0.1%）可忽略，换库/温度场景后会上升；每代 run 记一行 leakage/total，超 1% 触发复查（`gen_powerpro_hk11_image.py` 可加列） |

优先级：**1 > 4 > 3 > 2**。

### 4.5 跨项目对比：1V11 vs 1V22（HV1V22）——双边同流程数据侧归因

> 数据源：1V22 = 1014 服务器包 `script/_syn_1014v0/HV1V22/.../Power_zym/powerpro_AutoEQ_DPLC_on`（Initial）；1V11 = 1008 包三场景 1003 代（§4.1 口径）。归因源文档：`script/_1v11_vs_1v22_power.md`（HK1V11 仓库，表格化 + 证据行号）。与 §4.2 的 back_ppt/实测口径不同，本节是**两边同工具、同库、同 FSDB 向量法、同优化前 Initial 报告**的直接对账；两边均 RTL 级线负载估计（无 SPEF），**比值可信度高于绝对值**。

#### 4.5.1 口径对齐表（工艺/频率/场景/口径四缺口如实呈现）

| 口径项 | 1V11（三场景） | 1V22 AutoEQ_DPLC_on | 判定 |
|---|---|---|---|
| 工具 | PowerPro 2024.2_1 | PowerPro 2024.2_1 | ✅ 完全一致 |
| 工艺库（D①） | ENEXCHIP M31HSSC900EL150（125CSS1P62 ccs 角）+ HV1V21 APR_CDM | 同两条 ENEXCHIP 库，无 APR_CDM | ✅ 标准单元库一致；1V11 多读的 APR_CDM 覆盖面待确认（非功耗主因） |
| 互连模型 | mtg_wlm 线负载（无 SPEF） | mtg_wlm（无 SPEF） | ✅ 一致 |
| 功耗方法 | FSDB 向量法（前仿波形） | FSDB 向量法 | ✅ 同方法；⚠️ 向量窗口内容不同（D③） |
| 报告时点（D④） | Initial（优化前） | Initial（report_power 在 generate_guidance/insert_* 之前） | ✅ 均为优化前，可比；勿误用 1V22 优化后 7920 µW 那份 |
| lane 时钟（D②） | 1lane 3.048 ns（328.1 MHz） | DPLC 模式 4.5712 ns（218.8 MHz） | ⚠️ **不可直接比**：1V11 快 1.50×（比 normal 模式 3.608 ns 快 1.18×） |
| 场景内容（D③） | 解码/DPLC 通路真实数据流（DAT TD 0.0121） | 数据近乎静止（DAT TD 0.00013） | ⚠️ **最大公平性风险**：若 1V22 窗口取在静止段则低估其"数据流动时"功耗 |
| 顶层结构 | 顶层 = u_LOGIC_CENTER（100%） | LOGIC_CENTER 65.8% + u_rx_phy_unit 31.3% + 顶层钟网 2.9% | ⚠️ 1V22 多一块 RX PHY 数字域（1V11 无对应物） |

> 四缺口一览：**D① 工艺库**已对齐（仅 APR_CDM 待确认范围）；**D② 频率**可量化（DPLC 模式 1.50×，且 4K180 无 1V22 对应频率档，4.69× 不可直接比）；**D③ 场景/结构**（数据活动率 93× + rx_phy 独有，需同载荷重跑闭环）；**D④ 报告时点**已闭环 = 均 Initial。因此下文倍数是"**带口径注记的可比数字**"，非无条件公平值。

#### 4.5.2 总账对比

| 场景 | Total (mW) | Internal (mW) | 单元数 | vs 1V22 |
|---|---:|---:|---:|---:|
| 1V11 t_8b1lane（2.97G） | **16.30** | 13.43 | 13684 | **2.60×** |
| 1V11 4K180（4.47G） | **29.47** | 24.32 | 13684 | 4.69×（⚠️ 无 1V22 对应频率档，不可比） |
| 1V11 DPLC | **16.30** | 13.46 | 13684 | **2.60×** |
| 1V22 AutoEQ_DPLC_on | **6.28** | 5.09 | 8735 | 1.00× |
| <span style="background-color:#fff3cd">**1V22 4.46G（1015）**</span> | <span style="background-color:#fff3cd">**18.97**</span> | — | — | <span style="background-color:#fff3cd">**3.02× vs 1V11 1lane / 1.55× vs 4K180**</span> |

> 只比同名 `u_LOGIC_CENTER`（剔除 1V22 独有 rx_phy）：16303 vs 4132 µW = **3.95×**——总量比里 1.97 mW 是 1V11 没有的功能，结构差本身就把总量倍数压低。

#### 4.5.3 逐模块大头差异（1V11 取 1lane 场景）

| 功能对（1V11 ↔ 1V22） | 1V11 (µW / 占比) | 1V22 (µW / 占比) | 倍数 |
|---|---:|---:|---:|
| 全芯片 `__Top_Node__` | 16303 / 100% | 6282 / 100% | **2.60×** |
| `u_LOGIC_CENTER`（同名） | 16303 / 100% | 4132 / 65.8% | **3.95×** |
| 链路解码 `LC_CHPI_DECODE` ↔ `LC_CSPIF_L0`+`CSPI_CMD_ALIGN` | 7190 / 44.1% | 2827 / 45.0% | 2.54× |
| 显示时序 `CENTER1.DTCTL` ↔ `TOTAL_DTCTL` | 3123 / 19.2% | 545 / 8.7% | 5.72× |
| 寄存器配置 `LC_CPUWR`（同名） | 924 / 5.7% | 10.7 / 0.2% | **86×** |
| 时钟生成 `LC_CLK_RST_GEN` ↔ `CLKGEN_U0` | 352 / 2.2% | 5.3 / 0.1% | **67×** |
| DPLC 数据 `U_DPLC_DATA_GEN` ↔ `u_DPLC` | 897 / 5.5% | 112 / 1.8% | 8.0× |
| 输入同步 `BUFFER_I`（1V11 独有） | 1658 / 10.2% | —（PAD_INBUF 全 0） | — |
| RX PHY EQ/DFE `u_rx_phy_unit`（1V22 独有） | —（判决类合计 114.8） | 1965 / 31.3% | — |

> 三点解读：① **LC_CPUWR 86×** 是活动率/门控差而非规模差（单元数仅 2×；1V22 侧该模块输入时钟被 CG 关断，1V11 持续打）——对 1V11 是明确可落地的优化点（对齐 1V22 做法后 924 → ~10 µW 量级）；② **CLKGEN 67×**：1V11 多协议时钟切换链（CHPI/SD/DPLC 三模）持续翻转，切换逻辑本身是功耗源；③ 1V22 的 DFE/AutoEQ 占其 21.7%，在 1V11 数字顶层无对应物（1V11 的 EQ 判决类仅 114.8 µW 且 BOE 分支动态为 0）——**两边各有独有模块，总量比包含不可比成分**。

#### 4.5.4 分项结构对比（register / combinational / clock_network）

| 分项 | 1V11 1lane（count / µW / 占比） | 1V22（count / µW / 占比） | count 比 | 每单元功耗比 |
|---|---|---|---:|---:|
| register | 2847 / 11008 / 67.5% | 1520 / 4142 / 65.9% | 1.87× | 1.42×（≈ lane 时钟频率比 1.50×） |
| combinational | 10445 / 2330 / 14.3% | 6980 / 237 / 3.8% | 1.50× | **6.56×（数据活动率主导，库相同）** |
| clock_network | 392 / 2965 / 18.2% | 235 / 1902 / 30.3% | 1.67× | 0.93×（每单元持平，两边钟树都在跑） |

> 差距构成（1lane − 1V22 = +10.02 mW）：register **68.5%** + combinational 20.9% + clock_network 10.6%——**寄存器（时钟引脚翻转）功耗是第一大头**。活动率证据：两边 CLK TD 几乎相同（0.158 vs 0.151）但 1V22 LOGIC_CENTER 数据输入 TD 仅 0.00013（1V11 0.0121，**93×**）——1V22 场景"只有钟在跑、数据不动"，其 clock_network 占比高达 30.3% 正是该形态的直接体现（其 PowerPro 优化后插门控不省反费 6.28→7.92 mW 亦为佐证）。

#### 4.5.5 结论分档

**确定（数据可证）**：

1. 库 / 工具 / 流程 / 报告时点口径一致（§4.5.1 ✅ 行），2.60×（1lane、DPLC）与 3.95×（仅 LOGIC_CENTER）成立；4.69×（4K180）无对应频率档不可比；
2. 第一因素 = **寄存器规模（2847 vs 1520 = 1.87×）× lane 时钟频率（3.048 vs 4.5712 ns = 1.50×）**，占差距 68.5%（每寄存器 3.87 vs 2.72 µW 与频率比吻合）；
3. 第二因素 = **数据通路活动率**（TD 93×），占 20.9%——既是场景内容差异，也含 1V22 门控更充分的事实（LC_CPUWR 86× / CLKGEN 67×）；
4. 结构差双向存在：1V22 独有 rx_phy（31.3%）、1V11 独有 BUFFER_I 输入同步链（10.2%）。

**待条件补齐的推断**：

| 推断 | 需补什么 |
|---|---|
| 1V22 lane 时钟对齐 3.048 ns 重跑 → 总功耗约 6.28→7.6 mW，倍数 2.60× → **~2.15×** | 频率对齐 run（D②） |
| 1V22 换同载荷 case（DAT TD 0.00013→~0.012）→ 组合逻辑 237 µW → ~2.3 mW 量级，倍数 → **~1.96×** | 同内容激励向量（D③，最大公平性风险） |
| 两项都对齐后 1V11 仍大 **1.9–2.2×**（纯规模差 + BUFFER_I 同步链 + 多协议时钟切换） | 无需补，结构性事实 |

一句话：**1V11 更大（寄存器 1.87×）+ 更快（lane 钟 1.50×）+ 真实数据在流动（TD 93×），三者叠加**；其中"数据在流动"既是口径缺口也是 1V22 门控更充分的实况。
