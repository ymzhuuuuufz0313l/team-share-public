# 八、PowerPro 功耗评估

&gt; 本章收录 PowerPro 低功耗评估的方法论框架（功耗构成、评估工具、环境搭建、report 检查），并记录 1V11 的**实测**：RTL level 前仿功耗已跑通（t_8b1lane + 4K180 两 case，功耗表 + 跨项目对比 2 图），数据率换算因子定为 **20bit**。

## 1. 功耗基础与评估工具

### 1.1 功耗构成

- **静态功耗（leakage）**：与工艺库、电压、温度相关；漏电关系 LVT > SVT > HVT，与温度成指数关系。
- **动态功耗**：switching power（`P = C·Vdd²·Fclock`）+ internal power（`P = tsc·Vdd·Ipeak·Fclock`）。

### 1.2 评估工具对比

| 工具 | 评估阶段 | 级别 | 读取文件 | 目标 |
|------|----------|------|----------|------|
| RedHawk | 设计后端 | whole chip（APR 同事） | post-netlist + 带 SDF 后仿 VCD | IR drop 影响，值偏大 |
| PTPX | 设计后端 | whole chip（综合同事） | 同 RedHawk | whole-chip 功耗，与回片对比 |
| PowerPro（RTL level） | IP RTL 阶段 | IP owner | RTL code、sdc、前仿波形 | 初步评估 + 低功耗优化 |
| PowerPro（Gate level） | 设计后端 | 专人 | 同 PTPX | 与 RTL level 及回片对比 |

评估条件：**1 个 idle mode + N 个 function mode**；TT corner、typical 电压、85°C（lib 无 85 用 125）。

KEY: 务必确保实测功耗时的条件与评估功耗时的条件一致，否则对比无意义。

## 2. 环境搭建与运行

PowerPro 已集成到 IP 综合环境，`gensyn` 自动创建 `powerpro/` 目录（`fsdb/`、`sdc/`、`WORK/`、`script/`、`run_power_opt`）。1V11 的实例目录：`SYNTHESIS/ip/syn_HK1V11_digital_top/powerpro/`（`WORK/`、`calypto/` 已在 package 中出现，证明环境可生成）。

搭建四步（详见 <a href="../synthesis-integration-flow-guide/powerpro.html" target="_blank">指南站同章 §2</a>）：

1. **RTL filelist**：维护 `syn_<ip>/filelist/` 下 `<ip>.f` 与 `<ip>.sv.f`
2. **link 波形**到 `fsdb/`，design.set 指定 `FSDB_FILE` / `FSDB_HIER`（可 `fsdbextract` 截取时间窗）
3. **design.set 指定约束**：`CLOCK_MCP_CASE_SDC`（IP 约束）+ `CORNER`（tt_typical_85）
4. **时钟约束与 gray box**：`sdc/<ip>.sdc` 中 create_clock / create_generated_clock；不优化 module 用 `set_gray_box –module ...`

运行与 report 检查：

```bash
source /eda/env/NEXT/powerpro2024.2.1.cshrc
bsub -Ip run_power_opt
python3 powerpro_script.py                    # 生成 report_info（逐项 check）
python3 powerpro_chk.py report_info report_info2
show_analyzer
```

report 检查三件事：`powerpro.log` **反标率 100%**；`sa.log` 未反标信号清理；`sa.log` X 态信号清理。之后看 IP Efficiency（Memory Gating / CG Efficiency / Power Summary）与 Dashboard。

> ⚠️ HK1V11 **无 DRDOD 功能**，6 组模式中的 drdod 不适用；当前 Normal 两 case 已出，DPLC 模式待跑。造图脚本化（`gen_powerpro_hk11_image.py` / `gen_power_compare_hk11.py`），不手改 PNG。

WARNING: PowerPro 读取的 RTL 必须是可综合代码，无法综合会 internal ERROR 退出——常见坑（VHDL 分读、build_design 出错、数组 dump、hier 功耗导出 Excel）的解法清单见指南站 §2.4。

## 4. 实测结果（RTL level，front-sim，no corner）

> 口径：**Initial Design**（`hier_pwr_detail.csv __Top__`，优化前）；Clk Freq = `RX_CLK × 20 / 1000`（**20bit = HK1V11 RX 数据通路位宽**，`LINK_LOGIC.v` INDATA[19:0]，vs 2M23 `doutx[17:0]`=18bit）；**不乘 1.05**（那是 2M23 `clk_period.tcl` STA 时钟周期的 5% margin，非数据率↔时钟物理因子）。

### 4.1 功耗表（两 case）

![HK1V11 PowerPro 功耗表](./powerpro_hk11.png)

| Case | Clk Freq | Process | Area | Lane | Normal (mW) |
|------|----------|---------|------|------|-------------|
| t_8b1lane | 2.97G | 145 | 294907 | 1L | **21.08** |
| 4K180 | 4.47G | 145 | 294907 | 1L | **37.9** |

> 功耗随速率：4K180 (4.47G) 是 t_8b1lane (2.97G) 的 **1.80×**，而速率只 **1.50×**——高频下 clock_network + register 切换非线性增长。

### 4.2 跨项目对比（HK1V11 vs HV2M23 / HV3310B1 / HV1V21）

![HK1V11 vs 其他项目 PowerPro 功耗对比](./power_compare_hk11.png)

> ⚠️ HK1V11 功耗绝对值偏高**主因速率更高**（2.97G/4.47G vs 其他 1.8G/0.9G），**非同速率对比**，直接比 mW 会偏。

### 4.3 4K180 lane = 1L 判定（从 case 配置）

`t_H3840_V16_FPS180_power/user_def.sv` 与 `t_8b1lane/user_def.sv` 的 PORT_NUM=12 / PAIR_NUM=1 / TBK / HACT / VACT **全同**，唯一差异 FPS 120→180；实测 RX_CLK `148.386×(180/120)=222.6≈223.364 MHz` ✓ → 同 lane 架构（**1-lane**）。
