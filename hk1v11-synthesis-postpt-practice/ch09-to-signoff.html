# 九、TO SIGNOFF

> 骨架页 + 签核判读的分级思路。

## 本章在 1V11 流程中的位置

签核判读 = 读 summary：`top/sta/post/pt/summary/latest/`

| 文件 | 看什么 |
|---|---|
| `report_setup.csv` / `report_hold.csv` | 各 corner setup/hold qor |
| `report_sd_busskew.csv` | SD skew margin（⚠️ 警惕哨兵值假数，见 ch10 案例 3） |
| `report_phy_busskew.csv` | phy skew |
| `HK1V11_digital_top_cons.rpt` | 违例分组清单 |
| `latest/log/unconstrained_endpoints.rpt` | 未约束终点 |

## 关键检查点：违例分级判读

1. **真时序违例**：同域单周期路径（如 `DATA_POINT_LAT_reg_9_ → rx_shifter_reg_*`）→ 交 APR/设计
2. **准静态配置跨域**：`R_REG*_L_* → RX_CLK` 族 → mc 已收敛（ch10 案例 2）
3. **报告假值**：哨兵值/探针失配（ch10 案例 3）→ 修脚本，不是修时序
