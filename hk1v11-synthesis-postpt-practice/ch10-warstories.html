# 十、问题解决心路历程（排障实录）

> 全站唯一有实质内容的一章。收录 0915~0922 一周里 POSTPT 签核、skew 汇总与约束收窄的二十一段真实排障，每段按「现象 → 定位思路 → 证据链 → 处理 → 结论/遗留」展开。**结论先行：一周的主线只有一条——约束的生效链是 `ip_cons → pre-PT write_sdc → APR → postcts.sdc → POSTPT`；而 "read_cons.log / read_tcl.log 的 SEL-004/005 计数 + report_exceptions 的 applied 标志（o/p/po）" 是这条链上唯一可靠的回归指标。**

## 收敛仪表盘

| 轮次 | 动作 | 结果 |
|---|---|---|
| round1 | G1（25 条）+ G3（17 条）逐条 mc 进 ip_cons，走 PREPT→DATABASE→POSTPT 正流程 | ✅ 42 条违例全消、ignored_exceptions 为零、mc 未被折叠 |
| round2 | 补 G2~G8 共 30 对 | G2/G4/G5/G6/G7 全清；POL 组浮出 3 条新起点路径（打地鼠） |
| round3 | POL 扇入矩阵补全 3 对 | 矩阵完备，宣告无 round4 打地鼠 |
| round4 | 族通配合并 + dc_shell/pt_shell 双分支 | 100+ 行 → 约 30 行；DC 不再误读 |
| round5 | K1_FIND → CPUWR 族 mc（G1~G8 之外的新家族） | K1 家族违例 96 → 3（同一约束下） |
| round6 | G9 TRAINING_RESULT / G11 SMT_CS 的 mc + G10 DPLC 静态配置位 max_delay 2× | 已入 pending bundle，待评审 + POSTPT 验证（案例 7/8） |

## 案例 1：约束链认知坑——"改了 ip_cons 怎么没生效"

### 现象

在 `ip_cons/HK1V11_digital_top.tcl` 里加了 `set_multicycle_path`，重跑 POSTPT（wc_cbest_125），报告数值**纹丝不动**。

### 定位思路

不要猜"工具没吃"，去看**它到底读了什么**。POSTPT 的约束加载在 `top/sta/post/common/pt_setup.tcl:284-290`，只有三行 source：

```tcl
source ${TCL_DIR}/common/clk_period.tcl       -verbose -echo  >  ${log_dir}/read_cons.log
source ${TCL_DIR}/common/kv_clkio_postpt.tcl  -verbose -echo >> ${log_dir}/read_cons.log
source ${SDC_PATH}/${SDC_NAME}_postcts.sdc    -verbose -echo >> ${log_dir}/read_cons.log
```

`pt.log:1260-1266` 里能看到这三行的实际执行。**`ip_cons` 只在 pre-PT 被读**——post 流程从不 source 它。

### 证据链

- 约束生效链：`ip_cons` → ① pre-PT `write_sdc` → `sdc_pr` → ② APR（吃 sdc_pr 做 CTS）→ `postcts.sdc` → ③ POSTPT
- 只改 ip_cons 直接重跑 POSTPT = 跳过 ①②，postcts.sdc 还是旧的
- 自检命令：

```csh
# 约束是否进了 postcts.sdc（应 >0）
grep -c "R_REG03_L_reg_2_" .../HK1V11_digital_top_postcts.sdc
# PT 是否真的读到（read_cons.log 有 -echo 回显）
grep "R_REG03_L_reg_2_" wc_cbest_125/latest/log/read_cons.log
```

### 处理与结论

- 快速验证：把 mc 直接 append 到服务器 postcts.sdc 末尾（例外追加即生效）
- 固化：走正流程 ip_cons → PREPT → DATABASE → POSTPT（我们最终采用）
- **结论：POSTPT 的设计约束只有一个入口 postcts.sdc；ip_cons 是它的"祖先"，不是它本身**

## 案例 2：-0.588 配置跨域 mc 缺口（三轮打地鼠）

### 现象

PT wc_cbest_125 setup：`R_REG03_L_reg_2_`（WCLK1_A_CHPI_DCLK_SHORT）→ `PIX_CLK_EN_reg`（RX_CLK）slack **-0.588**；而 APR 工程师给的 Tempus 截图（ssg_1p62_125_**cworst**）同路径 **+0.300 MET**。"APR 不报错，PT 报错"。

### 定位思路（三步：先对齐，再拆解，再找缺口）

**第一步：同 corner 对齐，排除工具分歧。**
PT 在 wc_cworst_125（与截图同 corner）同路径 = **+0.0798 MET**，与 APR +0.300 同量级（残差 0.22 属工具/寄生/derate 正常范围）→ 工具间没有矛盾，矛盾的是 corner 覆盖。

**第二步：拆 cbest 为什么最差。**
launch 边沿 5.715 / capture 边沿 7.620 → 有效窗口只有 **1.905ns**（半个 RX_CLK 周期）。cbest↔cworst 的 0.668ns 摆动分解：

| 摆动项 | Δ | 方向 |
|---|---|---|
| capture 时钟 latency（2.929 → 3.100） | +0.168 | cworst capture 更慢，利于 cworst |
| launch 时钟 latency（3.119 → 3.001） | +0.117 | cbest 反而更慢 |
| 数据路径（5.586 → 5.203） | +0.383 | cbest 反而更慢 |

同单元延迟两 corner 几乎相同（相位 FF CK→Q：0.3697 vs 0.3686）→ 差异在**线网**。min-RC 下纯 RC 缩放只会更快，变慢只能是 **SI 串扰 delta**（两 corner 均 `SI_CHECK=1`；cbest 耦合占比高）→ 只有 cbest 破线。

**第三步：找约束缺口。**
对照 `ip_cons`：`R_REG*_F_reg*` → RX_CLK 有 mc 2/1（L211-212）、`R_REG*_L_*` → DCLK_DATA_MUX_* 有 mc（L223-226），**唯独 `R_REG*_L_*` → RX_CLK 没有**。违例起点恰是 R_REG03_L（0x43 行配置寄存器，R_BKDU 背光禁用位）——准静态配置写被按 1.905ns 单周期检查。

### 证据链（关键数字）

| 项 | wc_cbest_125 | wc_cworst_125 |
|---|---|---|
| launch / capture 边沿 | 5.715 / 7.620 | 5.715 / 7.620 |
| launch CK 到达 | 8.833635 | 8.716483 |
| 数据到达 | 10.610210 | 10.109614 |
| capture CK 到达 | 10.549459 | 10.720139 |
| slack | **-0.588483** | **+0.079763** |

（wc_typical -0.204 居中；uncertainty 两边同为 0.4）

### 处理（三轮收敛）

- **round1**：G1（R_BKDU→PIX_CLK_EN + PIX_DATA×24，25 条）+ G3（→REG_MAPPING 拷贝，17 条）= 42 条逐条 mc；POSTPT（0915 18:57）42 条违例全消、ignored_exceptions 为零
- **round2**：G2/G4/G5/G6/G7/G8 共 30 对补齐 → G2/G4~G7 全清；**POL 组浮出 3 条新起点路径**（打地鼠）
- **round3**：推出 POL 扇入矩阵后补最后 3 对，矩阵闭环：

```text
POL1_PRE = ~(POLC ^ POL)          POL3_PRE = (~H4INV) ^ POL1_PRE
POL2_PRE = ~(POLC ^ POL2)         POL4_PRE = (~H4INV) ^ POL2_PRE
POLC = R_REG00_L[2]   POL = R_REG00_L[1]
H4INV = R_REG00_L[4]  R_POL2 = R_REG03_L[6]
（ANCTL.v:98-101；POL1_SYNC 为两级打拍第一级，ANCTL.v:224）
```

- **round4**：族通配合并 + dc_shell/pt_shell 双分支（见案例 4）

### 结论与遗留

- 根因是**约束缺口**，不是工具分歧、也不是节点失配（read_cons.log 零 SEL，`u_gate_*/CG_CELL/Q`、`u_gate_*/CLKMUX2X2/O` 在 post-route 网表全部命中）
- 打地鼠教训：top-N 报告收集会漏掉被压住的次差路径；按**扇入矩阵补全集**才能一次收口
- 不可 mc 的残留：`DATA_POINT_LAT_reg_9_ → BK_ST_reg`（RX_CLK 同域，GBA -0.144 / PBA -0.069）、`SMT_CS/FLAG_1H_H2L_reg → CS_SYNC_reg_0/1_`（动态标志跨域，待 design 确认 FLAG 是否 sticky）

## 案例 3：skew -900（空报告 × 哨兵值）

> **说明**：这是当天下午的早期诊断。当天夜间的最终定案——perl 哨兵修复、三份"非法起点回退"报表、以及"改完还是 -900"的投放路径原因——见 **案例 9**；本案例给出的探针三原则仍然有效。

### 现象

skew 汇总 Excel/CSV 出现 **-993 ~ -998** 的 margin 值（wc_cbest 例：**-993.55687**），明显不是真实时序。

### 定位思路（顺着数据流往回找）

```text
report_timing_skew_sd.tcl
  → rpt/skew/report_timing_sd_*.rpt          （10 corner × 8 份）
    → get_sd_busskew.pl                       （解析 max/min）
      → <corner>_sd_busskew.txt               （单行 48 列）
        → merge_sd_busskew.pl
          → summary/latest/report_sd_busskew.csv   ← Excel 在这里
```

逐级回查发现：**`sd_l_1p_clk_a.rpt` 全部 10 个 corner 都是 151 字节空壳**，内容只有 SEL-003/005 报错——时钟探针没匹配到任何对象。

### 证据链

1. 探针层级错：`report_timing_skew_sd.tcl:15` 写 `u_LOGIC_CENTER/CENTER1/DTCTL/u_gate_INV_SD_CLK_INV/O*`；该反相器真实位置是 `u_LOGIC_CENTER/LC_CLK_RST_GEN/CLKGEN/u_gate_INV_SD_CLK_INV`（CLKGEN.v:186）
2. perl 哨兵：`get_sd_busskew.pl:33-34` 初始化 `$max=0; $min=1000;`——空报告没有任何 `data arrival time` 行，值永不更新
3. 差值：`get_sd_busskew.pl:117` `margin_max = 数据max − clk_min = 6.44 − 1000 = -993.55687`，与 Excel 逐位吻合
4. **次生错误**：`margin_min = 数据min − clk_max = 数据min − 0`，数值"看着正常"（4.44/5.09…）其实同样是垃圾——真实时钟延迟是 CLKGEN 到 pad 的时钟树延迟（几 ns 量级，需用修好的探针实测），不是 0
5. clk_b 另有一病：`DTCTL/DPLC_CLK*`、`DTCTL/SD_CLK_INV*` 用模块输入端口 pin 做探针，把**无关起点**的路径混进包络。实测 clk_b 的 10 个起点里有 `SP_I (input port)`、`APR_CDM_17/A`、`LC_CPUWR/R_REG05_F_reg_5/6/7`、`R_REG06_F_reg_2/7`、`SHORT_ENCODING_OUTPUT/data_cnt_reg_2_`、`CLKGEN/short_encoding_phase_data_0_half_dly_reg`（clk_b min≈2.3 vs max≈11 的大裂口即由此造成）

### 处理

时钟探针三原则：**① 从 CLKGEN buffer/mux 输出脚（时钟分叉点）起量；② 数据从 DTCTL 真实数据寄存器起量；③ 不拿寄存器当时钟探针。**

- clk_a → `CLKGEN/u_gate_INV_SD_CLK_INV/CLKINVX4/O`（与 SDC 生成时钟定义点一致）
- clk_b → 双源包络：`u_gate_MUX_SD_CLK/CLKMUX2X2/O` + `u_gate_INV_SD_CLK_INV/CLKINVX4/O`（DTCTL.v:741-744：CLKA 恒为 SD_CLK_INV；CLKB = DPLC_MODE_TRUE ? DPLC_CLK : SD_CLK_INV）
- 全部时钟报告加 `-slack_lesser_than 50`；~~补齐 perl 期望的 dplc 8 份报告（暂行值，DPLC_CLK 生成时钟未定义）~~ → 该"暂行填充"在**案例 9** 中被判定为**伪造数字**并已删除（dplc 行留空，等真实 DPLC 模式 run）
- `report_timing_skew_io.tcl` 同病同修：`PAD_INBUF/U3/O`、`SDA_LO` 在 1V11 不存在 → 改 `SCL_I` / `SDA_OE`

### 结论与遗留

- -900 = **探针失配 → 空报告 → 哨兵值进差值**，与真实时序无关
- 防呆建议：解析 perl 对空报告（未匹配到任何 data arrival）显式输出 NA 或报错，**禁止哨兵静默进 margin**
- 遗留：DPLC_CLK 生成时钟未定义（ip_cons FIXME DRD 段），dplc 数值待重生成；1V11 合格窗（1p [-2.5:+2.5] / dplc [-1:4]）与流程指南（[-1:+6]）不一致，待后端确认

## 案例 4：逐条 mc 的 DC 陷阱与 round4 双分支

### 现象（潜在）

逐条 mc（`-from [get_cells .../R_REG03_L_reg_2_] -to [get_pins .../PIX_DATA_reg_18_/D*]`）写在 `if {$synopsys_program_name != "pt_shell"}` **之外**——dc_shell 也会读它。

### 根因

DC elaborate 阶段没有综合后的位拆分名（`R_REG03_L_reg_2_`），也没有 `/D*` 引脚 → `get_cells`/`get_pins` 失配 → 约束静默丢失（或报错中断）。pre-PT `read_tcl.log` 已实证同类失配（SEL-005 ×2，见案例 5）。

### 处理（round4）

双分支：

```tcl
if {$synopsys_program_name == "pt_shell"} {
    # PT 分支：综合后网表名 + get_cells/get_pins
    # （pre-PT write_sdc → postcts.sdc 全链实测可达）
} else {
    # DC 分支：RTL 族通配（R_REG03_L_reg* / PIX_DATA_reg*），不用 get_pins
}
```

同时按族通配把 100+ 行合并为约 30 行（叉乘多覆盖为空匹配，无害）。G2 当时在两分支均注释 ON HOLD（09/16 17:08 改为"先启用 + 头部标注待确认"，见案例 6）。

### 结论

共享约束文件里，**任何按综合后命名写的约束都必须待在 pt_shell 分支**；DC 分支只写 RTL 名/族通配。跨工具共享文件的分支纪律，值得写进流程规范。

## 案例 5：改名残留与旧项目探针

### 现象

pre-PT `read_tcl.log` 出现 **18 条 SEL-004/005**。逐条清点，三类：

1. `ip_cons:156-157` clock list 仍写 `DPLC_CLK_*`（时钟已改名 `NORMAL_CLK_*`）→ **I2C/OSC ↔ NORMAL_CLK_\* 的 clock-group false path 缺失**
2. `ip_cons:281` `LC_MONBLOCK/DCLK_DIV*` 无匹配 → monblock false_path 的排除集为空（div clk 引脚被误纳入 false_path）
3. round2 新 G3 两条 `-to` 少写一级 `LINK_LOGIC/`（SEL-005 ×2）→ mc 没生效，0916V1 中对应路径仍违例 -0.322 / -0.288

另外 `report_timing_skew_io.tcl` 的 `PAD_INBUF/U3/O`、`SDA_LO` 是上一代芯片对象，1V11 里不存在 → io 报告 229 字节空壳。

### 处理与教训

- 教训：**模块/时钟改名后，所有引用点（clock list、pin 通配、报告脚本、skew 探针）都要过一遍 SEL 计数**——把 read_tcl.log / read_cons.log 的 SEL-004/005 总数当回归指标，非零即回归
- L422-428 的层级笔误由人工评审抓住（"层级和同组不一致"）——逐行对账仍是最后的安全网

## 案例 6：G2 从 ON HOLD 到"先启用待确认"

`R_BKDU (R_REG03_L_reg_2_) → BK_ST_reg`：RTL 上 `BIT_ALIGN_ST = BIT_ALIGN_PT | (R_BKDU & K2_FIND)`（LONG_ENCODING_ALIGN.v:429），R_BKDU 与已采纳的 G1/G3 是同一位。最初因 **dummy 行发送时 K2 与 BKDU 寄存器之间的时序间隙未确认** 而整组注释 ON HOLD。

后续处置（2026-09-16 17:08）：团队决定 **enabled first**——STA 环境验证 OK，先启用 mc2 收敛该违例；同时在 ip_cons 头部留下状态行："The actual timing gap between the K2 word and the BKDU register update during dummy-line transmission STILL NEEDS jjlu confirmation → treat as open, pending jjlu review. If jjlu rejects, re-comment the G2 lines in both branches."

这条的启示：**"先启用 + 显式标注待确认"是一种可接受的中间态**，但必须把待确认状态写进约束文件的头部注释里，让评审人一眼看到，而不是默默收敛。

## 案例 7：网表 A/B 审判——同一份约束，两版网表选哪版

### 现象

后端连续交付两版网表，都跑了完整 POSTPT：A 版（gating setup 违例 15 条，19373 cells / 25411 nets）与 B 版（gating 30 条，19250 / 25276）。两版 `ip_cons` 逐字节相同（diff=0，含 round4+round5+NORMAL 修复）——**这是难得的纯净 A/B：唯一变量就是网表本身**。

### 判据（先登记再看数据，防止事后凑结论）

1. 签核 corner 加权：wc_cworst（setup 主签核）> wc_typical > wc_cbest（min-RC，SI 放大区）
2. 违例率 = 违例数 ÷ 该类检查总数（两版 ICG 数不同，绝对条数不可直接比）
3. 真违例净值（剔除两版共有的 -5.x 系统性家族）
4. 约束兼容性（SEL、mc 落地、ignored）

### 数据对照

| 判据 | A (gating15) | B (gating30) | 胜 |
|---|---|---|---|
| setup wc_cworst（签核点） | 31 (w-0.358) | 49 (w-0.454) | **A** |
| setup wc_cbest | 194 (w-0.681) | 92 (w-0.518) | B |
| gating 违例率 | 15/47 = **31.9%** | 30/54 = **55.6%** | **A** |
| hold CONFIG_DATA 族 | 4~30 | 35~64（裕量差 ×5-10，兄弟时钟 skew 硬伤，约束无解） | **A** |
| DPLC 面板数据通路 | 108 违例（仅 cbest） | 0 | B |
| 约束兼容性 | SEL=0 / mc=55 / round5 落地 / ignored=0 | 完全相同 | 平 |

### 判定：选 A（六条理由）

1. 签核 corner 决定胜负：wc_cworst A 双优（条数与裕量）
2. B 的 hold 是硬伤且约束救不了（CONFIG_DATA ×10、兄弟时钟 skew 类，只能 APR 返工）；A 的对应项本来就小
3. gating 类 A 全面占优（违例率 31.9% vs 55.6%，三个 wc corner 条数全胜）；B 只在 cbest 单点 worst 值占优
4. A 的最大短板（DPLC 108 条）只在 cbest 出现（其余 9 corner 全 0），是单一可圈定的家族，SI 放大性质明显，交给 APR 定向修比 B 的全局 hold 劣化好处理
5. B 的 K1 家族优势已被 round5 中和（96→3，同一约束下）
6. 约束兼容性完全相同 → 差异纯粹是网表质量

### 翻转条件（诚实记录）

- cbest 被列为 setup 签核 gate 且 DPLC 必须立刻干净、APR 短期修不了 A 的 108 条
- designer 确认 B 的 CONFIG_DATA hold 可用约束合理豁免 → B 硬伤消失
- B 的 gating 检查总数（54 vs 47）若查出是误检 → 违例率对比需重算

**给 APR 的两个破局问题**：① A 的 DPLC 108 条（cbest only）能否一个 ECO 轮次修掉？② B 的 CONFIG_DATA hold（41 条 -0.5）什么根因？——**谁的问题便宜修，就选谁**。

## 案例 8：DPLC_GROUP 与 max_delay 优先级陷阱

### 现象

A 版 wc_cbest 冒出 108 条 setup 违例，全部收敛到两个起点寄存器：`R_REG06_F_reg_7_`（= DPLC_GROUP，DPLC 协议时序模式选择位）×87 和 `R_REG00_F_reg_6_`（= AVE_RGBW[1]，平均权重配置）×2，终点是 DTCTL 的 DPLC 数据生成/输出寄存器。其余 9 个 corner 全 0。

### 机制（为什么只在 cbest 崩）

数据路径（LC_CPUWR → DPLC_GROUP 组合扇出 → DTCTL）约 **9.9ns**，而约束是 `set_max_delay 6.35`（1× DPLC 周期）：

```
required = max_delay(6.35) + capture 时钟网络延迟
cworst：延迟 ~4.4 → required ~10.75 > 9.9 → 过
cbest ：延迟 ~3.0 → required ~9.35 < 9.9  → 崩（108 条）
```

**这条 max_delay 是靠 capture 时钟延迟垫着才能过的**——min-RC corner 延迟一缩，全线崩盘。corner 结构性脆弱，不是路径本身慢。

### 为什么 multicycle 救不了

PT 例外优先级：`set_false_path > set_max_delay > set_multicycle_path`。**实锤**：约束文件里本来就有 `R_REG*_F_reg* → DCLK_DATA_MUX_*` 的 mc2，这 89 条（报告 top 内）照样违例——mc 在 max_delay 面前直接被忽略。

### 解法：更具体的 set_max_delay（不是新发明，是沿用先例）

同一文件里密码寄存器早有先例：`set_max_delay [expr $DPLC_CLKP*2] -from R_REG48_F_reg*`。照此办理：

```tcl
set_max_delay [expr $DPLC_CLKP*2] -from .../R_REG06_F_reg_7_/CK -to .../DTCTL/U_DPLC_DATA_GEN/*/D*
set_max_delay [expr $DPLC_CLKP*2] -from .../R_REG06_F_reg_7_/CK -thr .../U_DPLC_DATA_GEN/* -to .../data_out_tmp*/D*
# R_REG00_F_reg_6_ 同款两行
```

同类例外里 point-to-point（-from -to）优先于 general（-to），所以只有这两个配置寄存器扇出的路径被放宽到 12.7ns（required = 12.7+延迟 ≥ 15.7 > 9.9，全 corner 收敛），**其余 DPLC 动态路径仍按 6.35 严格检查**。

### 强限定条款（来自用户的明确要求）

"-from 精确到 `R_REG06_F_reg_7_` / `R_REG00_F_reg_6_` 两个寄存器、零族通配"——宽松只属于这两个静态配置位；`R_REG06_F[2]`（DPLC_MODE）当前零违例，明确不放，防止顺手扩大化。

### 结论

**"只准 multicycle"的规则碰到 max_delay 罩着的路径时会失效**——此时正确做法不是 break rule 去加 false_path，而是用"更具体的宽松 set_max_delay"让路径保持被检查、只是窗口变宽。这是约束工具箱里第三件工具，值得记住。

## 案例 9：skew -900 定案——"改完还是 -900"的两个额外真相

### 现象

按案例 3 修好探针、把文件拷到别处后，报表里 **-993.56 依旧**。用户判断"路径找错了或脚本有问题"——**判断对了一半**。

### 定案证据（本地真实报表目录，msys perl 5.40）

| 步骤 | 内容 | 结果 |
|---|---|---|
| ① 复现 | 拿 git HEAD 的旧 perl + 0916V5 真实报表跑 | 输出 `0,1000,6.44313,...` 与 `-993.55687`，**与已发布 csv 完全一致** |
| ② 修复 | 新 perl（去掉哨兵）跑同一批报表 | 该字段留**空白**，stderr 点名 `report_timing_sd_l_1p_clk_a.rpt has no 'data arrival time' line` |
| ③ 回归 | 其余字段逐字节比对 | **完全相同**（修哨兵无副作用） |

### 真相一：坏的不止一个文件，另外三个"假得合理"

同一 run 的 4 份时钟报表：

| 文件 | 状态 | 后果 |
|---|---|---|
| `sd_l_1p_clk_a.rpt` | **151 字节空壳**（只有 SEL-003/005） | 哨兵 → -993.56（明显假） |
| `sd_r_1p_clk_a.rpt` | 3.3 MB，起点 `LC_CPUWR/R_REG06_F_reg_7_`（**数据寄存器**），带 `invalid start point (UITE-416)` | pt_shell 回退成"终点为该时钟 pad 的全部路径"，把 11.3 ns 的**数据路径**当时钟到达时间 → margin = -5.15（看着像真的超标） |
| `sd_l_1p_clk_b.rpt` | 起点 `CLKGEN/short_encoding_phase_data_0_half_dly_reg`（数据寄存器），2 invalid start point | margin = +3.75（落在窗口外，像"超标"） |
| `sd_r_1p_clk_b.rpt` | 同上 | margin = **+2.84（落在 [-2.5:+2.5] 窗口内）**——最危险，会被当成"合格"信以为真 |

教训：**"有些行看起来正常"比"全部离谱"更危险**。哨兵值至少一眼可疑；非法起点回退出的假数字能一路混进签核表。

### 真相二：服务器上根本没跑新脚本

最新 `PACK_TAR_0916V5`（16:12）里 `SYNTHESIS/top/sta/post/common/report_timing_skew_sd.tcl` 仍是 **4747 字节的 56 行旧版**（第 15 行还是 DTCTL 层级）。调用链是 `pt_setup.tcl:328/333 source ../../common/report_timing_skew_sd.tcl`（相对 `top/sta/post/pt/<corner>/` 解析）——**文件必须落在 `top/sta/post/common/`，并且要重跑 `run_pt`（`run_summary` 只是重新解析已有 corner 报表，不重跑就不会变）**。

### 处理（本次落地）

1. **探针**：clk_a → `CLKGEN/u_gate_INV_SD_CLK_INV/CLKINVX4/O`；clk_b → 双源包络（`SD_CLK_INV` + `u_gate_MUX_SD_CLK/CLKMUX2X2/O`）。两点即 SDC 里 `create_generated_clock` 的源 pin（`ip_cons:54-55,60-68`；`read_cons.log:476-486`），pt_shell 按**时钟源**处理——与 HV2M23 做法一致。
2. **perl 去哨兵**：`$max=0; $min=1000;` → `undef` + `defined()` 保护；新增 `margin()`：任一操作数未测到就输出**空白**；每文件统计 `data_lines`，为 0 时 stderr WARNING 点名文件。
3. **删掉伪造的 dplc 行**：早前为"填满 perl 期望的文件集"把 1p 的数据探针复制给 dplc——那是**编数字**。改为留空（原流程行为），等真实 DPLC 模式 run（2M23 用 `latest_1p`/`latest_2p` 两套 run 目录）。

### 验证清单（拷服务器后逐条过）

1. 4 份 `*_clk_*.rpt`：>1 KB、`grep -c "data arrival time"` > 0；
2. `Startpoint:` 必须是 **CLKGEN 的时钟源 pin**（`clock source 'SD_CLK_INV_*'`），**不应再有** `invalid start point (UITE-416)`；
3. 日志无 `WARNING(get_sd_busskew.pl)`；
4. `report_sd_busskew.csv` 不再出现 < -100 的 margin，左 CLKA margin 为**带符号个位数**（0 ~ ±3 ns 量级）。

### 结论

- -900 的完整因果链：**探针层级错 → 1 份空报表 + 3 份非法起点回退 → perl 0/1000 哨兵 → 假 margin 进签核表**。
- 修完还见 -900 的原因**不在脚本逻辑，而在投放位置 + 是否重跑 corner**：改副本无效，只跑 `run_summary` 无效。
- 遗留：DPLC 模式 CLKB 的独立 `DPLC_CLK`（`CLKGEN.v:182,190`，`u_gate_MUX_DPLC_CLK/O`）在 SDC 里**还没有** `create_generated_clock`，要测它得先在 ip_cons 补定义；合格窗规格（1V11 `[-2.5:+2.5]`/`[-1:4]` vs 指南 `[-1:+6]`）仍待后端确认。

| `修改记录/evidence_skew_fix_20260916/` | 本地复现证据：`old.out`（精确复现 -993.55687）、`new.out`（该字段转空白）、`new.err`（WARNING 点名空报告文件） |

## 案例 10：MPW 规格与"pulse 是不是时钟周期的一半"

> ⚠️ **本案例"处理"段中 (A) case_analysis 和 (C3) SHORT 留模板的部分已被案例 12/终版补遗推翻。** 终版：无 case、SHORT 族同值 2/0.73、clk_period 零修改。"现象/三问/概念表/结论中 pulse 概念和余量定性"仍然有效。

### 现象

SD 输出口补上 `set_min_pulse_width` 检查（批次 1）后，wc_cbest 一次冒出 **8 条违例**（worst CLKA_L **-0.365**）。规格链：MPW SPEC = **2ns**；3G(DPLC) 时 6.37/2=3.175 → 余量 1.175；5G(不开 DPLC) 若按同样余量 1.175 反推检查值只剩 **0.73**——"DPLC 那一坨设 0.7 几、其他保持 2、不设 false_path"，听起来像个方案，但每一步都值得拆开验证。

### 第一问：pulse 是不是时钟周期的一半？

**只对 50% 占空比的链成立：**

| 链 | 周期 | 高相 | 低相 | 是一半吗 |
|---|---|---|---|---|
| LONG 链（50% 占空比） | 3.81 | 1.905 | 1.905 | ✅ |
| LONG 链 @3G | 6.35 | 3.175 | 3.175 | ✅ |
| SHORT 链（`edges {1 3 4}`，非对称） | 5.715 | 3.81 | **1.905 = T/3** | ❌ |
| SHORT 链 @3G | 9.525 | 6.35 | **3.175 = T/3** | ❌ |

MPW 检查的是**较短那一相**；两条链的低相恰好相同（5G 1.905 / 3G 3.175），所以"按一半算"的数字恰好没露馅——但概念本身是错的，遇到别的占空比就会翻车。

### 第二问：5G 通道口上的活时钟，pulse 到底是多少？

**不是 1.905，是 3.81 / 5.715：**

| 证据 | 内容 |
|---|---|
| RTL `CLKGEN.v:179/185` | `SD_CLK = PANEL_DPLC_CLK_SEL ? DCLK_DATA : normal_clk`；normal_clk 是 DCLK_DATA **÷2** 翻转（L168-176） |
| SDC `ip_cons L57-61` | `SD_CLK_SHORT/LONG` 的 master 是 `NORMAL_CLK_SHORT/LONG`（= DCLK_DATA_MUX **÷2**） |

→ no-DPLC（5G）时口上周期 **7.62ns（LONG）/ 11.43ns（SHORT）**，pulse = **3.81 / 5.715**，MPW=2 的余量 **1.81 / 3.715**——比 3G 的 1.175 还宽。1.905 是 DCLK_DATA（lane 侧）和 DPLC mux-I1 腿的脉冲，那些时钟在 normal 模式下**在片上是死的**（`set_case_analysis 0` 会杀掉）。

### 第三问：规格到底从哪来？

- 俊杰答疑："**DPLC clk 就是 RX_CLK**" → SDC 链条结构本来就对（`DCLK_DATA_LONG = RX_CLK ÷1`），错的只是基础周期 `RX_CLKP` 的值（5G=3.81 / 3G=6.35）
- 3G 的周期项目里**早有名字**：`DPLC_CLKP = 6.35`（`clk_period.tcl:19`，注释 "3G×1.05/20=157.5M"）
- FIXME 块（`ip_cons L99-131`）的头注释原文是 "**DRD output clock for pulsewidth requirement FIXME!! add later**"——它就是为 MPW 需求预留的占位块，`set_min_pulse_width ... 2` 的 spec 值一直在文件里，只是从没被接上。早前判它为"幽灵代码"是误判，需要 1V11 化（L102 层级错误、时钟名是 2M23 的）

### 处理（终版，HK1V11 commit `c15fe91`，全英文注释，多行分段结构）

**(A) MODE SELECTION —— case analysis 必须启用**（初版"本轮未启用"作废，两行打在两个时钟 mux 上）：

```tcl
set_case_analysis 0 [get_pins u_LOGIC_CENTER/LC_CLK_RST_GEN/CLKGEN/u_gate_MUX_SD_CLK/CLKMUX2X2/S]
set_case_analysis 0 [get_pins u_LOGIC_CENTER/LC_CLK_RST_GEN/CLKGEN/u_gate_MUX_DCLK_DATA/CLKMUX2X2/S]
```

- 第一条：`PANEL_DPLC_CLK_SEL=0` → 不开 DPLC（mux 选 normal_clk）
- 第二条：`SP=0` → LONG 编码（`CLKGEN.v:130-135` 证实 SP 是长短编码选择脚：0=LONG/PIX_CLK_LONG、1=SHORT/DCLK_DIV1P5_SHORT）
- ⚠️ **警告**：SP=0 会杀掉**整个 SHORT 编码时钟族** → 本轮 run 是**新基线**，签核前必须确认 LONG 是出货编码

**(B) CLOCK-TO-OUTPUT BUDGET**：`set_max_delay 14 -to CLKA_L/CLKB_L/CLKA_R/CLKB_R`（= 2M23 原值 L657-660）

**(C) MPW 分时钟族（0.73 只给 LONG 族，不是整个 1.905 族）**：

| 段 | 对象 | 值 | 说明 |
|---|---|---|---|
| **(C1)** | `NORMAL_CLK_LONG` / `SD_CLK_LONG` / `SD_CLK_INV_LONG` | **2** | LONG 正常腿（÷2 链，pulse 3.81），一行一个 `get_clocks` |
| **(C2)** | `DCLK_DATA_LONG` / `DCLK_DATA_MUX_LONG` / `SD_CLK_DPLC_LONG` / `SD_CLK_INV_DPLC_LONG` | **0.73** | 仅这 4 个时钟对象（0.73 = 1.905 − 1.175，与 3G 等余量；**不设 false_path**；检查仍开着，真实恶化会报） |
| **(C3)** | SHORT 族 | 不设值 | SP=0 已把 SHORT 族杀掉；留注释模板，若 SHORT 成为出货编码再启用 |

### 结论

- **"余量"是结果，不是规格**：spec 是绝对值 2ns（面板采样需求）；余量随 pulse 自然变化——5G 时 1.81/3.715 比 3G 的 1.175 **更宽**，不存在"必须设 1.905−1.175 才能保住余量"的问题。
- **分时钟族/分模式设检查阈值**：幻影时钟要么 case 杀掉，要么给等余量阈值（0.73 = 1.905 − 1.175），**不要统一给 spec 值**。
- **pulse=半周期要先验证占空比**：非对称链（`edges {1 3 4}`）低相是 T/3，不是一半。
- **case_analysis 是模式选择，不是 false_path**——但它杀的是整个时钟族（SP=0 灭掉全部 SHORT 编码时钟），落笔前必须确认出货模式（本轮：no DPLC + LONG）。

### 证据文件

| 文件 | 内容 |
|---|---|
| ip_cons commit `c15fe91`（HK1V11） | 终版入真实约束：(A) 双 mux `set_case_analysis 0` + (B) `set_max_delay 14` ×4 口 + (C1/C2/C3) 分段 MPW（2 只给 LONG 正常腿、0.73 只给 LONG 族 4 个时钟对象、SHORT 留模板），全英文注释 |
| `修改记录/pending_constraints_SD_output_20260917.tcl` | 推演全记录：幻影速率定性、模式开关提案、FIXME 借鉴清单、0.73 论证与 pulse 概念澄清 |
| `CLKGEN.v:130-135`、`CLKGEN.v:179/185`、`ip_cons L57-61`、`clk_period.tcl:19` | SP=长短编码选择脚；"5G 活时钟 = ÷2 链"的 RTL+SDC 双证；3G 周期变量出处 |

## 案例 11：DPLC_CASE 与 3G/5G 速率开关——为什么 1V11 只有一套约束

> ⚠️ **本案例中 DPLC_CASE 开关、SP_CASE 双开关变量、按编码分 case 的方案已被案例 12/终版补遗全部推翻。** 终版：无任何 case/开关/if-else，clk_period 原始双速率共存（RX_CLKP 3.81 大部分路径 + DPLC_CLKP 6.35 DPLC 路径），一个 run 覆盖全部。"三问"和"2M23 对照分析"中的结构性事实（SP_I 物理引脚、RX0/RX1 双 lane 结构差异）仍然有效。

### 现象

案例 10 定下分时钟族 MPW 后，连出三个问题：

1. MPW 约束要分几套？四 case（长/短编码 × DPLC 开/关）要不要四份约束文件？
2. 2M23 当年分了两个网表，我们是不是也得跟着拆？
3. 2M23 的 `clk_period.tcl` 里有 `RX0_CLKP`(10.08)/`RX1_CLKP`(17.1) 两套周期，1V11 的 `clk_period.tcl` 里只有一个 `RX_CLKP`(3.81)——3G 的周期去哪了？

### 三问

**① MPW 值跟哪个轴走？** —— 只跟**速率轴**（DPLC/noDPLC），与编码轴无关：

| 轴 | 值 | 依据 |
|---|---|---|
| 编码轴（LONG vs SHORT） | **无差别** | 正常腿都设 2（LONG pulse 3.81 / SHORT pulse 5.715 都 >2）；数据腿都设 0.73（**LONG 低相 = T/2 = 1.905，SHORT 低相 = T/3 = 1.905，数字相同、来历不同**） |
| 速率轴（DPLC vs noDPLC） | **0.73 vs 2** | 5G 计时下 DPLC 族是幻影（没这个通路没这个模式）→ 0.73 是"诚实最小阈值"（=1.905−1.175，与 3G 等余量）；3G 真模式下 pulse=3.175，规格 2 适用 |

**② SP_CASE 是要按 run 翻的开关吗？** —— 不是。`SP_I` 是**物理输入引脚**（HK1V11_digital_top.v:253/408，BUFFER_I.v:120 `SP_buf = SP_I`），板上绑死的**静态声明**，是 2M23 `DPSEL_I` 的对应物。真正按 run 翻的开关只有 `DPLC_CASE`。

**③ 3G/5G 为什么 1V11 的 clk_period 没有两套？** —— 两边的物理结构根本不同：

- **2M23**：`RX0_CLKP=10.08` / `RX1_CLKP=17.1`（clk_period.tcl L20-21）是**两条并存的独立 lane**，两个时钟域同时存在，所以不需要开关；他们真正用 case 的地方只有数据通路模式选择（`clk_period.tcl:16 set_case_analysis 0 [get_ports DPSEL_I]`）。
- **1V11**：只有**一根 RX_CLK 管脚**（clk_lane），同一物理时钟在 5G/3G 两种速率下跑——**一个 clock 同时只能有一个周期**，正确形式是**按 run 切换基础周期**。俊杰的答案 "DPLC clk = RX_CLK" 证明链条结构本来就对（`DCLK_DATA_LONG = RX_CLK ÷1`），错的只是 `RX_CLKP` 的值；而且 3G 的周期项目里早有名字：`DPLC_CLKP=6.35`（clk_period.tcl:19，注释 "3G×1.05/20=157.5M"）。

### 处理

**一个开关联动三件事，四种 case 一份文件：**

```tcl
set SP_CASE   0    ;# 出货 strap 的静态声明（物理引脚，板上绑死）：0=LONG, 1=SHORT
set DPLC_CASE 0    ;# 按 run 翻的速率开关：0=noDPLC(5G, RX_CLKP 3.81), 1=DPLC(3G, RX_CLKP 6.35)
set_case_analysis $SP_CASE   [get_ports SP_I]
set_case_analysis $DPLC_CASE [get_pins u_LOGIC_CENTER/LC_CLK_RST_GEN/CLKGEN/u_gate_MUX_SD_CLK/CLKMUX2X2/S]
```

`clk_period.tcl` 同步加 `DPLC_CASE` 开关（1→`RX_CLKP=6.35=DPLC_CLKP`，0→3.81；info exists guard）。

**MPW 值跟随 DPLC_CASE（用户的挑战被接受）**：

```tcl
if {$DPLC_CASE == 0} {
  # 幻影情境：0.73 = 1.905 - 1.175（诚实最小阈值，保住检出能力）
  set_min_pulse_width -low -high 0.73 [get_clocks {DCLK_DATA_SHORT DCLK_DATA_LONG DCLK_DATA_MUX_SHORT DCLK_DATA_MUX_LONG SD_CLK_DPLC_SHORT SD_CLK_DPLC_LONG SD_CLK_INV_DPLC_SHORT SD_CLK_INV_DPLC_LONG}]
} else {
  # 3G 真模式：规格 2（pulse 3.175，余量 1.175）
  set_min_pulse_width -low -high 2 [get_clocks {…同上 8 个时钟对象…}]
}
```

> 之前"无条件 0.73"被用户当场反驳：**DPLC 模式真时钟下 0.73 太松，会掩盖 pulse 劣化到 1.9 以下的真违例**——值必须跟随速率，这一点和 case_analysis 值跟随 case 是同一个道理。

### 结论

- **四种 case 的实现 = 两个开关变量**：`SP_CASE`（出货 strap 静态声明）+ `DPLC_CASE`（按 run 翻）。不需要四份约束、不需要 2M23 式双网表/双目录。
- **"余量"是结果，不是规格**：spec 是绝对值（2ns）；MPW 检查值的语义是"该模式下诚实的最小阈值"，幻影档和真模式档分开给。
- **3G 的周期在项目里早有名字**（`DPLC_CLKP=6.35`）：缺的从来不是周期定义，而是把它接到 `RX_CLKP` 上的那个开关。
- **后续联动清单**：`set_max_delay 14`（绝对预算，四 case 通用，不动）；正常腿 MPW=2（两 case 都过，不动）；G10 的 `2×DPLC_CLKP=12.7`（表达式跟常量，速率切换时复核语义，列复核项）；G1~G8 mc（launch 相对，不动）。

## 案例 12：最终定稿——不用 case，per-clock MPW 就够了

### 现象

案例 10/11 讨论了 case_analysis、速率开关、if/else MPW——最终用户全部推翻：**一个都不需要**。clk_period.tcl 的老设计本来就是正确的。

### 为什么不需要 case（三句话）

1. clk_period 老设计 = **两档速率共存**：RX_CLKP 3.81 管大部分路径（5G），DPLC_CLKP 6.35 管 DPLC 路径（3G）——同一个 run 里各查各的，不需要拆成两次跑。
2. MPW 按**时钟对象**设值（非端口）：正常腿 2 / 数据腿 0.73——每族带自己的阈值，不活跃的族无 arrival 无检查自动空转。不需要 case 杀时钟。
3. 2M23 要 DPSEL_I case 是因为 RX0/RX1 是**两条物理 lane**（10.08/17.1 独立时钟域）；1V11 单 RX_CLK + 双速率共存，结构不同。

### 最终约束（ip_cons：4 行 set_max_delay + 14 行 MPW，合计 18 行活动约束；定稿 commit `a3049b7`）

set_max_delay 14 -to CLKB_L
set_max_delay 14 -to CLKA_R
set_max_delay 14 -to CLKB_R

set_min_pulse_width -low -high 0.73 [get_clocks DCLK_DATA_LONG]   # +DCLK_DATA_MUX_LONG/SD_CLK_DPLC_LONG/SD_CLK_INV_DPLC_LONG/SHORT 同族
```

无 false_path、无 if/else、无开关变量、clk_period 零修改。

### 被推翻的方案（防回流）

| 方案 | 否决理由 |
|---|---|
| DPLC_CASE 速率开关（clk_period if/else） | 老方式（双速率共存）更对，不需要跑两个 case |
| set_case_analysis 双开关 | 不需要任何 case 机制 |
| MPW 按 DPLC_CASE if/else（0.73↔2） | 随 case 一起删，固定 2/0.73 |

| **A0** BUFFER_I | 1 | -0.083 | 同域轻微 | 随 APR |

### 深度链路追踪：worst path (-0.496)

DATA_POINT_LAT_reg_13_ → lag_det_reg（同域 RX_CLK，无中间寄存器，单周期）：

- **LONG_ENCODING_ALIGN.v L310**：DATA_POINT_LAT 是对齐后 20-bit 数据寄存器

## 案例 15：同名 -add 生成时钟 → MPW 幻影违例（负脉宽）

> ⚠️ **归因修正（2026-09-20，见案例 17）**：本案例"同名 -add 双 master 波形合并"的归因**不成立**——0920V1 改名为 DPLC_CLK_SHORT 后，MPW 数字（6.334/5.727/-0.607）与改名前一模一样，单一 master 依然负脉宽。**真根因是时钟 mux 无 case 的多分支传播**（MUX_DPLC_CLK 两条腿 + DTCTL 的 DPLC_MODE_TRUE 选择），rise/fall 沿从不同分支到达、延迟差 2.66ns → 脉宽检查交错配对出负脉冲。改名只解决了 write_sdc 同名只留一条的问题，负脉宽伪影需要 case_analysis 或等效机制根治。

### 现象（0920V1 run）

- MPW 从 **0 违例 → 40 条**，全部 `Related clock: DPLC_CLK`，Check: `clock_tree_pulse_width`
- 典型路径 CLKB_L 端口：rise 沿到达 **6.334ns**、fall 沿到达 **5.727ns** → actual pulse width **-0.607ns（负值，物理不可能）**，required 0.73，slack -1.337
- 伴生两个症状：hold **+4 条**（DPLC_CLK 发起的 gating hold 检查，data_cnt_pre_reg）；LONG 腿 DPLC_CLK 生成时钟本轮没物化

### 根因（SDC 建模错误）

mux 输出 pin（`u_gate_MUX_DPLC_CLK/MUX2X2/O`）上两条生成时钟用了**同一个名字 `DPLC_CLK`**——两个不同周期的 master（LONG 腿 `DCLK_DATA_LONG` 3.81ns + SHORT 腿 `DPLC_CLK_SHORT_DIV` 5.715ns）以 `-add` 同名定义：

1. **write_sdc 对同名多 master 非确定性地只保留一条**——实测：0920V0 包留了 LONG 腿、0920V1 包留了 SHORT 腿，两轮行为不同
2. **PT 把两个 master 的波形合并在同一个时钟名下** → 脉宽检查时边沿交错配对（rise 来自一个 master、fall 配到另一个）→ 幻影负脉冲

**为什么没早发现**：既有惯例本来就是正确答案——SD_CLK 引脚上的 4 个变体用的就是 4 个**不同名字**（SD_CLK_SHORT/LONG/DPLC_SHORT/DPLC_LONG）。违反惯例时**没有任何报错**，只有两个间接症状（同名只物化一条 + 负脉宽）。

### 修复（commit 2734ee3）

两条腿改为不同名字：`DPLC_CLK_LONG`（master DCLK_DATA_LONG）/ `DPLC_CLK_SHORT`（master DPLC_CLK_SHORT_DIV）；MPW 列表同步两行；rx 时钟组通配 `DPLC_CLK*` 天然覆盖。修复验证中（用户重跑 0920V2）。

### 本轮对照：其余全部达标

setup **51/-0.632**（上一轮 2 条跨域 gating 假违例已消失，见案例 14 后续）、RX_CLK 35/-0.444、lt/ml/tt 全 0、**dplc skew 80 格首次全有数**、SEL=0。

### 案例 14 教训修正（重要）

之前归纳的"直接例化库 cell 无层级层"是**错的**。V3 报表实证的真规律：

- **AL9 后缀 = 工艺叶子 cell**（CLKBUFX4AL9）→ pin 路径无中间层（`inst/O`）
- **无 AL9 后缀**（CLKINVX4 / MUX2X2 / CLKMUX2X2 / CG_CELL）**= 包装模块** → 层级保留（`inst/CLKINVX4/O`）
- 证据：`u_gate_INV_SD_CLK_INV/CLKINVX4/O` 每轮工作；`u_gate_BUF_DPLC_CLK_1P5_SHORT/O` 无层——V3 报表实证两者并存
- **流程教训**：用户写的 `/CLKINVX4/O` 本来是对的，AI 拿错误归纳的"规律"去推翻——**必须先查网表报表证据再动手改别人的正确修改**
- 终极方案：双形式防呆 proc（先试 /O 再试 /CLKINVX4/O），网表打平差异免疫

### G14 → 毯子的架构升级

2M23 用一条毯子 `-through LC_CPUWR_*/R_*` mc 2/1 盖全部配置位（L666-667），其 L727-732 有被注释的逐 pin 历史——他们也走过打地鼠再改毯子。1V11 采纳同款。审计结论：LC_CPUWR 41 个 reg 全是配置/写接口/帧率慢信号（checksum/match 计数器每帧级，无 ns 级动态）；LC_REG_MAPPING 纯映射 + 3 个配置采样寄存器（R_PWRCP/R_PWRCN_COP、BKDU_SYNC 在动态选通 BIT_ALIGN_PT 下采样配置——**选通路径不从配置寄存器出发、不被毯子覆盖、保持全查**）。

## 心法清单

1. **先同 corner 对齐，再谈工具差异**（案例 2 第一步省掉半天弯路）
2. **SEL-004/005 计数是约束链的回归指标**（案例 1/5）
3. **空报告 + 哨兵值 = 最隐蔽的假数据源**，解析脚本要防呆（案例 3/9）；**非法起点的回退报表更危险**——数字"假得合理"，能混进签核表
4. 例外约束的演进路径：逐条（审计友好）→ 家族合并（可维护）→ 双分支（跨工具安全）（案例 4）
5. 改名/重构必过一遍引用点自检（案例 5）
6. 按扇入矩阵补全集，而不是逐个打地鼠（案例 2）
7. 证据链写到 文件:行号，让下一个接手的人不用重走
8. **诚实的待定 > 错误的收敛**；但"先启用+头部标注待确认"是更好的中间态（案例 6）
9. **判据先登记再看数据**；纯净 A/B（约束 diff=0）是判网表质量的黄金机会（案例 7）
10. 记住例外优先级链 `false_path > max_delay > multicycle`——它决定哪件工具能用（案例 8）
11. **"改完没变化"先查三件事：文件投放到调用链认的路径了吗？跑的是 `run_pt` 还是只 `run_summary`？改的是脚本还是副本？**（案例 9）
12. **宁可留空，不要编数字**：解析脚本缺数据就输出空白 + 日志点名，"暂行填充"迟早变成假签核（案例 9）
13. **"余量"是结果不是规格**——spec 是绝对值（2ns），余量随 pulse 变化且 5G 方向更宽（案例 10）
14. **分时钟族设检查阈值**：幻影时钟给等余量阈值（0.73=1.905−1.175），不要统一给 spec 值（案例 10）
15. **pulse=半周期要先验证占空比**：非对称链（`edges {1 3 4}`）低相是 T/3，不是一半（案例 10）
16. **约束值跟哪个轴走先问清楚**：速率轴决定 MPW 值，编码轴天然对称（同值 2/0.73）不用分套（案例 11→12）
17. **一个物理时钟同时只能有一个周期**：多速率的正确形式是"两档速率共存于同一 run"（clk_period 的 RX_CLKP + DPLC_CLKP），不是 case 切换（案例 11→12）
18. **case_analysis 不是万能解——先问 per-clock 值能不能解决。** 如果每个时钟对象可以带自己的阈值，多模式共存比分模式切换更简洁（案例 12）
19. **同一 pin 上多个 -add 生成时钟必须用不同名字**——同名 = master 波形合并 = 边沿配对错乱（幻影脉宽/幻影违例），且 write_sdc 行为不确定（V0 留 LONG 腿、V1 留 SHORT 腿）（案例 15）
20. **负脉宽（actual pulse < 0）是建模伪影的标志性信号**——物理不可能，见到就该查时钟定义而不是查后端；同理 2000ns 级边沿展开（案例 14 后续的跨域 gating）也是伪影指纹（案例 15）
21. **pin 路径先看例化后缀：AL9 = 工艺叶子 cell（无层级层，`inst/O`）；无后缀（CLKINVX4/MUX2X2/CLKMUX2X2）= 包装模块（层级保留，`inst/CLKINVX4/O`）**——案例 14 的"直接例化无层级"归纳不完整（它只对 AL9 叶子成立）；防呆终稿：双形式回退 proc，两种打平行为都兼容（案例 16）
22. **别拿错误归纳的规律推翻用户的正确修改**
23. **修复后数字一字不差 = 归因错误**：改名后违例逐位相同（6.334016/5.727087/-0.606930）说明问题不在改名处——数字不动是最干脆的错归因信号（案例 17）
24. **mux 无 case 传播的脉宽伪影无法靠改名消除**：多分支同时传播 + 边沿交错配对 = 负脉宽固有伪影；根治只有 case_analysis 或等效（单分支传播）机制（案例 17）——V3 里用户写的 `/CLKINVX4/O` 本来是对的，被"修正"成 `/O` 后又改回；正确流程：先查网表报表里的实际路径（报表 startpoint 就是铁证），再动手（案例 16）
26. **MPW 伪影的正解是移检查点，不用 case**：时钟对象级 MPW 在无 case 多分支传播下不可计算（worst-case 开沿慢分支 + 闭沿快分支配对），把检查钉在时钟生成点（mux 输出 pin）——每条腿自己的上升/下降沿同一条路，自洽可查（案例 19 后续）
27. **块替换后必须 diff 验证**：行数对照 + 关键行存在性检查——"替换成功"≠"内容完整"（案例 19）
28. **-through 对 gating 检查可能不生效；准静态寄存器用 -from 更保险**——gating 终点是门控单元不是 D pin，-through 匹配的是数据路径经过的 pin；-from 从寄存器出发对全部终点类型生效（案例 20）
29. **跨网表传递的约束 `-to` 用时钟对象不用寄存器**（-from 落 /CK 稳定，-to 落数据脚 D/D1/D2 随 DC 映射变化）；约束"不生效"先查三件套（SEL-004 / report_exceptions.rpt / capture 边沿第几拍）；冲突判定看 write_sdc 落地对象集合是否相交（`*` 跨 `/`，`R_REG*_F_reg*` 匹配不到 `_L_`）；max_delay 的 `-to 层级/*` 与 `/*/D*` 是两种检查，固定值对深时钟树结构性必爆——改完约束 diff 落地产物再跑（案例 21）

## 案例 21：约束明明写了却"不生效"——三个真凶都在落地环节，不在语法（0921 POSTPT）

### 背景

UTC_FRM_CNT 计数器路径（发射寄存器 `LC_CPUWR/R_REG00_L_reg_0_`，时钟 `WCLK1_A_CHPI_DCLK_SHORT` 5.715ns；捕获 `UTC_FRM_CNT_reg_4_`，时钟 RX_CLK 3.81ns）违例 **−0.369**，但约束文件里明明有对应 multicycle——约束"写了"和约束"生效"之间，隔着整条落地链。

### 真凶一（主案例）：`-to` 写寄存器 pattern，write_sdc 落成 DC 网表的数据脚名，APR 网表没有 → 异常被静默丢弃

- ip_cons 里写 `-to .../SHORT_ENCODING_ERROR_CTRL/*UTC_FRM_CNT_*`，PREPT 的 write_sdc 把它展开成 `[get_pins {.../UTC_FRM_CNT_reg_5_/D1 .../D2}]` 共 16 个脚。
- 为什么是 D1/D2：**DC 网表里该寄存器是复合单元** `AND2DFFRBQX1AL9 (.D1() .D2())`；**APR 网表里是普通** `DFFRBQX1AL9 ... /D`。
- POSTPT 读 postcts.sdc 时报 `Warning: No pin objects matched '...UTC_FRM_CNT_reg_5_/D1' (SEL-004)` ×16，该 exception 匹配 0 个对象被丢弃；`report_exceptions.rpt` 里只剩一条 `/latch/E` 的 clock-gating 异常，数据端一条都没有 → 路径退回单周期检查（capture 边沿 7.620 = 2×3.81）→ 违例。
- 同类受害者：G9 约束 `bcc_rx_reply_prdata_reg_0..4,9` 的 `/D1,/D2` 同样被丢（同一份 log 里 **56 条 SEL-004**）。
- 修复：**`-to` 一律用时钟对象**（如 `-to RX_CLK`），clock 对象落地为 `[get_clocks {RX_CLK}]`，与网表版本无关。证据：`-from R_REG*_F_reg* -to RX_CLK` 落地后在 report_exceptions.rpt 里表现为 `... } * RX_CLK cycles=2(start)`，正常生效。

### 真凶二：怀疑"两条 multicycle 一个 -start 一个 -end 冲突"——先用落地对象证伪

- 用户怀疑 `-from R_REG*_F_reg* -to RX_CLK`（mc2 -start）与 UTC 专用 mc（-end）冲突。
- 实测（read_cons.log 落地结果）：前者 -from 是 **346 个 pin 全部为 `_F_` 银行**，`R_REG00_L` 出现 **0 次**；后者 -from 恰是 **8 个 `R_REG00_L_reg_*/CK`**。两个集合完全不相交，不可能有路径同时匹配 → **不是冲突**。

### 真凶三：if/else 合并时丢了 `/D*` 端点限定，max_delay 抓进内部节点 → 伪违例 −3.8

- DPLC 数据发生器约束原为 pt_shell 分支 `set_max_delay $DPLC_CLKP -to .../U_DPLC_DATA_GEN/*/D*`（6.35ns，只查寄存器 D 脚）；合并/回退时 `/D*` 丢失，变成 `-to .../U_DPLC_DATA_GEN/*`，层级内部中间节点（如 `data_copy`，报告显示 "internal path endpoint"）也成了检查点。
- 这种内部端点 required 是裸 6.35，arrival 却含 6.819ns 发射时钟树 → **结构性必爆 −3.815**，而正式 run 的 worst 其实只有 −0.4 左右。
- 修复：恢复 `/*/D*` 与 `data_out_tmp*/D*`。

### 收尾状态

约束文件收敛为：一个 `R_REG*` 组（F+L 银行）× 4 个 `-to`（RX_CLK / OSC_CLK / DCLK_DATA_* / SD_CLK_INV_*）共 8 行 mc，全文件所有 multicycle 统一 `2 -start -setup` + `1 -start -hold`，无数值冲突。旧的 "R_REG* 爆炸"（289~1000+ 条违例）是**无 `-to` 的裸 blanket** 所致，与带明确 `-to` 的组约束不是一回事。

### 心法 29

**`-from <寄存器>` 落成 /CK 脚（稳定），`-to <寄存器>` 落成数据脚（D / D1/D2，随 DC 映射单元变化）——跨网表传递的约束，-to 要用时钟，不要用寄存器。**

配套三句话：

1. 约束"不生效"先查三件套：**read_cons.log 里的 SEL-004 警告、report_exceptions.rpt 里异常在不在、report_timing 里 capture 边沿是第几拍**。异常被丢是静默的，不报错。
2. 判断约束冲突不要看源码猜，**看 write_sdc 落地后的对象集合是否相交**；Synopsys 通配符 `*` 会跨 `/`，`R_REG*_F_reg*` 字面含 `_F_reg`，永远匹配不到 `_L_` 寄存器。
3. `set_max_delay` 的 arrival 含发射时钟树延迟，固定值对深时钟树的结构性必爆；**`-to <层级>/*` 和 `-to <层级>/*/D*` 是两种完全不同的检查**。每次改完约束，**diff 一遍 write_sdc 的落地产物再跑**。

## 案例 18：setup.rpt 双重计数——把 report 汇总行当分组加总

**症状**：0920V6 评估时我把 setup 总数算成 99 条，实际应为 49 条。

**根因**：
- report_setup.csv 每 corner 有 4 行：RX_CLK（路径组）、gating（路径组）、setup.rpt（report 级汇总=总数）、其他
- setup.rpt 行**就是总数**（49），不是第四个分组
- 我误把 35（RX_CLK）+15（gating）+49（setup.rpt）当成 99

**证据**：0916 邮件的 64 条就是 setup.rpt 行口径——64 才是正确答案，之后所有轮次的 129/103/99 全是双重计数错误。

**修法**：数字读法：读 setup.rpt 行，不是分组加总。邮件 md 和汇报图已全部修正（99→49），图副标题写明口径。

**教训（心法 25）**：读总数读 setup.rpt 行，不是分组加总——分组行之间有重叠（一条路径可能同时属于 RX_CLK 和 gating 组）。连续三轮犯同一个错误，用户抓出来的。

## 案例 19：V7 全域爆炸——块替换删掉一行 create，sourcing 中断、全部约束失效

**症状**（0920V7 run，"完全用不了"）：全域跨域爆炸，各 corner ~1000 条/corner，比 V3（1053）范围更广——这次连时钟组都没了。数字快照（wc_cbest）：setup 1000 条 / -9.84、WCLK1_A_DCLK_LONG 480 条 / -9.71、WCLK1_A_DCLK_SHORT 480 条 / -9.66、I2C_CLK 480 条 / -4.05、I2C_CLK_INV 480 条、WCLK1_A_I2C 480 条、async 488 条 / -7.0、gating 71-75——全部是 sourcing 中断后"无约束裸奔"的数字，不代表真实时序。

**根因（两层自伤，commit acd2178 修复）**：

1. **quad-form 块替换误删一行 create**：做块替换（起止锚点整段换）时，`create_generated_clock -name DPLC_CLK_1P5_SHORT` 这一行被一起删掉（全文件 create 38→25 条，13 条差异里混着这条不该删的）→ `DPLC_CLK_SHORT_DIV` 的 master 缺失 → create 报错 → **sourcing 中断 → 后面全部约束（时钟组 / CPUWR 毯子 / G 系列 / SD 输出 max_delay）没有加载** → 全域跨域爆炸。与 V3 的 I2C 爆炸同族但范围更大：这次连组都没了。
2. **DPLC_CLK_SHORT 的 -source 也被改错**：写成了 buffer pin（位于 master 定义点的上游，非法的 source-master 关系）→ 改回反相器输出 pin（喂 mux I1）。

**修复**（acd2178）：补回 1P5 create 行（全文件 create 25→26）+ source 修正。

**心法 26**：块替换后必须 diff 验证——行数对照 + 关键行存在性检查（本次 38→25 的 13 条差异里混着 1 条不该删的 create，只确认了"替换成功"没查内容完整性）。心法 27：**sourcing 中断 = 约束静默失效的最暴力形式**——一行 create 报错可能中断整个约束文件加载，后面几百行约束全部不存在；症状（全域跨域爆炸）与根因（一行缺失）距离极远，排查第一步永远是"约束到底加载到了第几行"（read_tcl.log 里最后的行号/内容）。判别特征：爆炸范围覆盖本来互不相干的多个域（I2C + WCLK1_A + async 同时爆）→ 先怀疑 sourcing 中断，再怀疑单点约束错误。

## 案例 20：毯子 -through → -from——gating 检查覆盖差异 + 用户一次纠正省掉三轮 run

### 背景

0921V1 run：DPLC 时钟**4/4 全部物化**（通配符 pin 生效），hold 零回归——但 setup 从 49 涨到 57、gating 从 15 涨到 17，worst 从 -0.632 恶化到 **-1.099**。

### 新增 2 条 gating 违例分析

| 起点寄存器 | worst | 性质 |
|---|---|---|
| R_REG05_F_reg_6_ | **-1.099** | 配置位（_F 族）——**毯子应该盖住它！** |
| R_REG06_F_reg_2_ | -1.072 | 配置位（= R_DPLC_MODE，_F 族）——同上 |

### 根因：-through 对 gating 检查不生效

CPUWR 毯子用的是 `-through u_.../LC_CPUWR/R_*`——但 clock-gating 检查的**终点是门控单元（SNPS_CG_CELL 等），不是普通寄存器 D pin**。`-through` 模式匹配需要经过指定 pin 的**数据路径**，而 gating 检查的路径形态（enable 数据 vs 时钟沿）不走 LC_CPUWR 的输出引脚路径——因此 -through 覆盖不到。

**用户指出**：改成 `-from`（从寄存器 cell 出发）就覆盖了——`-from` 对**所有终点类型**生效（数据 D pin、gating 使能、mux select）。

### 修复（commit 890360d，单次完成）

| 变更 | 内容 |
|---|---|
| 毯子 -through → **-from** | `mc 2/1 -from u_.../LC_CPUWR/R_REG*`——覆盖全部配置寄存器的所有终点类型（含 gating） |
| G14b 删除 | 被 -from 毯子取代（分 bit 补丁不需要了） |
| R_REG00_L mc 2→3 | UTC_FRM_CNT 路径 -0.542ns 跨时钟展开伪影（WCLK1_A_CHPI_DCLK_SHORT 5.715 vs RX_CLK 3.81，最小公共窗口 11.43），mc3 再扩 5.715ns 应清零 |

### 网表版本核对

| 侧 | 网表 | 关键发现 |
|---|---|---|
| PREPT（DC） | `rep_dir_20260901_3`（0901 DC） | DC 给 wrapper 起名 `HK1V11_digital_top_CLKINVX4_1`（前缀+编号） |
| POSTPT（APR） | `hmnie/.../timing/latest`（0916 APR） | APR 简化回 `CLKINVX4` |

**两套名字的解法**：通配符 pin（`u_gate_INV_DPLC_CLK*/*/O`）同时匹配。

### 心法 28

**`-through` 对 gating 检查可能不生效；准静态寄存器用 `-from` 更保险**——gating 终点是门控单元不是 D pin，-through 匹配的是数据路径经过的 pin；-from 从寄存器出发对全部终点类型生效。用户一次纠正省掉了三轮"分 bit 补丁→跑→再补"的循环。
