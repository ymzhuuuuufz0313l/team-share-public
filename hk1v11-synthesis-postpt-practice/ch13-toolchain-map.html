# 十三、目录结构与工具链教学 · 用 HK1V11 真实目录讲"每个工具吃什么、吐什么、怎么连"

> 个人学习资料 · 数字后端流程入门 · 面向刚接触后端流程的小白
> 本章以 HK1V11 工作区（`E:\project\HK1V11`）的**真实目录结构**为锚点，把"每个工具阶段的输入 → 脚本 → 产物 → 连到下一阶段"讲清楚。
> 所有脚本名、路径、产物名均来自实探结果，不存在的阶段诚实标注"本地不可见"。
> 约束方法论见 ch12，POSTPT 实操见 ch06，排障案例见 ch10/ch11。

---

## 0. 这一章怎么用

先说清楚三个"读者约定"：

- **结论先行**：每块开头一句话把"这个阶段到底在干什么"讲完，再展开。
- **真实锚点**：目录树 / 脚本清单 / 产物名全部来自实探 `E:\project\HK1V11\SYNTHESIS` 和 `HDL` 目录的结果，不存在的不编。
- **小白自检 3 问**：每块末尾给 3 个可自测的问题，确认你"真的看懂了"。

本章共 **14 个块**：

| # | 块 | 一句话 |
|---|------|--------|
| 1 | 全景地图 | 目录树 + 流程顺序图，先画全局 |
| 2 | 设计配置（design.set） | 所有工具阶段的"总开关" |
| 3 | Lint（nLint + SpyGlass） | 综合前静态检查 RTL 编码规范/CDC |
| 4 | DC 综合 | 把 RTL 翻译成门级网表 |
| 5 | LEC（逻辑等价检查） | 综合前后对比，确认没跑偏 |
| 6 | PowerPro（功耗分析） | 算功耗 + 找优化点 |
| 7 | Pre-PT（综合后时序） | 综合网表 + 约束 → 时序报告 |
| 8 | SDC 传递链（sdc_pr） | 约束怎么从综合流到 APR 再到 POSTPT |
| 9 | POSTPT（布局布线后时序） | 有 SPEF 的真实时序验证，10 corner |
| 10 | 跨阶段纪律 | 约束生效链 + 代际验证法 |
| 11 | DV_TCON_C 验证简介 | 验证目录结构 + 和后端流程的关系 |
| 12 | 公共脚本层 | common/ 里跨阶段复用的脚本 |
| 13 | 其他 IP 综合（LINK_LOGIC / LOGIC_CENTER） | 多 IP 独立综合的模式 |
| 14 | 心法 | 12 条可操作教训 |

## 1. 全景地图：HK1V11 工作区目录树 + 流程顺序图

> **一句话**：后端流程就是"RTL + 约束 → 一系列 EDA 工具 → 最终网表 + 时序报告"，每个工具吃上一阶段的产物做输入，吐自己的产物给下一阶段。

## 3. Lint：nLint + SpyGlass

> **一句话**：Lint 是"代码风格检查"，在综合**之前**跑，目的是抓 RTL 编码问题（不综合、不跑仿真）。

### 3.1 nLint（编码规范检查）

**干什么**：检查 Verilog/SystemVerilog 编码规范（命名、宽度、敏感列表、latch 推断等）。

**物理直觉**：就像写论文前的格式检查——不检查内容对不对，只检查格式规不规范。

**输入**：
- RTL 文件列表：`../filelist/HK1V11_digital_top.f`（展开后的）
- macro 文件列表：`$PROJECT_PATH/HDL/file_list/macro.f`
- nLint 规则集：`$TCL_DIR/nlint/nlint_rules.rs`（190KB，定义所有规则）
- 豁免列表：`./nlint_dummy.f`、`./no_check_module.f`

**脚本清单**：

| 文件 | 路径 | 角色 |
|------|------|------|
| `run_nlint` | `ip/syn_HK1V11_digital_top/nlint/run_nlint` | **主启动脚本**（csh），调用 nLint 命令 + 过滤 |
| `nlint_rules.rs` | `common/tcl_dir/nlint/nlint_rules.rs` | nLint 规则集（190KB，定义检查项） |
| `nlint_waive.list` | `common/tcl_dir/nlint/nlint_waive.list` | 全局豁免（当前 0 字节） |
| `cat_nlint_waive.list` | `common/tcl_dir/nlint/cat_nlint_waive.list` | 类别豁免 |
| `nlint_dummy.f` | `ip/syn_HK1V11_digital_top/nlint/nlint_dummy.f` | 本 IP 的 dummy 文件列表 |
| `no_check_module.f` | `ip/syn_HK1V11_digital_top/nlint/no_check_module.f` | 不检查的模块列表 |
| `nlint_filter.pl` | `common/script/nlint_filter.pl` | **后处理**：过滤 nLint 原始报告 |

**产出**：
- `rep_dir/nlint.log` —— nLint 完整日志
- `rep_dir/nlint_org.rpt` —— 原始报告
- `rep_dir/nlint.rpt` —— 过滤后报告
- `rep_dir/nlint.rpt.sort` —— 排序后报告
- `rep_dir/svn.info` —— 跑的时间 + svn 版本

**`run_nlint` 脚本核心逻辑**（58 行 csh）：
```csh
# 1. 清 rep_dir
# 2. 从 design.set 读 TOP_NAME 和 TCL_DIR
# 3. genfilelist 展开文件列表
# 4. 调 nLint：
nLint \
  -f ../filelist/$top_name.f \
  -f $PROJECT_PATH/HDL/file_list/macro.f \
  -rs ${tcl_dir}/nlint/nlint_rules.rs \
  -logfile ./rep_dir/nlint.log \
  -top $top_name -lint -lintTop $top_name \
  -out ./rep_dir/nlint_org.rpt
# 5. nlint_filter.pl 过滤
# 6. 排序
```

### 3.2 SpyGlass（CDC 检查）

**干什么**：检查跨时钟域（CDC）设计问题——哪个信号从时钟 A 域跨到时钟 B 域有没有同步器。

**物理直觉**：两个不同频的时钟之间传数据，必须加"两级同步器"，否则数据可能采到半中间。SpyGlass 就是自动检查"哪些地方该加同步器但没加"。

**输入**：
- RTL 文件列表：`../filelist/${TOP_NAME}.f` + `.sv.f`
- 配置：`spy.set`（goals、RESET 策略）
- 设计配置：`../design.set`

| `spy_setup.tcl` | `ip/syn_HK1V11_digital_top/spy/spy_setup.tcl` | **主流程 tcl**（152 行） |

## 4. DC 综合：把 RTL 翻译成门级网表

> **一句话**：DC（Design Compiler）把 RTL（Verilog）翻译成"门级网表"（一堆与门/或门/触发器），同时做时序优化和约束检查。

### 4.1 物理直觉

RTL 是"行为描述"（`if (a && b) c = 1`），综合后是"电路"（一个 AND 门 + 一个 OR 门 + 一个 D 触发器）。DC 的工作就是：
1. 把 RTL 映射到标准单元库（`nexchip_145_9t`）的 cell
2. 在满足时序约束（setup/hold）的前提下，优化面积/功耗/时序
3. 输出门级网表 + 时序报告

### 4.2 输入

| 输入 | 来源 | 说明 |
|------|------|------|
| RTL 文件列表 | `../filelist/HK1V11_digital_top.f`（由 `genfilelist` 从 `HDL/file_list/HK1V11_digital_top.f` 展开） | 所有 .v/.sv 文件 |
| 库文件 | `$TCL_DIR/common/common_db.tcl`（定义 lib 路径） | `nexchip_145_9t` |
| 时钟周期 | `$TCL_DIR/common/clk_period.tcl` | OSC_CLKP=20ns, RX_CLKP=3.81ns 等 |
| IP 约束 | `$IP_CONS_DIR/HK1V11_digital_top.tcl`（615 行） | 时钟定义、false_path、multicycle |
| 公共约束 | `$TCL_DIR/common/common_cons.tcl` | 公共 false_path、IO 延迟 |
| 设计规则 | `$TCL_DIR/dc/design_rule.tcl` | max_fanout、max_cap 等 |
| 禁用 cell | `$TCL_DIR/dc/dont_use_all.tcl`（59KB） | 哪些 cell 不能用 |
| 时钟/IO | `$TCL_DIR/common/kv_clkio.tcl`（20KB） | 时钟/IO 约束 |
| UPF | `$UPF_DIR/HK1V11_digital_top.upf`（当前 USE_UPF=0） | 低功耗（未启用） |

### 4.4 `compile_dc.tcl` 流程（139 行，行号实测）

```
1.  sh date + source ../design.set          ← 读配置（:1-3）
2.  source dc_user_proc.tcl + basic_setup_all.tcl   ← 用户 proc + 基础设置（:6-7）
3.  read_filelist_all → current_design → link       ← 读 RTL + 关联库（:10-25）
4.  check_design                                     ← 基本检查（:27）
5.  source design_rule.tcl + dont_use_all.tcl        ← 设计规则 + 禁用 cell（:34-35）
6.  source clk_period.tcl → kv_clkio.tcl → ip_cons/HK1V11_digital_top.tcl → common_cons.tcl
                                                     ← 约束顺序：先周期、再 kv 时钟/IO、再 IP 约束、再公共约束（:39-42）
7.  report_port / report_design / report_clock / check_timing
                                                     ← 综合前报告 → .pre_compile（:46-57）
8.  kv_compile_unltra $INCR_OPT $USE_SAIF $BOND_OPT  ← ★ 综合！（用户 proc，封装 compile_ultra，:61）
9.  kv_report_non_scan + kv_change_names             ← 名字规整（reg[n]→_reg_n_ 等，:64-66）
10. write -format verilog → .gv_org                  ← ★ 原始网表（:68）
11. write ddc → .ddc；write verilog → .gv；write verilog → _onlytop.v；write_sdc → .sdc
                                                     ← ★ 四个写出（:77-80）
12. report_area / report_power / report_clock_gating / report_constraints / report_timing
                                                     ← 综合后报告 → .rpt / _max.rpt（:83-108）
13. kv_report_dff_num / kv_report_all_latch / 导出 dont_touch.tcl（:115-121）
14. exec netlist_reform.pl                           ← ★ 最后清理 .gv（去 assign 等，:132）
```

> 注意顺序：**先 write 网表/SDC（10-11），再出报告（12）**；`.gv_org` 在 `netlist_reform.pl` 之前写出，所以它是"未经清理的原始网表"，LEC 用它做 Rev（第 5 块）。

### 4.7 Q&A

**Q：DC 和 PT 都会跑时序，为什么都要？**
A：DC 综合时做时序分析是为了**驱动优化**（"这条路径不满足，我换个更快的 cell / 加一级缓冲"）；PT 做时序分析是为了**报告验证**（"最终结果到底满不满足"）。DC 的分析精度低（没有布局、没有真实 RC），PT 的分析精度高（可以读 SPEF、可以做 SI）。

**Q：为什么有 `SYN_TOOL` 可以选 dc 或 genus？**
A：DC 是 Synopsys 的老牌综合工具，Genus 是新一代（支持增量综合、更好的功耗优化）。本项目当前 `SYN_TOOL="dc"`，genus 目录里有对应的脚本但没在用。

**Q：`DERATE_VAL 1.07` 是什么意思？**
A：综合时给时序加 7% 的余量（derate），相当于"我把周期缩短 7% 来优化"，这样综合出来的网表到 PT 阶段更不容易违例。

## 5. LEC（逻辑等价检查）

> **一句话**：LEC（Logic Equivalence Checking）对比"综合前 RTL"和"综合后网表"，确认综合没有改变设计逻辑。

### 5.1 物理直觉

综合是个"黑箱"：你喂进去 RTL，它吐出来网表。你怎么知道它没有偷偷改逻辑？LEC 就是把两个设计**逐 pin 对比**：
- Gold（金色参考）= 综合前的 RTL
- Rev（被审查）= 综合后的网表
- 如果所有输入/输出/内部寄存器都能一一映射且逻辑等价 → PASS
- 如果有 "non-equivalent"（不等价）点 → 综合可能改了你不想改的逻辑

### 5.2 输入

| 输入 | 来源 | 说明 |
|------|------|------|
| Gold RTL | `../filelist/HK1V11_digital_top.f` + `.sv.f` | 综合前的 RTL |
| Rev 网表 | `../dc/rep_dir/HK1V11_digital_top.gv_org` | DC 综合产物 |
| 库 | `$TCL_DIR/lec/lib_common_lec.do` → `common_db.tcl` | 标准单元库 |
| 设计配置 | `../design.set` | TOP_NAME、SYN_TOOL |

### 5.3 脚本清单

| 文件 | 路径 | 角色 |
|------|------|------|
| `run_lec` | `ip/syn_HK1V11_digital_top/lec/run_lec` | **主启动脚本**（csh），调 `lec -xl -64` |
| `rtl_gate.do` | `ip/syn_HK1V11_digital_top/lec/rtl_gate.do`（157 行） | **LEC 主 dofile** |
| `lib_common_lec.do` | `common/tcl_dir/lec/lib_common_lec.do` | 公共库加载（Verilog 格式 stdcell） |
| `run_lec_lp` | `ip/syn_HK1V11_digital_top/lec_upf/run_lec_lp` | LEC + UPF 低功耗版（perl） |
| `dofile_lp_check.tcl` | `ip/syn_HK1V11_digital_top/lec_upf/dofile_lp_check.tcl` | UPF LEC dofile |

### 5.4 `rtl_gate.do` 流程（157 行）

```
1. reset + tclmode
2. source design.set
3. 读库（lib_common_lec.do → 读 Verilog 格式 stdcell）
4. read_design Gold RTL（.f + .sv.f）
5. read_design Rev 网表（../dc/rep_dir/xxx.gv_org）
6. set_root_module
7. set_flatten_model（序列常数、gated clock 处理）
8. set_system_mode lec
9. analyze_setup → map_key_point → analyze_datapath
10. add_compared_points -all
11. compare -NONEQ_stop 999
12. 报告：unmapped.rpt / unreach.rpt / non_eq.rpt / abort.rpt
13. 如果有 nonequivalent → 打开 GUI 让用户看

### 5.6 Q&A

**Q：LEC 检查什么？**
A：检查"综合前后的设计逻辑是否完全等价"。具体来说：
- 所有输入端口 → 输出端口的映射关系是否一致
- 所有内部寄存器（DFF）是否一一对应
- 组合逻辑（与门、或门、mux）是否等价
- 时钟/复位是否一致

**Q：non_eq 不为 0 就一定是综合 bug 吗？**
A：不一定。常见原因：
- RTL 里有 `(* dont_touch *)` 但 DC 还是优化了
- LEC 映射策略不对（比如 `set_flatten_model` 参数没设对）
- 有些黑盒（black box）LEC 看不到内部
- 需要看 unmapped.rpt 和 unreach.rpt 辅助判断

**Q：本项目为什么用 `gv_org` 而不是 `gv`？**
A：`gv_org` 是 DC `write -format verilog` 的原始输出；`compile_dc.tcl` 末尾（:132）还会 `exec netlist_reform.pl` 对 `.gv` 做清理（去 assign 等格式规整）。LEC 用 `gv_org` 保证和 DC 原始输出完全一致，避免后处理差异导致误判。

## 6. PowerPro（功耗分析）

> **一句话**：PowerPro 读 RTL + 仿真波形（FSDB），算出每个模块的功耗，找出"谁在浪费电"，指导综合/布局阶段做功耗优化。

### 6.1 物理直觉

芯片功耗 = 动态功耗（开关活动）+ 静态功耗（漏电流）。PowerPro 的工作：
1. 读仿真波形（FSDB），知道每个信号在什么时候翻转
2. 读 RTL，知道每个模块里有什么 cell
3. 算出每个模块的翻转率（toggle rate）
4. 用库的功耗模型算出每个模块的功耗
5. 找出"高翻转但功能不重要"的信号 → 推荐优化

### 6.6 Q&A

**Q：PowerPro 的数据从哪来？**
A：三个来源：
1. **RTL**（文件列表）→ 知道电路结构
2. **FSDB 波形**（仿真产物）→ 知道信号什么时候翻转
3. **标准单元库**（.db）→ 知道每个 cell 的功耗模型

三者结合才能算出功耗。没有波形就只能做"无向量"分析（默认翻转率 50%），精度差很多。

**Q：PowerPro 和 DC 的功耗报告有什么区别？**
A：DC 的功耗是"估算"（基于默认翻转率），PowerPro 是"精确"（基于真实仿真波形）。DC 告诉你"大概多少"，PowerPro 告诉你"到底多少"。

**Q：为什么 PowerPro 要用 `tt_typ` corner 而不是综合的 `wcl_cmax_m40_setup`？**
A：功耗分析通常用典型条件（typical），因为你要知道"正常使用时的功耗"。综合用 worst-case 是因为要保证"最坏情况下时序也满足"。两者目标不同。

### 7.7 Q&A

**Q：Pre-PT 和 IP 级 PT（`ip/syn_HK1V11_digital_top/pt/`）有什么区别？**

- **IP 级 PT**（`ip/.../pt/`）：用 `common_pt.tcl`，读 DC 网表（`.gv_org`），输出在 `rep_dir/`，比较轻量。

**Q：`write_sdc` 是做什么的？**
A：把当前 PT session 里所有生效的约束（create_clock、set_false_path、set_multicycle_path 等）**原样导出**成一个 .tcl 文件，给 APR（布局布线）用。APR 会 `read_sdc` 这个文件，确保布局布线时的约束和综合时一致。

## 8. SDC 传递链（sdc_pr）

> **一句话**：`sdc_pr/HK1V11_digital_top.tcl` 是 Pre-PT `write_sdc` 的产物，是"综合约束"传递给 APR 的桥梁。

### 8.1 文件内容

路径：`SYNTHESIS/top/sta/pre/sdc_pr/HK1V11_digital_top.tcl`（290 行）

```tcl
# Created by PrimeTime write_sdc on Tue Sep 22 14:54:32 2026

set sdc_version 2.1
set_units -time ns -capacitance pF -current mA -voltage V -resistance kOhm
set_operating_conditions -analysis_type on_chip_variation -library [...]

# 主时钟
create_clock -name RX_CLK -period 3.81 -waveform {0 1.905} [get_ports {clk_lane}]
create_clock -name OSC_CLK -period 20 -waveform {0 10} [get_ports {OSC_CLK_I}]
create_clock -name I2C_CLK -period 500 -waveform {0 250} [get_ports {SCL_I}]

# 派生时钟
create_generated_clock -name WCLK1_A_I2C -source [get_ports {SCL_I}] -divide_by 1 -add -master_clock [get_clocks {I2C_CLK}] [get_pins {u_LOGIC_CENTER/...}]
...

# false_path / multicycle / IO delay
...
```

### 8.2 约束生效链

```
ip_cons/HK1V11_digital_top.tcl（人写的约束）
    + clk_period.tcl（时钟周期）
    + common_cons.tcl（公共约束）
    + kv_clkio.tcl（时钟/IO）
        │
        ▼  （DC 综合时 source）
    DC session 里的约束
        │
        ▼  （DC write_sdc → rep_dir/xxx.sdc）
    DC 的 SDC 快照
        │
        ▼  （Pre-PT source 同样的约束文件）
    PT session 里的约束
        │
        ▼  （PT write_sdc → sdc_pr/HK1V11_digital_top.tcl）
    ★ sdc_pr 文件（给 APR）
        │
        ▼  （APR read_sdc）
    APR session 里的约束
        │
        ▼  （APR 输出 postcts.sdc）
    postcts.sdc（CTS 后的约束，含 propagated clock）
        │
        ▼  （POSTPT source）
    POSTPT session 里的约束
```

**关键原则**：`sdc_pr` 里的内容必须和 `ip_cons` 里的一致。如果 `ip_cons` 改了但没重跑 Pre-PT，`sdc_pr` 就是旧的，APR 会用旧约束 → POSTPT 数字不可信。

### 9.8 Q&A

**Q：为什么 POSTPT 要跑 10 个 corner？**
A：芯片在不同温度、电压、工艺偏差下的时序表现不同：
- **wc（worst-case）**：最慢条件 → 查 setup（会不会太慢）
- **lt（low-temperature）**：低温 → 查 hold（会不会太快）
- **typical / cworst / cbest**：不同 RC 条件 → 覆盖耦合电容影响

注意这 10 个**不是**"温度×RC×电压的全笛卡尔积"（那会是几十上百个），而是**精选子集**：PVT 角 {wc, tt, lt, ml} × RC 角 {typical, cworst, cbest} × 温度 {125/25/-40} 里挑出对签核最有意义的 10 个组合（每个 corner 目录的 `corner_set.tcl` 设 `CORNER`，`pt_setup.tcl:183-259` 把它映射成 `RC_FILE` + operating conditions）。少跑一个 corner，就少覆盖一种物理条件。

**Q：`set_propagated_clock [all_clocks]` 是做什么的？**
A：POSTPT 里时钟已经经过 CTS（时钟树综合），时钟路径有真实的延迟。`set_propagated_clock` 告诉 PT"把时钟当真实路径分析"（而不是理想时钟），这样 skew 才能被正确计算。

**Q：`SI_CHECK 1` 是做什么的？**
A：开启信号完整性（SI）分析——考虑相邻线之间的耦合电容（crosstalk），分析"邻近信号翻转时会不会影响这条路径的延迟"。这是 POSTPT 独有的分析维度。

## 10. 跨阶段纪律：约束生效链 + 代际验证法

> **一句话**：后端流程最大的坑不是"工具报错"，而是"用了旧文件但以为是新的"。

### 10.1 约束生效链（任何阶段断代，后面的数字都不可信）

```
ip_cons/HK1V11_digital_top.tcl（源头）
    │
    │  DC source
    ▼
DC session ──→ write_sdc → dc/rep_dir/xxx.sdc
    │
    │  LEC 用 .gv_org（网表，不用 SDC）
    ▼
LEC（只验证逻辑等价，不验证约束）
    │
    │  Pre-PT source 同样的 ip_cons
    ▼
PT session ──→ write_sdc → sdc_pr/xxx.tcl
    │
    │  APR read_sdc
    ▼
APR ──→ postcts.sdc
    │
    │  POSTPT source postcts.sdc
    ▼
POSTPT（最终报告）
```

**纪律**：
- 改了 `ip_cons` → 必须重跑 DC → LEC → Pre-PT → APR → POSTPT
- 改了 `clk_period.tcl` → 同上
- 改了 `common_cons.tcl` → 同上
- 只改了 `design.set` 里的 `TAR_LIB` → 至少重跑 DC → LEC → Pre-PT
- APR 重跑了但没改约束 → 只需重跑 POSTPT

### 10.2 代际验证法（怎么确认"我跑的是最新的"）

**方法 1：robocopy 重置文件时间戳**
```csh
robocopy <源目录> <目标目录> /MIR /XF *.bak*
```
`/MIR` 镜像复制会更新所有文件的时间戳，让"文件时间"反映"真实跑的时间"。

**方法 2：看报告头的 Date**
每个工具的报告/log 开头都有时间戳：
- `dc.log` 第一行：`sh date` 的输出
- `pt.log` 第一行：`sh date` 的输出
- `lec.log` 第一行：`date` 的输出
- `powerpro.log`：有 "Date: ..." 行

**方法 3：看 `rep_dir/svn.info`**
每个 `run_*` 脚本都会写：
```
Date is 20260922145432
<svn info 输出>
```
这是最可靠的"这组产物是什么时候、什么版本跑出来的"。

**方法 4：看 `read_cons.log` 的 `write_sdc` 时间戳**
POSTPT 的 `<corner>/latest/log/read_cons.log` 里回显了 source 进来的约束文件内容，`postcts.sdc` 头部的 `Created by PrimeTime write_sdc on <时间戳>` 说明这份 SDC 是哪一代 Pre-PT 物化的（当前本地实测：`wc_typical_125/latest/log/read_cons.log:399` = `Mon Sep 21 15:24:21 2026`）。Pre-PT 侧对应的约束读取日志是 `pt_rpt/read_tcl.log` / `read_sdc.log`，名字别搞混。

**方法 5：看 `dc.log` 的标记串**
DC 的 `dc.log` 里搜 `compile_ultra`，看它后面有没有报错。如果 `compile_ultra` 后面直接就是 `write_verilog`，说明综合成功了。

## 14. 心法：12 条可操作教训

> 每条一句话，从"流程视角"总结。

1. **改约束必重跑全链**：`ip_cons` / `clk_period.tcl` / `common_cons.tcl` 任何一个改了，DC → LEC → Pre-PT → APR → POSTPT 全部重跑，否则后面的数字全是旧的。

2. **`read_design.tcl` 是手工炸弹**：Pre-PT 的网表路径写死了（`rep_dir_0922_1456`），DC 重跑后必须手动改，忘了改就会用旧网表。

3. **看 `svn.info` 确认代际**：每个 `rep_dir/svn.info` 里有 "Date is xxx" + svn 版本，这是"这组产物什么时候跑出来的"最可靠证据。

4. **LEC 的 non_eq ≠ 综合 bug**：可能是映射策略问题（`set_flatten_model` 参数）、黑盒、或 `dont_touch` 没生效。先看 `unmapped.rpt` 再看 `non_eq.rpt`。

5. **POSTPT 的 `latest` 符号链接是"当前有效"的指针**：`ls -la` 看它指向哪个 `history/<run_id>`，就知道"最新一次 POSTPT 是什么时候跑的"。

6. **PowerPro 的 FSDB 是 DV 的产物**：`fsdb/power_4k180.fsdb` 不在 `SYNTHESIS/` 里，在 DV 的仿真输出里。如果 DV 没跑，PowerPro 跑不了。

7. **`design.set` 是"总开关"**：换库、换 corner、换工具（dc/genus），都改这一个文件。但 `SYN_TOOL` 改了之后，LEC 的 `read_design` 路径也会变（dc 用 `.gv_org`，genus 用 `.gv`）。

8. **`write_sdc` 是"约束快照"**：Pre-PT 的 `write_sdc` 输出到 `sdc_pr/`，APR 读的就是这个。如果 Pre-PT 没重跑，APR 用的就是旧约束 → POSTPT 数字不可信。

9. **10 corner 不是"跑 10 遍"那么简单**：每个 corner 的 `RC_FILE`、`operating_conditions`、`derate` 都不同，`SI_CHECK` 也不同。不能只跑一个 corner 就下结论。

10. **`genfilelist` 是所有工具的前置**：DC/LEC/nLint/PowerPro 都先跑 `genfilelist` 展开文件列表。如果 `HDL/file_list/*.f` 加了新文件但没重跑 `genfilelist`，综合就看不到新文件。

11. **`common/` 里的文件改一个影响所有 IP**：`clk_period.tcl` 改了，三个 IP 的 DC/PT/POSTPT 全部受影响。改公共文件前必须评估影响范围。

12. **"本地不可见"不代表"不存在"**：APR 网表、SPEF、FSDB、`postcts.sdc` 都在服务器上（`/project/HK1V11/` 或 `/XXW_PRJ01/`），本地只有脚本和报告。如果本地看不到某个文件，去服务器上看。
