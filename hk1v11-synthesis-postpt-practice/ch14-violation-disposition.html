# 十四、违例分组处置 · 新旧约束逐组对照（精确 file:line 索引）

> **个人工作表 · 0922 收窄后新 DC（`rep_dir_0922_1456`）违例逐组归因 · 供逐条仔细思考**
>
> 用法：先看每组的 **Δ 变化**（旧约束干了什么 → 现在是什么）→ 看 **结论** → 看 **建议处置** → 打开 **file:line** 那一行仔细想。
> 约束基线：旧 = `79ef0030`（收窄前），新 = `61eb5605`（收窄后）。约束文件：`SYNTHESIS/common/ip_cons/HK1V11_digital_top.tcl`（615 行）。

---

## 0. Δ 变化分类图例

| Δ 类型 | 含义 | 违例性质 |
|---|---|---|
| **约束→删除** | 旧约束覆盖，现在被删除/注释/剔除 | narrowing_exposed（假 path 或有意收紧） |
| **从未约束** | 新旧两版都没覆盖 | genuine（真实违例）或历史遗留 |
| **未约束→新增** | 旧版无，新版新增约束 | （本次无） |
| **仍约束** | 新旧都覆盖 | （本次无违例） |

> 关键判别：**一条违例是不是"收窄报出来的"，只看它的 startpoint 在旧版是否落在某个 waiver 的匹配集内、在新版是否被剔除/注释**。不看感觉，看 get_cells 实际匹配（教训：G13 的 `DATA_POINT_LAT_reg_*` 永远匹配不到 `DATA_POINT_LAT_D1_reg_*`）。

## 2. 逐组详析（旧 → 新 → 结论 → 建议 → file:line）

### 2.1 组 1 · RX_CLK setup · 89 条（收窄剔除的 10 分区）· worst **-1.45**（全局 WNS）

**旧约束干了什么**：基线里 `cpuwr_reg_grp` = 宽泛的**全部** `R_REG*`（F+L 全含），对它下 `mc 2 -start -setup / 1 -start -hold -to RX_CLK`。这 89 条 startpoint 全部在宽组里 → 被 mc2 豁免，按 2 个 launch 周期检查，**不报违例**。

**现在是什么**：`cpuwr_reg_grp` 用 `remove_from_collection` 剔除了 10 个分区（24 个 bit 级审计判定的 B 类"裸 per-beat 消费者"），这 89 条 startpoint 退出组 → 失去 mc2 → **按单周期报 setup 违例**。同时 G1/G2（BKDU→PIX 的 4 对）也被注释，R_REG03_L[2] 的额外豁免也没了。

**Δ**：约束→删除（组覆盖被剔除）。

**逐分区拆解**（条数 / worst / 消费点 RTL file:line）：

| 分区 | bit | 条数 | worst | 下游消费者（无同步器） | RTL file:line |
|---|---|---|---|---|---|
| R_REG03_L | [2] BKDU | 24 | -0.16 | 像素数据通路/对齐使能 | `DATA16TO24.v:198`、`CHPI_KCODE_ALIGN_L0.v:265`、`ANCTL.v:147,153` |
| R_REG40_F | [7] DBC_VBK_ON | 23 | -1.00 | HSR_ACTIVE 裸项 | `LC_REG_MAPPING.v:322` |
| R_REG47_F | [1:6] HIZ_MIN | 13 | **-1.45** | TP 计数器直喂 | `CHPI_SD_CTRL.v:180-201` |
| R_REG33_F | [4:6] UTC/FRM_CHK | 12 | -0.34 | 比较活 UTC 计数器 | `CHPI_UTC_CHK.v:27-31`、`SHORT_ENCODING_ERROR_CTRL.v:27` |
| R_REG56_F | [0:3] UTC 阈值 | 11 | -0.36 | 活计数器比较 | `LONG_ENCODING_ERROR_CTRL.v:227-260` |
| R_REG57_F | [0:2] UTC 阈值 | 6 | -0.88 | 同 R_REG56_F 链 | `LONG_ENCODING_ERROR_CTRL.v:227-260` |

**结论**：形式上 100% 是"收窄暴露"。但这 24 bit 是审计**有意**挑出来的 B 类（裸 per-beat 消费者、无同步器），收窄是收紧不是 bug。其中要**逐 bit 二选一**：
- **一次性/准静态配置**（HIZ 类 `R_REG47_F`、DBC 类 `R_REG40_F`）：写入窗口远离工作拍 → 可恢复窄 `-to` 豁免。
- **每拍活消费**（UTC 比较 `R_REG33/56/57`、BKDU `R_REG03_L[2]`）：恢复豁免 = 放走真违例 → **只能 RTL 加同步/门控**。

**建议处置**：不要一刀切恢复 blanket。逐 bit：准静态的恢复窄 mc；UTC 比较类保留单周期 + RTL 修。

**你应该看的 file:line**：
- 约束剔除本体：`ip_cons` **L413-424**（`get_cells R_REG*` + `remove_from_collection` 10 分区）
- 组 mc 还在（对剩余对象生效）：`ip_cons` **L425-432**（-to RX_CLK / DCLK_DATA_* / SD_CLK_INV_* 三对）
- 逐分区"为什么剔"的理由注释：`ip_cons` **L385-412**（每个分区的 RTL file:line 都写在这）
- 最深那条（-1.45）：`CHPI_SD_CTRL.v:180-201`（HIZ_MIN_SEL/VAL → TP 计数器）
- DC 报告代表路径：`HK1V11_digital_top_max.rpt` **L39120**（R_REG47_F_reg_1_ → CS_SIG_ORG_reg/D，12 级组合）

### 2.2 组 2 · RX_CLK setup · 15 条（G13 DATA_POINT_LAT）· worst -1.31

**旧约束干了什么**：G13 = `mc 2 -start -setup / 1 -start -hold -from .../LONG_ENCODING_ALIGN/DATA_POINT_LAT_reg_*`（from-only，覆盖一切 endpoint 含 clock-gating 检查）。基线里**激活**。

**现在是什么**：G13 整对**注释掉**（`ip_cons` L329-330），只留审计注释。

**Δ**：约束→删除（G13 注释）。

**结论**：准静态 `DATA_POINT_LAT`，G13 注释**直接暴露**这 15 条（含 RX_CLK 的 clock-gating 检查）。代表路径 endpoint 是 `SNPS_CG_CELL_DCLK_DATA_POINT_LAT_reg_0/latch`（gating check）。

**建议处置**：与组 3 一起处理——把 G13 重写成覆盖本尊 + `_D1`（见 2.3），一次消 15+41=56 条。

**你应该看的 file:line**：
- G13 注释本体：`ip_cons` **L329-330**
- G13 审计注释（为什么留 OFF）：`ip_cons` **L321-328**
- DC 报告代表路径：`max.rpt` **L39296**（DATA_POINT_LAT_reg_13_ → CG latch，约 11 级）

### 2.3 组 3 · RX_CLK setup · 41 条（G13 的 `_D1` 漏配）· worst -1.31

**旧约束干了什么**：G13 的 pattern 是 `DATA_POINT_LAT_reg_*`——它**从未匹配过** `DATA_POINT_LAT_D1_reg_*`（名字里多了 `_D1`）。所以这 41 条在**旧版就没被 G13 覆盖**（新旧两版都是单周期）。

**现在是什么**：G13 注释（pattern 仍窄）。这 41 条依旧无豁免，只是这次 RTL/综合结果恶化到违例。

**Δ**：**从未约束**（不是收窄造成的——是 G13 pattern 本身有缺陷）。

**结论**：C 类。0922 审计已写明：0921V3 那 20 条近限路径里 **19 条 startpoint = `DATA_POINT_LAT_D1_reg_3_`**，`NOT matched by this waiver's pattern`。旧版"看起来对"其实是 waiver 没打中目标。

**建议处置**：把 G13 重写为 `-from { .../DATA_POINT_LAT_reg*  .../DATA_POINT_LAT_D1_reg* }`（覆盖 SHORT/LONG 两实例），先与设计师确认 D1 与本尊同为准静态。一次消 56 条。

**你应该看的 file:line**：
- G13 pattern（看它为什么匹配不到 D1）：`ip_cons` **L329**（`DATA_POINT_LAT_reg*`——注意 `_reg` 前没有 `*`，中间插不进 `_D1`）
- 审计更正注释：`ip_cons` **L322-327**
- DC 报告代表路径：`max.rpt` **L39374**（endpoint 同样是 `SNPS_CG_CELL_DCLK_DATA_POINT_LAT_TMP_reg_0/latch`）

### 2.4 组 4 · RX_CLK setup · 139 条（纯数据通路寄存器）· worst -0.85

**旧约束干了什么**：这些 startpoint（`o_keep_reg_*`、`rx_bit_cnt_reg_*`、`boe_bcc_prescale_reg_*` 等）**不在** cpuwr_reg_grp、不在 G13/G14 → 旧版就没覆盖。

**现在是什么**：仍未覆盖。

**Δ**：**从未约束**（真实违例）。

**结论**：RX 域内部真实关键路径（理想时钟即违例），与收窄**完全无关**，需综合策略/RTL 优化。

| startpoint 模式 | 模块 | 条数 | worst |
|---|---|---|---|
| `o_keep_reg_*` | LONG_ENCODING_DESCRAMBLE | 60 | -0.60 |
| `rx_bit_cnt_reg_*` | LONG_ENCODING_DECODE | 46 | -0.85 |
| `boe_bcc_prescale(_cnt)_reg_*` | BOE_AUTO_EQ_BCC_CTRL/u_boe_rx_bcc_decoder | 26 | -1.14 |
| 其他（CS_SIG_ORG / bcc_receive_state / cnt_7b / o_raw_idx） | 各 1~3 | 6 | -0.51 |

**建议处置**：交综合（ungroup / retime / 大小 cell 重映射）或 RTL 流水。

**你应该看的 file:line**：
- 这类 startpoint **没有任何 waiver**——在 `ip_cons` 里 grep 不到对应 `-from`（这正是"从未约束"的证据）
- DC 报告代表路径：`max.rpt` **L44108**（o_keep_reg_2_ → BIT_COUNT_reg_6_）、**L40964**（rx_bit_cnt_reg_3_ → o_data_reg_12_）、**L39458**（boe_bcc_prescale_reg_2_ → sample_mask_cnt_reg_5_）

### 2.5 组 5 · WCLK1_A_DCLK_SHORT · 139 条（CONFIG_DATA）· worst -0.11

**旧约束干了什么**：唯一可能沾边的是基线里的 `-through .../LC_CPUWR/R_` blanket mc——但 `"R_"` 是**字面名（无通配符）**，在每一版 flow 里都**匹配 0 个对象**（write_sdc 0 条 -through，dc_shell 报 CMD-036 Can't find objects）。所以它从第一天就是**死约束**，从未真正覆盖过这 139 条。

**现在是什么**：死约束已删除（`ip_cons` L332-337 注明）。这 139 条依旧无豁免。

**Δ**：**从未约束**（真实，但轻微 -0.11）。

**结论**：CHPI 配置写通路——`CONFIG_DATA_reg_*`（DCLK_CONFIG 域）→ `LC_CHPI_DECODE` → `CHPI_CONFIG_L0` → `LC_CPUWR` → `R_REG*_reg/D`（WCLK1 域），跨 DCLK_CONFIG→WCLK1_A。真实 setup 问题，但 worst 仅 -0.11，DC 优化裕量大概率够。

**建议处置**：交 DC 优化；若仍超，考虑对该写通路加窄 mc（确认是低频配置写）。

**你应该看的 file:line**：
- 死约束删除注明：`ip_cons` **L332-337**（看它为什么"删了但无影响"）
- DC 报告代表路径：`CONFIG_DATA_reg_2_(DCLK_CONFIG_MUX) → LC_CHPI_DECODE U38/U18 → CHPI_CONFIG_L0 U15 → LC_CPUWR U28 → R_REG*_reg/D (WCLK1)`

### 2.8 组 8 · DPLC_CLK_LONG · 2 条（G14 R_REG06_F[2] DPLC_MODE）· worst -0.38

**旧约束干了什么**：G14 = `mc 2 -start -setup / 1 -start -hold -from .../R_REG06_F_reg_2_`（from-only，覆盖 gating check 的一切 endpoint）。基线里**激活**。

**现在是什么**：G14 三对**注释掉**并移入 `pt_shell` guard（`ip_cons` L351-352 是 DPLC_MODE 那对）。DC 下本来也无法生效（reg[2] 命名）。

**Δ**：约束→删除（G14 注释）。

**结论**：`R_REG06_F[2]`（R_DPLC_MODE）是一次性模式配置 bit，路径 `R_REG06_F_reg_2_/Q → LC_REG_MAPPING/U24 → R_DPLC_MODE → CENTER1/DTCTL U326→…→U184（8 级）→ C2282/I2`。属可豁免候选。

**建议处置**：恢复 G14 的 `R_REG06_F_reg_2_` 对（DC 下用 `reg_2_` 形式避免 reg[2] 报错），或并入 G10 类 `set_max_delay`。低风险。

**你应该看的 file:line**：
- G14 DPLC_MODE 注释对：`ip_cons` **L351-352**
- G14 审计注释（为什么注释 + 回归口）：`ip_cons` **L339-347**
- DC 报告代表路径：`max.rpt` **L31466**

### 2.9 组 9 · hold 30 条（结构性 / IO）· worst **-4.19**

**旧约束干了什么**：未覆盖（multicycle 主要影响 setup，hold 通常不受 mc 收窄影响）。

**现在是什么**：未覆盖。

**Δ**：**从未约束**（与收窄无关）。

| 子组 | endpoint | 条数/worst | 定性 |
|---|---|---|---|
| SD_CLK_INV_SHORT | `DTCTL/C2272/C2277/C2278/C2283` I2（SD_CLK_INV 门控 AND，I1=SD_CLK_INV，I2=n751/n759 来自 U1186/U1194 半加器链，data_cnt 驱动） | 4 / **-4.19** | 生成时钟（反相+分频）hold 需求 4.97ns，**结构性** |
| SD_CLK_INV_LONG | 同上 | 4 / -2.66 | 同上（需求 3.45） |
| DPLC_CLK_SHORT | `DTCTL/C2276/C2282` I2 | 2 / -1.14 | 同族 |
| RX_CLK | `BUFFER_I/INDATA_SYNC_reg_0_..19_/D`（20bit 输入同步器） | 20 / -0.39 | IO 输入 hold：`set_input_delay -min` 使 arrival -0.28 < required 0.11 |

**结论**：DTCTL 的 SD/DPLC 门控 hold 是时钟生成结构问题（反相+分频组合出的 SD_CLK_INV vs DPLC 生成时钟边沿关系）；INDATA_SYNC 是 IO 约束/板上关系问题。**都不是收窄责任**。

**建议处置**：DTCTL 门控换 ICG 或对 n751/n759 加同步，APR 后用真实时钟树复核；INDATA_SYNC 复核 `set_input_delay -min` 与板上 RX_CLK skew 预算。

**你应该看的 file:line**：
- 输入延迟约束：`ip_cons` **L318** 一带（`set_input_delay -clock RX_CLK -min -0.3` 族，核对 INDATA_SYNC 对应的端口 -min 值）
- hold 无逐跳明细：DC 只在 `.rpt` 输出汇总表，endpoint 反查 `.gv` 网表
