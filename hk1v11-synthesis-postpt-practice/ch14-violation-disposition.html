## 0. Δ 变化分类图例

| Δ 类型 | 含义 | 违例性质 |
|---|---|---|
| **约束→删除** | 旧约束覆盖，现在被删除/注释/剔除 | narrowing_exposed（假 path 或有意收紧） |
| **从未约束** | 新旧两版都没覆盖 | genuine（真实违例）或历史遗留 |
| **未约束→新增** | 旧版无，新版新增约束 | （本次无） |
| **仍约束** | 新旧都覆盖 | （本次无违例） |

> 关键判别：**一条违例是不是"收窄报出来的"，只看它的 startpoint 在旧版是否落在某个 waiver 的匹配集内、在新版是否被剔除/注释**。不看感觉，看 get_cells 实际匹配（教训：G13 的 `DATA_POINT_LAT_reg_*` 永远匹配不到 `DATA_POINT_LAT_D1_reg_*`）。

### 2.2 组 2 · RX_CLK setup · 15 条（G13 DATA_POINT_LAT）· worst -1.31

**旧约束干了什么**：G13 = `mc 2 -start -setup / 1 -start -hold -from .../LONG_ENCODING_ALIGN/DATA_POINT_LAT_reg_*`（from-only，覆盖一切 endpoint 含 clock-gating 检查）。基线里**激活**。

**现在是什么**：G13 整对**注释掉**（`ip_cons` L329-330），只留审计注释。

**Δ**：约束→删除（G13 注释）。

**结论**：准静态 `DATA_POINT_LAT`，G13 注释**直接暴露**这 15 条（含 RX_CLK 的 clock-gating 检查）。代表路径 endpoint 是 `SNPS_CG_CELL_DCLK_DATA_POINT_LAT_reg_0/latch`（gating check）。**0928 审查修订（`_g13_datapoint_audit.md`）**："准静态"定性被推翻——DATA_POINT_LAT/_D1 是解串器位对齐桶形移位选择寄存器（K 码事件装载、更新→消费 0 拍、消费者无使能、漏 K1/K4 不自愈），双判据全不过 → ❌ 不可恢复 mc，**重分类为真实数据通路**。

**建议处置**：~~与组 3 一起把 G13 重写覆盖本尊+`_D1`~~（0928 否决）→ **交综合（retime/upsizing 桶形+20bit 比较锥）或 RTL 预相移重构（mux 移到 1bit 结果侧）**，与组 3 及 139 条 CONFIG_DATA 同桶。

**0930 进展（一句话）**：SHORT 侧打一拍已落地并批量 59/60 基线转绿、LONG v4.1 已实锤（420b 52/52 + 放量 369/382）——**两层根因档案与探针全档见 ch15《记忆唤醒》**。
