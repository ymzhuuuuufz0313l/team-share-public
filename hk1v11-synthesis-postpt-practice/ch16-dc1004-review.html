## 7. 方法论沉淀

- **四模型交叉分工**：3×GLM 独立全量分析（同一任务书：6 判据 + 全量扫描）→ 队长逐判据比对 → 分歧仲裁 → 共识呈 ymzhu 确认后收尾分发。
- **可复用的分析套路**（承接 [ch11](./ch11-violation-atlas.html) 心法）：① 两 run max.rpt 全量路径块逐块解析（Startpoint/Endpoint/Path Group/slack 四元组 + 起点族分类），不抽样；② SDC unwrap 续行后逐条 setdiff，mc 对数变化必须落到"哪 3 对、为什么"；③ dc.log 嵌入的 ip_cons tcl 全文 echo 是**约束代际签名的最可靠证据**（路径会骗人、签名不会）；④ DFF 域计数 diff（per-clock）是发现"整模块时钟域迁移"这类结构性变化的最快手段。
- **验证链**：分析基目录 `script/pack_1004v0_extract/`（源包 387MB/9285 项）；成员报告 glm53 / glm53flash 任务 output，glm53flashx 全文 `script/_dc1004_rep1003_analysis_glm53flashx.md`。
