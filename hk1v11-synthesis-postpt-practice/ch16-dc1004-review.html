## 4. BKDU 口径（判据 2 需 ymzhu 裁决的实质）

1. **排除侧完好（回归检查点通过）**：1003 SDC 中 `R_REG03_L` 仅 3 对同步器窄 mc（G3→BKDU_SYNC/CSYNC/R_PWR*_COP、LD_F_SYNC、POL1-4_SYNC），**无任何 `-to RX_CLK/PIX_DATA/DCLK_DATA` 的 BKDU mc**；抽样路径块 launch 0.00→capture 3.05 单周期、`slack (MET) +1.18`，确证单拍受检。
2. **字面检查点失效（非回归）**：24 条全部物理 MET，组内 worst 仅 **+0.02**——时钟域重构（RX_CLK→DCLK_DATA_MUX_LONG 等）+ v4.2 综合结果使路径自然收敛，"仍违例可见"不再成立。
3. **真 CDC 未修**：RTL 两级 BKDU_SYNC **仍未实施**（网表 `R_BKDU` fanout14 直通 SHORT/LONG_ENCODING_OUTPUT 的 PIX_DATA mux；`LC_REG_MAPPING.v` 仍单级版）；STA 转绿 ≠ 跨域安全，0924 定案（RTL 两级同步器，非 waiver）继续保留待办，+0.02 贴线在 PT/APR 多角下极易翻回。

**建议口径**：判据 2 改记为"排除侧 PASS + 24 条单拍受检 + RTL 两级同步器保留待办（贴线 +0.02）"。

3. **🔴 本地 1V11 仓库代际缺口**：服务器编译清单 81 文件 vs 本地 80——本地 HDL **缺 `LENB_CTRL.v`**，`DTCTL.v` / `LC_REG_MAPPING.v` 为旧版（而 LONG/SHORT_ENCODING_ALIGN、BUFFER_I 已是 v4.2 代）——**部分同步状态**，回传合并需按服务器清单对齐。

## 7. 方法论沉淀

- **四模型交叉分工**：3×GLM 独立全量分析（同一任务书：6 判据 + 全量扫描）→ 队长逐判据比对 → 分歧仲裁（t2+t3 双路一致 + t3 cell 级 diff 终裁）→ 共识呈 ymzhu 确认后收尾分发。判据 1 的"残留另列"口径、残留 10 vs 11 条、SDC 16→13 对定案均由此收敛。
- **Qwen 路由缺席说明**：Qwen 路因线路中断 4 连超时缺席本轮回合（digest_1004.md 已备，可补跑）；本轮共识为 3×GLM 三路一致，Qwen 补跑后如与共识冲突需回滚重议。
- **可复用的分析套路**（承接 [ch11](./ch11-violation-atlas.html) 心法）：① 两 run max.rpt 全量路径块逐块解析（Startpoint/Endpoint/Path Group/slack 四元组 + 起点族分类），不抽样；② SDC unwrap 续行后逐条 setdiff，mc 对数变化必须落到"哪 3 对、为什么"；③ dc.log 嵌入的 ip_cons tcl 全文 echo 是**约束代际签名的最可靠证据**（路径会骗人、签名不会）；④ DFF 域计数 diff（per-clock）是发现"整模块时钟域迁移"这类结构性变化的最快手段。
- **验证链**：分析基目录 `script/pack_1004v0_extract/`（源包 387MB/9285 项）；成员报告 glm53 / glm53flash 任务 output，glm53flashx 全文 `script/_dc1004_rep1003_analysis_glm53flashx.md`。
