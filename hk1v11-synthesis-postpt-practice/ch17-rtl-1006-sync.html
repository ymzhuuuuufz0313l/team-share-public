> **实战复盘 · 按时间线 · 2026-10-06 · 对象 `pack_1006v0_rtl_extract`（服务器 10-06 ymzhu 树）vs 本地 `HDL/`（1004 交付态）+ `rep_dir_1003`（10-02 DC 编译版）**

## C. 总结论

### 452→11 八项加法闭合

**面积**：Total cell area **294907→314707（+6.7%，+19800 um²）**（.rpt L203/L445）。

> **口径注**：452 家族按起点划分（R_REG40_F 与 R_REG03_L 族互斥无重复计数）；15+41+29+367=452 经直接枚举闭合。

| 措施 | 0922 条数 | 1003 归宿 | 证据 |
|---|---:|---|---|
| RTL 打拍 v4.2/v3 | 56 | 全 MET（−1.31→+2.10/0.00） | max.rpt DATA_ALIGN_PRE_D 族 |
| cpuwr 宽 mc（RX 域） | 65 | 起点不再上报 | SDC mc 32→26 |
| cpuwr 宽 mc（WCLK1） | 139 | 774 条全 MET +0.97 | max.rpt CONFIG_DATA |
| AABB·VPS 窄 mc | 23 | 96 条全 MET +1.53 | max.rpt PIX_DATA |
| DPLC bit mc | 2 | 消失，后继 +1.01 | SDC -from R_REG06_F |
| BOE 域迁移 | 26 | OSC 组 +9.93/+12.37 | max.rpt L107630 |
| BKDU（=R_REG03_L） | 24 | 77 条全 MET +0.02 | max.rpt R_REG03_L 族 |
| LONG 数据通路收敛 | 117 | 全物理 MET +0.00~+0.02 | 打拍+weight3 综合 |
| **合计** | **452** | **11 条新 −0.01 ICG（非旧残留）** | max.rpt L3187-3971 |

### 符合性终判

**✅ 四路一致：1006V0 包 RTL 就是 1003 DC run 实际使用的版本。** 81/81 编译清单 + 541 基名零孤儿 + 97.1% 覆盖率 + 0922 负对照 4 项 ×0。

### 整树替换

commit `7dad5525`（38 文件），本地≡1003 编译版，452→11 时序结论直接继承。
