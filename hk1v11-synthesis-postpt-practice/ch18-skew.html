# 十八、Clock Skew 从原理到实战 · 小白自学教程

> 个人学习资料 · 面向刚接触 skew 的读者。全部例子来自 HK1V11 1008 包真实文件；豁免/配对方法论见 <a href="./ch11-violation-atlas.html">ch11 §12</a>。

---

## 1. 原理 · 零基础

### 1.1 发令枪比喻：为什么"钟"到每个人耳朵的时间不一样

想象田径场发令枪：**枪响只有一个，但每个运动员听到枪声的时刻不同**——离发令员近的先听到，远的晚听到（距离 = 延迟）。

数字芯片里：

- **发令枪** = 时钟源（晶振进来的 `SCL_I`、`RX_CLK`，或它们的分频/门控分支）；
- **运动员** = 几千个寄存器（DFF）的 CK 引脚；
- **枪声传播** = 时钟树（CTS 综合的一堆 buffer/inverter 链）；
- **每人听到枪声的时刻差** = **clock skew**。

寄存器靠 CK 边沿"起跑"（把 D 打进 Q）。两个寄存器 A→B 传数据时，A 的起跑时刻和 B 的起跑时刻如果不一致，数据传输的比赛就变了味——这就是 skew 影响时序的全部来源。

### 1.2 三个基础词：launch / capture / insertion delay

一条最简单的时序路径（寄存器到寄存器）：

```
CLK ──树──> [FF_A 的 CK]   FF_A.Q ──组合逻辑──> FF_B.D   [FF_B 的 CK] <──树── CLK
            ↑launch clock                          ↑capture clock
```

- **launch 寄存器（FF_A）**：数据出发的一端，CK 边沿把 D 打进 Q；
- **capture 寄存器（FF_B）**：数据到达的一端，下一个 CK 边沿把 D 接住；
- **insertion delay（插入延迟/时钟延迟）**：时钟从源点走到某个寄存器 CK 脚的总延迟，记 `t_CK(FF)`。树上每条分支的 insertion delay 都不一样。

### 1.3 skew 的定义式

**skew = t(capture_CK) − t(launch_CK)**

即 capture 端 insertion delay 减 launch 端 insertion delay。注意方向约定：**capture 比 launch 晚到（skew > 0）记正**。

- `skew > 0`（capture 晚起跑）：数据"多跑了一会儿才被接"——**对 setup 友好，对 hold 危险**；
- `skew < 0`（capture 早起跑）：数据"少跑一会儿就被接"——**对 setup 危险，对 hold 友好**。

### 1.4 skew 怎么进 setup/hold 账（数字例子）

两个记账公式（uncertainty 暂记 0）：

```
setup slack = T_period + t_capture_CK − t_launch_CK − t_data_delay
            = T_period − t_data_delay + skew
hold  slack = t_launch_CK + t_data_delay − t_capture_CK
            = t_data_delay − skew
```

**数字例子（本项目真实周期 T = 1.905ns，DCLK_DATA 族脉冲周期）**：

设数据路径延迟 `t_data_delay = 1.6ns`：

| 场景 | skew | setup 账 | hold 账 |
|---|---|---|---|
| 理想树 | 0 | 1.905 − 1.6 = **+0.305** ✓ | 1.6 − 0 = **+1.6** ✓ |
| capture 晚 0.5ns | +0.5 | 1.905 − 1.6 + 0.5 = **+0.805**（setup 更宽松） | 1.6 − 0.5 = **+1.1**（hold 仍过，但被吃掉 0.5） |
| capture 早 0.5ns | −0.5 | 1.905 − 1.6 − 0.5 = **−0.195** ✗ setup 违例 | 1.6 + 0.5 = **+2.1**（hold 更宽松） |

规律一句话：**skew 正负一个方向挪，setup 和 hold 一松一紧，永远反向**。所以"故意加正 skew 救 setup"是在预支 hold 的余量——本项目 K1_FIND 路径 hold 被 −1.16ns 分支 skew 推穿就是这个机制的实战版（见 §4.3）。

### 1.5 intra-clock vs inter-clock

| 口径 | 定义 | 谁负责 |
|---|---|---|
| **intra-clock（local）skew** | 同一时钟域内，最晚 CK 与最早 CK 之差 | CTS 的本职，目标是压小 |
| **inter-clock skew** | 两条相关时钟（源钟 ↔ generated clock 分支，或两分支之间）的 insertion 差 | **不是 CTS 能救的**——分支发散点物理位置决定，要用约束（mc/false_path/set_max_delay）消化 |

HK1V11 的特点是 inter-clock 多：`CLKGEN` 里一堆 `u_gate_MUX_*` 输出点上定义的 generated clock（`SD_CLK_INV` / `WCLK1_A_*` / `DCLK_CONFIG_MUX_*`），分支间 4ns 级插入差不叫"CTS 没做好"，是设计结构使然。

再叠一层**global/local/inter-clock 三口径**：global（源到各叶的全局插入差，决定 IO 接口相位）、local（域内，CTS 验收指标）、inter-clock（分支间，约束工程视角）。看报表时先问自己"这份文件是哪个口径"（§3 清单表每行都标了）。

### 1.6 ICG 门控钟：树上多了一截"私人通道"

ICG（integrated clock gating）单元插在时钟树分支上：CK 进、门控后的 gck 出，下游寄存器整块跑在 gck 后面。后果：

- ICG 自身的延迟直接加进该分支的 insertion delay，**拉开与其他分支的 skew**；
- 本项目 `SHORT_ENCODING` 整块逻辑就跑在 ICG 后的时钟上——它的 launch/capture 都在同一 gck 域内时问题不大，一旦跨"ICG 域 ↔ 非 ICG 域"传数据，skew 账里就多了一段别人没有的插入；
- 审计要点：skew 报表里 **ICG 前后分叉的域**要单独看（clk.sum.rpt 的 per-clock latency 天然按 gck 分了组）。

## 2. 代码 · 本项目实战（三层）

skew 从"物理现象"变成"报表上的数字"，在本项目要过三层代码。**每层的坑层不一样**：约束层错=钟定义错；采集层错=报告空；解析层错=数字假。

### 2.1 约束层：钟从哪来（ip_cons）

文件：`SYNTHESIS/common/ip_cons/HK1V11_digital_top.tcl`。

两个基本包装 + 一个户口本机制：

```tcl
# L98-99：根钟（create_clock 的包装）
kv_clock  OSC_CLK   $OSC_CLKP   $OSC_CLK_PIN
kv_clock  I2C_CLK   $I2C_CLKP   $I2C_CLK_PIN

# kv_genclock 模板 = create_generated_clock 的包装（L5 注释）
# kv_genclock clk_name src_clk_period div_num src_clk_pin clk_pin
```

**户口本（重点）**：同一个 MUX 输出脚可以挂多个钟（`-add`），L116-118：

```tcl
create_generated_clock -name WCLK1_A_DCLK_SHORT -divide_by 1 -source $DCLK_CONFIG_MUX_PIN $WCLK1_A_CLK_PIN -master_clock DCLK_CONFIG_MUX_SHORT -add
create_generated_clock -name WCLK1_A_DCLK_LONG  -divide_by 1 -source $DCLK_CONFIG_MUX_PIN $WCLK1_A_CLK_PIN -master_clock DCLK_CONFIG_MUX_LONG  -add
create_generated_clock -name WCLK1_A_I2C        -divide_by 1 -source $I2C_CLK_PIN         $WCLK1_A_CLK_PIN -master_clock I2C_CLK -add
```

同一个 `u_gate_MUX_WCK1_ASEL` 输出脚，三个"户口"（不同 mode 下选不同的上游）。**这一层决定了 skew 报表里"有哪些钟可测"**——STA 只对定义了的钟做分析。另外 `-edges {1 3 4}` 的写法（DCLK_CONFIG_SHORT，L110）= 三沿取非等间隔，本质 **÷1.5 分频**——钟定义里的数学，直接决定 inter-clock 配对关系。

### 2.2 采集层：skew 探针（report_timing_skew_sd.tcl）

文件：`SYNTHESIS/top/sta/post/common/report_timing_skew_sd.tcl`（206 行，头部 L13-57 有 2026-09-16/17/18 三轮修复史注释）。

**探针思想**：skew 没法"直接报"，就用 `report_timing -from <发散点> -to <终点>` 逐对打。时钟树报告（`-from` 时钟发散点引脚、`-to` 端口/寄存器）拿到的是**该分支 insertion delay 的包络（max/min）**；数据报告（`-from` 数据寄存器、`-to` 端口）拿到**数据到达包络**。两者相减就是接口 margin（§2.3）。

L157-158（本次修复点，DPLC 模式 CLKB 时钟树探针）：

```tcl
# 修复前（commit 6a5e7ec8 之前）：
report_timing -from [get_pins .../u_gate_MUX_DPLC_CLK/MUX2X2/O] -to [get_ports CLKB_L] ... > .../report_timing_sd_l_dplc_clk_b.rpt
# 修复后（现值）：MUX2X2/ 段去掉，挂在被改名 cell 的上一层实例引脚
report_timing -from [get_pins .../u_gate_MUX_DPLC_CLK/O] -to [get_ports CLKB_L] ... > .../report_timing_sd_l_dplc_clk_b.rpt
```

为什么改：post-route 网表里 PR 把 cell 改名了（§4.1 详述），老探针 `get_pins` 匹配不到 → SEL-005 空报告。**探针是"点名"，网表换名就哑**——这是采集层最典型的失效模式。

### 2.3 解析层：哨兵与公式（get_sd_busskew.pl + merge）

文件：`SYNTHESIS/top/sta/post/common/get_sd_busskew.pl`（169 行）、`merge_sd_busskew.pl`。

**哨兵（L33-34）**：

```perl
$max = 0;
$min = 1000;     # 哨兵初值：只在 rpt 里解析到 "data arrival time" 行才被真值覆盖
```

rpt 空 → 哨兵原样进 txt（`0,1000`）→ 下游 margin 公式算出 **−99x** 的响亮报警（用户决定保留，历史上正是靠它发现探针失效）。**看到 −99x 先查"报告是不是空的"，不要当时序数**。

**margin 公式（L117-133）**：

```perl
margin_max = data_max − clk_min    # 最快数据 vs 最慢钟，setup 侧包络
margin_min = data_min − clk_max    # 最慢数据 vs 最快钟，hold 侧包络
```

即 **margin = 数据到达 − 钟到达**，八个方向（l/r × 1p/dplc × a/b）× max/min 一并算。`merge_sd_busskew.pl` 把每角一行 txt 合并成 `summary/latest/report_sd_busskew.csv`（10 角一张表）。

## 4. 真实案例 · 本项目

### 4.1 999/−99x 哨兵事件全复盘（1008 包）

**现象**：`report_sd_busskew.csv` 里 4 行醒目的 −992~−997（`sd_{l,r}_dplc_margin_b_max`），txt 里对应 `0,1000`。

**证据链（四步）**：
1. **报表**：`report_timing_sd_{l,r}_dplc_clk_b.rpt` 仅 0.05 KB，内容一行 `Error: Nothing matched for from_list (SEL-005)`；
2. **脚本**：`report_timing_skew_sd.tcl` L157-158 的 `-from [get_pins ...u_gate_MUX_DPLC_CLK/MUX2X2/O]` 在 post-route 网表匹配不到；
3. **网表实锤**：V1 APR 网表（`script/_syn_1008v1/.../HK1V11_digital_top.v`）**L1323-1326**，PR 把该 mux 下 cell 改名 `CLKMUX2X2 → HK1V11_digital_top_CLKMUX2X2_2`，引脚层变裸 `O`（原 `MUX2X2/O` 层级消失）→ get_pins 落空；
4. **解析**：空 rpt → 哨兵残留（L33-34）→ margin = 6.03 − 1000 = **−993.97**。

**修复（commit `6a5e7ec8`，2026-10-08）**：两处 `-from` 去掉 `MUX2X2/` 段，挂上一层实例引脚，天然免疫 PR 内部换名。验收：下个 run dplc_clk_b rpt 恢复 50-60KB 量级、csv 4 行落窗（−0.9~+4.1）。

**教训**：skew 探针 = "点名"，PR 换名就哑；哨兵（999/−99x）是**报警不是数据**。更稳的方案是 `-from [get_clocks DPLC_CLK*]` 由钟定义反查发散点。

### 4.2 WCLK1_A_I2C 包络 6.40ns：全项目最大 + set_sense 完整闭环

clk.sum.rpt：`WCLK1_A_I2C` latency 0.037~6.439ns，**spread 6.40ns 全项目最大**——全族 832 条假违例的物理背景。约束侧解法见 ch11 §12；本页只强调：**先看钟树包络，再定约束口径**。

#### 4.2.1 关键命令：`set_sense -stop_propagation -type clock`（ymzhu 指示重点学习）

**命令解析**（PT `man set_sense`：`[-clocks clock_list] pin_object_list [-type signal|clock]`）：

```tcl
set_sense u_LOGIC_CENTER/LC_CLK_RST_GEN/CLKGEN/u_gate_MUX_WCK1_ASEL/CLKMUX2X2/S \
          -stop_propagation -type clock
```

- `-stop_propagation`：在该引脚上**打断传播**（sense 传播不再穿过此点）；
- `-type clock`：**只切钟感（clock sense）传播，signal sense 不动**——即只影响时钟传播分析，不动数据路径例外；
- 语法注意：`set_sense` 是**一个词**（不是 set_sense 命令族分开写）；pin 可用 `get_pins` 集合或直接路径字符串；
- 执行反馈：返回命中数（`1` = 命中一个引脚）+ **PTE-139 "Invalidating logical update"**——提示当前 timing 已失效，**必须 `update_timing` 重算才生效**（漏掉这步是最常见"为什么没效果"）。

**本项目案例（1008 实测闭环）**：

- 目标 = `WCLK1_A_I2C` 经 TEST_EN 选择腿（`MUX_WCK1_ASEL` 的 **S 脚方向**）的钟传播，插入差 4.75~6.9ns（**PR hold-fix DEL 链疤痕**——布局布线工具为修 hold 加的延时链，把 S 腿时钟拖长）；
- **历史注**：该命令在 `SYNTHESIS/common/top_cons/add_on.tcl` L8-9 早已存在但被 `##` 注释且路径过期，从未生效；
- **1008 修正实测**（ymzhu pt_shell）：按当前网表实核路径 `u_LOGIC_CENTER/LC_CLK_RST_GEN/CLKGEN/u_gate_MUX_WCK1_ASEL/CLKMUX2X2/S` 执行，返回 **1**（命中）+ PTE-139，`update_timing` 后 skew 报告中该分支传播被正确切断；
- ⚠️ **网代形态差异**：不同实例/不同网代层级形态不同——同款 DPLC mux cell 在 post-route 已被拍平改名（§4.1 的 999 事件），WCK1_A 这只保留 `CLKMUX2X2` 层。**路径必须按各自网表实核**，跨网代复用命令字符串必失败。

#### 4.2.2 三层解法谱系（方法论沉淀）

同一个"WCLK1_A_I2C 假违例"问题，三层修法各解决一个面，**组合使用**：

| 层 | 修法 | 状态 | 解决什么 |
|---|---|---|---|
| a) 约束层 | async clock_groups（父子对） | `629ec58a` 已落地，V3 run 实证 832 条清零 | **检查**：hold/removal/gating 不再按同步对查 |
| b) 报表层 | pt_report.tcl skew 汇总剔除 | `73b37b6f` 做过，但 `-clock` collection 传法在真实 run 失败，**已回滚 `a9036c2c`**（根因 K3 t32 审查中） | **报表**：skew 汇总不再被疤痕分支污染 |
| c) 物理分析层 | `set_sense -stop_propagation -type clock` | 本条，pt_shell 实测有效 | **传播**：分析层面直接切断 S 腿钟传播，skew 包络还原真实 |

**教训**：报表脚本改动必须真实 run 验证，纸面语法推演不可上服务器。

#### 4.2.3 使用注意

- **会话级命令**：pt_shell 里敲只在当前会话生效；固化需进约束文件（位置待定：ip_cons 末尾 / add_on.tcl L9 解注释+改新路径，二选一待评审）；
- **验证两步**：① `report_clock_timing -type skew -clock WCLK1_A_I2C` 看插入差变化（6.40 应显著回落）；② 全量 setup/hold 检查确认**无误伤真路径**（S 腿若被真路径用作数据选通，切钟感不影响数据，但需实证）。

### 4.3 G15 与 K1_FIND：skew 是违例根因也是杠杆

- **G15 路径**（DCLK_CONFIG 族）：launch insertion 3.697 vs capture 3.180，**+0.5ns 正 skew** 是 setup 违例的主要构成（§1.4 表第三行的实况版：正 skew 在帮 setup 的反面场景里，本例 capture 反而早，即负向贡献 −0.517 挪给了数据要求）——修法用 mc 侧（commit `2d0cc6f9`）；
- **K1_FIND 路径**：CTS 分支 skew **−1.16ns**（capture 比 launch 晚 1.16ns 的反向记法），hold 侧直接被推穿——§1.4 "skew 吃 hold" 的实战版。

两条路径同一族根源：`DCLK_CONFIG_MUX_LONG`（spread 3.36ns）分支间插入差。

### 4.5 签核阈值建议

- **intra-clock spread**：立门限 **min(0.15 × T, 300ps)** 类经验值。例：RX_CLK T=3.81ns → 上限 ~500ps；当前 clk.sum 里 3.94 的"spread"含 inter 分支成分，建议改 `report_clock_timing -skew` 按 clock group 分开统计再签；
- **接口 margin**：沿用 spec 窗逐 corner 全过即 PASS；
- **哨兵纪律**：−99x / 0 / 1000 任何一个出现 = 报表链有断点，先修报表再谈签核。

## 5. 小白自测

**Q1：hold 违例 4.6ns，一定是数据跑太快吗？**
不一定。hold slack = t_data − skew，4.6ns 的违例更可能是 **capture 钟比 launch 钟晚 4.6ns**（skew +4.6）——本项目 WCLK1_A_I2C 族 832 条假违例（hold 489 + removal 282 + gating 61）全是这个机制：先查两域 insertion 包络差，再谈数据路径。

**Q2：grep `set_clock_groups` 一条都搜不到，是不是没配豁免？**
不对。约束可能藏在"列表 + kv 过程"两层后面（ip_cons 的 clklist → `kv_2clklist_group_path` → 落盘才变 `set_clock_groups`）。要按落盘 SDC 或 kv 调用行去数（详见 ch11 §12）。

**Q3：csv 里 margin = −993.97，时序真的崩了吗？**
没有。−99x 是解析器哨兵（$min=1000 未被覆盖）报警：上游 rpt 空了（探针 get_pins 在 post-route 网表失配）。先追 rpt 大小和 SEL-005。

**Q4：正 skew 救 setup，能不能故意把 capture 分支做慢？**
能，但每一皮秒正 skew 同时从 hold 账里扣（§1.4 表）。K1_FIND 就是分支 skew 把 hold 推穿的例子；故意 skew 要跟 hold 余量一起做预算。

**Q5：DPLC 模式的 clk_a 报告和 1p 模式数字完全一样，是抄错了吗？**
不是。CLKA 两种模式下物理上是同一棵树（`SD_CLK_INV`），dplc 文件名只是为了让 perl 解析器按文件名规约填 csv 的 dplc 行（脚本 L160-169 注释写明"NOT fabricated data"）。**看懂数字先看懂口径**。
