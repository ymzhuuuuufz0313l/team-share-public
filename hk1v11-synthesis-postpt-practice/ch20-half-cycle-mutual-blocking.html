# 二十、Setup-Hold 互卡

## 1. 什么是互卡

**互卡（mutual blocking）**：两条（或多条）时序路径对同一个调节手段的需求方向相反，导致修一条必然恶化另一条。

在半周期路径中，互卡发生在三个层面：

| 层面 | 描述 | 调节手段 |
|------|------|----------|
| **时钟层面** | skew 帮一个方向的 setup 就伤另一个方向的 hold | useful skew |
| **路径层面** | 缩短路径修 setup 可能触发 hold，加长路径修 hold 可能触发 setup | ECO buffer |
| **跨方向层面** | 同一个时钟域的入口和出口对 skew 需求相反 | CTS 分支控制 |

## 2. 半周期基础

### 2.1 正常路径 vs 半周期路径

```
正常路径（全周期 T=3.81ns）：
  DCLK:  _/‾‾\___/‾‾\___/‾‾\___
          |         |
          launch    capture
          |←── T ──→|          ← 数据有 3.81ns

半周期路径（T/2=1.905ns）：
  DCLK:      _/‾‾\___/‾‾\___
  DCLK_INV:  ___/‾‾\___/‾‾\_
                  |    |
                  launch capture
                  |←T/2→|            ← 数据只有 1.905ns！
```

### 2.2 HK1V11 的 DCLK_INV 域

RTL 设计（`CHPI_SD_CTRL.v` L530-580, `CLKGEN.v` L118-165）：

```verilog
// 正常相位源寄存器
always @(posedge DCLK)
    STB_P <= ...;

// 反相影子寄存器（LD_R timing，20241225 添加）
assign DCLK_INV = ~DCLK;  // CLKGEN.v L46

always @(posedge DCLK_INV)
    STB_P_neg <= STB_P;   // 半周期捕获！

// 延时链（也在反相域）
always @(posedge DCLK_INV)
    STB_DLY <= {STB_DLY[14:0], STB_A_PRE};  // 16 级移位
```

**86 个 FF** 分布在 **5 条时钟网**：

| 时钟网 | FF 数 | 内容 |
|--------|-------|------|
| ccopt_net__1 | 27 | CS_SIG_SMT_CS_DLY 全链 |
| ccopt_net__2 | 30 | CS_SIG_DLY + STB_FAKE_DLY + 影子寄存器 |
| ccopt_net__3 | 25 | STB_DLY + 部分混合 + 影子 |
| ccopt_net__59 | 3 | short_encoding_phase half_dly |
| CLK_clone3 | 1 | STB_DLY 个别级 |

## 3. 五组互卡模式

> **一句话总结**：DCLK_INV 域同时被入口 setup 和出口 setup 挤压，任何 skew >0.25ns 都是拆东墙补西墙。治本方案是 RTL 加一级 posedge 打拍。

| STB_DLY_15 → HSR_W_cnt_5 | setup | **+0.259** | 最薄！skew 上限锁死因素 |

### 互卡 C：入域 setup ↔ 出域 setup（最强互卡）

> **一句话**：两边都是 setup 且 skew 需求相反——但入口和出口在不同时钟网，可分别控制。

**网表证据**：

```
入口 FF:  STB_DLY_reg_0_  .CK = ccopt_net__2  ← 可多加 skew
出口 FF:  STB_DLY_reg_15_ .CK = ccopt_net__3  ← 只能少加 skew
                                        ↑ 不同网！
```

<details>
<summary>📋 展开 PT 完整路径</summary>

```
【入口（需要 net__2 skew ↑）】
Startpoint: u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/PSR_LINE_CNT_reg
             (rising edge-triggered flip-flop clocked by RX_CLK)
Endpoint:    u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/STB_DLY_reg_0_
             (rising edge-triggered flip-flop clocked by RX_CLK')
             网表: AND2DFFRBQX4AL9 STB_DLY_reg_0_ (.CK(ccopt_net__2))
             slack (VIOLATED) = -0.675

【出口（需要 net__3 skew ↓）】
Startpoint: u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/STB_DLY_reg_15_
             (rising edge-triggered flip-flop clocked by RX_CLK')
Endpoint:    u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/HSR_W_cnt_reg_5_
             (rising edge-triggered flip-flop clocked by RX_CLK)
             网表: DFFRBQX1AL9 STB_DLY_reg_15_ (.CK(ccopt_net__3))
             slack (MET) = +0.259  ← 不能再少
```

</details>

**解决方案推演**：

| 方案 | net__2 | net__3 | 入口 | 出口 |
|------|--------|--------|------|------|
| 统一 +0.675 | +0.675 | +0.675 | ✅ 全修 | ❌ 全毁 |
| **分别 skew** | **+0.48** | **+0.25** | ⚠️ -0.195 | ✅ +0.009 |
| 统一 +0.25 | +0.25 | +0.25 | ❌ -0.425 | ✅ +0.009 |

**推荐**：分别 skew。入口残留 -0.195ns 由 RTL 打拍解决。
**风险**：链中间 net__2→net__3 过渡处窗口缩 0.23ns，需确认域内 setup 余量。

### 互卡 D：ECO 缩短 vs hold

> **一句话**：修 setup 缩短路径→太短可能触发 hold。但此路径差距大（0.90ns），安全。

| 项目 | 数值 |
|------|------|
| 当前 data_delay | 4.04ns |
| 修 setup 需缩至 | 1.90ns |
| hold 阈值 | ≈1.0ns |
| 修完后距阈值 | 0.90ns → **安全** |

**解决方案**：ECO upsize（2.14ns 幅度太激进）或 RTL 打拍（推荐）。

---

### 互卡 E：ECO 加长 vs setup

> **一句话**：修 hold 加长路径→太长可能触发 setup。但域内全周期余量大（3.6ns），安全。

| 路径 | Slack | 处置 |
|------|-------|------|
| STB_DLY_3 → STB_DLY_4 | -0.160 | hold-fix buffer |
| STB_DLY_7 → STB_DLY_8 | -0.182 | hold-fix buffer |
| STB_FAKE_DLY_3 → _4 | -0.159 | hold-fix buffer |

**解决方案**：标准 hold-fix buffer（独立操作，与 skew 互不干扰）。

```
// 入口 FF（setup 违例的 capture 端）
AND2DFFRBQX4AL9 STB_DLY_reg_0_ (
    .CK(ccopt_net__2),     // DCLK_INV → 可多加 skew
    .D1(STB_EN),
    .D2(STB_P_neg) );

// 出口 FF（setup 极薄的 launch 端）
DFFRBQX1AL9 STB_DLY_reg_15_ (
    .CK(ccopt_net__3),     // DCLK_INV → 只能少加 skew
    .D(STB_DLY[14]) );

## 5. 分析方法论：RTL → 网表 → PT

### 5.1 三级追踪法

| 步骤 | 做什么 | 产出 |
|------|--------|------|
| ① RTL | 找 `posedge` 与 `posedge *_INV` 配对，确认信号链 | 源寄存器→影子→延时链→输出 |
| ② 网表 | 找每个 FF 的 `.CK()` 连接，确认时钟网分布 | 时钟网→FF 映射表 |
| ③ PT | 提取 setup + hold 违例的 startpoint→endpoint | 违例路径清单 |
| ④ 交叉 | 匹配 RTL 信号名与 PT 路径名 | 完整因果链 |
| ⑤ 推演 | 对每个 skew 值推演六个方向的变化 | 互卡矩阵 |

### 5.2 从 PT 报告提取半周期路径

关键：识别 launch 和 capture 钟名互补（`RX_CLK` vs `RX_CLK'`）。

```python
if base_l == base_c and lc != cc:  # 同名不同相
    category = 'half_cycle'         # 半周期路径
```

### 5.3 判定互卡的充要条件

两条路径互卡 ⟺ 存在一个调节手段 D，使得：
- 路径 1 的 slack(D) 单调递增（D 帮它）
- 路径 2 的 slack(D) 单调递减（D 伤它）

## 6. 解决策略

### 6.1 分别 skew（利用不同时钟网）

| 时钟网 | 建议 skew | 锁定因素 |
|--------|----------|----------|
| ccopt_net__2 | +0.48ns | STB_FAKE_DLY 出口余量 0.479 |
| ccopt_net__3 | +0.25ns | STB_DLY_15 出口余量 0.259 |
| ccopt_net__59 | +0.05ns | 仅需修 -0.045 |

**效果**：4/10 条 setup 修复，但 3 条大违例仍在。

### 6.2 RTL 打拍（治本）

```verilog
// 在正常钟域与影子寄存器之间插一级 posedge DCLK FF
reg STB_P_pipe;
always @(posedge DCLK)
    STB_P_pipe <= STB_P;      // 全周期，无压力

always @(posedge DCLK_INV)
    STB_P_neg <= STB_P_pipe;  // 半周期，但 reg→reg 直连！
```

**原理**：半周期约束从"4ns 长路径"变为"0.1ns 直连"——互卡根源消除。

### 6.3 hold-fix buffer（独立修复）

域内 hold 违例不涉及互卡（skew 不影响域内），用标准 hold-fix buffer 即可。

## 7. 互卡矩阵速查

| 互卡 | 方向 | 类型 | 当前状态 | skew 敏感 | 解决 |
|------|------|------|----------|-----------|------|
| A | 入域 | setup↔hold | setup 违 + hold 未知 | 反向 | RTL 打拍 |
| B | 出域 | setup↔hold | setup 薄 + hold 违 | 反向 | 分别 skew |
| C | 入↔出 | setup↔setup | 入违 + 出薄 | 反向 | 不同网 skew |
| D | ECO | 缩短→hold | 低风险 | — | 距离大，安全 |
| E | ECO | 加长→setup | 中风险 | — | 确认余量 |
