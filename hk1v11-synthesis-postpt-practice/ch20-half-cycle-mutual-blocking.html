# 二十、Setup-Hold 互卡

## 1. 什么是互卡

**互卡（mutual blocking）**：两条（或多条）时序路径对同一个调节手段的需求方向相反，导致修一条必然恶化另一条。

在半周期路径中，互卡发生在三个层面：

| 层面 | 描述 | 调节手段 |
|------|------|----------|
| **时钟层面** | skew 帮一个方向的 setup 就伤另一个方向的 hold | useful skew |
| **路径层面** | 缩短路径修 setup 可能触发 hold，加长路径修 hold 可能触发 setup | ECO buffer |
| **跨方向层面** | 同一个时钟域的入口和出口对 skew 需求相反 | CTS 分支控制 |

## 2. 半周期基础

### 2.1 正常路径 vs 半周期路径

```
正常路径（全周期 T=3.81ns）：
  DCLK:  _/‾‾\___/‾‾\___/‾‾\___
          |         |
          launch    capture
          |←── T ──→|          ← 数据有 3.81ns

半周期路径（T/2=1.905ns）：
  DCLK:      _/‾‾\___/‾‾\___
  DCLK_INV:  ___/‾‾\___/‾‾\_
                  |    |
                  launch capture
                  |←T/2→|            ← 数据只有 1.905ns！
```

### 2.2 HK1V11 的 DCLK_INV 域

RTL 设计（`CHPI_SD_CTRL.v` L530-580, `CLKGEN.v` L118-165）：

```verilog
// 正常相位源寄存器
always @(posedge DCLK)
    STB_P <= ...;

// 反相影子寄存器（LD_R timing，20241225 添加）
assign DCLK_INV = ~DCLK;  // CLKGEN.v L46

always @(posedge DCLK_INV)
    STB_P_neg <= STB_P;   // 半周期捕获！

// 延时链（也在反相域）
always @(posedge DCLK_INV)
    STB_DLY <= {STB_DLY[14:0], STB_A_PRE};  // 16 级移位
```

**86 个 FF** 分布在 **5 条时钟网**：

| 时钟网 | FF 数 | 内容 |
|--------|-------|------|
| ccopt_net__1 | 27 | CS_SIG_SMT_CS_DLY 全链 |
| ccopt_net__2 | 30 | CS_SIG_DLY + STB_FAKE_DLY + 影子寄存器 |
| ccopt_net__3 | 25 | STB_DLY + 部分混合 + 影子 |
| ccopt_net__59 | 3 | short_encoding_phase half_dly |
| CLK_clone3 | 1 | STB_DLY 个别级 |

## 3. 五组互卡模式

### 互卡 A：入域 setup ↔ 入域 hold

> **机理**：skew 使 capture 沿延迟 → setup 窗口变大（好）但 hold 阈值上移（坏）。
> 同一个 skew 动作，帮 setup 就伤 hold。

#### PT 报告显示的路径（setup 侧，wc_cbest_125）

```
Startpoint: u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/PSR_LINE_CNT_reg
             (rising edge-triggered flip-flop clocked by RX_CLK)
Endpoint:    u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/STB_DLY_reg_0_
             (rising edge-triggered flip-flop clocked by RX_CLK')
             launch: RX_CLK@0.000  capture: RX_CLK'@1.905
             data arrival: 4.038  data required: 3.364
             slack (VIOLATED) = -0.675

Startpoint: u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/PSR_LINE_CNT_reg
             (rising edge-triggered flip-flop clocked by RX_CLK)
Endpoint:    u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/STB_FAKE_DLY_reg_0_
             (rising edge-triggered flip-flop clocked by RX_CLK')
             slack (VIOLATED) = -0.675

Startpoint: u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/CS_SIG_ORG_SMT_CS_reg
             (rising edge-triggered flip-flop clocked by RX_CLK)
Endpoint:    u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/CS_SIG_ORG_SMT_CS_neg_reg
             (rising edge-triggered flip-flop clocked by RX_CLK')
             slack (VIOLATED) = -0.588

Startpoint: u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/STB_P_reg
             (rising edge-triggered flip-flop clocked by RX_CLK)
Endpoint:    u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/STB_P_neg_reg
             (rising edge-triggered flip-flop clocked by RX_CLK')
             slack (VIOLATED) = -0.340
```

#### PT 报告显示的路径（hold 侧）

当前 hold 报告中**没有**此方向违例——报告只列 VIOLATED，MET 路径余量未知。
这是互卡 A 的盲区：**我们不知道 hold 余量有多少，但 skew 会消耗它**。

```
hold 检查逻辑（同一条路径的 hold 侧）：
  launch: RX_CLK@0.000 → 数据出发
  capture: RX_CLK'@1.905 → 数据必须在此之前保持稳定

  hold slack = min_data_delay - (capture_clk_delay + hold_time - launch_clk_delay)

  skew 加入后：capture_clk_delay 增加 → hold slack 减少
  当前 = 未知（正数，否则会出现在违例报告中）
  skew +0.48 后 = 未知 - 0.48 → 可能变负！
```

#### 互卡可视化

```
skew 对入域的影响：

setup:  |←hold───setup──→|     skew →
                         右移（setup 更松 ✓）
        |←hold───setup────────→|
                右移（hold 更紧 ✗）

修复 setup 的代价 = hold 余量的消耗
```

#### 解决方案

| 方案 | 操作 | 效果 | 风险 |
|------|------|------|------|
| **RTL 打拍（推荐）** | 在 PSR_LINE_CNT 与延时链之间插 posedge DCLK FF | 半周期约束变为 reg→reg 直连，setup 轻松满足；hold 也不再受 skew 影响 | 信号多一拍延迟，需 designer 确认 |
| **分别 skew** | ccopt_net__2 加 +0.48ns | 4 条 setup 修复（影子寄存器类）| hold 余量未知，skew 后可能出现新违例 |
| **混合** | skew +0.25ns（保守）+ 对最差路径 ECO 优化 | 部分修复 | hold 风险较小但仍需复查 |

### 互卡 B：出域 setup ↔ 出域 hold

> **机理**：skew 使 launch 沿延迟 → 数据晚出发 → setup 恶化但 hold 改善。
> 全设计最差 hold（-0.690）与出域最薄 setup（+0.259）在同方向上互卡。

#### PT 报告显示的路径（setup 侧，极薄余量）

```

             launch: RX_CLK'@1.905  capture: RX_CLK@3.810
             data arrival: 6.123  data required: 6.382
             slack (MET) = +0.259  ← 最差！skew 上限锁死因素

Startpoint: .../STB_DLY_reg_15_ → Endpoint: .../latch(CLK_SCHOP)   slack = +0.345
Startpoint: .../STB_DLY_reg_15_ → Endpoint: .../latch(PWRC_TIME)   slack = +0.369
Startpoint: .../STB_DLY_reg_15_ → Endpoint: .../HSR_W_cnt_reg_1_   slack = +0.451
Startpoint: .../STB_DLY_reg_15_ → Endpoint: .../HSR_W_cnt_reg_0_   slack = +0.457
Startpoint: .../STB_DLY_reg_15_ → Endpoint: .../PWRC_TIME_CNT_reg  slack = +0.457

Startpoint: u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/STB_FAKE_DLY_reg_7_
             (rising edge-triggered flip-flop clocked by RX_CLK')
Endpoint:    u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/HSR_FAKE_reg
             (rising edge-triggered flip-flop clocked by RX_CLK)
             slack (MET) = +0.479
```

#### PT 报告显示的路径（hold 侧，全设计最差）

```
Startpoint: u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/STB_DLY_reg_3_
             (rising edge-triggered flip-flop clocked by RX_CLK')
Endpoint:    u_LOGIC_CENTER/CENTER1/DTCTL/LENB1_DLY_reg_0_
             (rising edge-triggered flip-flop clocked by DCLK_DATA_MUX_SHORT)
             launch: RX_CLK'@5.715  capture: DCLK_DATA_MUX_SHORT@5.715
             slack (VIOLATED) = -0.690
```

#### 互卡推演

```
同一个 skew 动作（launch 延迟）：

对 setup 路径 STB_DLY_15 → HSR_W_cnt：
  launch 晚 → 数据晚到 → 窗口小 → 恶化
  +0.675 skew → +0.259 - 0.675 = -0.416 → 从 MET 变 VIOLATED！

对 hold 路径 STB_DLY_3 → LENB1_DLY：
  launch 晚 → 数据晚到 → 不太早 → 改善
  +0.675 skew → -0.690 + 0.675 = -0.015 → 几乎修复

帮了 hold 就伤了 setup（互卡！）
```

#### 解决方案

| 方案 | 操作 | 效果 | 风险 |
|------|------|------|------|
| **分别 skew（推荐）** | ccopt_net__3 只加 +0.25ns（不多加）| setup 保住（+0.009）；hold 改善至 -0.44 | -0.44 仍未修完 |
| **hold 单独 delay** | 在 STB_DLY_3 → LENB1_DLY 数据路径插 delay buffer | hold 独立修复，不影响 setup | 需精确控制 delay 量 |
| **两步走** | skew +0.25 → hold 改善到 -0.44 → 再插 0.44ns delay | setup 安全 + hold 修复 | 需验证 delay 不影响其他路径 |

### 互卡 C：入域 setup ↔ 出域 setup（最强互卡）

> **这是最致命的互卡**——两边都是 setup，且对 skew 需求完全相反。
> 但 HK1V11 有一个幸运发现：入口和出口在不同时钟网！

#### PT 报告显示的路径对

**入口路径（需要 net__2 skew ↑）**：
```
Startpoint: u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/PSR_LINE_CNT_reg
             (rising edge-triggered flip-flop clocked by RX_CLK)
Endpoint:    u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/STB_DLY_reg_0_
             (rising edge-triggered flip-flop clocked by RX_CLK')
             slack (VIOLATED) = -0.675
             网表: AND2DFFRBQX4AL9 STB_DLY_reg_0_ (.CK(ccopt_net__2))
```

**出口路径（需要 net__3 skew ↓）**：
```
Startpoint: u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/STB_DLY_reg_15_
             (rising edge-triggered flip-flop clocked by RX_CLK')
Endpoint:    u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/HSR_W_cnt_reg_5_
             (rising edge-triggered flip-flop clocked by RX_CLK)
             slack (MET) = +0.259  ← 不能再少！
             网表: DFFRBQX1AL9 STB_DLY_reg_15_ (.CK(ccopt_net__3))
```

#### 网表证据

```
// 入口 FF —— 在 ccopt_net__2
AND2DFFRBQX4AL9 STB_DLY_reg_0_ (
    .CK(ccopt_net__2),     ← 可多加 skew
    .D1(STB_EN),
    .D2(STB_P_neg) );

// 出口 FF —— 在 ccopt_net__3（不同网！）
DFFRBQX1AL9 STB_DLY_reg_15_ (
    .CK(ccopt_net__3),     ← 只能少加 skew
    .D(STB_DLY[14]) );
```

#### 互卡可视化

```
入口（需要 net__2 skew ↑）:          出口（需要 net__3 skew ↓）:
  PSR_LINE_CNT                        STB_DLY_reg_15
  [RX_CLK]                           [RX_CLK', ccopt_net__3]
      |                                  |
      | 数据 4.04ns（太慢）              | mux + 逻辑
      v                                  v
  STB_DLY_reg_0                       HSR_W_cnt_reg_5
  [RX_CLK', ccopt_net__2]           [RX_CLK]
      |                                  |
  capture 要晚到                      launch 不能晚
```

#### 解决方案

| 方案 | net__2 skew | net__3 skew | 入口效果 | 出口效果 |
|------|------------|------------|----------|----------|
| 统一 +0.675 | +0.675 | +0.675 | -0.675+0.675=0 ✅ | +0.259-0.675=-0.416 ❌ |
| **分别 skew** | **+0.48** | **+0.25** | -0.675+0.48=-0.195 ⚠️ | +0.259-0.25=+0.009 ✅ |
| 统一 +0.25 | +0.25 | +0.25 | -0.675+0.25=-0.425 ❌ | +0.009 ✅ |

**推荐**：分别 skew（net__2=+0.48 / net__3=+0.25），出口安全但入口仍有 -0.195ns 残留，需后续 RTL 打拍。

**额外风险**：STB_DLY 链中间从 net__2 到 net__3 的过渡级，skew 差 = 0.48-0.25 = 0.23ns 窗口缩小，需确认域内 setup 余量 > 0.23ns。

### 互卡 D：ECO 缩短 vs hold

> 修 setup 需缩短路径 → 缩太多可能触发 hold。

#### PT 报告显示的路径

```
Startpoint: u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/PSR_LINE_CNT_reg
             (rising edge-triggered flip-flop clocked by RX_CLK)
Endpoint:    u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/STB_DLY_reg_0_
             (rising edge-triggered flip-flop clocked by RX_CLK')
             data arrival: 4.038  data required: 3.364
             slack (VIOLATED) = -0.675
```

#### 量化分析

```
当前 data_delay = 4.04ns（太慢，setup 违例）
hold 阈值 ≈ launch_clk_delay + hold_time ≈ 1.0ns（数据不能太早）

修 setup：需缩短 4.04 → 1.90ns（缩短 2.14ns）
修完后：data_delay = 1.90ns，hold 阈值 = 1.0ns
余量 = 1.90 - 1.00 = 0.90ns → hold 仍然安全 ✓

结论：此路径修 setup 不会触发 hold（差距大，安全）
```

#### 解决方案

| 方案 | 操作 | 效果 |
|------|------|------|
| ECO upsize | 对 PSR_LINE_CNT → STB_EN → D1 路径上的 cell 换大驱动 | 缩短数据路径，但 2.14ns 幅度太大，ECO 难以达成 |
| RTL 打拍 | 插一级 posedge DCLK FF | 根本消除（半周期窗口不再适用于长路径）|
| 综合 | 下一轮 DC 综合时对此路径加权重 | 长期方案 |

### 互卡 E：ECO 加长 vs setup

> 修 hold 需加长路径 → 加太多可能触发 setup。

#### PT 报告显示的路径

```
Startpoint: u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/STB_DLY_reg_3_
             (rising edge-triggered flip-flop clocked by RX_CLK')
Endpoint:    u_LOGIC_CENTER/LINK_LOGIC/LINK_PANEL_CTRL/CHPI_SD_CTRL/STB_DLY_reg_4_
             (rising edge-triggered flip-flop clocked by RX_CLK')
             slack (VIOLATED) = -0.160
```

同类型的域内 hold 违例还有 2 条：

```
Startpoint: .../STB_DLY_reg_7_  → Endpoint: .../STB_DLY_reg_8_   slack = -0.182
Startpoint: .../STB_FAKE_DLY_reg_3_ → Endpoint: .../STB_FAKE_DLY_reg_4_  slack = -0.159
```

#### 量化分析

```
hold slack = -0.160ns（数据跑太快，需加 delay 0.16ns）
setup 余量 = 未知（域内全周期 3.81ns，当前 MET）

加 0.16ns delay 后：
  hold: -0.160 + 0.16 = 0 → 修复 ✓
  setup: 原余量 - 0.16ns → 需原余量 > 0.16ns

域内全周期 = 3.81ns，数据路径（reg→reg 直连）≈ 0.1ns
setup 余量 ≈ 3.81 - 0.1 - setup_time ≈ 3.6ns >> 0.16ns
→ 非常安全 ✓
```

#### 解决方案

| 方案 | 操作 | 效果 | 风险 |
|------|------|------|------|
| **hold-fix buffer（标准做法）** | 在 STB_DLY_3 → STB_DLY_4 数据路径插 delay buffer | hold 修复 | setup 余量 3.6ns，极安全 |
| 同上 × 3 | 对 3 条域内 hold 各插 buffer | 全部修复 | 同上 |

> **注意**：域内 hold 不受 skew 影响（两端同时偏移），所以 hold-fix buffer 与 skew 方案互不干扰，可以独立执行。

// 入口 FF（setup 违例的 capture 端）

## 5. 分析方法论：RTL → 网表 → PT

### 5.1 三级追踪法

| 步骤 | 做什么 | 产出 |
|------|--------|------|
| ① RTL | 找 `posedge` 与 `posedge *_INV` 配对，确认信号链 | 源寄存器→影子→延时链→输出 |
| ② 网表 | 找每个 FF 的 `.CK()` 连接，确认时钟网分布 | 时钟网→FF 映射表 |
| ③ PT | 提取 setup + hold 违例的 startpoint→endpoint | 违例路径清单 |
| ④ 交叉 | 匹配 RTL 信号名与 PT 路径名 | 完整因果链 |
| ⑤ 推演 | 对每个 skew 值推演六个方向的变化 | 互卡矩阵 |

### 5.2 从 PT 报告提取半周期路径

关键：识别 launch 和 capture 钟名互补（`RX_CLK` vs `RX_CLK'`）。

```python
if base_l == base_c and lc != cc:  # 同名不同相
    category = 'half_cycle'         # 半周期路径
```

### 5.3 判定互卡的充要条件

两条路径互卡 ⟺ 存在一个调节手段 D，使得：
- 路径 1 的 slack(D) 单调递增（D 帮它）
- 路径 2 的 slack(D) 单调递减（D 伤它）

## 6. 解决策略

### 6.1 分别 skew（利用不同时钟网）

| 时钟网 | 建议 skew | 锁定因素 |
|--------|----------|----------|
| ccopt_net__2 | +0.48ns | STB_FAKE_DLY 出口余量 0.479 |
| ccopt_net__3 | +0.25ns | STB_DLY_15 出口余量 0.259 |
| ccopt_net__59 | +0.05ns | 仅需修 -0.045 |

**效果**：4/10 条 setup 修复，但 3 条大违例仍在。

### 6.2 RTL 打拍（治本）

```verilog
// 在正常钟域与影子寄存器之间插一级 posedge DCLK FF
reg STB_P_pipe;
always @(posedge DCLK)
    STB_P_pipe <= STB_P;      // 全周期，无压力

always @(posedge DCLK_INV)
    STB_P_neg <= STB_P_pipe;  // 半周期，但 reg→reg 直连！
```

**原理**：半周期约束从"4ns 长路径"变为"0.1ns 直连"——互卡根源消除。

### 6.3 hold-fix buffer（独立修复）

域内 hold 违例不涉及互卡（skew 不影响域内），用标准 hold-fix buffer 即可。

## 7. 互卡矩阵速查

| 互卡 | 方向 | 类型 | 当前状态 | skew 敏感 | 解决 |
|------|------|------|----------|-----------|------|
| A | 入域 | setup↔hold | setup 违 + hold 未知 | 反向 | RTL 打拍 |
| B | 出域 | setup↔hold | setup 薄 + hold 违 | 反向 | 分别 skew |
| C | 入↔出 | setup↔setup | 入违 + 出薄 | 反向 | 不同网 skew |
| D | ECO | 缩短→hold | 低风险 | — | 距离大，安全 |
| E | ECO | 加长→setup | 中风险 | — | 确认余量 |
