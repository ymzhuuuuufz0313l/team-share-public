<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<style>text{font-family:"Microsoft YaHei","Noto Sans SC",monospace;fill:#1c2534}.mono{font-family:Consolas,"Microsoft YaHei",monospace}</style>
<defs><marker id="mB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs>
<rect width="1440" height="900" fill="#f4f1ea"/>
<text x="14" y="34" font-size="11" fill="#b45309" class="mono">HK1V11 · SIGNOFF · CLOCK SHIFT WINDOW · 1104V2 · 10 CORNER</text>
<text x="14" y="66" font-size="22" font-weight="bold"><tspan fill="#b45309">时钟偏移容限</tspan> — 采样时钟相对数据可左移 / 右移多少</text>
<rect class="panel" x="40" y="90" width="1360" height="430" rx="2" fill="#fffdf7" stroke="#c9bfa8" stroke-width="1.5"/>
<text x="60" y="118" font-size="16.5" font-weight="bold">① 容限窗全景 — 采样时钟相位可在 [数据窗 − 左限, 数据窗 + 右限] 内偏移</text>
<line class="boundPulse" x1="477.7" y1="150" x2="477.7" y2="322" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="5,3"/>
<text x="477.7" y="358" font-size="11" fill="#b91c1c" class="mono" text-anchor="middle">-0.64606（setup 碰界）</text>
