<text x="1320" y="358" font-size="12" class="mono" fill="#5b6675" text-anchor="end">ns（0 = 名义采样沿）</text>
<rect x="626.2" y="248" width="187.5" height="44" fill="#0e7490" opacity="0.85"/>
<text x="720.0" y="275" font-size="12.5" fill="#fffdf7" text-anchor="middle">数据有效窗</text>
<line class="arrowDash" x1="720.0" y1="190" x2="330.7" y2="190" stroke="#1d4ed8" stroke-width="3" marker-end="url(#mB)"/>
<text x="513.8" y="174" font-size="13.5" fill="#1d4ed8" text-anchor="middle" font-weight="bold">← 左移容限 1.03822 ns</text>
<text x="513.8" y="214" font-size="11.5" class="mono" fill="#1d4ed8" text-anchor="middle">= port→FF setup +0.33822 +0.3+0.4</text>
<text x="513.8" y="234" font-size="11" fill="#5b6675" text-anchor="middle">lt_cworst（setup 先碰界）</text>
<line class="arrowDash" x1="720.0" y1="190" x2="901.7" y2="190" stroke="#1d4ed8" stroke-width="3" marker-end="url(#mB)"/>
<text x="1030.0" y="174" font-size="13.5" fill="#1d4ed8" text-anchor="middle" font-weight="bold">右移容限 0.48453 ns →</text>
<text x="1030.0" y="214" font-size="11.5" class="mono" fill="#1d4ed8" text-anchor="middle">= port→FF hold +0.03453 +0.3+0.15</text>
<text x="1030.0" y="234" font-size="11" fill="#5b6675" text-anchor="middle">lt_cbest（hold 先碰界）</text>
<rect class="formulaGlow" x="60" y="372" width="1320" height="120" rx="2" fill="#f4f1ea" stroke="#c9bfa8" stroke-width="1.2"/>
<text x="80" y="398" font-size="13.5" font-weight="bold" fill="#b45309">换算公式（把 set_input_delay 与 uncertainty 的预算还原成 2M23 裸口径）</text>
<text x="80" y="424" font-size="13" class="mono">左移容限 = port→FF setup slack + 0.3（max input delay） + 0.4（setup uncertainty）</text>
<text x="80" y="448" font-size="13" class="mono">右移容限 = port→FF hold slack + 0.3（min input delay −0.3 还原） + 0.15（hold uncertainty）</text>
<text x="80" y="472" font-size="11.5" fill="#5b6675">注：1118V1 代际 port→FF setup = phy csv rx0_00_max 行、port→FF hold = rx0_00_min 行（input port 即头名）；数值全部由 csv 直算，无手录。</text>
<rect class="panel" x="40" y="540" width="1360" height="330" rx="2" fill="#fffdf7" stroke="#c9bfa8" stroke-width="1.5"/>
