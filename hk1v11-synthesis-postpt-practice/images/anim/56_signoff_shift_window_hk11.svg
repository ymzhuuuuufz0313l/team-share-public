<rect x="60" y="404" width="1320" height="130" rx="2" fill="#f4f1ea" stroke="#c9bfa8" stroke-width="1.2"/>
<text x="80" y="432" font-size="13.5" font-weight="bold" fill="#b45309">换算公式（把 set_input_delay 与 uncertainty 的预算还原成 2M23 裸口径）</text>
<text x="80" y="458" font-size="13" class="mono">左移容限 = port→FF setup slack + 0.3（max input delay） + 0.4（setup uncertainty）</text>
<text x="80" y="482" font-size="13" class="mono">右移容限 = port→FF hold slack + 0.3（min input delay −0.3 还原） + 0.15（hold uncertainty）</text>
<text x="80" y="506" font-size="11.5" fill="#5b6675">注：port→FF setup 取自 rx0_00_max.rpt 内 dout_lane 块（FF→FF 只是抢了头名）；port→FF hold 即 phy 表 rx0_00_min 行</text>
<rect x="40" y="540" width="1360" height="330" rx="2" fill="#fffdf7" stroke="#c9bfa8" stroke-width="1.5"/>
<text x="60" y="568" font-size="16.5" font-weight="bold">② 逐角容限（10 corner，蓝=左移/setup 侧、青=右移/hold 侧，红虚线=全角最小）</text>
