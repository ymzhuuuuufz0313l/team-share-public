<svg xmlns="http://www.w3.org/2000/svg" width="2743" height="1009" viewBox="0 0 2743 1009" role="img" aria-label="DC 三代面积演进">
  <style>
    .mono{font-family:ui-monospace,Consolas,monospace;}
    .cjk{font-family:'Microsoft YaHei',sans-serif;}
    
    
    
    
    
    .hdr{transform-origin:center;animation:breathe 2.4s ease-in-out infinite}
    
    .tl{animation:tl 6s linear infinite}
    
    
    
    .rg1{animation:rg1 5.6s linear infinite}
    .rg2{animation:rg2 5.6s linear infinite}
    .rg3{animation:rg3 5.6s linear infinite}
    
    .pl1{animation:pl 3.2s ease-in-out infinite}
    .pl2{animation:pl 3.2s ease-in-out 1.6s infinite}
    
    .cB{animation:cellB 3s ease-in-out infinite}
    .cBx{animation:pl 3.2s ease-in-out 1.6s infinite,cellB 3s ease-in-out .3s infinite}
    
    .diag{animation:diag 7s linear infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
<style>
.row{opacity:0;animation:rowIn .55s cubic-bezier(.22,.7,.3,1) forwards}
.head{opacity:0;animation:rowIn .55s cubic-bezier(.22,.7,.3,1) forwards}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:100;animation:drawIn .6s cubic-bezier(.4,0,.2,1) forwards}
@keyframes drawIn{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fadeIn .6s ease forwards}
@keyframes fadeIn{to{opacity:1}}
.flowdot{fill:none;stroke-linecap:round;stroke-dasharray:9 91;stroke-width:3.5;animation:flow 2.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-100}}
.flowtail{fill:none;stroke-linecap:round;stroke-dasharray:4 96;stroke-width:8;opacity:.25;animation:flow 2.6s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;filter:drop-shadow(0 0 0 rgba(180,83,9,0))}50%{opacity:.8;filter:drop-shadow(0 0 10px rgba(180,83,9,.75))}}
.pulse-t{transform-box:fill-box;transform-origin:center;animation:pulseT 2.8s ease-in-out infinite}
@keyframes pulseT{0%,100%{opacity:1;filter:drop-shadow(0 0 0 rgba(14,116,144,0))}50%{opacity:.8;filter:drop-shadow(0 0 10px rgba(14,116,144,.75))}}
.pulse-b{transform-box:fill-box;transform-origin:center;animation:pulseB 2.8s ease-in-out infinite}
@keyframes pulseB{0%,100%{opacity:1;filter:drop-shadow(0 0 0 rgba(29,78,216,0))}50%{opacity:.8;filter:drop-shadow(0 0 10px rgba(29,78,216,.75))}}
.sweepband{opacity:.85;animation:sweepMove 8s linear infinite}
@keyframes sweepMove{to{transform:translateX(var(--sweepP,160px))}}
.dashgrow{stroke-dasharray:7 5;animation:dashgrow 2.6s linear infinite}
@keyframes dashgrow{from{stroke-dashoffset:72}to{stroke-dashoffset:0}}
.march{animation:march 1.5s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
.cellwave{animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,100%{opacity:1}50%{opacity:.72}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:1}50%{opacity:.55}}
.step{animation:stepLit 6s ease-in-out infinite}
@keyframes stepLit{0%,16%{filter:drop-shadow(0 0 9px rgba(29,78,216,.85))}24%,92%{filter:drop-shadow(0 0 0 rgba(29,78,216,0))}100%{filter:drop-shadow(0 0 9px rgba(29,78,216,.85))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.row,.head,.fade{opacity:1!important}.flowdot,.flowtail,.sweepband{display:none!important}}
</style>
  <defs>
    <pattern id="diagF" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="2" height="28" fill="#0e7490"/>
    </pattern>
    <clipPath id="clipD1"><rect x="0" y="488" width="2743" height="130"/></clipPath>
<linearGradient id="sweepG-1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="2983" y2="0"><stop offset="0" stop-color="#b45309" stop-opacity="0"/><stop offset="0.46" stop-color="#b45309" stop-opacity="0"/><stop offset="0.5" stop-color="#b45309" stop-opacity="0.3"/><stop offset="0.54" stop-color="#b45309" stop-opacity="0"/><stop offset="1" stop-color="#b45309" stop-opacity="0"/></linearGradient>
<clipPath id="sweepC-1"><rect x="0" y="488" width="2743" height="130"/></clipPath>
  </defs>
  <rect x="0" y="0" width="2743" height="1009" fill="#fffdf7"/>
<g class="hdr head" style="animation-delay:0s">
    <rect x="0" y="0" width="2743" height="118" fill="#0e7490"/>
    <text x="40" y="59" dy="0.35em" font-size="52" font-weight="bold" fill="#fffdf7" class="mono">DC 三代面积演进</text>
    <line x1="0" y1="118" x2="2743" y2="118" stroke="#fffdf7" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="0" y="118" width="2743" height="110" fill="#0e7490"/>
    <text x="24" y="173" dy="0.35em" font-size="42" fill="#fffdf7" class="cjk">日期</text>
    <text x="344" y="173" dy="0.35em" font-size="42" fill="#fffdf7" class="mono">面积 (um2)</text>
    <text x="644" y="173" dy="0.35em" font-size="42" fill="#fffdf7" class="cjk">代际增量</text>
    <text x="1054" y="173" dy="0.35em" font-size="42" fill="#fffdf7" class="mono">结构（FF / comb / ports）</text>
    <text x="2719" y="173" dy="0.35em" font-size="42" fill="#fffdf7" text-anchor="end" class="cjk">定位</text>
    <rect class="underline" x="0" y="228" width="2743" height="4" fill="#b45309"/>
</g>
<g class="r1 row" style="animation-delay:0.2s">
<g class="cellwave" style="animation-duration:3.6s;animation-delay:0s">
    <rect class="rg1" x="0" y="228" width="2743" height="130" fill="#0e7490" opacity="0"/>
    <text x="24" y="293" dy="0.35em" font-size="42" font-weight="bold" fill="#1c2534" class="mono">2026-09-01</text>
    <text x="344" y="293" dy="0.35em" font-size="42" font-weight="bold" fill="#0e7490" class="mono">283496</text>
    <text x="644" y="293" dy="0.35em" font-size="42" fill="#1c2534" class="mono">—</text>
    <text x="1054" y="293" dy="0.35em" font-size="42" fill="#1c2534" class="mono">FF 2434 / comb 11344 / ports 6086</text>
    <text x="2719" y="293" dy="0.35em" font-size="42" fill="#1c2534" text-anchor="end" class="cjk">约束收窄前</text>
</g>
</g>
<g class="r2 row" style="animation-delay:0.5s">
<g class="cellwave" style="animation-duration:3.6s;animation-delay:-1.2s">
    <rect x="0" y="358" width="2743" height="130" fill="#f4f1ea"/>
    <rect class="rg2" x="0" y="358" width="2743" height="130" fill="#0e7490" opacity="0"/>
    <text x="24" y="423" dy="0.35em" font-size="42" font-weight="bold" fill="#1c2534" class="mono">2026-09-22</text>
    <text x="344" y="423" dy="0.35em" font-size="42" font-weight="bold" fill="#0e7490" class="mono">294907</text>
    <g class="pl1 pulse" style="animation-delay:-0.7s"><text x="644" y="423" dy="0.35em" font-size="42" font-weight="bold" fill="#b91c1c" class="mono pop p2">+4.0% (+11410)</text></g>
    <text x="1054" y="423" dy="0.35em" font-size="42" fill="#1c2534" class="mono">FF 2526 / comb 12096 / ports 6105</text>
    <text x="2719" y="423" dy="0.35em" font-size="42" fill="#1c2534" text-anchor="end" class="cjk">完成约束收窄</text>
</g>
</g>
<g class="r3 row" style="animation-delay:0.8s">
<g class="cellwave" style="animation-duration:3.6s;animation-delay:-2.4s">
    <rect x="0" y="488" width="2743" height="130" fill="#fffdf7"/>
    <rect class="rg3" x="0" y="488" width="2743" height="130" fill="#0e7490" opacity="0"/>
    <g clip-path="url(#clipD1)"><g class="diag"><rect x="-40" y="450" width="2830" height="180" fill="url(#diagF)" opacity="0.05"/></g></g>
    <rect class="br" x="0" y="488" width="6" height="130" fill="#0e7490"/>
<g clip-path="url(#sweepC-1)"><rect class="sweepband" x="0" y="488" width="2983" height="130" fill="url(#sweepG-1)" style="--sweepP:2983px"/></g>
    <text x="24" y="553" dy="0.35em" font-size="42" font-weight="bold" fill="#1c2534" class="mono cB">2026-10-02</text>
    <text x="344" y="553" dy="0.35em" font-size="42" font-weight="bold" fill="#0e7490" class="mono cB">314707</text>
    <g class="pl2 pulse" style="animation-delay:-2.1s"><text x="644" y="553" dy="0.35em" font-size="42" font-weight="bold" fill="#b91c1c" class="mono pop p3 cBx">+6.7% (+19800)</text></g>
    <text x="1054" y="553" dy="0.35em" font-size="42" fill="#1c2534" class="mono cB">FF 2839 / comb 11773 / ports 6772</text>
    <text x="2719" y="553" dy="0.35em" font-size="42" fill="#1c2534" text-anchor="end" class="cjk cB">关键路径优化 + 约束审核后重新添加</text>
</g>
</g>
<g class="fade" style="animation-delay:0.05s">
  <g stroke="#ddd6c8" stroke-width="2">
    <line x1="320" y1="118" x2="320" y2="618"/>
    <line x1="620" y1="118" x2="620" y2="618"/>
    <line x1="1030" y1="118" x2="1030" y2="618"/>
    <line x1="1930" y1="118" x2="1930" y2="618"/>
    <line x1="0" y1="228" x2="2743" y2="228"/>
    <line x1="0" y1="358" x2="2743" y2="358"/>
    <line x1="0" y1="488" x2="2743" y2="488"/>
    <line x1="0" y1="618" x2="2743" y2="618"/>
  </g>
</g>
  <rect class="tl" x="0" y="234" width="2742" height="6" fill="#0e7490" opacity="0"/>
  <g class="fn fade" style="animation-delay:1.1s" fill="#5b6675" font-size="32">
    <text x="40" y="660" dy="0.35em" class="cjk">面积扩大原因（0922→10-02，+6.7% / +19800um2）：</text>
    <text x="40" y="708" dy="0.35em" class="cjk">① 新增打拍寄存器（+80bit FF）+ 模块时钟域迁移 + 新模块</text>
    <text x="40" y="756" dy="0.35em" class="cjk">② 约束语法 group_path -weight 3（时序优化权重×3，DC 优先为加权路径加强驱动/插拍换时序）</text>
    <text x="40" y="804" dy="0.35em" class="cjk">③ 门从小变大（upsizing）实例：加权域 RX→DCLK 的 RX 输入同步 FF 由 X1 换成 X4/X16 驱动（X16 档 2→46 处；同一路径 0922 max.rpt L90912 全 X1 vs 100</text>
    <text x="40" y="852" dy="0.35em" class="cjk">3 L52800 已 X4），门数不变、单门面积增大即涨面积</text>
    <text x="40" y="900" dy="0.35em" class="cjk">经与聂老师确认：此类先于 APR 的时序优化方式是被推荐的做法</text>
    <text x="40" y="948" dy="0.35em" class="cjk">数据来源：面积=.rpt L186/L203/L445；FF=L6305/L6471/L7461；comb=L19857/L20467/L20066；ports=L171/L188/L430</text>
  </g>
  <rect x="1.5" y="1.5" width="2740" height="1006" fill="none" stroke="#ddd6c8" stroke-width="3"/>
</svg>
