<svg xmlns="http://www.w3.org/2000/svg" width="3928" height="489" viewBox="0 0 3928 489" role="img" aria-label="DC 三代总览（时间 / 面积 / 时序 / 主要变化）">
  <style>
    .mono{font-family:ui-monospace,Consolas,monospace;}
    .cjk{font-family:'Microsoft YaHei',sans-serif;}
    
    
    
    
    
    .hdr{transform-origin:center;animation:breathe 2.4s ease-in-out infinite}
    
    .tl{animation:tl 6s linear infinite}
    
    
    
    .rg1{animation:rg1 5.6s linear infinite}
    .rg2{animation:rg2 5.6s linear infinite}
    .rg3{animation:rg3 5.6s linear infinite}
    
    .pl1{animation:pl 3.2s ease-in-out infinite}
    .pl2{animation:pl 3.2s ease-in-out 1.07s infinite}
    .pl3{animation:pl 3.2s ease-in-out 2.13s infinite}
    
    .cB{animation:cellB 3s ease-in-out infinite}
    .cBx{animation:pl 3.2s ease-in-out 2.13s infinite,cellB 3s ease-in-out .45s infinite}
    
    .wash{animation:wash 5.2s ease-in-out infinite}
    
    .diag{animation:diag 7s linear infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
<style>
.row{opacity:0;animation:rowIn .55s cubic-bezier(.22,.7,.3,1) forwards}
.head{opacity:0;animation:rowIn .55s cubic-bezier(.22,.7,.3,1) forwards}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:100;animation:drawIn .6s cubic-bezier(.4,0,.2,1) forwards}
@keyframes drawIn{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fadeIn .6s ease forwards}
@keyframes fadeIn{to{opacity:1}}
.flowdot{fill:none;stroke-linecap:round;stroke-dasharray:9 91;stroke-width:3.5;animation:flow 1.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-100}}
.flowtail{fill:none;stroke-linecap:round;stroke-dasharray:4 96;stroke-width:8;opacity:.25;animation:flow 1.5s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(180,83,9,0))}50%{transform:scale(1.03);filter:drop-shadow(0 0 12px rgba(180,83,9,.8))}}
.pulse-t{transform-box:fill-box;transform-origin:center;animation:pulseT 2.8s ease-in-out infinite}
@keyframes pulseT{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(14,116,144,0))}50%{transform:scale(1.03);filter:drop-shadow(0 0 12px rgba(14,116,144,.8))}}
.pulse-b{transform-box:fill-box;transform-origin:center;animation:pulseB 2.8s ease-in-out infinite}
@keyframes pulseB{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(29,78,216,0))}50%{transform:scale(1.03);filter:drop-shadow(0 0 12px rgba(29,78,216,.8))}}
.sweepband{opacity:.85;animation:sweepMove 8s linear infinite}
@keyframes sweepMove{to{transform:translateX(var(--sweepP,160px))}}
.dashgrow{stroke-dasharray:7 5;animation:dashgrow 2.6s linear infinite}
@keyframes dashgrow{from{stroke-dashoffset:72}to{stroke-dashoffset:0}}
.march{animation:march 1.5s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
.cellwave{transform-box:fill-box;transform-origin:center;animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.72;transform:scale(1.01)}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:1}50%{opacity:.55}}
.step{transform-box:fill-box;transform-origin:center;animation:stepLit 6s ease-in-out infinite}
@keyframes stepLit{0%,16%{filter:drop-shadow(0 0 9px rgba(29,78,216,.85));transform:scale(1.02)}24%,92%{filter:drop-shadow(0 0 0 rgba(29,78,216,0));transform:none}100%{filter:drop-shadow(0 0 9px rgba(29,78,216,.85));transform:scale(1.02)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.row,.head,.fade{opacity:1!important}.flowdot,.flowtail,.sweepband{display:none!important}}
</style>
  <defs>
    <pattern id="diagF2" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="2" height="28" fill="#0e7490"/>
    </pattern>
    <clipPath id="clipD2"><rect x="0" y="396" width="3928" height="93"/></clipPath>
<linearGradient id="sweepG-1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="4168" y2="0"><stop offset="0" stop-color="#b45309" stop-opacity="0"/><stop offset="0.46" stop-color="#b45309" stop-opacity="0"/><stop offset="0.5" stop-color="#b45309" stop-opacity="0.3"/><stop offset="0.54" stop-color="#b45309" stop-opacity="0"/><stop offset="1" stop-color="#b45309" stop-opacity="0"/></linearGradient>
<clipPath id="sweepC-1"><rect x="0" y="396" width="3928" height="93"/></clipPath>
  </defs>
  <rect x="0" y="0" width="3928" height="489" fill="#fffdf7"/>
<g class="hdr head" style="animation-delay:0s">
    <rect x="0" y="0" width="3928" height="110" fill="#0e7490"/>
    <text x="40" y="55" dy="0.35em" font-size="52" font-weight="bold" fill="#fffdf7" class="mono">DC 三代总览（时间 / 面积 / 时序 / 主要变化）</text>
    <line x1="0" y1="110" x2="3928" y2="110" stroke="#fffdf7" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="0" y="110" width="3928" height="100" fill="#0e7490"/>
    <text x="24" y="160" dy="0.35em" font-size="40" fill="#fffdf7" class="cjk">时间</text>
    <text x="454" y="160" dy="0.35em" font-size="40" fill="#fffdf7" class="mono">面积 (um2)</text>
    <text x="854" y="160" dy="0.35em" font-size="40" fill="#fffdf7" class="mono">结构（FF / comb）</text>
    <text x="1474" y="160" dy="0.35em" font-size="40" fill="#fffdf7" class="mono">时序（setup / WNS / hold）</text>
    <text x="3904" y="160" dy="0.35em" font-size="40" fill="#fffdf7" text-anchor="end" class="cjk">主要变化</text>
    <rect class="underline" x="0" y="210" width="3928" height="4" fill="#b45309"/>
</g>
<g class="r1 row" style="animation-delay:0.25s">
<g class="cellwave" style="animation-duration:3.6s;animation-delay:0s">
    <rect class="rg1" x="0" y="210" width="3928" height="93" fill="#0e7490" opacity="0"/>
    <text x="24" y="256" dy="0.35em" font-size="38" font-weight="bold" fill="#1c2534" class="mono">2026-09-01</text>
    <text x="454" y="256" dy="0.35em" font-size="38" font-weight="bold" fill="#0e7490" class="mono">283496</text>
    <text x="854" y="256" dy="0.35em" font-size="38" fill="#1c2534" class="mono">FF 2434 / comb 11344</text>
    <g class="pl1"><text x="1474" y="256" dy="0.35em" font-size="38" font-weight="bold" fill="#b91c1c" class="mono pop p1">434 条 / -0.33 ns / hold 87</text></g>
    <text x="3904" y="256" dy="0.35em" font-size="38" fill="#1c2534" text-anchor="end" class="cjk">约束收窄前：部分路径未被真实检查，表面违例少并非真实收敛</text>
</g>
</g>
<g class="r2 row" style="animation-delay:0.55s">
<g class="cellwave" style="animation-duration:3.6s;animation-delay:-1.2s">
    <rect x="0" y="303" width="3928" height="93" fill="#f4f1ea"/>
    <rect class="rg2" x="0" y="303" width="3928" height="93" fill="#0e7490" opacity="0"/>
    <text x="24" y="350" dy="0.35em" font-size="38" font-weight="bold" fill="#1c2534" class="mono">2026-09-22</text>
    <text x="454" y="350" dy="0.35em" font-size="38" font-weight="bold" fill="#0e7490" class="mono">294907</text>
    <text x="854" y="350" dy="0.35em" font-size="38" fill="#1c2534" class="mono">FF 2526 / comb 12096</text>
    <g class="pl2 pulse" style="animation-delay:-1.4s"><text x="1474" y="350" dy="0.35em" font-size="38" font-weight="bold" fill="#b91c1c" class="mono pop p2">452 条 / -1.45 ns / hold 30</text></g>
    <text x="3904" y="350" dy="0.35em" font-size="38" fill="#1c2534" text-anchor="end" class="cjk">完成约束收窄：暴露真实信息 + 真实待优化路径：setup 452 条、最差 −1.45ns</text>
</g>
</g>
<g class="r3 row" style="animation-delay:0.85s">
<g class="cellwave" style="animation-duration:3.6s;animation-delay:-2.4s">
    <g class="wash"><rect class="fill" x="0" y="396" width="3928" height="93" fill="#0e7490" fill-opacity="0.1"/></g>
    <rect class="rg3" x="0" y="396" width="3928" height="93" fill="#0e7490" opacity="0"/>
    <g clip-path="url(#clipD2)"><g class="diag"><rect x="-40" y="360" width="4010" height="160" fill="url(#diagF2)" opacity="0.05"/></g></g>
    <rect class="br" x="0" y="396" width="6" height="93" fill="#0e7490"/>
<g clip-path="url(#sweepC-1)"><rect class="sweepband" x="0" y="396" width="4168" height="93" fill="url(#sweepG-1)" style="--sweepP:4168px"/></g>
    <text x="24" y="442" dy="0.35em" font-size="38" font-weight="bold" fill="#1c2534" class="mono cB">2026-10-02</text>
    <text x="454" y="442" dy="0.35em" font-size="38" font-weight="bold" fill="#0e7490" class="mono cB">314707</text>
    <text x="854" y="442" dy="0.35em" font-size="38" fill="#1c2534" class="mono cB">FF 2839 / comb 11773</text>
    <g class="pl3 pulse-t" style="animation-delay:-0.7s"><text x="1474" y="442" dy="0.35em" font-size="38" font-weight="bold" fill="#047857" class="mono pop p3 cBx">11 条 / -0.01 ns / hold 21</text></g>
    <text x="3904" y="442" dy="0.35em" font-size="38" fill="#1c2534" text-anchor="end" class="cjk cB">关键路径优化 + 约束审核后重新添加：setup 452→11（−97.6%），最差 −0.01ns，面积 +6.7%</text>
</g>
</g>
<g class="fade" style="animation-delay:0.05s">
  <g stroke="#ddd6c8" stroke-width="2">
    <line x1="430" y1="110" x2="430" y2="489"/>
    <line x1="830" y1="110" x2="830" y2="489"/>
    <line x1="1450" y1="110" x2="1450" y2="489"/>
    <line x1="2100" y1="110" x2="2100" y2="489"/>
    <line x1="0" y1="210" x2="3928" y2="210"/>
    <line x1="0" y1="303" x2="3928" y2="303"/>
    <line x1="0" y1="396" x2="3928" y2="396"/>
  </g>
</g>
  <rect class="tl" x="0" y="216" width="3926" height="6" fill="#0e7490" opacity="0"/>
  <rect x="1.5" y="1.5" width="3925" height="486" fill="none" stroke="#ddd6c8" stroke-width="3"/>
</svg>
