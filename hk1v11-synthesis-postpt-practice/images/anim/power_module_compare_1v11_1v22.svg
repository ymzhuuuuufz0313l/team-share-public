<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 688" width="1200" height="688" role="img" aria-label="1V11 vs 1V22 模块功耗对比 @4.46G">
  <title>1V11 vs 1V22 模块功耗对比 @4.46G</title>
  <style>
    text{font-family:"Microsoft YaHei",sans-serif;fill:#1c2534}
    .mono{font-family:ui-monospace,Consolas,monospace}
    .hdr{transform-origin:left center;font-size:12px;fill:#5b6675;transform-origin:left center}
    
    
    
    
    
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
<style>
.row{opacity:0;animation:rowIn .55s cubic-bezier(.22,.7,.3,1) forwards}
.head{opacity:0;animation:rowIn .55s cubic-bezier(.22,.7,.3,1) forwards}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:100;animation:drawIn .6s cubic-bezier(.4,0,.2,1) forwards}
@keyframes drawIn{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fadeIn .6s ease forwards}
@keyframes fadeIn{to{opacity:1}}
.flowdot{fill:none;stroke-linecap:round;stroke-dasharray:9 91;stroke-width:3.5;animation:flow 2.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-100}}
.flowtail{fill:none;stroke-linecap:round;stroke-dasharray:4 96;stroke-width:8;opacity:.25;animation:flow 2.6s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;filter:drop-shadow(0 0 0 rgba(180,83,9,0))}50%{opacity:.8;filter:drop-shadow(0 0 10px rgba(180,83,9,.75))}}
.pulse-t{transform-box:fill-box;transform-origin:center;animation:pulseT 2.8s ease-in-out infinite}
@keyframes pulseT{0%,100%{opacity:1;filter:drop-shadow(0 0 0 rgba(14,116,144,0))}50%{opacity:.8;filter:drop-shadow(0 0 10px rgba(14,116,144,.75))}}
.pulse-b{transform-box:fill-box;transform-origin:center;animation:pulseB 2.8s ease-in-out infinite}
@keyframes pulseB{0%,100%{opacity:1;filter:drop-shadow(0 0 0 rgba(29,78,216,0))}50%{opacity:.8;filter:drop-shadow(0 0 10px rgba(29,78,216,.75))}}
.sweepband{opacity:.85;animation:sweepMove 8s linear infinite}
@keyframes sweepMove{to{transform:translateX(var(--sweepP,160px))}}
.dashgrow{stroke-dasharray:7 5;animation:dashgrow 2.6s linear infinite}
@keyframes dashgrow{from{stroke-dashoffset:72}to{stroke-dashoffset:0}}
.march{animation:march 1.5s linear infinite}
@keyframes march{to{stroke-dashoffset:-16}}
.cellwave{animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,100%{opacity:1}50%{opacity:.72}}
.breathe{animation:br 3.2s ease-in-out infinite}
@keyframes br{0%,100%{opacity:1}50%{opacity:.55}}
.step{animation:stepLit 6s ease-in-out infinite}
@keyframes stepLit{0%,16%{filter:drop-shadow(0 0 9px rgba(29,78,216,.85))}24%,92%{filter:drop-shadow(0 0 0 rgba(29,78,216,0))}100%{filter:drop-shadow(0 0 9px rgba(29,78,216,.85))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.row,.head,.fade{opacity:1!important}.flowdot,.flowtail,.sweepband{display:none!important}}
</style>
  <defs>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffdf7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fffdf7" stop-opacity="1"/>
      <stop offset="1" stop-color="#fffdf7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="688" fill="#f4f1ea"/>
  <g class="hdr fade" style="animation-delay:0.05s">
    <g stroke="#ddd6c8" stroke-width="1" stroke-dasharray="4 4" opacity="0.85">
      <line x1="389" y1="70" x2="389" y2="620"/>
      <line x1="568.1" y1="70" x2="568.1" y2="620"/>
      <line x1="747.1" y1="70" x2="747.1" y2="620"/>
      <line x1="926.2" y1="70" x2="926.2" y2="620"/>
      <line x1="1105.2" y1="70" x2="1105.2" y2="620"/>
    </g>
    <g stroke="#5b6675" stroke-width="1" opacity="0.55">
      <line x1="210" y1="70" x2="210" y2="620"/>
      <line x1="210" y1="620" x2="1150" y2="620"/>
      <line x1="210" y1="620" x2="210" y2="625"/>
      <line x1="389" y1="620" x2="389" y2="625"/>
      <line x1="568.1" y1="620" x2="568.1" y2="625"/>
      <line x1="747.1" y1="620" x2="747.1" y2="625"/>
      <line x1="926.2" y1="620" x2="926.2" y2="625"/>
      <line x1="1105.2" y1="620" x2="1105.2" y2="625"/>
    </g>
    <g class="mono" font-size="12" fill="#5b6675" text-anchor="middle">
      <text x="210" y="638">0</text>
      <text x="389" y="638">2000</text>
      <text x="568.1" y="638">4000</text>
      <text x="747.1" y="638">6000</text>
      <text x="926.2" y="638">8000</text>
      <text x="1105.2" y="638">10000</text>
    </g>
    <text class="mono" x="680" y="662" font-size="13" fill="#5b6675" text-anchor="middle">Power (µW)</text>
  </g>

  <!-- 模块名（双行，逐字转录自 mods） -->
  <g class="hdr" font-size="13" text-anchor="end" fill="#1c2534">
<g class="cellwave" style="animation-delay:0s">
    <text data-label="1" data-g="0" x="200" y="91">短编码解码<tspan x="200" y="107" font-size="11" class="mono">SHORT_ENCODING↔CSPIF</tspan></text>
</g>
    <text data-label="1" data-g="1" x="200" y="141">显示时序<tspan x="200" y="157" font-size="11" class="mono">DTCTL↔TOTAL_DTCTL</tspan></text>
    <text data-label="1" data-g="2" x="200" y="191">面板SD时序<tspan x="200" y="207" font-size="11" class="mono">PANEL_CTRL(融合)</tspan></text>
    <text data-label="1" data-g="3" x="200" y="241">输入同步<tspan x="200" y="257" font-size="11" class="mono">BUFFER_I→rx_phy</tspan></text>
    <text data-label="1" data-g="4" x="200" y="291">长编码<tspan x="200" y="307" font-size="11" class="mono">LONG_ENCODING</tspan></text>
    <text data-label="1" data-g="5" x="200" y="341">寄存器配置<tspan x="200" y="357" font-size="11" class="mono">CONFIG↔CPUWR</tspan></text>
    <text data-label="1" data-g="6" x="200" y="399" font-size="12" class="mono">ANCTL</text>
    <text data-label="1" data-g="7" x="200" y="441">时钟生成<tspan x="200" y="457" font-size="11" class="mono">CLKGEN↔CLKGEN_U0</tspan></text>
    <text data-label="1" data-g="8" x="200" y="499">其他小模块</text>
<g class="cellwave" style="animation-delay:0.6s">
    <text data-label="1" data-g="9" x="200" y="541">rx_phy(EQ/LEQ)<tspan x="200" y="557" font-size="11">1V22独有</tspan></text>
</g>
<g class="cellwave" style="animation-delay:1.2s">
    <text data-label="1" data-g="10" x="200" y="591">MON_DISP<tspan x="200" y="607" font-size="11">1V22独有</tspan></text>
</g>
  </g>

  <!-- 双条：组 i 延时 .30s+.06s*i，自基线（左端）生长 -->
  <g>
<g class="row" style="animation-delay:0.3s">
    <!-- g0 短编码解码 10294 / 8590 -->
<g class="pulse-t" style="animation-delay:-0.9s">
<g class="cellwave" style="animation-duration:4s;animation-delay:0s">
    <rect class="bar" data-g="0" data-s="11" x="210" y="77" width="921.6" height="16" fill="#0e7490"/>
    <rect class="bar" data-g="0" data-s="22" x="210" y="97" width="769" height="16" fill="#b45309"/>
</g>
    <text class="val peak" data-g="0" data-s="11" x="1139.6" y="85" dominant-baseline="central">10294</text>
    <text class="val" data-g="0" data-s="22" x="987" y="105" dominant-baseline="central">8590</text>
</g>
</g>
<g class="row" style="animation-delay:0.4s">
    <!-- g1 显示时序 4717 / 3294 -->
<g class="cellwave" style="animation-duration:4s;animation-delay:-0.15s">
    <rect class="bar" data-g="1" data-s="11" x="210" y="127" width="422.3" height="16" fill="#0e7490"/>
    <rect class="bar" data-g="1" data-s="22" x="210" y="147" width="294.9" height="16" fill="#b45309"/>
</g>
    <text class="val" data-g="1" data-s="11" x="640.3" y="135" dominant-baseline="central">4717</text>
    <text class="val" data-g="1" data-s="22" x="512.9" y="155" dominant-baseline="central">3294</text>
</g>
<g class="row" style="animation-delay:0.5s">
    <!-- g2 面板SD时序 3019 / 0 -->
<g class="cellwave" style="animation-duration:4s;animation-delay:-0.3s">
    <rect class="bar" data-g="2" data-s="11" x="210" y="177" width="270.3" height="16" fill="#0e7490"/>
</g>
    <text class="val" data-g="2" data-s="11" x="488.3" y="185" dominant-baseline="central">3019</text>
    <text class="val" data-g="2" data-s="22" x="218" y="205" dominant-baseline="central">0</text>
</g>
<g class="row" style="animation-delay:0.6s">
    <!-- g3 输入同步 2511 / 0 -->
<g class="cellwave" style="animation-duration:4s;animation-delay:-0.45s">
    <rect class="bar" data-g="3" data-s="11" x="210" y="227" width="224.8" height="16" fill="#0e7490"/>
</g>
    <text class="val" data-g="3" data-s="11" x="442.8" y="235" dominant-baseline="central">2511</text>
    <text class="val" data-g="3" data-s="22" x="218" y="255" dominant-baseline="central">0</text>
</g>
<g class="row" style="animation-delay:0.7s">
    <!-- g4 长编码 853 / 0 -->
<g class="cellwave" style="animation-duration:4s;animation-delay:-0.6s">
    <rect class="bar" data-g="4" data-s="11" x="210" y="277" width="76.4" height="16" fill="#0e7490"/>
</g>
    <text class="val" data-g="4" data-s="11" x="294.4" y="285" dominant-baseline="central">853</text>
    <text class="val" data-g="4" data-s="22" x="218" y="305" dominant-baseline="central">0</text>
</g>
<g class="row" style="animation-delay:0.8s">
    <!-- g5 寄存器配置 1525 / 727 -->
<g class="cellwave" style="animation-duration:4s;animation-delay:-0.75s">
    <rect class="bar" data-g="5" data-s="11" x="210" y="327" width="136.5" height="16" fill="#0e7490"/>
    <rect class="bar" data-g="5" data-s="22" x="210" y="347" width="65.1" height="16" fill="#b45309"/>
</g>
    <text class="val" data-g="5" data-s="11" x="354.5" y="335" dominant-baseline="central">1525</text>
    <text class="val" data-g="5" data-s="22" x="283.1" y="355" dominant-baseline="central">727</text>
</g>
<g class="row" style="animation-delay:0.9s">
    <!-- g6 ANCTL 782 / 218 -->
<g class="cellwave" style="animation-duration:4s;animation-delay:-0.9s">
    <rect class="bar" data-g="6" data-s="11" x="210" y="377" width="70" height="16" fill="#0e7490"/>
    <rect class="bar" data-g="6" data-s="22" x="210" y="397" width="19.5" height="16" fill="#b45309"/>
</g>
    <text class="val" data-g="6" data-s="11" x="288" y="385" dominant-baseline="central">782</text>
    <text class="val" data-g="6" data-s="22" x="237.5" y="405" dominant-baseline="central">218</text>
</g>
<g class="row" style="animation-delay:1.0s">
    <!-- g7 时钟生成 528 / 8 -->
<g class="cellwave" style="animation-duration:4s;animation-delay:-1.05s">
    <rect class="bar" data-g="7" data-s="11" x="210" y="427" width="47.3" height="16" fill="#0e7490"/>
    <rect class="bar" data-g="7" data-s="22" x="210" y="447" width="0.7" height="16" fill="#b45309"/>
</g>
    <text class="val" data-g="7" data-s="11" x="265.3" y="435" dominant-baseline="central">528</text>
    <text class="val" data-g="7" data-s="22" x="218.7" y="455" dominant-baseline="central">8</text>
</g>
<g class="row" style="animation-delay:1.1s">
    <!-- g8 其他小模块 416 / 447 -->
<g class="cellwave" style="animation-duration:4s;animation-delay:-1.2s">
    <rect class="bar" data-g="8" data-s="11" x="210" y="477" width="37.2" height="16" fill="#0e7490"/>
    <rect class="bar" data-g="8" data-s="22" x="210" y="497" width="40" height="16" fill="#b45309"/>
</g>
    <text class="val" data-g="8" data-s="11" x="255.2" y="485" dominant-baseline="central">416</text>
    <text class="val" data-g="8" data-s="22" x="258" y="505" dominant-baseline="central">447</text>
</g>
<g class="row" style="animation-delay:1.2s">
    <!-- g9 rx_phy(EQ/LEQ) 0 / 4196 -->
<g class="pulse" style="animation-delay:-2.3s">
<g class="cellwave" style="animation-duration:4s;animation-delay:-1.35s">
    <rect class="bar" data-g="9" data-s="22" x="210" y="547" width="375.6" height="16" fill="#b45309"/>
</g>
    <text class="val" data-g="9" data-s="11" x="218" y="535" dominant-baseline="central">0</text>
    <text class="val" data-g="9" data-s="22" x="593.6" y="555" dominant-baseline="central">4196</text>
</g>
</g>
<g class="row" style="animation-delay:1.3s">
    <!-- g10 MON_DISP 0 / 588 -->
<g class="cellwave" style="animation-duration:4s;animation-delay:-1.5s">
    <rect class="bar" data-g="10" data-s="22" x="210" y="597" width="52.6" height="16" fill="#b45309"/>
</g>
    <text class="val" data-g="10" data-s="11" x="218" y="585" dominant-baseline="central">0</text>
    <text class="val" data-g="10" data-s="22" x="270.6" y="605" dominant-baseline="central">588</text>
</g>
  </g>

  <!-- 持续柔光脉冲 -->
  <rect class="glow fade" style="animation-delay:1.5s" x="205" y="72" width="931.6" height="26" rx="8" fill="#0e7490" filter="url(#softGlow)"/>
  <rect class="glow glow2 fade" style="animation-delay:1.55s" x="205" y="542" width="385.6" height="26" rx="8" fill="#b45309" filter="url(#softGlow)"/>

  <!-- 图例 -->
<g class="hdr head" style="animation-delay:1.65s">
    <rect x="872" y="552" width="316" height="56" rx="6" fill="#fffdf7" stroke="#ddd6c8" stroke-width="1"/>
    <rect x="888" y="564" width="18" height="12" fill="#0e7490"/>
    <text class="mono" x="914" y="574" font-size="12" fill="#1c2534">1V11 @4.46G (25.65 mW)</text>
    <rect x="888" y="586" width="18" height="12" fill="#b45309"/>
    <text class="mono" x="914" y="596" font-size="12" fill="#1c2534">1V22 @4.46G (18.97 mW)</text>
</g>

  <!-- 标题 -->
  <text class="hdr head" style="animation-delay:0s" x="600" y="38" font-size="20" font-weight="bold" text-anchor="middle" fill="#1c2534">1V11 vs 1V22 模块功耗对比 @4.46G</text>

  <!-- 基线扫光 -->
  <rect class="sweep fade" style="animation-delay:1.7s" x="95" y="610" width="120" height="20" fill="#efe8d8"/>
</svg>
