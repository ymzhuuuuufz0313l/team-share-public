  .sector { animation: sweepIn 1.2s ease-out var(--d) both; }
  .top1 { animation: sweepIn 1.2s ease-out var(--d) both, topPulse 5.2s ease-in-out calc(var(--d) + 1.3s) infinite;
           transform-box: fill-box; transform-origin: 50% 50%; }
  .glowL { animation: glowPulse 3.2s ease-in-out infinite; }
  .glowR { animation: glowPulse 4s ease-in-out -1.6s infinite; }
  .sweep { opacity: .08; transform-box: fill-box; transform-origin: 50% 50%;
            animation: orbit 6s linear infinite; }
  .sweepR { animation-delay: -3s; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(4px); } }
  @keyframes sweepIn { from { stroke-dasharray: 0 100; } }
  @keyframes glowPulse { 0%,100% { opacity: .22; } 50% { opacity: .5; } }
  @keyframes topPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
  @keyframes orbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
