## 4. 第 2 轮结果（10-26）

### 4.1 F1 定案：DRA "不收敛"的完整机制（四实验闭环）

10-23 遗留的 50×[analog pol error] 之谜，本轮用四个实验把机制钉死：

| 实验 | 方法 | 结果 |
|------|------|------|
| E1 | 复用 r6 已编译 simv，同 case 同 seed 重跑，仅加 `-xprop=none`，fsdb 逐位对比 | SIM_OUT 完全一致（61 有效位 + 9600 X）→ **排除 X-prop 传播模式假设** |
| E2 | 顶层 netlist 静态检查 | `DRA_BITLINE_R`[4809:10] + `DRA_BITLINE_L`[9669:4810] = 9660bit 全覆盖 → **排除缺块** |
| E3 | 时变快照对比 | 323us 仅 **1** bit 有效 / 330us **61** bit 有效（961-966 通道=带专用 POFF/VNPOFF 处理的路尾特殊组）/ 339.49us checker 采样时 = X → **位级闪烁、永不收敛** |
| E4 | 16 个 DRA 版本（20260114→20260910+updated）扫描 | 全部晶体管级（M31 90nm 单元库 69k 行），**无行为级变体** |

**定论**：晶体管级 DRA 网表在事件驱动 VCS 中，内部模拟节点 X↔值随机闪烁、永不稳定；`SIM_OUT` 位级闪烁，checker 采样必然落到 X（强转 0）→ 50 错。**这是流程固有伪影：非数字 DUT bug**（60h 循环 golden model 已证数字核心正确），**也非 VM 特有问题**（16 个版本全部同构）。推论：若服务器回归"通过"，必用不同机制（co-sim / 初值 / 容差检查）——这是 10-23 遗留问题的答案。

### 4.2 T1 通过：QuestaSim 10.7c 功能可用

`vlog` 编译 0 错 + `vsim -c` 仿真 PASS + license checkout 正常。三个坑：

- **`vcom` 是 VHDL 编译器、`vlog` 才是 Verilog**（老 ModelSim 命名；10.7c 的 vcom 无 `-sv`/`-v2001` 选项）
- **Mentor license 真实端口是 27002**，不是 5280——dat 文件 `SERVER` 行决定，`ps` 上看不到端口
- `LM_LICENSE_FILE=27002@IC_EDA`

### 4.4 T4 判负：Cadence 工具实际不可用（勘误第七章）

拉起 Cadence license 后跑 Spectre 冒烟，license checkout 失败；深挖发现 **cdslmd（32-bit i86）在 lmgrd 下确定性段错误**：

- dmesg 铁证：每次崩溃于同一地址 `0x2085c60b`（ip=故障地址，error 14=指令取指自数据区 → 损坏的函数指针）；136 个 i686 运行库全部在位、ldd 无缺失
- **60h 循环的 Cadence license 从未真正工作过**：`cadence_lmgrd2.log` 里 4:49:46 "Server started on IC_EDA for: 100" 是假象，1 秒后（4:49:57）同模式崩溃；循环从未跑过任何 Cadence 工具
- **勘误**：第七章"完整多厂商 EDA 平台"实际是——**Synopsys 全家功能可用 + Mentor QuestaSim 10.7c 功能可用（T1 实测）+ RISC-V/qemu 可用；Cadence（IC617/Spectre/INCISIVE）装着但损坏**
- 证据：dmesg 段错误序列 / cdslmd md5 `4895c7b7...` / restart 日志；实验后已清理进程、释放 5280/5281

### 4.5 T7 判负：ARM FastModels 缺 LISA 编译器

FastModels 9.4（524M）= 框架 + FVP_MPS2 构建源码（Cortex-M0/M0+/M3/M4/M7）+ AMBA bus 协议 LISA 源码，但 **LISA 编译器二进制未安装**（portfolio 内无 lisa/lisa64）→ 无法构建/运行 Fast Model，与 Cadence 同判负级别。

### 4.6 F2 ✅：golden model bug 修复并验证

60h 循环 M75 发现的 golden model 编译 bug（`intf_connect.sv:130` 变量上界 part-select）本轮修复并端到端验证：

| 步骤 | 结果 |
|------|------|
| 修复 | `[10*gi+7:0]` → `[10*gi +: 8]`（隔离副本，原项目文件未动；符合注释语义 bit[9]=0 / bit[8]=pol / bit[7:0]=像素） |
| 编译 | **0 错**（60h 循环同构建在此行编译失败） |
| 运行 | t_8b1lane_checksum_vbk_en → **TEST CASE PASSED**，UVM_ERROR 0 / FATAL 0，GMV2 激活（880us，CPU 298s） |
| 限制 | v2 像素数据模式（`+GM_HEX_FILE`）需要 cmodel 预期输出 txt（`outResult/analog/frame_*_analog*.txt`），VM 上无现成文件、cmodel 二进制缺失 → 待补 |

意义：golden model 路径（含此前从未编译通过的 v2 分支）首次可编译可用——数字核心 + checker 的 golden 验证通道重新打通。

> 轮间事故记录：T4 排查时误用 `killall lmgrd` 把 Synopsys + Mentor 两台健康 license 服务器一并杀掉，F2 编译随即卡 license 队列——已重启恢复（27000/27002 均在位）。教训：杀 lmgrd 必须按 PID 精确杀，`killall` 会跨厂商误伤。

## 5. 第 4 轮：工具冒烟电池总判定（10-26）

七个工具实验全部收官，这台 VM 的"多厂商 EDA 平台"真实能力定案：

| 编号 | 工具 | 判定 | 一句话原因 |
|------|------|------|-----------|
| T1 | QuestaSim 10.7c | ✅ **可用** | vlog/vsim 冒烟通过（license 27002） |
| T2 | Calibre 2015.2 | ❌ 不可用 | 工具请求老 feature 名，license 只有 2020 新名（calibrepvs_s）——版本错位 5 代 |
| T3 | ICC2 | ❌ 不可用 | 安装不完整（ict 二进制缺失）+ PDK 无 stdcell LEF（后端 P&R 工具+数据双缺） |
| T6 | PrimeTime | ⚠️ **流程可用 / 真实 STA 不可行** | read/link/clock/report 全通；但 liberty→db 编译链断裂（LC2 命令集不兼容 + PTS 缺 LC 桥接），且设计是门级+自定义单元 |
| T4 | Cadence IC617/Spectre | ❌ 不可用 | cdslmd 32-bit 确定性段错误（60h 循环从未工作过） |
| T5 | Vivado 2019.1 | ⚠️ **工具可用 / VU440 不可行** | Artix-7 全流程 3.8MB bitstream 生成；但 part 库裁剪（804 parts，无 UltraScale+/Versal） |
| T7 | ARM FastModels 9.4 | ❌ 不可用 | 框架+FVP 源码在，LISA 编译器二进制缺失 |
| T8 | KVM/libvirt | ❌ 不可用 | 无 /dev/kvm、无 vmx 位 |
| P1 | VCS 编译 -j 基准 | ✅ 完成 | 116-module 设计 ~20s 单线程；-j4/-j8 无收益（20/22/21s） |

**总判定（R6 更新，全工具收官）**：本机真实功能平台 = **VCS 仿真（日常主流程）+ Verdi 波形 + QuestaSim 10.7c + Vivado 2019.1（7 系）+ RISC-V/qemu**。Synopsys 后端全线不可行：DC 只能结构综合（FFGEN 估算）、PT 流程通但真实 STA 断链（liberty 编译链缺失）、ICC2 缺二进制+无 stdcell LEF。**"完整多厂商 EDA 平台"的说法至此完全勘误**——Mentor 系除 QuestaSim 外、Cadence 系、ARM 系均不可用；**任何需要真实工艺库时序/布局的 signoff 类流程都必须在服务器上跑**。

**T5 技术细节**（Vivado 批处理流程坑）：写 XDC 的 Tcl 里 `puts $xdc "...[get_ports clk]"` 会被 Tcl 立即求值（此时设计未打开）→ 需花括号转义；CFGBVS 必须匹配 CONFIG_VOLTAGE（3.3→VCCO）；无 pin 定位时 UCIO-1 需降级为 Warning。

## 6. 第 5 轮：T3 ICC2 + P3/D3 抽取基准（10-26）

### 6.1 T3 判负：后端 P&R 双重不可行

- **工具侧**：ICC2 O-2018.06-SP1 安装不完整——`bin/` 只有 `icc2_shell`/`icc2_lm_shell`/`check_script`，**`ict` 二进制缺失**
- **数据侧**：三个 TSMC PDK 均无 stdcell LEF（130nm 无 lef / 90nm 仅 tech lef `tpdn90g18_5lm.lef` / 65nm 无 lef）——即使补齐 ict 也无处布局
- 对照：`dc_shell` / `pt_shell` / `primetime` 二进制齐全 → Synopsys 前段（综合/时序）数据链可续，后端 P&R 不可行

### 6.2 P3/D3 定案：FSDB 抽取是索引访问，与文件大小无关

目标：HV2M23 **4.3GB** FSDB（187,194 变量，9-15 运行，`$fsdbAutoSwitchDumpfile` 多文件 dump 的 _000 段，1.58ms 窗口）：

| 操作 | 耗时 | 输出 |
|------|------|------|
| `-summary`（结构元数据） | 1s | 187194 vars / 2 trees / 1ps scale |
| 单信号 14460b 全窗口（1.58ms） | **<1s** | 1.24MB（86 跳变） |
| **全树 187k 信号 10us 窗口** | 6s | 34.9MB（~5.8MB/s） |

结论：fsdb2vcd 按索引定位信号数据，**抽取耗时 ∝（信号数 × 窗口内跳变数），与 FSDB 总大小无关**——4.3GB 级别单信号全量抽取 <1s，无 GUI 信号级波形探针完全实用且远快于预期。附带观察：HV2M23 `pixel_out` 1.58ms 内仅 86 跳变——第二芯片的 DRA 输出同样稀疏/X 主导，与 HK1V11 F1 结论跨芯片一致。

### 6.3 T6 定案：PT 流程通，真实 STA 断链（+ 门级设计真相）

PT O-2018.06-SP1 全流程实测：29k 网表（DC 60s 导出，184 modules，2725 FF）read_verilog / read_lib / link_design / create_clock / report_timing 全部执行——**工具本身没问题**。但真实时序分析卡在两处：

1. **设计真相**：HK1V11 digital core 是**门级设计**——RTL 自带 30+ 个自定义行为单元（`DFFRX4`/`DFFRSX4`/`BUFX1-6`/`CLKBUFX1-6`/`MUX2X2`/`CG_CELLX4`... 全在 `seperated_code/`）。DC 用 and_or.db（纯组合通用库）综合时 FF 全部落成 **FFGEN**（无时序模型）→ PT 报 "No constrained paths"。
2. **liberty→db 编译链断裂**：真实 PDK 单元库在位（TSMC 90nm sc-x liberty：`DFFX1-4/HX`、`AND2X1-8`，319k 行），但编译需要 lc_shell——本机的 LC 安装是 **LC2 DesignWare**（经典 `attribute/library/compile_library` 命令集不识别，缺 Qt 库需借 PTS shlib 才能启动），且 PTS 安装**缺 LC 桥接脚本**（`auxx/syn/lc_commands.tbc` 不存在，`set lc_shell` 后 PT 仍报 PT-063）。

**定论**（与 60h 循环 M66 互证）：DC 结构综合 ≠ 真实时序收敛；60h 报告的 "40.08ns critical path" 是 FFGEN + wire-load 估算，非 PDK 时序结果。真实 STA/布局需要项目自有单元库映射，**属于服务器流程**。

## 7. 第 7 轮：F3 定案——stuck 11 的 12ms 看门狗重试死循环（10-26）

60h 循环已定性 "stuck = 模拟 CDR PLL 问题"，本轮把机理**信号级+源码级完整闭合**：

**因果链**：
1. **警告源**（M31 门级单元模型内部自检）：`M31HSSC900EL150SL.v:14218` — `or(RB_or_SB, RB, SB); @(negedge RB_or_SB) if (RB_or_SB===0) $display("Both RB and SB...")`。这是 FF 异步 set/reset 同时拉低的**复位瞬态自检**，不是功能 bug
2. **位置**：`XPHY0_TOP.I_lane0.I_cdr_ana_loop.I_cdr_pll.I_lock_detector`（36 个 FF 实例）
3. **时间分布**（t_reg_i2c_password_rw_match，360 条警告）：**精确 12ms 周期**——0 / 12.3 / 24.3 / … / 108.3ms × 10 次 × 36 条。对照组：PASS case（t_8b1lane）只有 t=0 一次 36 条（PLL 一次锁定，无重试）
4. **12ms 源** = `CHPI_WATCHDOG.v:19`：`parameter WD_CNT_TAR_AL = 20'd120000; //change to 12ms`，`BWDL_TRIG = (WD_CNT>=120000) & ~BAC_RECEIVED & ~LOCK_FREQ_DLY0`——link 握手（BAC）收不到 → 12ms 后 band watchdog 触发 → 复位 CDR PLL（36 条警告 = 复位的表面现象）→ 重新训练 → 再失败 → **死循环**
5. I2C 测试需要 link 建立 → 111ms VCS 超时 → "stuck"

**定论**：stuck 11 = **晶体管级 CDR PLL 门级模型在事件驱动 VCS 下不锁定**（模型限制，与 F1 DRA bitline 闪烁同类问题）+ 数字域 CHPI 看门狗按设计 12ms 重试。**非数字 DUT bug**——若服务器回归"通过"，说明服务器流程用的是收敛的 CDR 模型（或不同仿真机制）。

## 8. 第 8 轮：F4 定案——CHPI 3 case 是 TB 采样点与 DUT 同步窗的 1 帧竞态（10-26）

CHPI 是 5 类回归中**唯一既非模拟模型限制、也非 test 侧文件问题**的类别，本轮重跑 case（补 LD_LIBRARY_PATH 修复 FSDB dumper）+ 2.05GB 波形取证，完整闭合：

**证据链**：
1. 测试读回映射：`CS1/CS0 = LINK_LOGIC.CS_SYNC[1:0]`；RTL 中 `R_CS_reg = R_REG03_L[1:0]`（寄存器 0x43 低 2 位），`CS_SYNC` 仅在 `TP_ACT0_SET_OK` 脉冲时锁存（该脉冲由 CHPI_SD_CTRL 的 end-event 计数器产生：`K2_FIND|K3_FIND|(SP&EOL&K4_FIND)`）
2. **写路径 100% 正常**：ADDR03_L 断言 200 次，每次 DATA_A 都携带正确值（0x7F/0x7B 含 CS=11），同寄存器的 BKDU/LD_F 位均写成功
3. **两条时间线**（us）：
   - `R_CS_reg`（即时）：b11@**320.7** → b00@408.4 → b10@568.2 → b11@661.4 → b01@909.3
   - `CS_SYNC`（同步窗锁存）：b11@**395.6** → b00@410.4 → b10@646.2 → b11@664.3 → b01@909.9 —— 比 R_CS_reg **晚 60-80us**
   - `VS_O` 测试采样点：335.5 / 423.2 / 503.1 / 583.1 / 676.3 …
4. 帧 0 检查 @335.5us：R_CS_reg 已是 b11，但 CS_SYNC 仍 b00（395.6 才锁存）→ 读回 0 → `WRITE FAIL CS1==0 (expected 1)`，与日志逐条吻合

**定论**：**TB 采样协议（VS_O 沿检查）与 DUT 同步协议（end-event 窗锁存 CS_SYNC）之间的 1 帧竞态**——测试永远读到上一帧的 CS_SYNC。非数字写路径 bug、非模拟模型限制。chipsel1 的 32 errors 同机理（更多帧的 CS 期望）。

**留给设计 owner 的裁决**：改 TB（延 1 帧检查）还是改 RTL（VS_O 时锁存）？若服务器版本该 case 通过，需比对服务器 RTL/TB 的 CS_SYNC 锁存时机——这是 VM 与服务器流程差异的又一候选证据点。

## 9. 第 9 轮：D4 数据面盘点 + F2-v2 完成（50err 用 cmodel ground truth 最终标定）（10-26）

**D4 数据面盘点**：
- `/sim_dd/ICer/` = **13G**：HK1V11（12G，60h 循环 run 目录 + outResult）+ HV2M23（1.4G，t_8b1lane FSDB + PPM）
- test 目录 PPM 池：1864 个 .ppm 共 1.2G（`ppm_mix_1920x480` 等）
- **cmodel 参考输出在位**：`/sim_dd/.../t_8b1lane/outResult/analog/` 200 个 `frame_*_analog*.txt` 共 38MB（10-bit 像素值三元组格式）——此前认为"缺 cmodel 输出"的 F2-v2 阻塞解除

**F2-v2 完成（50err 最终标定）**：
1. t_8b1lane 开 `analog_check_on=1` + 拷贝 200 个 cmodel 参考 → **复现 UVM_ERROR=50**，与 60h 循环签名逐条一致（全部 @347.855us / frame 0 / 单行奇数索引，expected 10101010）
2. checker 逻辑（scoreboard:155）：每像素 10-bit 的 **MSB（bit 8）** 必须按 H4INV/POL/POL2/POLC 推导的 8-bit 极性图案交替
3. **FSDB 铁证**：347.855382us 时刻 DUT `ana_SIM_OUT`（9661-bit）line 0 = **480 个 X / 3 个 0 / 0 个 1**（奇数像素 MSB）——checker 报的 "dut=0" 就是 **X→0 转换**
4. **定论**：F1 最终确认——50err = 晶体管级 DRA 在事件驱动 VCS 下不收敛（输出 X）→ checker 采 X→0 → 与 cmodel 期望失配。**非真实 analog 差异、非数字 bug**。VM/服务器差异的已证实机理至此共三个：F1（xprop 排除 + X→0）、F4（CS_SYNC 锁存点竞态）、本条（DRA 收敛性）
5. 项目状态已恢复（t_8b1lane.sv 回到 ck=0）

## 10. 第 10 轮：P4 定案——Icarus vs VCS 速度对比与能力边界（10-26）

**速度**（同 2 文件 4 级流水线，compile+run 一体）：
| 工具 | 耗时 | 备注 |
|---|---|---|
| Icarus 12.0 | **0.027s** | iverilog+vvp，无 license |
| VCS O-2018.09 | 0.96s | -R 一体化，含 license 交互 |

小设计 Icarus 快 **~35 倍**（无 elaborate 管线、无 license 开销）。

**能力边界**（HK1V11 全列表 102 个 verilog 文件）：
1. iverilog 编译全列表 **0.7s 通过**（仅 `ifnone` timing check 非致命警告）
2. **SV class / UVM 不支持**（`class` = syntax error）→ **UVM 回归不能跑 Icarus**
3. 含 analog macro 的全设计仿真：**重复 module 声明 fatal**（M31 model 与 RXPHY_X1_TOP 同定义 stdcell——VCS 按 last-wins 容忍，iverilog 视为错误）
4. 去重后仍不可行：**PDK 自动生成 model 按上下文重命名 cell**（`DFFRBQBX1AS9_RXPHY_X1_TOP` 式）→ 纯名 cell（AND3X2AL9 等）缺失，完整 top 仿真断链

**定论**：Icarus 定位 = 自包含模块/纯数字逻辑的**秒级快速 sanity 与无 license 冒烟**（模块开发调试利器）；HK1V11 的 UVM 回归与含 analog 全设计仿真**必须 VCS**。开源工具链是 VCS 的补充，不是替代。

### 11.4 给设计 owner 的完整结论

<script>
const md = document.getElementById('md').textContent;
document.getElementById('article').innerHTML = marked.parse(md);

const toc = document.getElementById('toc');
const headings = document.querySelectorAll('.article h2, .article h3');
const tocLinks = [];
headings.forEach(h => {
  const id = h.textContent.trim().replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fa5-]/g, '');
  h.id = id;
  const cls = h.tagName === 'H2' ? 'toc-h2' : 'toc-h3';
  const a = document.createElement('a');
  a.href = '#' + id;
  a.textContent = h.textContent;
  a.className = cls;
  toc.appendChild(a);
  tocLinks.push(a);
});

tocLinks.forEach((link, i) => {
  if (!link.classList.contains('toc-h2')) return;
  const children = [];
  for (let j = i + 1; j < tocLinks.length && tocLinks[j].classList.contains('toc-h3'); j++) children.push(tocLinks[j]);
  if (!children.length) return;
  link.classList.add('toc-parent');
  const arrow = document.createElement('span');
  arrow.className = 'toc-arrow';
  arrow.textContent = '▸';
  link.prepend(arrow);
  children.forEach(c => c.parentLink = link);
  arrow.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const collapsed = link.classList.toggle('collapsed');
    children.forEach(c => c.style.display = collapsed ? 'none' : '');
  });
});

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(l => l.classList.remove('active'));
      let active = tocLinks.find(a => a.getAttribute('href') === '#' + entry.target.id);
      if (active && active.style.display === 'none' && active.parentLink) active = active.parentLink;
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-10% 0px -75% 0px' });
headings.forEach(h => observer.observe(h));
</script>
<script>
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;
function openLightbox(src) { lbImg.src = src; scale = 1; translateX = 0; translateY = 0; updateTransform(); lightbox.classList.add('active'); document.body.style.overflow = 'hidden'; }
function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = ''; }
function updateTransform() { lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`; }
document.addEventListener('click', (e) => { const img = e.target.closest('img'); if (!img || img.id === 'lightbox-img' || !img.closest('.article')) return; openLightbox(img.src); });
lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
lightbox.addEventListener('wheel', (e) => { e.preventDefault(); const d = e.deltaY > 0 ? -0.12 : 0.12; scale = Math.min(Math.max(0.5, scale + d), 5); updateTransform(); });
lbImg.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX - translateX; startY = e.clientY - translateY; lbImg.classList.add('grabbing'); e.preventDefault(); });
document.addEventListener('mousemove', (e) => { if (!isDragging) return; translateX = e.clientX - startX; translateY = e.clientY - startY; updateTransform(); });
document.addEventListener('mouseup', () => { isDragging = false; lbImg.classList.remove('grabbing'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox(); });
