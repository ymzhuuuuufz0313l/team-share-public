  position: fixed;
  inset: 0;

  max-width: none;

  transition: none;
  margin: 0;
}

  user-select: none;
  background: rgba(0,0,0,0.4);
  padding: 6px 14px;
  border-radius: 20px;
}

  top: 20px;

# 一、环境与配置

&gt; 综合开始之前，需要先准备好项目环境、正确配置 `design.set`，并管理好 RTL filelist。

环境搭建的整体顺序：

<div class="flow">
  <div class="fbox"><b>① 拷贝配置</b><br/>制程不变时，从上一个已验证项目整包拷贝配置（SVN update 获取最新版）</div>
  <div class="farrow">→</div>
  <div class="fbox"><b>② 换 top name</b><br/><code>design.set</code> 传入 top name，整个配置批量替换</div>
  <div class="farrow">→</div>
  <div class="fbox"><b>③ 检查工具版本</b><br/>Verdi / VCS 固定 <code>18.19</code>，不随验证环境升级</div>
  <div class="farrow">→</div>
  <div class="fbox"><b>④ 更新 filelist / common_db</b><br/>filelist 与 HDL 侧 <code>.f</code> 一致；新 cell lib 加进 target library</div>
  <div class="farrow">→</div>
  <div class="fbox"><b>⑤ CKF + nLint 验证</b><br/>连接性与语法检查全过，环境即就绪</div>
</div>

## 1. 环境准备

### 1.1 目录结构
典型的综合环境位于：

```
$PROJECT_PATH/SYNTHESIS/ip/<top_name>/
```

主要子目录说明：

| 目录 | 用途 |
|------|------|
| `ckf` | RTL 连接性检查 |
| `nlint` | Lint 检查 |
| `lec_upf` | UPF 正确性检查 |
| `dc` | Design Compiler 综合 |
| `genus` / `genus_upf` | Genus 综合 / UPF 生成 |
| `lec` | 形式验证 |
| `pt` / `sta/post/pt` | 时序分析 |
| `power` | 功耗仿真 |

### 1.2 环境初始化

进入 `$PROJECT_PATH/SYNTHESIS/ip/` 后执行：

```bash
# 生成综合环境（默认会 check in 到版本管理）
gensyn <TOP_NAME>

# 不自动 check in
gensyn <TOP_NAME> -noadd

# 自定义目录名
gensyn <TOP_NAME> -noadd <custom_dir>
```

ASSUMPTION: 本指南以项目内部封装脚本 <a href="./script-dict.html#gensyn" target="_blank">gensyn</a>（脚本包外，本页只有用法说明）为例；若使用其他 flow，需替换为对应的环境初始化命令。

其他常用选项：
- 初次生成环境时，默认会 check in 到版本管理，以保持目录干净；不需要 check in 时用 `-noadd`。
- 生成的目录中通常包含 `Readme`，可再次阅读 synthesis flow 说明。
- 如果模板有更新，可再次运行 `gensyn <TOP_NAME>` 自动 copy 新模板并备份原文件；`filelist` 与约束文件一般不会被覆盖。

### 1.3 环境 source 与工具配置
综合前通常需要 source 项目特定的 cshrc 或 bashrc，以保证工具链版本与 verification 环境一致。

NOTE: 若 cshrc 中同时 source 了仿真工具（如 Verdi / VCS），在运行 DC / PT 时可能产生冲突，建议临时注释相关行。

WARNING: DC / PT 与 Verdi / VCS 存在版本冲突——验证环境与 PT 环境需要的 Verdi / VCS 版本不同。PT 环境的 Verdi / VCS 版本长期固定（如 18.19，已沿用多年），不要随验证环境升级。若 source 错版本后跑 DC / PT，会报出很奇怪的错误；遇到莫名报错时，第一件事先检查当前 source 的工具版本是否正确。

---

## 2. design.set 核心配置

<a href="./script-dict.html#design_set" target="_blank">design.set</a> 是综合环境的总控文件，被 `compile_dc.tcl`、`compile_genus.tcl`、`rtl_gate.do`、`pt_setup.tcl` 以 `source ../design.set` 读入。

top name「批量替换」的真实机制：top name 只写在 `design.set` 的 `TOP_NAME` / `SDC_NAME` 两行；各 `run_*` 入口脚本（如 <a href="./script-dict.html#run_dc" target="_blank">run_dc</a>）运行时 `grep "set *TOP_NAME" ../design.set` 动态提取顶层名，再由 `genfilelist` 生成 filelist。因此换项目只需要改这两行（不同项目的 design.set diff 实证只有这两行差异）。

复用惯例：制程不变时，直接从上一个已验证项目整包拷贝配置，只替换 top name 即可；最新版配置统一上传到公共路径，团队通过 SVN update 获取（上传前需核对是否为最新版本）。

关键字段如下：

| 字段 | 说明 | 常用设置 |
|------|------|---------|
| `TOP_NAME` / `SDC_NAME` | 顶层模块名 / 约束名 | 换项目必改，只改这两行 |
| `USE_SAIF` | 是否使用 SAIF 功耗引导 | 默认 0 |
| `SCAN_EN` | 扫描链使能 | 综合阶段常设为 0 |
| `INCR_OPT` / `BOND_OPT` | 增量优化 / bonding 选项 | 默认 1 |
| `USE_UPF` | UPF 流程开关 | 默认 0 |
| `LINK_LIB` / `TAR_LIB` | 标准单元库 | 实例写法如 `nexchip_145_9t`，注释中列有各工艺候选 |
| `NET_DEFINE` | 全局宏定义 | 与 clk_rst 相关，如 `[list "NETLIST" <库名>]` |
| `ANA_EN` | analog db 使能 | 按项目需要 |
| `MEM_EN` / `MEM_SNPS_EN` / `MEM_FARA_EN` | memory db 来源 | 按库配置 |
| `LVT_EN` / `SVT_EN` | 低阈值 / 标准阈值单元使能 | 常用默认值 |
| `SYN_TOOL` | 综合工具 | `dc` 或 `genus` |
| `CORNER` | PVT corner | 与标准单元库一致 |
| `DERATE_VAL` | derate 值 | 实例 1.07 |
| `POSTPT_EN` | postPT 流程开关 | 综合阶段为 0 |

补充说明：
- `ANA_EN`：analog db 使能，按项目需要开启。
- `MEM_EN` / `MEM_SNPS_EN` / `MEM_FARA_EN`：memory db 来源开关，按实际库配置选择。
- `LVT_EN` / `SVT_EN`：低阈值 / 标准阈值单元使能，常用默认值即可；不同项目可能使用 RVT、HVT 等其它命名。
- `LINK_LIB` / `TAR_LIB`：标准单元库选择，若需多种 std_cell，用空格分隔，例如 `"lib_a lib_b"`。
- `NET_DEFINE`：全局宏定义，与 `clk_rst` 下文件对应。
- `PARAM_DESIGN`（注意真实拼写，不是 `PARA_DESIGN`）与 `UPPER_CASE` 只存在于 postPT 的 `design.set` 中，综合主 `design.set` 没有这两个字段，不要照抄。
- lane / mode 变体（`design.set_1lane` / `_2lane` / `_dplc` / `_drd`）：与主文件的唯一差异是 `FSDB_FILE` 的 powerpro 目录名——它们是 PowerPro 功耗分析的 FSDB 配置变体，与时序 skew 分组无关，手工复制改一行即可。

TIP: 同一项目下的不同 IP 应尽量使用相同的 `CORNER` 和库配置，以保证时序 signoff 口径一致。

---

## 3. common_db 与库配置

`common_db` 集中存放 lib 库、target library、wireload 等配置，项目不做库变更时基本不需要改动。

必须修改的场景：
- 项目新加自定义 cell / APR module 时，必须把对应的新 lib 加进 `common_db` 的 target library，否则 DC 找不到 cell 名会直接报错。
- 每个新项目都需要提前申请 library。

### 3.1 阈值电压库（VT 库）规则
- 当前 145 制程项目统一只使用 LVT（低阈值库）并全部拉满。原因：排期紧张；且该工艺下 SVT / LVT 混用会导致 DRC 过不了（该工艺库特有的问题）。
- 代价：综合阶段已全部使用最快的 cell，后端修 setup 时无法再通过换 VT 解决，只能 sizing。
- 该制程已成熟，leakage 占比很小，全 LVT 方案可接受。

---

## 4. Filelist 管理

### 4.1 文件分类

综合 filelist 通常按文件类型拆分：

| 文件 | 内容 |
|------|------|
| `<top>.f` | Verilog RTL 文件列表 |
| `<top>.sv.f` | SystemVerilog 文件列表 |
| `<top>.ddc_dc.f` | 引用 DDC 的 design（DDC 目前已不使用，环境保留配置） |
| `<top>.dummy_lec.f` | LEC 对比时需要的 dummy 文件 |
| `advanced/*.vhdl_dc.f` / `*.vhdl_lec.f` | VHDL 相关处理 |

### 4.2 填写建议
1. `clk_rst` 中的 define 一般由环境自动加入，filelist 中无需重复。
2. memory / analog 模块在综合时引用 db / lib，filelist 中通常不需要加入 RTL；LEC 环境会自行使用相关 dummy 文件。
3. filelist 支持嵌套 `*.f`。
4. 对于底层/中层模块、mem_wrap、bist、clk_rst、std_ip 相关文件，建议由 owner 明确填写，增强可控性。
5. 能直接复用 `HDL/file_list/*.f` 时，优先复用，以保证仿真与综合的一致性。
6. 若不确定是否有遗漏，可通过 `run_ckf` 结果反向补充 filelist 中未添加的 `.v`。
7. filelist 必须与 HDL（RTL 开发侧）的 `.f` 完全一致，综合和 LEC 都从这里读取、统一管理，建议从 SVN 直接 link 获取。
8. 空文件占位规则：配置中指定的文件即使没有内容，也必须放空文件占位，否则流程会直接报错。

WARNING: filelist 拿错版本的后果极隐蔽——拿错版 filelist 做综合、再拿同一错版做 LEC，LEC 会自洽通过，逻辑错误完全发现不了（"拿错 = 白综合"）。务必确认 filelist 版本与 HDL 侧一致。

  <div class="lightbox" id="lightbox">
    <span class="close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
    <div class="hint">滚轮缩放 · 拖拽移动 · Esc 或点击空白处关闭</div>

  <script>

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;

function openLightbox(src) {
  lbImg.src = src;
  scale = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
  lightbox.classList.add('active');
}

function closeLightbox() {
  lightbox.classList.remove('active');
}

function updateTransform() {
  lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

document.addEventListener('click', (e) => {
  const img = e.target.closest('img');
  if (!img || img.id === 'lightbox-img' || !img.closest('.article')) return;
  openLightbox(img.src);
});

lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

lightbox.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  scale = Math.min(Math.max(0.5, scale + delta), 4);
  updateTransform();
});

lbImg.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  lbImg.classList.add('grabbing');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  updateTransform();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.classList.remove('grabbing');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
});

  </script>

  <script>
const article = document.getElementById('article');
article.innerHTML = marked.parse(document.getElementById('md').textContent, {gfm:true, breaks:false});
applyGlossary(article);
const toc = document.getElementById('toc');
const h1 = article.querySelector('h1');
const headings = article.querySelectorAll('h2, h3');
headings.forEach((h, i) => { h.id = 'sec-' + i; });

// 标题统一自动编号：h2 = "N."，h3 = "N.M"；先剥离手写编号再重排，只改首个文本节点以保留标题内链接
let h2No = 0, h3No = 0;
headings.forEach(h => {
  if (h.firstChild && h.firstChild.nodeType === 3) {
    h.firstChild.nodeValue = h.firstChild.nodeValue.replace(/^\s*\d+(\.\d+)*[.、]?\s+/, '');
  }
  if (h.tagName === 'H2') {
    h2No++; h3No = 0;
    h.prepend(document.createTextNode(h2No + '. '));
  } else {
    h3No++;
    h.prepend(document.createTextNode(h2No + '.' + h3No + ' '));
  }
});

let tocHtml = '';
if (h1) {
  tocHtml += `<a class="toc-h1" href="#">${h1.textContent}</a>`;
}
tocHtml += '<ul style="list-style:none;padding:0;margin:0;">';
const h3ToH2 = {};
for (let i = 0; i < headings.length; i++) {
  const h = headings[i];
  if (h.tagName !== 'H2') continue;
  const children = [];
  let j = i + 1;
  while (j < headings.length && headings[j].tagName === 'H3') {
    children.push(headings[j]);
    h3ToH2[headings[j].id] = h.id;
    j++;
  }
  const arrow = children.length > 0
    ? `<span class="toc-arrow open" data-target="${h.id}">▸</span>`
    : '<span class="toc-arrow-spacer"></span>';
  tocHtml += `<li class="toc-h2-item">${arrow}<a href="#${h.id}">${h.textContent}</a></li>`;
  if (children.length > 0) {
    tocHtml += `<li class="toc-h3-group" data-group="${h.id}"><ul style="list-style:none;padding:0;margin:0;">`;
    children.forEach(c => {
      tocHtml += `<li><a class="toc-h3" href="#${c.id}">${c.textContent}</a></li>`;
    });
    tocHtml += '</ul></li>';
  }
}
tocHtml += '</ul>';
toc.innerHTML = tocHtml;

toc.querySelectorAll('.toc-arrow').forEach(arrow => {
  arrow.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const group = toc.querySelector('.toc-h3-group[data-group="' + arrow.dataset.target + '"]');
    const collapsed = group.classList.toggle('collapsed');
    arrow.classList.toggle('open', !collapsed);
    if (collapsed) {
      const activeInGroup = group.querySelector('a.active');
      if (activeInGroup) {
        activeInGroup.classList.remove('active');
        const parentLink = toc.querySelector('a[href="#' + arrow.dataset.target + '"]');
        if (parentLink) parentLink.classList.add('active');
      }
    }
  });
});

const tocLinks = toc.querySelectorAll('a[href^="#"]');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(a => a.classList.remove('active'));
      let targetId = entry.target.id;
      if (h3ToH2[targetId]) {
        const group = toc.querySelector('.toc-h3-group[data-group="' + h3ToH2[targetId] + '"]');
        if (group && group.classList.contains('collapsed')) {
          targetId = h3ToH2[targetId];
        }
      }
      const active = toc.querySelector('a[href="#' + targetId + '"]');
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
headings.forEach(h => observer.observe(h));
</script>
