/* Image lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0.25s ease;
  cursor: grab;
}
.lightbox.active {
  opacity: 1;
  visibility: visible;
}
.lightbox img {
  max-width: none;
  max-height: none;
  border: none;
  border-radius: 4px;
  cursor: grab;
  transform-origin: center center;
  transition: none;
  margin: 0;
}
.lightbox img.grabbing { cursor: grabbing; }
.lightbox .hint {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  pointer-events: none;
  user-select: none;
  background: rgba(0,0,0,0.4);
  padding: 6px 14px;
  border-radius: 20px;
}
.lightbox .close {
  position: absolute;
  top: 20px;
  right: 24px;
  color: rgba(255,255,255,0.8);
  font-size: 32px;
  line-height: 1;
  cursor: pointer;
  user-select: none;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: background 0.2s;
}
.lightbox .close:hover { background: rgba(255,255,255,0.15); color: #fff; }

}

# 七、常见问题与检查清单

&gt; 最后整理一些综合与集成阶段容易踩坑的点，以及一份可复用的检查清单。

## 1. 常见问题与注意事项

### 1.1 UPF 相关
- `lec_upf` 检查手写 UPF 是否正确；`genus_upf` 用于生成 `*_final.upf`。
- `genus_upf` 引用网表时，若引用 RTL 则需打开全部编译步骤；引用网表可注释 generic 编译。
- 综合时代码中的 output / inout 不能直接接常量，否则 `genus_upf` 可能报错。

### 1.2 综合优化相关
- 仅包含 input 的 module 会被工具优化掉，可设置 `set_dont_touch` 保留。
- `set_ideal_network`：常用于 clock / reset，避免工具插 buffer。

- `set_dont_touch`：常用于 analog cell，防止被优化。
- `set_dont_touch_network`：作用与 `set_dont_touch` 类似，但范围更广，通常到 DFF。

- `set_false_path`：常用于两个异步时钟之间。

- 综合时代码中的 output / inout 不能直接接常量，否则 `genus_upf` 可能报错。

### 1.3 工具链冲突
- 综合环境 source 前，若 cshrc 中同时 source 了 Verdi / VCS 环境，建议先注释，避免 DC / PT 报错。

---

  <div class="lightbox" id="lightbox">
    <span class="close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
    <div class="hint">滚轮缩放 · 拖拽移动 · 点击空白处或右上角关闭</div>
  </div>

  <script>

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;

function openLightbox(src) {
  lbImg.src = src;
  scale = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
  lightbox.classList.add('active');
}

function closeLightbox() {
  lightbox.classList.remove('active');
}

function updateTransform() {
  lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

document.querySelectorAll('img').forEach(img => {
  if (img.id === 'lightbox-img') return;
  img.addEventListener('click', () => openLightbox(img.src));
});

lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

lightbox.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  scale = Math.min(Math.max(0.5, scale + delta), 4);
  updateTransform();
});

lbImg.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  lbImg.classList.add('grabbing');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  updateTransform();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.classList.remove('grabbing');
});

  </script>

  <script>
const article = document.getElementById('article');
article.innerHTML = marked.parse(document.getElementById('md').textContent, {gfm:true, breaks:false});
applyGlossary(article);
const toc = document.getElementById('toc');
const h1 = article.querySelector('h1');
let tocHtml = '';
if (h1) {
  tocHtml += `<a class="toc-h1" href="#">${h1.textContent}</a>`;
}
tocHtml += '<ul style="list-style:none;padding:0;margin:0;">';
const headings = article.querySelectorAll('h2, h3');
headings.forEach((h, i) => {
  const id = 'sec-' + i;
  h.id = id;
  const cls = h.tagName === 'H2' ? '' : 'toc-h3';
  tocHtml += `<li><a class="${cls}" href="#${id}">${h.textContent}</a></li>`;
});
tocHtml += '</ul>';
toc.innerHTML = tocHtml;

const tocLinks = toc.querySelectorAll('a[href^="#"]');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(a => a.classList.remove('active'));
      const active = toc.querySelector('a[href="#' + entry.target.id + '"]');
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
headings.forEach(h => observer.observe(h));
</script>
