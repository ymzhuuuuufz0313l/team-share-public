# ASIC IP Synthesis & Integration Flow 工具使用指南

> 一份面向数字 IC 设计工程师的通用综合与集成流程参考手册，涵盖环境搭建、RTL 检查、综合、一致性验证、时序 signoff 及功耗分析等关键环节。

---

## 1. 概述

### 1.1 适用范围
本指南适用于采用 **top-down synthesis** 的 ASIC 项目。在该模式下，整个芯片或顶层模块可被视作一个 IP 进行综合，流程、脚本和检查项与中小规模 IP 综合保持一致。

### 1.2 核心目标
- 建立可复用的综合环境
- 规范 RTL 到 netlist 的转化流程
- 在 signoff 前完成质量、一致性、时序、功耗检查
- 形成可自动化追踪的交付物

### 1.3 流程总览

```
环境准备 → RTL 质量检查 → 综合 → 一致性检查 → 时序分析 → Signoff → 交付
```

主要阶段包括：

| 阶段 | 工具/脚本 | 关键交付物 | 通过标准 |
|------|-----------|-----------|---------|
| 环境生成 | `gensyn` | 综合环境目录 | 目录完整、模板最新 |
| RTL 检查 | CKF / nLint | `ckf.rpt`, `nlint.rpt` | 无 Floating、可接受的错误已 waive |
| UPF 准备 | lec_upf / genus_upf | `*.upf`, `report_top.txt` | UPF 语法正确、PG 定义完整 |
| 综合 | DC / Genus | netlist, `dc.log`, `*.rpt` | 无 Error、slack ≥ 0 |
| 一致性 | LEC | `lec.log`, `non-eq.rpt` | 0 non-equivalent / 0 abort |
| Signoff | signoff 脚本 | `signoff.rpt`, release 目录 | 版本一致、检查项全部通过 |
| 时序 | PrimeTime | `pt.log`, `*.rpt` | slack > 0 |
| 功耗 | PTPX | power report, fsdb | 功耗数据收敛 |

---

## 2. 环境准备

### 2.1 目录结构
典型的综合环境位于：

```
$PROJECT_PATH/SYNTHESIS/ip/<top_name>/
```

主要子目录说明：

| 目录 | 用途 |
|------|------|
| `ckf` | RTL 连接性检查 |
| `nlint` | Lint 检查 |
| `lec_upf` | UPF 正确性检查 |
| `dc` | Design Compiler 综合 |
| `genus` / `genus_upf` | Genus 综合 / UPF 生成 |
| `lec` | 形式验证 |
| `pt` / `sta/post/pt` | 时序分析 |
| `power` | 功耗仿真 |

### 2.2 环境初始化
进入 `$PROJECT_PATH/SYNTHESIS/ip/` 后执行：

```bash
# 生成综合环境（默认会 check in 到版本管理）
gensyn <TOP_NAME>

# 不自动 check in
gensyn <TOP_NAME> -noadd

# 自定义目录名
gensyn <TOP_NAME> -noadd <custom_dir>
```

ASSUMPTION: 本指南以项目内部封装脚本 `gensyn` 为例；若使用其他 flow，需替换为对应的环境初始化命令。

### 2.3 环境 source 与工具配置
综合前通常需要 source 项目特定的 cshrc 或 bashrc，以保证工具链版本与 verification 环境一致。

NOTE: 若 cshrc 中同时 source 了仿真工具（如 Verdi / VCS），在运行 DC / PT 时可能产生冲突，建议临时注释相关行。

---

## 3. design.set 核心配置

`design.set` 是综合环境的总控文件，关键字段如下：

| 字段 | 说明 | 常用设置 |
|------|------|---------|
| `TOP_NAME` | 顶层模块名 | 由 `gensyn` 自动填充 |
| `UPPER_CASE` | 是否大写处理 | 默认 |
| `PARA_DESIGN` | 是否并行综合 | 默认 |
| `USE_SAIF` | 是否使用 SAIF 功耗引导 | 默认 |
| `POWER_OPTIMIZATION` | 功耗优化开关 | 默认 |
| `SCAN_EN` | 扫描链使能 | 综合阶段常设为 0 |
| `LINK_LIB` / `TAR_LIB` | 标准单元库 | 可填多个，空格分隔 |
| `NET_DEFINE0` / `NET_DEFINE1` | 全局宏定义 | 与 clk_rst 相关 |
| `ANA_EN` | analog db 使能 | 按项目需要 |
| `MEM_EN` / `MEM_SNPS_EN` / `MEM_FARA_EN` | memory db 来源 | 按库配置 |
| `LVT_EN` / `SVT_EN` | 低阈值 / 标准阈值单元使能 | 常用默认值 |
| `SYN_TOOL` | 综合工具 | `dc` 或 `genus` |
| `CORNER` | PVT corner | 与标准单元库一致 |

TIP: 同一项目下的不同 IP 应尽量使用相同的 `CORNER` 和库配置，以保证时序 signoff 口径一致。

---

## 4. Filelist 管理

### 4.1 文件分类
综合 filelist 通常按文件类型拆分：

| 文件 | 内容 |
|------|------|
| `<top>.f` | Verilog RTL 文件列表 |
| `<top>.sv.f` | SystemVerilog 文件列表 |
| `<top>.ddc_dc.f` | 引用 DDC 的 design |
| `<top>.dummy_lec.f` | LEC 对比时需要的 dummy 文件 |
| `advanced/*.vhdl_dc.f` | VHDL 相关处理 |

### 4.2 填写建议
1. `clk_rst` 中的 define 一般由环境自动加入，filelist 中无需重复。
2. memory / analog 模块在综合时引用 db / lib，filelist 中通常不需要加入 RTL。
3. filelist 支持嵌套 `*.f`。
4. 对于底层/中层模块、mem_wrap、bist、clk_rst、std_ip 相关文件，建议由 owner 明确填写，增强可控性。
5. 能直接复用 `HDL/file_list/*.f` 时，优先复用，以保证仿真与综合的一致性。

---

## 5. RTL 质量检查

### 5.1 CKF（连接性检查）

```bash
cd ckf
run_ckf
```

检查项：
- `ckf.log` 无 Error
- `ckf.rpt` 中 **Floating** 必须清零
- `black box` 需逐一确认，通常为 analog、memory、digital macro
- `Latch` 只允许来自统一库（如 `gclk`、`io_latch`）或配合 analog design 直接调用的 latch，其余需检查 RTL

### 5.2 nLint

```bash
cd nlint
run_nlint
```

检查项：
- `nlint.log` / `nlint.rpt`
- `no_check_module.f` 可排除不需要检查的模块
- 确认可接受的 error 后，填入公共 waive list：`$PROJECT/SYNTHESIS/common/tcl_dir/nlint/nlint_waive.list`

NOTE: nLint 和 CKF 建议在综合前完成，以显著减少后续综合阶段的 RTL 问题。

---

## 6. UPF 准备与检查

### 6.1 lec_upf
`lec_upf` 用于检查 UPF 文件本身的正确性。

- UPF 文件通常放在 `SYNTHESIS/common/upf/` 下。
- 输入 `report_top.txt` 需逐行检查：
  - library PG pin 定义是否正确
  - analog 电源域是否缺失
  - power port 电压定义是否合理
- 即使 UPF 已修正，仍可能存在 Error / Warning，需与模拟设计同事确认。

### 6.2 genus_upf（生成 final.upf）
部分 flow 需要借助 Genus 生成最终的 `*_final.upf`：

1. 从 genus 目录复制并新建 `*_genus_upf` 目录。
2. 修改 `compile_genus.tcl`：
   - 注释掉 `kv_genus_compile "generic"`
   - 增加 read UPF 相关命令
3. filelist 引用网表（`*.gv`）而非 RTL。
4. 顶层约束 `.tcl` 中的层级分隔符需与工具要求一致。
5. `setting.upf` 一般无需修改。
6. 运行 `run_genus`，检查 `genus.log` 与报告。

---

## 7. 综合（DC / Genus）

### 7.1 Design Compiler

```bash
cd dc
run_dc
```

前置条件：CKF、nLint、lec_upf 问题已清理。

主要检查项：
- `dc.log`：无 Error、无 unresolved
- `*.chk_design`：无 undrive
- `*.rpt`：
  - area 符合预期
  - timing slack ≥ 0（signoff 版本必须 slack > 0）

约束文件（通常位于 `SYNTHESIS/common/ip_cons/`）应包括：
- `kv_clock` / `kv_v_clock`：clock 点需为 macro 或 standard cell pin
- `kv_reset`
- `kv_inout`
- `kv_2clklist_group_path`
- `set_multicycle_path`
- `set_false_path`
- `set_dont_touch`：analog macro、standard cell、IO 等，防止被 DC 优化掉

### 7.2 Genus
若使用 DC，通常不需要运行 Genus。若项目指定使用 Genus，则需配置 `design.set` 中 `SYN_TOOL=genus`。

---

## 8. 形式验证（LEC）

```bash
cd lec
run_lec
```

- `run_lec` 和 `rtl_gate.do` 一般无需修改；ECO 场景下才需调整。
- 使用 Genus 综合时，可设置 `EC_R2V_EN=1` 以加速；若存在无法解决的 abort，再改为分步进行。

通过标准：
- `lec.log` 无 Error
- `abort.rpt` = 0 个 abort point
- `non-eq.rpt` = 0 个 non-equivalent point
- `unmapped.rpt` = 0 个 unmapped point

即使 abort 全部解决，也视为 PASS。

---

## 9. Signoff 与交付

### 9.1 Signoff 检查
运行 signoff 脚本时，会：
- check 综合相关目录对应的版本号，确保 CKF / nLint / DC / LEC 等步骤基于同一 RTL 版本
- 输出 `signoff.rpt`，汇总所有 error 与 check 信息
- 全部通过后，自动 release 到指定目录并指向 `latest`

WARNING: 若 CKF / nLint / DC / LEC 无法全部 pass，可申请 `signoff fake`，但 silver netlist 后通常不允许 fake。

### 9.2 交付物示例

| 交付物 | 说明 |
|--------|------|
| netlist (`*.v` / `*.gv`) | 综合后的门级网表 |
| SDC | 时序约束 |
| UPF | 电源意图文件 |
| `dont_touch.tcl` | 不被优化的单元列表 |
| `signoff.rpt` | signoff 检查报告 |
| release 目录 | 按版本归档的完整结果 |

---

## 10. 时序分析（PrimeTime）

### 10.1 Pre-PT

```bash
cd pt
run_pt
```

- `pt_setup.tcl` 一般无需修改
- `common_db_pvt.tcl` 选择与实际综合一致的 corner（如 `wc_cworst`）
- 注意 memory / analog 的 PVT 可能与标准单元不同

检查项：
- `pt.log` 无 Error
- `*.rpt` 中 timing slack > 0

### 10.2 Post-PT
基于 APR 后端输出进行 signoff 级时序分析：

```bash
cd sta/post/pt
run_pt
```

需修改：
- `corner_set.tcl`：wc / wcl / lt / ml / tt 等 corner
- `pt_setup.tcl`：读取 APR 吐出的网表、设置 operating conditions
- `pt/design.set`：路径、LINK_LIB、TAR_LIB、NET_DEFINE、POSTPT_EN=1 等
- `common_db_pvt.tcl`

---

## 11. 流程依赖关系

各步骤的并行与串行关系如下：

```mermaid
flowchart LR
    A[环境准备] --> B[CKF]
    A --> C[nLint]
    A --> D[lec_upf]
    B --> E[DC / Genus]
    C --> E
    D --> E
    E --> F[LEC]
    E --> G[Pre-PT]
    F --> H[Signoff]
    G --> H
    H --> I[交付]
```

- CKF、nLint、lec_upf、DC/Genus 原则上可并行。
- 为保证 signoff 的版本一致性检查，DC/Genus 需在 CKF、nLint 之后运行。
- Pre-PT 与 LEC 可并行。

---

## 12. Memory 与 mem_wrap 生成

### 12.1 生成 memory
利用 memory compiler 工具，按工艺要求填写：
- word / bit / byte
- ring layer（决定 memory 方向）
- bus format 选 YES，保证总线信号打包
- feature 选择 Generic

### 12.2 整理 lib / DB
1. 修改 `sram.list`、`corner.list`、`gen_tcl.pl`
2. 生成 cp_lib 和 gen_db_tcl
3. 创建 `cfg cir db ds dummy gds lef lib lvlib sim pglib` 等目录
4. 执行 `cp_lib`、`run_lc` 生成 db
5. merge lib 和 db：执行 `do_merge_db` 与 `do_merge_back`
6. 将 `mem_db` 复制到 database 下（只复制 corner 目录，不复制 `*_merged` 目录）

### 12.3 生成 mem_wrap
1. 修改 memory wrapper config：
   - wrapper_name、msize、mwide、mem_num
   - 添加 `pg_en`、`repair` 列，默认 0
2. source `run.tcl` 生成 wrapper.v 与 fault_info 文件
3. 将生成的 `.v` 复制到 `HDL/mem_wrap/`

---

## 13. 功耗仿真

功耗仿真通常在 `SYNTHESIS/top/power/0.px_template/` 下运行。

### 13.1 配置要点
1. `design.set` 中 `TOP_NAME` 改为实际顶层。
2. `px_cfg.tcl` 中修改：
   - `verilog_file`：PR release 的网表路径
   - `sdc_file`：post-PT release 的 SDC（注意 `sdc_version` 需改为 2.0）
   - `spec_dir`：PR release 的 timing 目录
   - `ip0_inst` / `ip0_strip` / `ip0_vcd`：对应顶层实例与 VCD 路径
3. 生成 VCD 前，需在 post-PT 对应 corner 生成 SDF，并在 post-sim case 中读取。

### 13.2 运行与查看

```bash
run_ptpx
```

结果：
- `*_toggle_rate_detail.rpt`：toggle rate
- `*_power.rpt`：功耗结果
- 上层目录生成 fsdb，可用 Verdi 打开查看功耗波形

---

## 14. 常见问题与注意事项

### 14.1 UPF 相关
- `lec_upf` 检查手写 UPF 是否正确；`genus_upf` 用于生成 `*_final.upf`。
- `genus_upf` 引用网表时，若引用 RTL 则需打开全部编译步骤；引用网表可注释 generic 编译。
- 综合时代码中的 output / inout 不能直接接常量，否则 `genus_upf` 可能报错。

### 14.2 综合优化相关
- 仅包含 input 的 module 会被工具优化掉，可设置 `set_dont_touch` 保留。
- `set_ideal_network`：常用于 clock / reset，避免工具插 buffer。
- `set_dont_touch`：常用于 analog cell，防止被优化。
- `set_dont_touch_network`：作用范围更广，通常到 DFF。
- `set_false_path`：常用于两个异步时钟之间。

### 14.3 工具链冲突
- 综合环境 source 前，若 cshrc 中同时 source 了 Verdi / VCS 环境，建议先注释，避免 DC / PT 报错。

  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script>
    const md = document.getElementById('md').textContent;
    const contentEl = document.getElementById('content');
    contentEl.innerHTML = marked.parse(md, { gfm: true, breaks: false });

    // Add IDs to headings
    const headings = contentEl.querySelectorAll('h2, h3');
    headings.forEach((h, i) => {
      const id = 'sec-' + i;
      h.id = id;
    });

    // Build TOC
    const tocList = document.getElementById('toc-list');
    headings.forEach(h => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      a.className = h.tagName === 'H2' ? 'toc-h2' : 'toc-h3';
      a.onclick = (e) => {
        e.preventDefault();
        document.getElementById(h.id).scrollIntoView({ behavior: 'smooth' });
        if (window.innerWidth <= 960) document.getElementById('toc').classList.remove('open');
      };
      li.appendChild(a);
      tocList.appendChild(li);
    });

    // Scroll spy
    const tocLinks = tocList.querySelectorAll('a');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          tocLinks.forEach(a => a.classList.remove('active'));
          const active = tocList.querySelector('a[href="#' + entry.target.id + '"]');
          if (active) active.classList.add('active');
        }
      });
    }, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
    headings.forEach(h => observer.observe(h));

    // Theme
    function toggleTheme() {
      const html = document.documentElement;
      html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', html.dataset.theme);
    }
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.dataset.theme = 'dark';
    }

    // Mobile TOC
    function toggleToc() {
      document.getElementById('toc').classList.toggle('open');
    }

    // Lightbox
    let scale = 1;
    contentEl.querySelectorAll('img').forEach(img => {
      img.addEventListener('click', () => {
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightbox-img');
        lbImg.src = img.src;
        lbImg.style.transform = 'scale(1)';
        scale = 1;
        lb.classList.add('active');
      });
    });
    function closeLightbox(e) {
      if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('active');
    }
    const lbImg = document.getElementById('lightbox-img');
    document.getElementById('lightbox').addEventListener('wheel', (e) => {
      e.preventDefault();
      scale += e.deltaY * -0.001;
      scale = Math.min(Math.max(0.5, scale), 4);
      lbImg.style.transform = 'scale(' + scale + ')';
    });
  </script>
