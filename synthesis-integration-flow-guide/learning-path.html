:root {

  --muted: #64748b;

body {

/* Image lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0.25s ease;
  cursor: grab;
}
.lightbox.active {
  opacity: 1;
  visibility: visible;
}
.lightbox img {
  max-width: none;
  max-height: none;
  border: none;
  border-radius: 4px;
  cursor: grab;
  transform-origin: center center;
  transition: none;
  margin: 0;
}
.lightbox img.grabbing { cursor: grabbing; }
.lightbox .hint {
  position: absolute;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  pointer-events: none;
  user-select: none;
  background: rgba(0,0,0,0.4);
  padding: 6px 14px;
  border-radius: 20px;
}
.lightbox .close {
  position: absolute;
  top: 20px;
  right: 24px;
  color: rgba(255,255,255,0.8);
  font-size: 32px;
  line-height: 1;
  cursor: pointer;
  user-select: none;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: background 0.2s;
}
.lightbox .close:hover { background: rgba(255,255,255,0.15); color: #fff; }

/* Hover glossary tooltip */
.term {
  position: relative;
  border-bottom: 1px dashed var(--accent);
  cursor: help;
  color: var(--accent);
  transition: background 0.15s ease, border-bottom-style 0.15s ease;
}
.term:hover {
  background: var(--accent-soft);
  border-bottom-style: solid;
  border-radius: 4px;
}
.term-tooltip {
  position: fixed;
  max-width: 320px;
  padding: 14px 18px;
  --tooltip-bg-rgb: 219, 234, 254;
  background: rgba(var(--tooltip-bg-rgb), 0.88);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  font-size: 14px;
  line-height: 1.7;
  z-index: 1000;
  opacity: 0;
  transform: translateY(8px) scale(0.98);
  transition: opacity 0.25s ease, transform 0.25s ease;
  pointer-events: none;
}
.term-tooltip.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.term-tooltip::after {
  content: '';
  position: absolute;
  left: 50%;
  width: 0;
  height: 0;
  border-style: solid;
  transform: translateX(-50%);
}
.term-tooltip.arrow-bottom::after {
  bottom: -10px;
  border-width: 10px 8px 0 8px;
  border-color: var(--line) transparent transparent transparent;
}
.term-tooltip.arrow-bottom::before {
  content: '';
  position: absolute;
  left: 50%;
  bottom: -8px;
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 8px 7px 0 7px;
  border-color: rgba(var(--tooltip-bg-rgb), 0.88) transparent transparent transparent;
  transform: translateX(-50%);
}
.term-tooltip.arrow-top::after {
  top: -10px;
  border-width: 0 8px 10px 8px;
  border-color: transparent transparent var(--line) transparent;
}
.term-tooltip.arrow-top::before {
  content: '';
  position: absolute;
  left: 50%;
  top: -8px;
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 0 7px 8px 7px;
  border-color: transparent transparent rgba(var(--tooltip-bg-rgb), 0.88) transparent;
  transform: translateX(-50%);
}

  
@media (prefers-color-scheme: dark) {
  .term-tooltip {
    --tooltip-bg-rgb: 30, 58, 138;
  }
}

# 九、学习路径与实操练习

&gt; 按 flow 顺序动手跑一遍，每步跑完把指定截图贴回来核对结果、指出问题；确认后的好图可以嵌进网站对应页面当示例。

建议节奏：第 1 → 5 步是主线，跑通即掌握交付全流程；第 6 步是当前项目最核心也最依赖经验的部分，值得多练。

每步的「跑」和「截图」行动项可以直接勾选记录进度；勾选状态保存在浏览器本地（localStorage），换浏览器或清除缓存会重置。

<div class="statbar">
  <div class="stat"><div class="num">6</div><div class="lbl">学习步骤</div></div>
  <div class="stat"><div class="num">13</div><div class="lbl">反馈截图</div></div>
  <div class="stat"><div class="num ok">19</div><div class="lbl">勾选项</div></div>
</div>

<div class="check-progress" id="check-progress"></div>

---

## 1. 环境配置（对照 [「环境与配置」](./environment.html) 页）

- [ ] **跑**：`design.set` 传入 top name；确认 source 的工具版本（Verdi / VCS 固定 18.19）
- [ ] **截图** ①：初始化后的目录结构
- [ ] **截图** ②：工具版本输出
- **核对点**：<span class="badge badge-pending">常见坑</span> 版本是否 source 对（跑 PT / DC 报奇怪错误的第一嫌疑）

## 2. RTL 检查（对照 [「RTL 检查」](./rtl-check.html) 页）

- [ ] **跑**：`bsub -Ip run_ckf 1`（batch 参数，所有 `run_*` 入口同一约定：带参数 = 跑完自动 exit）、nLint
- [ ] **截图** ③：CKF 结果尾部
- [ ] **截图** ④：nLint error / warning 汇总（有 error 截前几条）
- **核对点**：<span class="badge badge-rtl">必查</span> 哪些 error 必须修、哪些 warning 可以进 waive list

## 3. DC 综合（对照 [「综合」](./synthesis-upf.html) 页）

- [ ] **跑**：compile 脚本
- [ ] **截图** ⑤：DC 结束的 timing / area summary
- [ ] **截图** ⑥：unconstrained paths report（prePT 里对应 `pt_rpt/${TOP_NAME}_cons.rpt`）
- **核对点**：<span class="badge badge-rtl">必查</span> 有无未收敛 violation（有的话面积数据是假的，不能交付）

## 4. LEC（对照 [「LEC 验证」](./lec.html) 页）

- [ ] **跑**：LEC
- [ ] **截图** ⑦：log 最后一行的 pass 字样（不是"没弹窗"就算过）
- **核对点**：<span class="badge badge-pending">常见坑</span> 是真 pass 还是根本没跑起来；有 unmapped 点要追原因

## 5. prePT + signoff（对照 [「APR SIGNOFF」](./signoff-timing.html) 页）

- [ ] **跑**：prePT（`cd pt && run_pt`），然后 `signoff`
- [ ] **截图** ⑧：pt.log 无 error + rpt 里 slack &gt; 0
- [ ] **截图** ⑨：prePT 的 DFF per clock（`report_dff_num.rpt`）/ floating 列表（`pt_input_float.log`）
- [ ] **截图** ⑩：signoff pass 界面
- **核对点**：<span class="badge badge-rtl">必查</span> unconstrained / floating 有无风险项（这两类交付出去是重大 bug）

## 6. PT 深入（对照 [「POSTPT」](./pt-intro.html) 页，重点）

- [ ] **跑**：批量脚本跑全 corner PT → run summary；再开一个 live PT 练手
- [ ] **截图** ⑪：summary latest 全 corner setup / hold / transition 汇总
- [ ] **截图** ⑫：live PT 里一条 `report_timing -input_pins` 完整路径报告
- [ ] **截图** ⑬：自动生成的汇总报表（实际产物是 CSV，如 `report_sd_busskew.csv`，导入 Excel 后上半 latency / 下半 skew）
- **核对点**：<span class="badge badge-rtl">必查</span> 会不会看 latency 判断 clock tree 有没有做歪、能不能认出假路径（经过准静态 mux 的那种）、skew 分组是否合理

---

每步的图贴回后，按「结果判读 + 问题指出 + 下一步建议」给反馈。

let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;

function openLightbox(src) {
  lbImg.src = src;
  scale = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
  lightbox.classList.add('active');
}

function closeLightbox() {
  lightbox.classList.remove('active');
}

function updateTransform() {
  lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

document.addEventListener('click', (e) => {
  const img = e.target.closest('img');
  if (!img || img.id === 'lightbox-img' || !img.closest('.article')) return;
  openLightbox(img.src);
});

lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

lightbox.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  scale = Math.min(Math.max(0.5, scale + delta), 4);
  updateTransform();
});

lbImg.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  lbImg.classList.add('grabbing');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  updateTransform();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.classList.remove('grabbing');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
});

  </script>

  <script>
const article = document.getElementById('article');
article.innerHTML = marked.parse(document.getElementById('md').textContent, {gfm:true, breaks:false});
applyGlossary(article);

// Interactive checklist with localStorage persistence
(function () {
  const boxes = article.querySelectorAll('li > input[type="checkbox"]');
  if (!boxes.length) return;
  const KEY = 'learning-path-checks';
  let state = {};
  try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
  const progressEl = document.getElementById('check-progress');
  function updateProgress() {
    const total = boxes.length;
    const done = Array.from(boxes).filter(b => b.checked).length;
    if (!progressEl) return;
    const pct = total ? Math.round(done / total * 100) : 0;
    progressEl.innerHTML =
      '<span class="progress-text">已完成 ' + done + ' / ' + total + ' 项</span>' +
      '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<button type="button" id="check-reset">重置进度</button>';
    document.getElementById('check-reset').addEventListener('click', () => {
      state = {};
      localStorage.removeItem(KEY);
      boxes.forEach(b => { b.checked = false; b.closest('li').classList.remove('done'); });
      updateProgress();
    });
  }
  boxes.forEach((box, i) => {
    box.disabled = false;
    box.id = 'lp-' + i;
    box.checked = !!state[box.id];
    box.closest('li').classList.toggle('done', box.checked);
    box.addEventListener('change', () => {
      state[box.id] = box.checked;
      localStorage.setItem(KEY, JSON.stringify(state));
      box.closest('li').classList.toggle('done', box.checked);
      updateProgress();
    });
  });
  updateProgress();
})();
const toc = document.getElementById('toc');
const h1 = article.querySelector('h1');
const headings = article.querySelectorAll('h2, h3');
headings.forEach((h, i) => { h.id = 'sec-' + i; });

// 标题统一自动编号：h2 = "N."，h3 = "N.M"；先剥离手写编号再重排，只改首个文本节点以保留标题内链接
let h2No = 0, h3No = 0;
headings.forEach(h => {
  if (h.firstChild && h.firstChild.nodeType === 3) {
    h.firstChild.nodeValue = h.firstChild.nodeValue.replace(/^\s*\d+(\.\d+)*[.、]?\s+/, '');
  }
  if (h.tagName === 'H2') {
    h2No++; h3No = 0;
    h.prepend(document.createTextNode(h2No + '. '));
  } else {
    h3No++;
    h.prepend(document.createTextNode(h2No + '.' + h3No + ' '));
  }
});

let tocHtml = '';
if (h1) {
  tocHtml += `<a class="toc-h1" href="#">${h1.textContent}</a>`;
}
tocHtml += '<ul style="list-style:none;padding:0;margin:0;">';
const h3ToH2 = {};
for (let i = 0; i < headings.length; i++) {
  const h = headings[i];
  if (h.tagName !== 'H2') continue;
  const children = [];
  let j = i + 1;
  while (j < headings.length && headings[j].tagName === 'H3') {
    children.push(headings[j]);
    h3ToH2[headings[j].id] = h.id;
    j++;
  }
  const arrow = children.length > 0
    ? `<span class="toc-arrow open" data-target="${h.id}">▸</span>`
    : '<span class="toc-arrow-spacer"></span>';
  tocHtml += `<li class="toc-h2-item">${arrow}<a href="#${h.id}">${h.textContent}</a></li>`;
  if (children.length > 0) {
    tocHtml += `<li class="toc-h3-group" data-group="${h.id}"><ul style="list-style:none;padding:0;margin:0;">`;
    children.forEach(c => {
      tocHtml += `<li><a class="toc-h3" href="#${c.id}">${c.textContent}</a></li>`;
    });
    tocHtml += '</ul></li>';
  }
}
tocHtml += '</ul>';
toc.innerHTML = tocHtml;

toc.querySelectorAll('.toc-arrow').forEach(arrow => {
  arrow.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const group = toc.querySelector('.toc-h3-group[data-group="' + arrow.dataset.target + '"]');
    const collapsed = group.classList.toggle('collapsed');
    arrow.classList.toggle('open', !collapsed);
    if (collapsed) {
      const activeInGroup = group.querySelector('a.active');
      if (activeInGroup) {
        activeInGroup.classList.remove('active');
        const parentLink = toc.querySelector('a[href="#' + arrow.dataset.target + '"]');
        if (parentLink) parentLink.classList.add('active');
      }
    }
  });
});

const tocLinks = toc.querySelectorAll('a[href^="#"]');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(a => a.classList.remove('active'));
      let targetId = entry.target.id;
      if (h3ToH2[targetId]) {
        const group = toc.querySelector('.toc-h3-group[data-group="' + h3ToH2[targetId] + '"]');
        if (group && group.classList.contains('collapsed')) {
          targetId = h3ToH2[targetId];
        }
      }
      const active = toc.querySelector('a[href="#' + targetId + '"]');
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
headings.forEach(h => observer.observe(h));
</script>
