/* Image lightbox */
.lightbox {
  position: fixed;

  background: rgba(0,0,0,0.92);

  <script type="text/template" id="md">
# 九、学习路径与实操练习

&gt; 按 flow 顺序动手跑一遍，每步跑完把指定截图贴回来核对结果、指出问题；确认后的好图可以嵌进网站对应页面当示例。

建议节奏：第 1 → 5 步是主线，跑通即掌握交付全流程；第 6 步是当前项目最核心也最依赖经验的部分，值得多练。

---

## 1. 环境配置（对照 [「环境与配置」](./environment.html) 页）

- **跑**：`design.set` 传入 top name；确认 source 的工具版本（Verdi / VCS 固定 18.19）
- **截图**：① 初始化后的目录结构；② 工具版本输出
- **核对点**：版本是否 source 对（跑 PT / DC 报奇怪错误的第一嫌疑）

## 2. RTL 检查（对照 [「RTL 检查」](./rtl-check.html) 页）

- **跑**：`bsub -Ip run_ckf 1`（尾部必须加 `1`）、nLint
- **截图**：③ CKF 结果尾部；④ nLint error / warning 汇总（有 error 截前几条）
- **核对点**：哪些 error 必须修、哪些 warning 可以进 waive list

## 3. DC 综合（对照 [「综合与 UPF」](./synthesis-upf.html) 页）

- **跑**：compile 脚本
- **截图**：⑤ DC 结束的 timing / area summary；⑥ unconstrained paths report
- **核对点**：有无未收敛 violation（有的话面积数据是假的，不能交付）

## 4. LEC（对照 [「LEC 验证」](./lec.html) 页）

- **跑**：LEC
- **截图**：⑦ log 最后一行的 pass 字样（不是"没弹窗"就算过）
- **核对点**：是真 pass 还是根本没跑起来；有 unmapped 点要追原因

## 5. prePT + signoff（对照 [「Signoff 与时序」](./signoff-timing.html) 页）

- **跑**：prePT（`cd pt && run_pt`），然后 `signoff`
- **截图**：⑧ pt.log 无 error + rpt 里 slack &gt; 0；⑨ prePT log 的 DFF per clock / floating 列表；⑩ signoff pass 界面
- **核对点**：unconstrained / floating 有无风险项（这两类交付出去是重大 bug）

## 6. PT 深入（对照 [「PT 介绍」](./pt-intro.html) 页，重点）

- **跑**：批量脚本跑全 corner PT → run summary；再开一个 live PT 练手
- **截图**：⑪ summary latest 全 corner setup / hold / transition 汇总；⑫ live PT 里一条 `report_timing -input_pins` 完整路径报告；⑬ 自动生成的 Excel 报表（上半 latency / 下半 skew）
- **核对点**：会不会看 latency 判断 clock tree 有没有做歪、能不能认出假路径（经过准静态 mux 的那种）、skew 分组是否合理

---

每步的图贴回后，按「结果判读 + 问题指出 + 下一步建议」给反馈。

const chapters = [

  <div class="lightbox" id="lightbox">
    <span class="close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
    <div class="hint">滚轮缩放 · 拖拽移动 · 点击空白处或右上角关闭</div>
  </div>

  <script>

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;

function openLightbox(src) {
  lbImg.src = src;
  scale = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
  lightbox.classList.add('active');
}

function closeLightbox() {
  lightbox.classList.remove('active');
}

function updateTransform() {
  lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

document.querySelectorAll('img').forEach(img => {
  if (img.id === 'lightbox-img') return;
  img.addEventListener('click', () => openLightbox(img.src));
});

lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

lightbox.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  scale = Math.min(Math.max(0.5, scale + delta), 4);
  updateTransform();
});

lbImg.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  lbImg.classList.add('grabbing');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  updateTransform();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.classList.remove('grabbing');
});

  </script>

  <script>
const article = document.getElementById('article');
article.innerHTML = marked.parse(document.getElementById('md').textContent, {gfm:true, breaks:false});
applyGlossary(article);
const toc = document.getElementById('toc');
const h1 = article.querySelector('h1');
let tocHtml = '';
if (h1) {
  tocHtml += `<a class="toc-h1" href="#">${h1.textContent}</a>`;
}
tocHtml += '<ul style="list-style:none;padding:0;margin:0;">';
const headings = article.querySelectorAll('h2, h3');
headings.forEach((h, i) => {
  const id = 'sec-' + i;
  h.id = id;
  const cls = h.tagName === 'H2' ? '' : 'toc-h3';
  tocHtml += `<li><a class="${cls}" href="#${id}">${h.textContent}</a></li>`;
});
tocHtml += '</ul>';
toc.innerHTML = tocHtml;

const tocLinks = toc.querySelectorAll('a[href^="#"]');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(a => a.classList.remove('active'));
      const active = toc.querySelector('a[href="#' + entry.target.id + '"]');
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
headings.forEach(h => observer.observe(h));
</script>
