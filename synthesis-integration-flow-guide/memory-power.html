# 七、Memory 与功耗仿真

&gt; 本章介绍 memory compiler 生成 memory、整理 DB、生成 mem_wrap，以及基于 PTPX 的功耗仿真流程。

## 1. Memory 与 mem_wrap 生成

NOTE: 当前 Driver 类项目均未使用 memory，flow 里 memory 相关配置不用改动；有 memory 的项目需把 memory 库加进 `common_db`。Memory Compiler 流程由专业团队长期维护，带存储需求的项目（涉及 MBIST、CP test）可直接复用其成熟流程。

### 1.1 生成 memory
利用 memory compiler 工具，按工艺要求填写：
- word / bit / byte（byte 通常写 1）
- ring layer（决定 memory 方向）：例如 `2233` 为横向，`3322` 为竖向
- bus format 选 YES，保证总线信号打包
- feature 选择 Generic

### 1.2 整理 lib / DB
1. 修改 `sram.list`、`corner.list`、`gen_tcl.pl`
2. 执行 `gen_tcl.pl`，生成 `cp_lib` 和 `gen_db_tcl`
3. 创建 `cfg cir db ds dummy gds lef lib lvlib sim pglib` 等目录
4. 执行 `cp_lib`
5. 执行 `run_lc` 生成 db（可跳过，直接执行 merge）
6. merge lib 和 db：执行 `do_merge_db` 与 `do_merge_back`
7. 将 `mem_db` 复制到 database 下（只复制 corner 目录，不复制 `*_merged` 目录）

### 1.3 生成 mem_wrap

1. 修改 memory wrapper config，常见字段：
   - `wrapper_name`：按命名规则填写，如 `mem_wrap_1p_208_640_x2`
   - `msize`：memory depth
   - `mwide`：memory width（若 byte_num 不为 1，需按实际位宽填写）
   - `mem_num`：memory 个数
   - 添加 `pg_en`、`repair` 列，默认 0
2. source `run.tcl` 生成 wrapper.v 与 fault_info 文件
3. 将生成的 `.v` 复制到 `HDL/mem_wrap/`

---

## 2. 功耗仿真

功耗仿真通常在 `SYNTHESIS/top/power/0.px_template/` 下运行。

### 2.1 配置要点
1. `design.set` 中 `TOP_NAME` 改为实际顶层。
2. `px_cfg.tcl` 中修改：
   - `verilog_file`：PR release 的网表路径
   - `sdc_file`：post-PT release 的 SDC（注意 `sdc_version` 需改为 2.0）
   - `spec_dir`：PR release 的 timing 目录
   - `ip0_inst` / `ip0_strip` / `ip0_vcd`：对应顶层实例与 VCD 路径

3. 生成 VCD 前，需在 post-PT 对应 corner 生成 SDF，并在 post-sim case 中读取。

4. VCD 获取方式：
   - 将原来 dump fsdb 的函数换成 `$dumpvars` 直接 dump VCD；或

   - 从 fsdb 截取 VCD，例如：`fsdb2vcd chip_tb_top_000.fsdb -bt 500ps -et 700ps -o verilog.dump`

### 2.2 实例：生成 four-line 波形并让 PTPX 指向它

**① 在后仿 case 目录截取 four-line VCD**（`-bt` / `-et` 框出 4 条 line 的时间区间，输出 `.dump` 即 VCD 格式）：

```bash
cd /sim_dd/ymzhu/HV2M23/TOP_NETLIST_POST_TCON_C/t_8b2lane
bsub -Ip fsdb2vcd chip_tb_top_000.fsdb -bt 452us -et 467us -o four_line.dump
```

**② 修改 PTPX 路径下 `px_cfg.tcl` 的 `ip0_vcd` 指向这个 dump 文件**（同时核对 `verilog_file` / `sdc_file` / `spef_dir` / `ip0_inst` / `ip0_strip` 均指向对应 release 路径）：

![px_cfg.tcl 中 ip0_vcd 指向 four-line dump 文件](./image/17_px_cfg_ip0_vcd.jpg)

如图：`set ip0_vcd "/sim_dd/ymzhu/HV2M23/TOP_NETLIST_POST_TCON_C/four_line_fre1p8_2lane_tt_0729v0.dump"`；`power_mode` 用 `time_based`（按时间窗分析），`use_vcd_saif` 用 `vcd`。

### 2.3 运行与查看

```bash
run_ptpx
```

结果：
- `*_toggle_rate_detail.rpt`：toggle rate

- `*_power.rpt`：功耗结果
- 上层目录生成 fsdb，可用 Verdi 打开查看功耗波形

功耗报告实例：左侧 `rep_dir_<corner>/` 下生成 `*_power.rpt`、`*_toggle_rate_detail.rpt` 及各项日志；右侧 `*_power.rpt` 的 Hierarchy 表中，顶层（如 `HV2M23_digital_top`）一行的 **Total Power** 列即为全芯片总功耗（图中 `1.50e-02 W`，占比 100%），其下各行为子模块/实例的功耗拆分。

![PTPX 功耗报告实例：TOTAL POWER 位置](./image/18_ptpx_power_rpt_total.jpg)

功耗报告判读重点（完整报告：<a href="./server-reports/HV2M23_digital_top.rpt" target="_blank">HV2M23_digital_top.rpt</a>；逐配置版本见 <a href="./server-reports/power/px_85c_random/" target="_blank">power/px_85c_random</a> 下各 rep_dir）——看 Hierarchy 表顶层行的 **Total Power**：

```text
                          Int       Switch    Leak      Total
Hierarchy                 Power     Power     Power     Power    %
------------------------------------------------------------------------
HV2M23_digital_top        1.14e-02  2.30e-03  1.61e-04  1.38e-02  100.0
```

- 判读时先看 **Total Power**（总功耗，上例 1.38e-02 W ≈ 13.8 mW），Int / Switch / Leak 为其拆分项；
- 三个 rep_dir 对应不同 lane / 频率配置（1lane_fre1p8 / 2lane_fre1p8 / 2lane_fre0p9），Total 随配置不同在 7.6e-03 ~ 1.5e-02 W（约 7.6 ~ 15 mW）之间。

  <script>

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;

function openLightbox(src) {
  lbImg.src = src;
  scale = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
  lightbox.classList.add('active');
}

function closeLightbox() {
  lightbox.classList.remove('active');
}

function updateTransform() {
  lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

document.addEventListener('click', (e) => {
  const img = e.target.closest('img');
  if (!img || img.id === 'lightbox-img' || !img.closest('.article')) return;
  openLightbox(img.src);
});

lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

lightbox.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  scale = Math.min(Math.max(0.5, scale + delta), 4);
  updateTransform();
});

lbImg.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  lbImg.classList.add('grabbing');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  updateTransform();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.classList.remove('grabbing');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
});

  </script>

  <script>
const article = document.getElementById('article');
article.innerHTML = marked.parse(document.getElementById('md').textContent, {gfm:true, breaks:false});
applyGlossary(article);
const toc = document.getElementById('toc');
const h1 = article.querySelector('h1');
const headings = article.querySelectorAll('h2, h3');
headings.forEach((h, i) => { h.id = 'sec-' + i; });

// 标题统一自动编号：h2 = "N."，h3 = "N.M"；先剥离手写编号再重排，只改首个文本节点以保留标题内链接
let h2No = 0, h3No = 0;
headings.forEach(h => {
  if (h.firstChild && h.firstChild.nodeType === 3) {
    h.firstChild.nodeValue = h.firstChild.nodeValue.replace(/^\s*\d+(\.\d+)*[.、]?\s+/, '');
  }
  if (h.tagName === 'H2') {
    h2No++; h3No = 0;
    h.prepend(document.createTextNode(h2No + '. '));
  } else {
    h3No++;
    h.prepend(document.createTextNode(h2No + '.' + h3No + ' '));
  }
});

let tocHtml = '';
if (h1) {
  tocHtml += `<a class="toc-h1" href="#">${h1.textContent}</a>`;
}
tocHtml += '<ul style="list-style:none;padding:0;margin:0;">';
const h3ToH2 = {};
for (let i = 0; i < headings.length; i++) {
  const h = headings[i];
  if (h.tagName !== 'H2') continue;
  const children = [];
  let j = i + 1;
  while (j < headings.length && headings[j].tagName === 'H3') {
    children.push(headings[j]);
    h3ToH2[headings[j].id] = h.id;
    j++;
  }
  const arrow = children.length > 0
    ? `<span class="toc-arrow open" data-target="${h.id}">▸</span>`
    : '<span class="toc-arrow-spacer"></span>';
  tocHtml += `<li class="toc-h2-item">${arrow}<a href="#${h.id}">${h.textContent}</a></li>`;
  if (children.length > 0) {
    tocHtml += `<li class="toc-h3-group" data-group="${h.id}"><ul style="list-style:none;padding:0;margin:0;">`;
    children.forEach(c => {
      tocHtml += `<li><a class="toc-h3" href="#${c.id}">${c.textContent}</a></li>`;
    });
    tocHtml += '</ul></li>';
  }
}
tocHtml += '</ul>';
toc.innerHTML = tocHtml;

toc.querySelectorAll('.toc-arrow').forEach(arrow => {
  arrow.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const group = toc.querySelector('.toc-h3-group[data-group="' + arrow.dataset.target + '"]');
    const collapsed = group.classList.toggle('collapsed');
    arrow.classList.toggle('open', !collapsed);
    if (collapsed) {
      const activeInGroup = group.querySelector('a.active');
      if (activeInGroup) {
        activeInGroup.classList.remove('active');
        const parentLink = toc.querySelector('a[href="#' + arrow.dataset.target + '"]');
        if (parentLink) parentLink.classList.add('active');
      }
    }
  });
});

const tocLinks = toc.querySelectorAll('a[href^="#"]');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(a => a.classList.remove('active'));
      let targetId = entry.target.id;
      if (h3ToH2[targetId]) {
        const group = toc.querySelector('.toc-h3-group[data-group="' + h3ToH2[targetId] + '"]');
        if (group && group.classList.contains('collapsed')) {
          targetId = h3ToH2[targetId];
        }
      }
      const active = toc.querySelector('a[href="#' + targetId + '"]');
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
headings.forEach(h => observer.observe(h));
</script>
</body>
