# 六、Memory 与功耗仿真

&gt; 本章介绍 memory compiler 生成 memory、整理 DB、生成 mem_wrap，以及基于 PTPX 的功耗仿真流程。

## 1. Memory 与 mem_wrap 生成

### 1.1 生成 memory
利用 memory compiler 工具，按工艺要求填写：
- word / bit / byte（byte 通常写 1）
- ring layer（决定 memory 方向）：例如 `2233` 为横向，`3322` 为竖向
- bus format 选 YES，保证总线信号打包
- feature 选择 Generic

### 1.2 整理 lib / DB
1. 修改 `sram.list`、`corner.list`、`gen_tcl.pl`
2. 执行 `gen_tcl.pl`，生成 `cp_lib` 和 `gen_db_tcl`
3. 创建 `cfg cir db ds dummy gds lef lib lvlib sim pglib` 等目录
4. 执行 `cp_lib`
5. 执行 `run_lc` 生成 db（可跳过，直接执行 merge）
6. merge lib 和 db：执行 `do_merge_db` 与 `do_merge_back`
7. 将 `mem_db` 复制到 database 下（只复制 corner 目录，不复制 `*_merged` 目录）

### 1.3 生成 mem_wrap
1. 修改 memory wrapper config，常见字段：
   - `wrapper_name`：按命名规则填写，如 `mem_wrap_1p_208_640_x2`
   - `msize`：memory depth
   - `mwide`：memory width（若 byte_num 不为 1，需按实际位宽填写）
   - `mem_num`：memory 个数
   - 添加 `pg_en`、`repair` 列，默认 0
2. source `run.tcl` 生成 wrapper.v 与 fault_info 文件
3. 将生成的 `.v` 复制到 `HDL/mem_wrap/`

---

## 2. 功耗仿真

功耗仿真通常在 `SYNTHESIS/top/power/0.px_template/` 下运行。

### 2.1 配置要点
1. `design.set` 中 `TOP_NAME` 改为实际顶层。
2. `px_cfg.tcl` 中修改：
   - `verilog_file`：PR release 的网表路径
   - `sdc_file`：post-PT release 的 SDC（注意 `sdc_version` 需改为 2.0）
   - `spec_dir`：PR release 的 timing 目录
   - `ip0_inst` / `ip0_strip` / `ip0_vcd`：对应顶层实例与 VCD 路径
3. 生成 VCD 前，需在 post-PT 对应 corner 生成 SDF，并在 post-sim case 中读取。
4. VCD 获取方式：
   - 将原来 dump fsdb 的函数换成 `$dumpvars` 直接 dump VCD；或
   - 从 fsdb 截取 VCD，例如：`fsdb2vcd chip_tb_top_000.fsdb -bt 500ps -et 700ps -o verilog.dump`

### 2.2 运行与查看

```bash
run_ptpx
```

结果：
- `*_toggle_rate_detail.rpt`：toggle rate
- `*_power.rpt`：功耗结果
- 上层目录生成 fsdb，可用 Verdi 打开查看功耗波形

  <script>

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;

function openLightbox(src) {
  lbImg.src = src;
  scale = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
  lightbox.classList.add('active');
}

function closeLightbox() {
  lightbox.classList.remove('active');
}

function updateTransform() {
  lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

document.querySelectorAll('img').forEach(img => {
  if (img.id === 'lightbox-img') return;
  img.addEventListener('click', () => openLightbox(img.src));
});

lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

lightbox.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  scale = Math.min(Math.max(0.5, scale + delta), 4);
  updateTransform();
});

lbImg.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  lbImg.classList.add('grabbing');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  updateTransform();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.classList.remove('grabbing');
});

  </script>

const headings = article.querySelectorAll('h2, h3');
headings.forEach((h, i) => {
  const id = 'sec-' + i;

  const cls = h.tagName === 'H2' ? '' : 'toc-h3';
  tocHtml += `<li><a class="${cls}" href="#${id}">${h.textContent}</a></li>`;
});
tocHtml += '</ul>';
toc.innerHTML = tocHtml;

const tocLinks = toc.querySelectorAll('a[href^="#"]');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(a => a.classList.remove('active'));
      const active = toc.querySelector('a[href="#' + entry.target.id + '"]');
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
headings.forEach(h => observer.observe(h));
</script>
