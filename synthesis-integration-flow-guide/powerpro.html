# 八、PowerPro 功耗评估

&gt; 本章基于 PowerPro 低功耗设计培训（2025 年 6 月）整理，收录课件功耗评估部分：功耗构成与评估工具、PowerPro 环境搭建、运行与 report 检查。命令与路径按原文保留。

## 1. 功耗基础与评估工具

### 1.1 功耗构成

- **静态功耗（leakage power）**：漏电流功耗，与工艺库、电压、温度相关。漏电关系 LVT &gt; SVT &gt; HVT；与电压成正比，与温度成指数关系。
- **动态功耗（dynamic power）**：晶体管跳变产生的功耗，包含两部分：
  - switching power：`P = C · Vdd² · Fclock`——与频率、关断时的负载电容、电压平方成正比；
  - internal power：`P = tsc · Vdd · Ipeak · Fclock`——与频率、电流、电压成正比。

![功耗的构成：静态功耗与动态功耗](./image/powerpro/slide_5.jpg)

### 1.2 评估工具对比

| 工具 | 评估阶段 | 级别 / 负责人 | 读取文件 | 目标 |
|------|----------|---------------|----------|------|
| RedHawk | 设计后端 | whole chip，APR 同事 | APR 后 post-netlist + 带 SDF 后仿 VCD | 评估功耗对 IR drop 的影响，功耗值相对偏大 |
| PTPX | 设计后端 | whole chip，综合同事 | 同 RedHawk | 评估 whole-chip 功耗，与实际回片功耗对比 |
| PowerPro（RTL level） | IP RTL 设计阶段 | IP level 由 IP owner；chip level 由专人 | RTL code、sdc、前仿波形 | 初步评估功耗并进行低功耗设计优化；与回片实测有一定差距 |
| PowerPro（Gate level） | 设计后端 | whole chip，专人 | 同 PTPX | whole-chip 功耗，与 RTL level 及回片功耗对比 |

![评估工具：RedHawk 与 PTPX](./image/powerpro/slide_6.jpg)

![评估工具：PowerPro RTL / Gate level](./image/powerpro/slide_7.jpg)

### 1.3 评估条件

1. 工作模式：Idle mode 做漏电流分析与优化；Function mode 做最大功耗评估与优化。采用 **1 个 idle mode + N 个 function mode** 进行评估。
2. 工作条件：TT corner、typical voltage、normal temperature **85°C**（lib 中无 85°C 时可选 125°C）。

KEY: 务必确保实测功耗时的条件与评估功耗时的条件一致，否则对比无意义。

![PowerPro 评估条件](./image/powerpro/slide_8.jpg)

## 2. PowerPro 环境搭建与运行

PowerPro 已集成到 IP 综合环境，`gensyn` 生成环境时自动创建 powerpro 目录：

| 目录 / 文件 | 用途 |
|-------------|------|
| `fsdb/` | 存放仿真波形 |
| `sdc/` | 存放约束文件 |
| `WORK/` | powerpro report 目录 |
| `script/` | 存放 vector 脚本 |
| `run_power_opt` | powerpro 运行脚本 |

![PowerPro 目录结构](./image/powerpro/slide_9.jpg)

### 2.1 搭建步骤

1. **RTL filelist**：维护 `syn_<ip>/filelist/` 下的 `<ip>.f` 与 `<ip>.sv.f`。
2. **link 波形**：将仿真波形 link 到 `fsdb/` 目录。
3. **design.set 指定波形与层次**：

```tcl
set FSDB_FILE  "fsdb/xxx.fsdb"    # 指定波形文件
set FSDB_HIER  "tb.wdut.u_ip"     # IP_TOP 在仿真波形中的层次
```

   可截取波形某一段做评估：`fsdbextract xxx.fsdb -bt xxxtime -et xxxtime -o xxx.fsdb`（`-bt` begin time、`-et` end time、`-o` 输出文件名）。

4. **design.set 指定约束**：

```tcl
set CLOCK_MCP_CASE_SDC  "./sdc/<ip>.sdc"     # IP 约束文件
set CORNER  "tt_typical_85_setup"            # lib 无 85 度则用 125 度
```

![搭建 PowerPro 环境（filelist / 波形 / design.set）](./image/powerpro/slide_10.jpg)

5. **时钟约束**（在 `sdc/<ip>.sdc` 中增加）：

```tcl
set CLK_NAME_PERIOD [expr 1000.0/720]
create_clock -name clk_name -period $CLK_NAME_PERIOD clk                    # clk 为输入 input
create_clock -name clk_name -period $CLK_NAME_PERIOD [get_pins xxx/xxx/xxx] # clk 为内部信号
create_generated_clock [get_pins xxx/xxx] -name clk_name -source <reference_pin> -divide_by <N>
```

6. **设置不优化的 module**：环境默认将 STD_IP 和 clk_cell 设为不优化；IP 有其他需求时在 `syn_<ip>/powerpro/script/user_config.tcl` 中追加，格式：`set_gray_box –module kv_sync_clkgated`。

![搭建 PowerPro 环境（时钟约束 / gray box）](./image/powerpro/slide_11.jpg)

### 2.2 运行

```bash
source /eda/env/NEXT/powerpro2024.2.1.cshrc   # ① license / 环境
cd powerpro
bsub -Ip run_power_opt                        # ② 运行
python3 powerpro_script.py                    # ③ 生成 report_info（重要信息汇总，逐项 check）
python3 powerpro_chk.py report_info report_info2  # 生成 report_info2（末 3 行为指标占比）
show_analyzer                                 # ④ 启动图形化界面
```

![运行 PowerPro](./image/powerpro/slide_12.jpg)

### 2.3 report 检查

- 打开 `powerpro.log`，**反标率需 100%**；
- 打开 `sa.log`，查看未反标的信号并清理；
- 打开 `sa.log`，查看 `X` 态信号并清理。

![report 检查实例：powerpro.log 反标率 / sa.log 未反标与 X 态](./image/powerpro/slide_13.jpg)

- 查看 IP Efficiency：重点关注 Memory Gating Efficiency、CG Efficiency 与 Power Summary 各分组占比。

![IP Efficiency 示例](./image/powerpro/slide_14.jpg)

- observability 优化后的 efficiency：关注 CG Efficiency 提升与 Register Power Saved。

![observability 优化后的 efficiency](./image/powerpro/slide_15.jpg)

- Dashboard：总览 Design Statistics（Flop / Memory / CG Efficiency）、Design Power、Early Design Checks 与各类 Redundancy 计数。

![PowerPro Dashboard](./image/powerpro/slide_16.jpg)

- GUI 中还可以直接下钻：如 Dashboard → Memory Info 逐个看 memory 的 Leakage Power，左下角可 Export as PowerPro Command Line 把当前视图导出为命令行复现。

![Dashboard：Memory Info 下钻与导出命令行](./image/powerpro/slide_20.jpg)

### 2.4 常见问题

1. **读取 VHDL 文件**：VHDL 与 Verilog 需分开读取，不同 library 分别读取，且不能读取无法综合的文件：`read_design –library grlib –vhdl –f xxx/xxx.vhd.f`。
2. **filelist 同时含 VHDL 和 Verilog**：仅 verilog 时 `build_design –sv –top ${module_top} –f $RTL_FILE_LIST $DEFINE`；混合时分步 build：`source $VHDL_FILE_LIST` → `read_design –sv –f $RTL_FILE_LIST $DEFINE` → `link_design –top ${module_top}` → `build_db`。
3. **退出命令行后快速恢复**：首次运行时各阶段可用 `write_db xxx.db` 保存 database；重启后 `read_db xxx.db` 直接调入继续。
4. **build_design 出错**：PowerPro 读取的 RTL 必须是可综合代码，无法综合会 internal ERROR 退出。查看 `WORK/build_design.log`，如出现 `$display` 等，可在 design.set 中设定 `set NET_DEFINE [list "SYNTHESIS"]`。
5. **Missing definitions**：查看 `WORK/create_bbox.tcl` 中需设成 box 的模块名进行 debug。
6. **create_black_box 失效**：高版本机制不同，加 `set_global __auto_port_inferencing 1` 恢复原机制。
7. **数组无法 dump 波形**：在 dump_waveform.v 中增加 `$fsdbDumpvars(0, bench_top.u_top);` 与 `$fsdbDumpMDA(bench_top.u_top);`。
8. **导出各 hier 功耗到 Excel**：`report_power -hierarchical -csv -filename xxx.csv`；单项指标用 `report_format –metric "Clock Toggle – Data Stable" –csv –filename ctds_pwr.csv`（另有 `Clock Gating`、`Not Combinationally Enabled Flops`）。
9. **RTL level 与 gate level 功耗差异**：PowerPro 预综合不考虑时序；实际综合因时序紧张采用 LVT cell 后，gate level 功耗会比 RTL level 大，主要是 LVT leakage 大。

  <div class="lightbox" id="lightbox">

  <script>

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;

function openLightbox(src) {
  lbImg.src = src;
  scale = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
  lightbox.classList.add('active');
}

function closeLightbox() {
  lightbox.classList.remove('active');
}

function updateTransform() {
  lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

document.addEventListener('click', (e) => {
  const img = e.target.closest('img');
  if (!img || img.id === 'lightbox-img' || !img.closest('.article')) return;
  openLightbox(img.src);
});

lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

lightbox.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  scale = Math.min(Math.max(0.5, scale + delta), 4);
  updateTransform();
});

lbImg.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  lbImg.classList.add('grabbing');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  updateTransform();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.classList.remove('grabbing');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
});

  </script>

  <script>
const article = document.getElementById('article');
article.innerHTML = marked.parse(document.getElementById('md').textContent, {gfm:true, breaks:false});
applyGlossary(article);
const toc = document.getElementById('toc');
const h1 = article.querySelector('h1');
const headings = article.querySelectorAll('h2, h3');
headings.forEach((h, i) => { h.id = 'sec-' + i; });

// 标题统一自动编号：h2 = "N."，h3 = "N.M"；先剥离手写编号再重排，只改首个文本节点以保留标题内链接
let h2No = 0, h3No = 0;
headings.forEach(h => {
  if (h.firstChild && h.firstChild.nodeType === 3) {
    h.firstChild.nodeValue = h.firstChild.nodeValue.replace(/^\s*\d+(\.\d+)*[.、]?\s+/, '');
  }
  if (h.tagName === 'H2') {
    h2No++; h3No = 0;
    h.prepend(document.createTextNode(h2No + '. '));
  } else {
    h3No++;
    h.prepend(document.createTextNode(h2No + '.' + h3No + ' '));
  }
});

let tocHtml = '';
if (h1) {
  tocHtml += `<a class="toc-h1" href="#">${h1.textContent}</a>`;
}
tocHtml += '<ul style="list-style:none;padding:0;margin:0;">';
const h3ToH2 = {};
for (let i = 0; i < headings.length; i++) {
  const h = headings[i];
  if (h.tagName !== 'H2') continue;
  const children = [];
  let j = i + 1;
  while (j < headings.length && headings[j].tagName === 'H3') {
    children.push(headings[j]);
    h3ToH2[headings[j].id] = h.id;
    j++;
  }
  const arrow = children.length > 0
    ? `<span class="toc-arrow open" data-target="${h.id}">▸</span>`
    : '<span class="toc-arrow-spacer"></span>';
  tocHtml += `<li class="toc-h2-item">${arrow}<a href="#${h.id}">${h.textContent}</a></li>`;
  if (children.length > 0) {
    tocHtml += `<li class="toc-h3-group" data-group="${h.id}"><ul style="list-style:none;padding:0;margin:0;">`;
    children.forEach(c => {
      tocHtml += `<li><a class="toc-h3" href="#${c.id}">${c.textContent}</a></li>`;
    });
    tocHtml += '</ul></li>';
  }
}
tocHtml += '</ul>';
toc.innerHTML = tocHtml;

toc.querySelectorAll('.toc-arrow').forEach(arrow => {
  arrow.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const group = toc.querySelector('.toc-h3-group[data-group="' + arrow.dataset.target + '"]');
    const collapsed = group.classList.toggle('collapsed');
    arrow.classList.toggle('open', !collapsed);
    if (collapsed) {
      const activeInGroup = group.querySelector('a.active');
      if (activeInGroup) {
        activeInGroup.classList.remove('active');
        const parentLink = toc.querySelector('a[href="#' + arrow.dataset.target + '"]');
        if (parentLink) parentLink.classList.add('active');
      }
    }
  });
});

const tocLinks = toc.querySelectorAll('a[href^="#"]');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(a => a.classList.remove('active'));
      let targetId = entry.target.id;
      if (h3ToH2[targetId]) {
        const group = toc.querySelector('.toc-h3-group[data-group="' + h3ToH2[targetId] + '"]');
        if (group && group.classList.contains('collapsed')) {
          targetId = h3ToH2[targetId];
        }
      }
      const active = toc.querySelector('a[href="#' + targetId + '"]');
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
headings.forEach(h => observer.observe(h));
</script>
