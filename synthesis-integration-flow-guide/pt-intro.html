# 六、POSTPT：PrimeTime 时序分析方法论

&gt; 本篇覆盖 prePT / postPT 的**运行与配置**（什么时候做、怎么跑、产物给谁用），以及一次 PT（PrimeTime）培训会议整理的 **postPT 时序方法论**（STA 基础、环境与脚本、约束管理、skew 修调、报告解读、签核准则与常见坑）。人名与项目信息已泛化，所有数值与规则按原始记录保留。
&gt;
&gt; 章节分工：§1~§5 讲 prePT / postPT 的定位、跑法与产物（含 notimingcheck、SDF 生成）；§6 起为 postPT 方法论。signoff 检查与交付见 <a href="./signoff-timing.html" target="_blank">「APR SIGNOFF」</a>章。

## 1. prePT / postPT 在流程中的位置

### 1.1 prePT：DC 之后、交付 APR 之前的第一次全量 STA

prePT 的时机：**DC 综合完成之后、交付 APR 之前**，与 LEC 可并行（两者都只吃综合网表，互不依赖）。

为什么在这个节点做：prePT 是流程中第一个拿「综合网表 + 完整展开 SDC」做全量 STA 的节点。DC 阶段的 timing 只是 wireload 估计、约束未完整展开，不能作为时序结论；异步跨域、同步器、准静态路径只有在 prePT 报告里才看得全。

交付纪律：交付 APR 前必须在 prePT 报告中确认 unconstrained 清零、`pt.log` 无 Error、timing slack > 0（见 <a href="./signoff-timing.html" target="_blank">APR SIGNOFF</a> 章「交付前检查要点」）。

### 1.2 postPT：APR 返回之后的 signoff 级时序验收

postPT 的时机：**APR 后端输出网表 + spef + postcts SDC 之后**，是 APR 阶段的最终时序验收，以全 corner 结果为准。

### 1.3 prePT vs postPT 对比

| 维度 | prePT | postPT |
|------|-------|--------|
| 时机 | DC 之后、交付 APR 前 | APR 返回之后 |
| 输入 | 综合网表 + ip_cons 约束 | APR 网表 + spef + postcts SDC |
| 目的 | 约束展开与语法检查、简单 timing check、产出下游配置 | signoff 级全 corner 时序验收 |
| 主要产物 | sdc_pr 展开产物、cons.rpt（unconstrained）、notimingcheck 名单依据 | 各 corner timing 报告、SDF（供后仿） |
| 工具版本 | TOP 级 pt1806 / IP 级 pt1706 | 同左 |

---

## 2. prePT 运行与配置
```bash
cd pt
run_pt
```

prePT 的作用：把 constraint 展开成完整形式、检查 SDC 语法、做简单的 timing check。

- <a href="./script-dict.html#pt_setup_pre" target="_blank">pt_setup.tcl</a> 一般无需修改；其中 `set auto_wire_load_selection false` 是刻意关掉的——开着时 pre_pt 的 timing 会比 DC 的 timing 差得多。IP 级环境下 pt_setup.tcl 对应的是 `common_pt.tcl`。
- `common_db_pvt.tcl` 选择与实际综合一致的 corner（如 `wc_cworst`）。
- 注意 memory / analog 的 PVT 可能与标准单元不同。

检查项：
- `pt.log` 无 Error
- `*.rpt` 中 timing slack &gt; 0

运行路径：IP 路径和 TOP 路径下都有 prePT 脚本（两套环境的工具版本不同：IP 级用 pt1706，TOP 级用 pt1806），当前一般使用 TOP 路径下的版本；IP 路径下的脚本目前跑不过、待排查（在 IP 下跑的好处是 signoff 时 PT log / report 可以一起 signoff）。

prePT 产物中还可以查到（真实文件名）：
- unconstrained（未约束）路径列表——在 `pt_rpt/${TOP_NAME}_cons.rpt`
- SDC 语法错误——`read_sdc.log`
- 每个 clock 域下挂的 DFF 数量——`report_dff_num.rpt`
- floating 信号列表（APR 对接工程师有时需要）——`pt_input_float.log`

### 2.1 prePT 约束覆盖率（coverage）

prePT 阶段除了看时序违例，还要看**约束覆盖率**——报告 `pt_rpt/HV2M23_digital_top_coverage.rpt`（`report_analysis_coverage`，pt_report.tcl 自动生成）。

**判读口径：只看 Untested 列（必须 = 0）**；Violated 并入"已检查"看待——违例修调由 APR 负责，constraint 侧的职责是保证每条路径都被约束覆盖到。

报告有两版，注意区分（过滤清单定义在 `pt_report.tcl:10` 的 `COV_DISABLE`）：

![coverage 报告的 -exclude_untested 过滤机制](./image/39_cov_filter.png)

- **汇总版**（`*_coverage.rpt`）：带 `-exclude_untested {constant_disabled mode_disabled user_disabled no_paths false_paths}` 过滤——被过滤的类不显示；但 `no_clock` / `no_startpoint_clock`（异步复位类）**不在过滤清单里**，仍会计入 Untested
- **明细版**（`log/report_analysis_coverage.rpt`）：不带过滤的全量清单，用于逐条归因

2026-08-19 版报告（1P/2P 双模式，报告分存 `pt_rpt_1p/` / `pt_rpt_2p/`）：

| 检查类型 | 1P Total | 1P Untested | 2P Total | 2P Untested |
|---|---|---|---|---|
| setup | 4342 | 0 | 4736 | 0 |
| hold | 4342 | 0 | 4736 | 0 |
| recovery / removal | 418 / 418 | 0 | 418 / 418 | 0 |
| clock_gating setup/hold | 176 / 176 | 0 | 187 / 187 | 0 |
| out_setup | 647 | 0 | 648 | 0 |
| out_hold | 647 | 0 | 648 | 0 |
| **All Checks** | **11166** | **0** | **11978** | **0** |

Untested 归零的三类典型根因与处置（08/19 案例）：

- **通配符误挂**：`reg_*` output_delay 通配符罩住了纯透传端口 reg_lane_osr（输入 BW_MODE_I 直出、无寄存器）→ 从通配符与兜底条款两处摘除
- **约束缺半边**：PTAT_EN 只有 -min 缺 -max → 补齐成对（只写半边等于只卡半边）
- **异步复位起点无时钟**：BWDAL_rst 链 SB 由 XPONRST_I 直驱 → 补名义 input_delay（注释写明语义）后转 tested

配套机制：`SYNTHESIS/COVERAGE_ANALYSIS.md` 追踪基线 + waiver 清单；每次重跑后残量必须与 waiver 清单一致，**多一条查一条**。

> 1P/2P 拆分（08/19 起，TO 阶段手动维护）：prePT 报告分 `pt_rpt_1p/` / `pt_rpt_2p/`，sdc_pr 分 `*_1p.tcl` / `*_2p.tcl`（write_sdc 输出是模式相关的，单文件会被后跑的模式覆盖）。

## 3. prePT 产物：后仿 notimingcheck 配置
prePT 报告除了看时序，还有一个重要下游用途：**给 gate-level 后仿生成 notimingcheck 名单**。

![notimingcheck_DIG.cfg 实例](./image/06_notimingcheck_cfg.jpg)

配置文件（真实路径）：

```text
HV2M23/DV_TCON_C/script/notimingcheck_DIG.cfg
```

格式为逐行列 instance 的完整仿真层次：

```text
instance {chip_tb_top.u_<TOP>.u_<TOP>_digital_top.u_LOGIC_CENTER.LINK_LOGIC.U_SYNC_L0L1.<...>_reg} {noTiming};
```

**为什么在 prePT 之后做（而不是 DC 之后）：**

- 这个 cfg 是后仿（带 SDF 的 gate-level 仿真）用的，`noTiming` 让仿真工具不对这些 instance 做 setup / hold 等 timing check。
- 「哪些 instance 不需要 check」必须由**完整约束下的 STA 报告**判定——prePT 是第一个拿综合网表 + 完整展开 SDC 做全量 STA 的节点，异步跨域、同步器、准静态路径只有在 prePT 报告里才看得全。
- DC 阶段的 timing 只是 wireload 估计、约束未完整展开，不能作为「这条路径不用 check」的依据。
- 图中实例名单自己也证明了来源：`U_SYNC_L0L1`（同步器）、`U_L0_CIRC_DELAY_BUF`（环形 delay buffer）、`BLANK_EN_ASYNC`、`CSPI_CMD_ALIGN` 等，全是 STA 报告里「刻意不做时序检查」的异步 / 延时链寄存器。

**为什么需要它：** 后仿带 SDF 时，这些异步 / 延时 instance 会刷出大量假的 setup / hold violation 甚至 X 传播，把真实问题淹没；用 `noTiming` 屏蔽后仿真 log 才干净，真实 violation 才看得见。

**操作步骤：**

1. 跑完 prePT，看报告中的异步跨域 / unconstrained / 准静态路径；
2. 确认属于「不 check」的 instance（同步器、delay buffer、async 控制信号）；
3. 按仿真层次写进 `notimingcheck_DIG.cfg`；
4. 后仿环境读取该 cfg，仿真时这些 instance 不做 timing check。

注意：名单必须与 STA 报告逐条对应，漏加会被假 violation 淹没，错加会把真实时序问题掩盖掉——和 false path 一样需要人工逐条确认。

**修改 notimingcheck 后的重跑纪律：**

| 改动 | 重跑 DC | 重跑 prePT | 重跑后仿 |
|------|---------|-----------|---------|
| 只改 `notimingcheck_DIG.cfg`（名单增删） | ❌ 不需要——cfg 是仿真侧屏蔽名单，与综合网表无关 | ❌ 不需要——cfg 不影响 prePT 运行 | ✅ 需要——仿真重新读 cfg 才生效 |
| prePT 重跑了（网表 / 约束变化） | — | — | ⚠️ 名单必须按新报告重新核对，不能直接沿用 |

## 4. postPT 运行与配置
基于 APR 后端输出进行 **signoff 级**时序分析——这是 APR 阶段的最终时序验收，以全 corner 结果为准：

```bash
cd sta/post/pt
run_pt
```

每个 corner 目录下各有一份入口脚本 <a href="./script-dict.html#run_pt_post" target="_blank">run_pt</a>（只跑当前 corner）。

NOTE: 每个 corner 下的报告目录已拆为 `latest_1p`（1P 模式）与 `latest_2p`（2P 模式）两份（详见附录 §9.4）。两种模式用 `set_case_analysis` 固定 `DPSEL_I` 切换，各跑一轮 postPT；报告路径、`run_summary` 取数、后仿 SDF 引用都按模式区分。

需修改：
- <a href="./script-dict.html#corner_set_tcl" target="_blank">corner_set.tcl</a>：每个 corner 下各有一份；corner 配置基本不动，换库时需照 foundry 提供的 PVT 文档（含 OCV）逐项更换。当前 <a href="./script-dict.html#run_summary" target="_blank">run_summary</a> 实际跑 10 个 corner：`wc_cworst_125` / `wc_cbest_125` / `wc_typical_125` / `lt_cworst_m40` / `lt_cbest_m40` / `lt_typical_m40` / `ml_cbest_125` / `tt_cworst_25` / `tt_cbest_25` / `tt_typical_25`——无 wcl（脚本中已整段注释掉）、无 bc（bc 是旧命名，只出现在旧版串行脚本 `run_all` 中）

  - `wc`：ss 低压高温（LVHT）
  - `wcl`：ss 低压低温（LVLT）
  - `lt`：ff 高压低温（HVLT）
  - `ml`：ff 高压高温（HVHT）
  - `tt`：典型温压
- <a href="./script-dict.html#pt_setup_post" target="_blank">pt_setup.tcl</a>：最核心的脚本，内含大量需要 check 的 report 定义（slack、clock path 等）；读取 APR 吐出的网表（`.v` / `.gv`）与 spef；`set_operating_conditions` 必须与 `DataBase/Analog/DB` 下对应 `.lib` 中的 operating_conditions 保持一致；约束读的是 APR 返回的 postcts SDC（`${SDC_PATH}/${SDC_NAME}_postcts.sdc`），不是 prePT `sdc_pr/` 的展开产物直接喂入
- `pt/design.set`：路径、LINK_LIB、TAR_LIB、NET_DEFINE、POSTPT_EN=1 等
  - `POSTPT_EN` 必须为 1
  - `PT_HOLD` 仅针对特定工艺（如 22nm）
- `common_db_pvt.tcl`

注意 memory / analog 的 PVT 可能与标准单元不同。

使用经验：
- 打开 postPT 环境第一件事先改 top name；SDC / 网表路径可在配置中搜索 APR 对接工程师的标识快速定位（APR 网表路径固定），并确认路径为最新。
- **分析中间版本（非 latest）时必须改 `pt_setup.tcl`**：`read_verilog` 默认指向 APR release 目录下的 `.../timing/latest/<TOP>.v.gz`——`latest` 是软链，永远指向最新一版；要复查某个历史/中间版本的时序，需要把路径从 `latest` 改成具体版本目录（spef 路径同理），否则会误分析到最新版。

![分析中间版本时需修改 pt_setup.tcl 的 read_verilog 路径](./image/07_mid_version_pt_setup.jpg)

该文件同时是 CORNER → RC_FILE → operating_conditions 的映射表（图中 `wc_cworst` / `wc_cbest` / `lt_cbest` / `lt_cworst` 各分支，`wcl_*` 整段注释保留），换库时按 foundry PVT 文档逐项更换，且 `set_operating_conditions` 必须与 `DataBase/Analog/DB` 下对应 `.lib` 一致（见前述注意事项）。
- 附加自研脚本：抓 worst slack、批量跑 PT、跑完后 merge 结果。

KEY: corner 配置里有 dump SDF 开关（真实变量名是 corner_set.tcl 里的 <a href="./script-dict.html#dump_sdf" target="_blank">DUMP_SDF</a>，打开则专门生成 SDF，供后仿使用）。真实机理：`DUMP_SDF==1` 的那趟 run 只执行 `write_sdf` 并跳过全部 report——两个分支互斥，结果并非被删除，而是 `latest` 软链指向了这趟只产 SDF 的 run，run summary 自然抓到空。run summary 里发现某 corner 结果为空，基本就是这个原因；关掉后重跑该 corner 即可恢复。

## 5. 后仿 SDF 生成与仿真侧配置
后仿（带 SDF 的 gate-level 仿真）前要先生成 SDF，完整流程如下：

**① 开 DUMP_SDF（PT 侧）**：到对应 corner 目录改 `corner_set.tcl`，把 `set DUMP_SDF 0` 改为 `1`：

![corner_set.tcl 中需要设置 DUMP_SDF 为 1 的位置](./image/08_corner_set_dump_sdf.jpg)

文件路径：`SYNTHESIS/top/sta/post/pt/<corner>/corner_set.tcl`。一般只跑三个 corner：`tt_typical_25`、`wc_cbest_125`、`lt_cbest_m40`。

**② 跑 postPT 生成 SDF**：在该 corner 目录执行 `run_pt`。注意这趟 run 只执行 `write_sdf`、不产任何 timing report（分支互斥，见上条 WARNING）；SDF 落在 `SYNTHESIS/top/sta/post/sdf/` 下，如 `HV2M23_digital_top_typical_25c.sdf` / `_cbest_125c.sdf` / `_cbest_m40c.sdf`。

**③ 改回 0**：SDF 下载/取回后，**必须把 `DUMP_SDF` 改回 `0`**——不改的话 `latest` 软链一直指向这趟只产 SDF 的 run，run_summary 抓到的就是空结果。

**④ 仿真侧 case 定义**：在 case 的 userdefine（`user_def.sv`）里按 corner 分别定义宏：`SDF_TT` / `SDF_WC` / `SDF_BC`，决定本 case 反标哪个 corner 的 SDF。

**⑤ waves_dumper.sv 的 SDF 路径**：`DV_TCON_C/top/tests_netlist_post/<case>/waves_dumper.sv` 中，`ifdef SDF_TT / SDF_WC / SDF_BC` 三段各有一条 `$sdf_annotate`，SDF 路径写死在这里：

![waves_dumper.sv 中修改 SDF 存放路径的位置](./image/09_wavedump_sdf_path.jpg)

WARNING: SDF 存放路径一旦变化（换目录、换项目、换 top name），`waves_dumper.sv` 里三处 `$sdf_annotate` 路径必须同步修改，否则后仿反标不到 SDF、timing check 全失效。

```mermaid
flowchart LR
  A["corner_set.tcl<br/>DUMP_SDF=1"] --> B["跑 postPT<br/>(只产 SDF)"]
  B --> C["SDF 落盘<br/>sta/post/sdf/"]
  C --> D["DUMP_SDF 改回 0"]
  D --> E["user_def.sv 定义<br/>SDF_TT/WC/BC"]
  E --> F["waves_dumper.sv<br/>$sdf_annotate 反标"]
  F --> G["跑后仿"]
```

## 1. STA 基础概念

### 1.1 corner 全量校验

当前工艺共 10 个 corner，corner 定义由 foundry 提供，不是项目自己建的。

- 每个 corner 下 setup、hold、transition 全部都要 check，不做取舍。
- 历史规律已经失效：以前是 wc corner 下 setup 更差、lt corner 下 hold 更差；现在因为修 skew 把延迟垫乱，各 corner 的表现不再符合老规律，所以必须所有 corner 全量校验。

WARNING: "按经验只跑最差的 corner" 在当前项目已不成立。skew 修调会打乱延迟分布，任何 corner 都可能冒出最差值，全量跑是唯一安全的做法。

### 1.2 uncertainty 与放宽纪律

uncertainty 来源于历史经验值：hold uncertainty 全表统一 150 ps；setup uncertainty 按时钟不同为 0.4 ~ 2 ns 不等，只有高速 lane 时钟是 400 ps（脚本包 sdc_pr 展开产物实证）。

    <div class="metric-label">setup uncertainty</div>
    <div class="metric-note">仅高速 lane 时钟；其余 0.4~2 ns 不等</div>
  </div>

使用策略：

- 新项目不主动放宽，一直按公版值卡；只有最后一版实在修不下去时，才找高层签字放一点。
- 工程上它有点像 false path——不会主动先写，出问题了才放。
- 新项目不会沿用上一版放宽后的值，继续用 0.4 ns 起步。

WARNING: <span class="badge badge-tx">必须</span> uncertainty 放宽是"最后手段"纪律——必须有高层签字；放宽值不跨项目继承，每个新项目从公版值重新卡。

### 1.3 SI / noise 常开

当前环境 SI check 默认全部打开。

- 背景：某历史项目 SI 影响很大导致 corner 结果很差，想关但没敢关；脚本留有开关可做中间实验，但最终关不关必须多方共同决定，一直保持最保守（打开）执行。
- 机理：SI 分析 noise；摆线太近 noise 很大；PT 会看走线的宽度和高度；SI 大时 cell delay 会非常大。
- 有些工艺厂商文档写 SI 不用考虑，但团队不采信，仍以最保守方式执行。

### 1.4 占空比与 min_pulse_width

当前项目输出 clock 占空比不是 50%。

- PT 报的 min_pulse_width 类数值**不是**真实占空比：它报的是从 clock 源头上升沿到该点与下降沿到该点的差值（rise/fall latency 差），工具并不知道实际高电平宽度，所以报那个没意义。
- 验证占空比的正确方法：后仿，把该 clock 在波形里拉出来看；模拟方也会拉这条 clock 看有没有对到中心点。
- 分频器经验：1.5 分频处两边的组合逻辑 delay 最好保持一致（理想情况），这是占空比恶化的来源之一。
- 历史教训：双方对该参数理解不一致踩过坑（tapeout 前才发现），规格必须与规格方书面确认。
- 周期越慢该参数越不可能超，速度越快 / 周期越短才紧张。

WARNING: <span class="badge badge-rtl">严禁</span> 把 PT 的 min_pulse_width 报告当占空比证据。占空比规格必须书面确认，并用后仿波形验证。

### 1.5 准静态信号（quasi-static）

一帧才变一次的信号、寄存器配出的控制信号属于准静态信号，不用 check，可设 false path。

### 1.6 clock latency 判断经验

报表上半部分是原始 latency 数据（clock / data latency，未做运算）；下半部分是脚本算好的 skew。

- clock 之间做过 clock tree balance，相互 latency 不应差很多；clock 与 data 差得多是正常的。
- clock 的 max 与 min 差很多，说明 clock tree 做歪了。
- max 路径和 min 路径通常不是同一条，两条都要 check。
- 实例：某版 CLK 最慢 10.56、最快 3，而 skew 余量只有 7——10.56 那条是假路径（mux 特别多、trace 起点没选好导致），真实 clock latency 约 3 点多。

- dump SDF 的 option 是给后仿用的，其他 option 基本不动。

### 2.5 复用环境要改的 7 项

同一项目重新跑一版（重新综合迭代）：什么都不用改，直接 run，全自动。

全新项目 / 新架构复用，要改：

1. `design.set`（必改）；
2. pt setup 相关配置；
3. data skew 抓取的三个脚本全部要重改（分组分类不同）；
4. create clock 周期定义所在文件；
5. 直抛 clock path 的 Tcl（项目初期必改）；
6. 新增定制 lib 时改 `common_db` 及 .v / .lib 路径；
7. Excel merge 脚本（手写分组对应关系，极易对错，需一一对应）。

分组层级经验（沿用上一项目脚本）：L/R → 1P/2P → A/B → clock/data 四层分类，落地到报告文件名即 `sd_{l,r}_{1p,2p_l0,2p_l1}_{clk_,}{a,b}` 共 24 组（2P 版报告脚本在包中缺失，perl 抓取层仍期待 `sd_*_2p_*` 文件）。

### 2.6 环境搭建检查项

- 第一版搭环境时，必须确保所有 log 和 report 目录下没有任何 error。
- 环境通用，全组共用。

## 3. 约束（constraint / SDC）管理

### 3.1 dco → prePT → SDC 工作流（核心工作流）

false path / multicycle 等约束统一写在指定的 dco 文件里；**不直接改 SDC**（批量展开式修改很复杂）。

流程：

```mermaid
flowchart LR
  E["先在 live PT 试一版"] -.->|"验证后再写入"| A["改 dco"]
  A --> B["重新跑 prePT"]
  B --> C["自动生成展开后的 SDC"]
  C --> D["放入 database 目录"]
```

- 改 dco 前的验证习惯：先在 live PT（手工打开的交互式 session）里把路径直接指过去试一版，确认效果再正式写入。
- 纪律：<span class="badge badge-rtl">严禁</span>直接修改 SDC 文件、提前乱写 false path，需确认路径为假后再配置。

### 3.2 约束迭代闭环：看 summary 总表 → 定性 → 改 dco → 重跑

post PT 10 个 corner 全部跑完后，执行 <a href="./script-dict.html#run_summary" target="_blank">run_summary</a>，产物在 `SYNTHESIS/top/sta/post/pt/summary/latest_2p/`（2P）与 `latest_1p/`（1P）下：

- 每 corner 单表：`<corner>_setup.csv` / `_hold.csv` / `_trans.csv` / `_phy_busskew.txt` / `_sd_busskew.txt`
- merge 总表：`report_setup.csv` / `report_hold.csv` / `report_trans.csv` / `report_phy_busskew.csv` / `report_sd_busskew.csv`
- 总表结构：行 = clock 组，列 = 每个 corner 各两列（violation number、biggest violation），一眼看全 10 个 corner

![POST PT run_summary 后的 merge 总表 report_setup.csv（2P）](./image/30_postpt_setup_2p.png)

![POST PT run_summary 后的 merge 总表 report_setup.csv（1P）](./image/31_postpt_setup_1p.png)

第一步·找目标：在 merge 总表里扫 **violation number ≠ 0 或 biggest violation 为负** 的 clock 组，这些就是要处理的违例。**最新版本（8/17）1P / 2P 两套总表 violation number 已全部为 0、无负 slack**（此前 1P 曾有 `LENB_R` output delay 违例 `−0.225507`，经 setcase 修复后已消除，详见 <a href="./to-signoff.html" target="_blank">TO SIGNOFF 页</a>）。未来若出现新违例，仍按此方法定位。

找到目标后到**对应 corner 目录**看具体报告定位路径。示例：总表里 `wc_cbest_125` 的 `CLK_L0_DTCTL_OD_DIV1P5` 组有 5 条 violation（biggest −0.0499），打开 `SYNTHESIS/top/sta/post/pt/wc_cbest_125/latest_2p/rpt/setup/report_timing_setup.rpt`，按 slack 排序找到 VIOLATED 路径，看清 Startpoint / Endpoint / Path Group：

![wc_cbest corner 出问题路径的定位示例（历史版本演示方法）](./image/12_ccbest_corner_path.jpg)

（上例：Startpoint `LC_CSPIF_L0/DIOH_DCLK_reg`（RX0_OD_CLK_DIV2）→ Endpoint `DTCTL_L0/EN1_L_reg`（CLK_L0_DTCTL_OD_DIV1P5），slack (VIOLATED) = −0.049949。每个 corner 的 `latest_1p` / `latest_2p` 下按 `rpt/setup` / `rpt/hold` / `rpt/skew` / `rpt/trans` 分目录，各 clock 组单独一份 report_timing 文件。）

NOTE: 上图为**历史版本演示「如何定位违例路径」的方法示例**。当前 SVT 换库 + 约束收敛后的最新结果（8/13）setup / hold 违例数已全部为 0（见 <a href="./to-signoff.html" target="_blank">TO SIGNOFF</a> 页总表），定位方法仍适用于未来出现新违例时。

第二步·定性（关键判断）：逐条看违例路径，判断它**后端修不修得掉**：

- 修得掉的（skew 类，垫 delay / 换 size 能收敛）→ 不动约束，留给 APR 修调；
- 修不掉的 → 判断该下什么约束：
  - 准静态信号、异步跨时钟域 → `set_false_path`
  - 数据允许跨多个周期到达的慢速路径 → `set_multicycle_path`
- 下约束前先在 live PT 里 `report_timing -input_pins` 把这条路径报出来看明白：穿过哪些 cell、起点终点对不对、是不是夹带准静态 mux 的假路径——确认是假路径才写，判错会把真实路径漏报。
- 报告只能告诉你「违例在哪」，**信号到底准不准静态要看波形**：把起点信号（如 `SETTING_DET`）在仿真波形里拉出来，确认它是一帧变一次的配置类信号、或与终点时钟确实异步，才能落 `set_false_path`。只看 report 不看波形就下约束，是把真实路径漏报的常见原因。

第三步·落地重跑（一轮完整循环）：

```mermaid
flowchart LR
  A["违例写进 dco<br/>(false path / multicycle)"] --> B["重跑 prePT<br/>展开生成新 SDC"]
  B --> C["新 SDC 放入<br/>database 目录"]
  C --> D["重跑 post PT<br/>10 个 corner"]
  D --> E["run_summary<br/>看新 merge 总表"]
  E -->|"该组 violation 清零<br/>且无误伤"| F["✅ 收敛"]
  E -->|"仍有修不掉的"| A
  F --> G["APR 修调全部完成"]
  G --> H["最终再跑一次<br/>postPT + run_summary"]
  H --> I{"5 个 csv<br/>全部 ready?"}
  I -->|"是"| J["TO SIGNOFF<br/>(最终签核)"]
  I -->|"否"| A
```

最终确认环节（TO SIGNOFF）的详细操作见 <a href="./to-signoff.html" target="_blank">TO SIGNOFF</a> 页。

- 每轮重跑后必须确认两件事：目标违例已清；没有误伤真实路径（violation number 异常减少、或别的组冒出新违例都要警惕）。
- false path / multicycle 采用叠加式维护：不删旧的，往 dco 后面追加（cell 流水号每版都变，旧条目自然失效但无害）。

dco 落点实例（真实文件）：`SYNTHESIS/common/ip_cons/HV2M23_digital_top.tcl`——上一节说的「改 dco」改的就是它（prePT 时由 `pt_setup.tcl` source 进来）。

![dco 文件 ip_cons/HV2M23_digital_top.tcl 中的 set_false_path 实例](./image/13_digital_top_tcl.jpg)

图中可以看到 merge 总表里那批修不掉的违例，最终都落成这个文件里的一条条 `set_false_path`：

- 配置/寄存器写类：`LC_CPUWR_HV2M23/R_*`、`VGMA/R_REG*` 的 CK 与数据端，整组 from 豁免；
- 异步复位类输出：`-to [get_ports XRSTA_R]`；
- 跨域配置信号（与 merge 总表 `RX0_OD_CLK_DIV2` → `CLK_L*_DTCTL_OD_DIV1P5` 的负 slack 对应）：`LC_CSPIF_L0/SETTING_DET_reg` → `DTCTL_L0/L1` 的 `DBR0N/DBL0N/START_R/START_L/L5/EN1_R/EN1_L_reg`，L0、L1 两侧逐条列出；`POL_DET_reg` → `DTCTL_L0/L1/DATA*` 用 `get_cells` 通配一整组。

写法经验（对照图）：

- 起点能整组通配就通配（`R_*`、`DATA*`），终点是寄存器时逐列 L0/L1 两侧，避免误伤同组真实路径；
- 每条 false path 都对应一次「报告定位 + 波形确认」，追加在文件末尾，不删旧条目。

#### live PT 验证工作流（约束生效确认）

约束写好后、正式重跑之前，先在 live PT 里快速验证——**session 不退出，随改随报**：

1. 开 live PT：直接 `pt_shell` 起交互 session（或 restore 之前 `save_session` 存的 session，省掉重新 link / read_parasitic 的时间）；
2. 在 session 里输入新约束：把刚写进 dco 的 `set_false_path` / `set_multicycle_path` 直接敲进去（或 `source` 对应片段），即时生效；
3. 用 `report_timing` 报目标路径确认效果，常用完整选项组合（setup 检查一般 `-delay_type max`，hold 检查换 `-delay_type min`）：

```tcl
report_timing \
  -path_type full_clock_expanded \
  -delay_type max \
  -input_pins \
  -nworst 20 \
  -slack_lesser_than 20 \
  -max_paths 100 \
  -group RX0_OD_CLK_DIV2 \
  -transition_time \
  -capacitance \
  -derate \
  -sort_by slack
```

选项含义与取舍：

| 选项 | 作用 | 备注 |
|------|------|------|
| `-delay_type max` | 报 setup（max）路径 | 最常用；查 hold 改 `min` |
| `-path_type full_clock_expanded` | 展开完整 clock 路径 | 看 clock latency 必备 |
| `-input_pins` | 列出路径经过的每级 pin | 判断有没有夹带准静态 mux / 假路径 |
| `-group RX0_OD_CLK_DIV2` | 只看指定 clock 组 | 与 merge 总表里的违例组对应 |
| `-slack_lesser_than 20` | 只报 slack < 20 的 | 过滤掉大量无意义正 slack |
| `-nworst 20` / `-max_paths 100` | 每终点 20 条、共 100 条 | 验证用足够；修 skew 抓数据才放大到 2000/1000 |
| `-transition_time` / `-capacitance` / `-derate` | 附带 trans / cap / derate 信息 | 排查时一并看 |
| `-sort_by slack` | 按 slack 排序 | 最差的排最前 |

4. 确认两件事：被豁免的路径不再出现在报告里（false path 生效）；同组该 check 的真实路径还在（没误伤）；
5. 验证 OK → 约束已写回 dco，走「重跑 prePT → database → 10 corner」正式循环；验证不对 → 在 session 里调整约束重新报，直到对了再落 dco。

这套「live PT 先试、对了再写 dco」的习惯，对应的就是 §3.1 的纪律：不直接改 SDC、不提前乱写 false path。

### 3.3 input / output delay 约束文件（ip_cons/input_delay.tcl）

input delay 约束有专门文件，与 dco 同目录、随约束一起被 source（配套还有 `output_delay.tcl`）：

```text
SYNTHESIS/common/ip_cons/input_delay.tcl
```

![input_delay.tcl 位置与内容实例](./image/14_input_delay.jpg)

文件头的编写方法（三条，照做即可）：

1. 从顶层实际 input port 出发（以 `<TOP>.v` 的 port 为准）；
2. 每个 port 往里 trace 到**第一个有效时序捕获域**（用哪个 clock 就挂哪个 clock）；
3. 数值沿用 legacy Tcl 中仍然匹配的值——不随意收紧，避免相对旧版 under-constrain。

文件组织纪律（图上半部分注释）：

- 假定 base clock 已由 dco（`HV2M23_digital_top.tcl`）创建，本文件只管 input delay；
- 专用 clock / reset port 只写注释说明，**不给** `set_input_delay`；
- FPGA-only 的输入以注释形式列出，留待单独 review。

代码实例（图下半部分）：

```tcl
# I2C 串行输入：max/min 成对
set_input_delay -clock I2C_CLK 1     [get_ports CSCL_I]
set_input_delay -clock I2C_CLK -min -1 [get_ports CSCL_I]
#set_input_delay -clock OSC_CLK_IN 5 [get_ports CSCL_I] -add_delay   # 旧版第二捕获域，注释保留

# RX lane 数据：整组通配，挂 OD /2 分频时钟
set_input_delay -clock RX0_OD_CLK_DIV2 0      [get_ports dout_lane_L0*]
set_input_delay -clock RX0_OD_CLK_DIV2 -min 0 [get_ports dout_lane_L0*]
```

写法经验（对照图）：

- max / min 成对写（`1` / `-min -1`、`0` / `-min 0`），只写一个等于只卡了半边；
- lane 类信号用通配符整组设置（`dout_lane_L0*`），clock 挂实际捕获域（OD 模式用 `*_OD_CLK_DIV2`）；
- 换 clock 域、换数值时旧行**注释保留不删除**（图中 `#set_input_delay -clock RX0_CLK ...` 一片），方便回退和 review diff。

WARNING: `set_max_delay` 与 `set_output_delay` **不要加在同一个端口上**。两者角色不同：`set_output_delay` 定义外部环境（基于参考时钟建立完整的同步接口检查），`set_max_delay` 是一刀切的路径延迟上限（不参考时钟关系）。同一端口混用时，max_delay 会覆盖 output_delay 建立的时钟检查机制，导致路径报不出来或直接变成 unconstrained path。

正确做法：需要单独 `set_max_delay` 的端口，先从 `all_outputs` 集合中排除，再对剩余端口统一 `set_output_delay`：

```tcl
set exceptions [get_ports "sig_a sig_b sig_c"]   ;# 替换成要排除的信号名
set output_without_exceptions [remove_from_collection [all_outputs] $exceptions]

set_output_delay -clock oscclkin 5 $output_without_exceptions
```

实例：setup 报告中某条路径穿过 MUX 的 S（选择）口导致违例，最终修法是把该端口的 **output delay 放宽到 12 ns**——路径本身合法、只是 output delay 卡得太紧时，直接放宽 output delay 比给 S 口下路径约束更干净。

### 3.3 false path / multicycle 设置经验

- 无继承机制：每版综合后 cell 流水号（自动命名）全变，false path 要全部重新报、重新加；做法是不删旧的、往文件后面叠加（叠加式维护）。
- 跨项目经验可继承：架构没有大改时按信号功能 / 类别识别，同一类信号成组设置。
- 准静态信号（一帧变一次）可大胆设 false path。
- `set_case_analysis` 的实际用途：**2port / 1port 双模式设计**的模式约束——用它把模式选择信号固定为对应值（如 `set_case_analysis 1 [get_ports MODE_SEL]`），让 PT 只按当前模式做时序分析；同一套约束文件覆盖两种 port 配置，按模式各跑一份报告。
- 修 skew 的副产物：往后推 data / clock 垫 delay 时会推出假 hold（只推最后一级、后面没有 DFF 承接，推超过一个周期就报 hold violation）——这种是假的，持续补 multicycle / false path 即可。
- 修 skew 引入的真实问题多为 clock gating 的 hold。
- 另一种造"假路径"手段：output delay（有时值设得比 max 还大）。
- 多种 mode 合成一路输出、只有一个可 check 点时，按最严的标准卡；条数多难修但对签核安全。

NOTE: "最严标准原则"——多个 mode 共用一个 check 点时按最严的规格卡。修起来条数多、辛苦，但漏报的代价比难修大得多。

### 3.3 clock 定义与频率目标

- create clock 周期在 `common/tcl_dir/common/clk_period.tcl` 中定义（`clk_period.tcl:1-5`），所有周期乘 `$MARGIN`：综合 `MARGIN=0.80`（给 DC 加严）、PT `MARGIN=1.00`。
- **当前生效（HV2M23，接近 TO）**：`set_case_analysis 1 [get_port DPSEL_I]`（2P 模式）+ `RX0_CLKP = RX1_CLKP = 10.71ns`（对应 1.7G SPEC：`1.7G×1.05/18 = 99.16M ≈ 10.08ns`，实际取 10.71ns 留余量）。一组可选周期：`9.5 / 10.08 / 10.71 / 11.42 ns`（对应 1.8G/1.7G 不同档位）。

### 3.5 pin 名称的坑（通配符穷举法）

某输出 cell 有 I0 / I1 / O 三个 pin：直接写 `O` 设约束设不上（live PT 里 `get_pins` 能找到，但写进 constraint 跑 prePT 报找不到）；三个 pin 名都写上也不行。

解决：用通配符 `*` 穷举代替，写星号后全部 pin 都会设上。两个项目都踩过这个坑。

WARNING: live PT 里能 `get_pins` 到的名字，不代表 prePT 展开约束时能找到。pin 名设不上时，优先试通配符穷举。

## 4. Skew 修调方法（技术核心）

### 4.1 规格与目标推导

skew 规格来自规格方 / 模拟方：目标 ±3.5 ns。

推导（以周期约 15 ns 的慢 clock 为例）：

```text
一周期 15 ns
前后各留 4 ns 给 setup / hold margin
中间允许 data 相对 clock 偏移：15 - 4 - 4 = 7 ns
以正中间为零点 → skew = ±3.5 ns
```

<div class="metric-grid">
  <div class="metric-card">
    <div class="metric-value">±3.5 ns</div>
    <div class="metric-label">skew 目标</div>
  </div>
  <div class="metric-card">
    <div class="metric-value">7 ns</div>
    <div class="metric-label">可偏移窗口</div>
    <div class="metric-note">15 − 4 − 4</div>
  </div>
  <div class="metric-card">
    <div class="metric-value">4 ns</div>
    <div class="metric-label">前后 setup / hold margin</div>
  </div>
</div>

占空比不是 50% → 下降沿注定不在 data 中间 → 要把 clock 往左推（对齐到 data 窗口中间）。

完整的 skew 规格推导如下图：15 ns 周期前后各留 4 ns，中间 7 ns 窗口即 ±3.5；clock 本身带 +2.5 偏移，所以最终 **skew 规格 = +2.5 ±3.5 = [-1, +6]**——左边界 +6（data 最迟）、右边界 −1（data 最早）。这就是 `merge_sd_busskew.pl` 输出的 margin 标注规格 **[-1:6]** 的出处（见 <a href="./script-dict.html#merge_pl" target="_blank">脚本字典</a>）。

![SD BUS SKEW 时序规格推导](./image/15_sd_bus_skew_spec.jpg)

### 4.2 修调策略：先 data 后 clock，推 clock 为主

理想步骤：

1. 先把 data 之间推到等长（相互偏移尽量小）；
2. 再由 clock 推到中间位置。

实际执行：大部分推 clock 不推 data——data 条数太多（一组 8 bit，多 lane 每路多路来源，每个 DFF 出来起码 6 路）；只有 clock 没法弄时才动 data。

- 方向性：往后推（垫 delay）容易，往前拉（拆 delay）难；风险是垫太多绕线绕不过去，需提前预留绕线余量。
- data skew 都是针对 clock 去设的，不单独要求 data 间 skew；clock 间因 clock tree 不会差很多，data 间差很多正常。

### 4.3 修调分工与 Excel 交接

- skew 修调由 APR 工程师全权负责；他自行搭建 PT 环境（link 到 PT 环境 owner 的目录），自己跑 PT、按 Excel 报表自行修调，遇修不下去的（如 setup 互卡）主动反馈。
- 交接物：自动化环境 + Excel 报表。
- 修不下去时先看组分得够不够细（按 lane / mode 细化 check 分组）；分到最细还修不下去，说明 skew 标准本身需要谈判。

### 4.4 check 路径取舍（trace 教学）

check 对象：所有 data bus、全部 clock、以及指定的输入信号。

trace 方法：从输出端往里走，逐级看每个控制信号要不要 check、是不是 multicycle、gating 信号如何处理。

- 不要偷懒合并报点：本想"A 包含 B / C 就只报 A"，结果 A 内部还有准静态 mux 把假路径带进来，特别难修——必须一直往前看，把来源都抓出来。
- 历史案例：某条一帧变一次的 CK 路径连续三四个项目都修不下去，后来干脆不加进 check 列表（多打一条 path 没坏处，但明知修不下去的不加）。
- 两路来源的路径中，一路和其他路长度差很多的，加进来必修不下去，宁可不 check。

### 4.5 skew 报告脚本实例（report_timing_skew_sd.tcl）

修 skew 用的批量报告脚本，完整路径与文件名（与 `pt_setup.tcl`、`get_*.pl` / `merge_*.pl` 抓取合并层同目录，脚本条目见 <a href="./script-dict.html#skew_sd" target="_blank">脚本字典</a>）：

```text
SYNTHESIS/top/sta/post/common/report_timing_skew_sd.tcl
```

![SD skew 报告脚本 report_timing_skew_sd.tcl 实例](./image/16_timing_skew_sd.jpg)

内容结构（对照截图）：

- data 组：`report_timing -from u_LOGIC_CENTER/CENTER1/TOTAL_DTCTL/DTCTL_L*/SL_DLY*、DATA*_PRE* 等 -to [get_ports DBL*/DBR*/SLIN_B] -max_path 2000 -nworst 1000 >> ${rpt_dir}/skew/report_timing_sd_{l,r}_1p_{a,b}.rpt`
- clock 组：from `CLKGEN_U0/U1` 各 DCLK 到 `CLKA_L/CLKB_L` 等 port，在 `-max_path 2000 -nworst 1000` 基础上再加 `-slack_lesser_than 50`
- 输出写到 `${rpt_dir}/skew/report_timing_sd_*.rpt`（每组第一条 `>` 新建、其余 `>>` 追加），供 `get_sd_busskew.pl` 抓取、merge 进 Excel
- 换 lane / 换分组的旧写法用注释保留（截图 77-79、84-85 行），不删除，方便回退对照

选项取舍（重要经验）：

- `-max_path 2000 -nworst 1000` 是**固定写法**：修 skew 要拿到每组足够多路径的 latency 分布，merge 脚本才能算出 max / min 和 margin；路径太少，推 skew 的数据基础就失真。
- `-slack_lesser_than 50` **可加可不加、需要灵活考虑**：加上可以过滤掉 slack 明显为正的路径、控制报告体积（图中 clock 组带了 50，data 组没带）；但如果当前要看完整的 latency 分布（比如 data 组要推 skew），就不要加、或把阈值放宽，否则长 latency 路径被滤掉、merge 出来的数据就失真。阈值取多少（图中为 50）按当前要分析的内容定。

KEY: <span class="badge badge-rtl">强调</span> `-slack_lesser_than` 加不加、阈值取多少，**很需要经验、很需要迭代**才能下结论——不是抄一组参数就万事大吉。**每一条** `report_timing` 都要单独综合考虑：这条报告的目的是什么（推 skew 抓分布 / 只看违例 / 点对点附近）、滤掉的路径会不会正是要用的数据、阈值卡多紧合适。下不了结论时就迭代：先不加跑一次看数据量，再加上对比，反复几轮才能定下每一条的写法。
- 输出重定向按分组区分：每组第一条用 `>` 新建（覆盖旧结果），后续条目用 `>>` 追加——注意 script-dict 里记录过 `>` 误用于同组文件导致报告互相覆盖的坑。
- 只做点对点跨域检查时不需要这套大 `-max_path`：如 1P5 分频跨域、isprx、io 报告，用 `-slack_lesser_than` 过滤或少量 `-max_paths 100` 即可。

## 5. 报告解读与报表生成

### 5.1 report_timing 实战

基本报法：from DFF 的 Q 端，to 输出 port。

- <span class="badge badge-fixed">推荐</span> option：`-input_pins`（列出每级 input pin，看清路径穿过哪个 cell / pin；用 `report_timing -help` 查 option）。
- 报全原则：路径报全；起点选错会夹带假路径。
- 每条 path 报 1000 条；工具上限报不了 1 万条。主 report 定义集中在 `report_timing_prj.tcl`：`report_timing -pba_mode path -delay_type max -path_type full_clock_expanded -crosstalk_delta -derate -slack_lesser_than 0.5 -max_paths 1000`（每个 clock 单独一份时 slack 阈值收紧到 0.2）。
- 规模：10 corner × L/R × A/B × 每组 6 条 × 每条 1000 ≈ 10 万条级 report，全靠脚本处理。

### 5.2 假路径识别（肉眼判断要点）

典型特征：路径中经过不该经过的寄存器 / 准静态 mux（"经过寄存器就觉得不妙"）。

- 起点选错后果：报出的点 latency 异常大（别人 3 点多它 10 点多，没做 balance），merge 进 Excel 后修不动。
- 处理：换起点——从最前面的点报，不要从夹带准静态寄存器的 DFF 报。

### 5.3 自动化抓取与 Excel 报表

流程：PT report 按设计好的 from/to 点批量报 → 脚本按 keyword 抓数打印 → merge 脚本合成 CSV / Excel。

Excel 结构：

- 上半部分：原始 clock / data latency；
- 下半部分：自动算好的 skew（标准列在脚本里）；
- clock 组、data 组分别抓 max / min 并排序，方便后端直接抓最大最小来推。

merge 脚本是手写分组对应关系，照猫画虎改，一定要一一对应，很容易整错。

NOTE: 选点必须人工——看代码、看波形或问设计方，AI 做不了。

### 5.4 当前项目时序现状

- 第一版综合后 setup 违例极少：最大仅 0.1 ~ 0.2 ns（周期富裕）。
- 核心矛盾在 clock skew 收敛：clock 路径最快最慢差值曾达 7，接近余量上限；报表中 10 以上的异常值均为假路径，已清完。
- 修 skew 过程会不断引入新的假 hold，需持续清。

---

## 6. 签核准则与仿真关系

- 数字签核（signoff）以 PT 结果为准，不以 co-sim 为准——PT 覆盖率远高于仿真（PT 是所有检查）。
- 跑 co-sim 的两个目的：
  1. 确认 constraint 有没有错；
  2. 给模拟方看（他们 spec 描述不一定 OK，完整联仿更有效）。

---

## 7. AI 辅助的边界与使用原则

当前 AI 无法做到：

- 识别准静态信号 / 特殊节点（真假路径判定）；
- 自主判断最佳抓取节点；
- 自动适配新项目特殊规则；
- 基础 PT 命令可生成但存在随机参数错误，直接运行会报错。

使用原则（会议共识）：

- "寄存器出来的就是假路径"不能作为通用规则；
- 宁可多报不可漏报（漏报一条 skew 没掉很可怕）；人工做完也要反复检查三四遍；
- AI 可做中间引导 + 人工 review 的辅助；产出固化为 script 且不再改才可信，但生成 script 过程要充分评估；
- 落地前需至少 3 轮全流程验证、准确率 100%；固化后每版仍人工抽查至少 10%；
- 优先探索 AI 生成标准化文档、整理配置说明等低风险场景。

WARNING: 真假路径判定不能交给 AI。constraint 漏报的代价是硅后才发现时序问题，远大于人工 review 的成本。

---

## 8. 常见问题与经验清单

1. 流水号坑：每版综合后 cell 自动命名全变，针对具体 cell 名的约束每版要重加（叠加式，不删旧）。可在关键路径预埋 buffer，或用 DC / PT 脚本做 ECO 塞 buffer。
2. 路径抓取节点选择错误会产生大量无效报表数据——严格按规范选节点，从最前端节点开始抓，避开准静态寄存器。
3. 宁可多报不可漏报。
4. 修不下去的路径连续几个项目都修不下去，就别再加进 check 列表。
5. margin（给 DC 的加严量）一般 0.8，曾试 0.6（会议经验值，脚本包中未见对应设置）；压紧 constraint → DC 难做但走线余量长；DC 可能拆逻辑、换 cell 结构（AOI / OAI），曾有案例 APR 绕不出来，发现一大串 AOI 需拆掉。
6. report 文件太大打不开需要 license（大项目 SOC 经验）；以前看几万条 report 靠先分类、先设 false path、再迭代。
7. 环境版本固定，报错先查 source 版本。
8. 分组（lane / mode）先分细再修，修不下去再谈标准。

## 9. 附录：目录结构与脚本的便捷改造（新增）

> 本节是对 postPT 环境的一次**便捷性改造**，**不改动原有 PT 分析逻辑**——原始流程（corner_set.tcl 配置、pt_setup.tcl 分析、report 生成、SDF 反标）全部保持原样，只是把「多次运行堆积的产物」整理归类、并补了几个一键脚本，减少手改配置与手动改回开关的重复劳动。已有章节描述的所有步骤照常适用，本节仅作补充。

### 9.1 目录结构收敛：`history/` + `latest`

**改了什么**：原来每次 PT 运行会把 `log_*` / `rpt_*` / `whole_session_*` 平铺在 corner 目录下，多次运行后目录越堆越乱；现在所有产物收敛到 `corner/history/<run_id>/`（`run_id` 形如 `YYYYMMDD_N`，自动递增唯一），corner 下只保留一个 `latest` 软链指向最新一份。`summary/` 目录同理：改为 `summary/history/<date>_<n>/` + `latest`。

**好处**：

- 一次运行 = 一份独立目录，多次运行互不污染、不再平铺膨胀；
- `latest` 永远指向最新一次结果，`run_summary` / 后仿取数路径稳定，不因历史堆积而混乱；
- 历史结果完整保留、可追溯，需要复查旧版直接进 `history/` 对应 `run_id` 目录即可。

### 9.2 一键归档脚本 `archive_pt_history.py`

**改了什么**：新增一键归档脚本，把 corner 和 `summary/` 下已存在的平铺产物按 `run_id` 归入 `history/`，并重建 `latest` 链接；支持 `--apply`（实际执行）与 dry-run（默认只打印计划、不移动）两种模式。

**好处**：老环境迁移零手工；脚本幂等、可重复执行，不会误删或重复移动已归档内容。

### 9.3 SDF 生成并行化 `run_pt_sdf.py` + `DUMP_SDF` 环境变量化

**改了什么**：

- `corner_set.tcl` 的 `DUMP_SDF` 改读环境变量 `env(DUMP_SDF)`——未设置时默认 0，手动 `run_pt` 行为与原来完全一致；
- 新增 `run_pt_sdf.py`：一键并行跑 `tt_typical_25` / `wc_cbest_125` / `lt_cbest_m40` 三个 corner 生成 SDF，SDF 文件名自动带日期 + 版本号（如 `HV2M23_digital_top_typical_25c_0813v1.sdf`，版本号自动递增、也可命令行指定）。

**好处**：

- 不用再逐个 corner 手改 `corner_set.tcl` 的 `DUMP_SDF=1`、跑完再手动改回 0——规避了上一节提到的「忘改回 0 → `latest` 指向只产 SDF 的空 run」这个坑；
- 三个 corner 一键并行提交，SDF 版本自动编号，多次生成互不覆盖、可追溯。

### 9.4 latest 拆分：`latest_1p` / `latest_2p`（1P / 2P 模式报告分开保留）

**改了什么**：本项目存在 **1P（单 lane）与 2P（双 lane）两种时序模式**，约束用 `set_case_analysis` 固定 `DPSEL_I` 切换（`DPSEL_I=1` 为 2P）。两种模式各跑一轮 postPT 后，报告内容不同但都指向同一个 `latest`，会互相顶掉。现在拆成：

```
post/pt/<corner>/
├── latest_1p/    ← 1P 模式报告（单 lane，多 RX0_CLK_DIV1P5_1P 等 1P 时钟）
└── latest_2p/    ← 2P 模式报告（双 lane，含 RX0/RX1_OD_CLK 等 OD 时钟）
```

- 10 个 corner 全部拆分；`summary/` 同理拆成 `summary/latest_1p/`、`summary/latest_2p/`。
- 每份包含 `pt.log` + `log/` + `rpt/`（setup / hold / skew / trans / summary 各 clock 分组报告 + `input_port_first_buf_type.tsv` / `output_port_last_buf_type.tsv`），**不含 `whole_session`**（PT session 恢复数据，本地查看报告用不到）。

**好处**：1P / 2P 两组报告并存，互不覆盖，随时可分别查阅/对比，`run_summary` 与后仿取数路径按模式区分。

### 9.5 通用打包脚本 `pack_tar.py`

**改了什么**：新增通用打包脚本，把任意目录打包成带日期 + 版本号迭代的 tarball（取代之前手动 `cp` + 删大文件/历史报告）：

```bash
python pack_tar.py SYNTHESIS                 # -> PACK_TAR_MMDDV0.tar.gz
python pack_tar.py SYNTHESIS hdl DV_TCON_C   # 多目录一起打包
# 输出 PACK_TAR_0813V0.tar.gz，当天重复运行自动 V1、V2… 递增
```

- 自动排除 >10M 的**非 `.rpt`** 文件（重要 rpt 即使 >10M 也保留）；
- 自动排除 `history/` 历史版本，只打包最新一份（`latest` 解引用为真实目录，跨机器 / Windows 解压不依赖软链）。

### 9.6 LVT → SVT 换库（接近 TO）

**改了什么**：本项目已完成 **LVT → SVT 换库**，`report_vt_cell_usage` 报告显示 **`SVT 100%`**：

![综合报告 Threshold Voltage Group Report：SVT 100%（cell 数 7655、面积 167727.28）](./image/27_svt_100.png)

换库涉及的文件链：

2. `common_db.tcl`：库名定义（`M31HSSC900EL150SL`=LVT / `M31HSSC900EL150SS`=SVT）；

  }
  const arrow = children.length > 0
    ? `<span class="toc-arrow open" data-target="${h.id}">▸</span>`
    : '<span class="toc-arrow-spacer"></span>';
  tocHtml += `<li class="toc-h2-item">${arrow}<a href="#${h.id}">${h.textContent}</a></li>`;
  if (children.length > 0) {
    tocHtml += `<li class="toc-h3-group" data-group="${h.id}"><ul style="list-style:none;padding:0;margin:0;">`;
    children.forEach(c => {
      tocHtml += `<li><a class="toc-h3" href="#${c.id}">${c.textContent}</a></li>`;
    });
    tocHtml += '</ul></li>';
  }
}
tocHtml += '</ul>';
toc.innerHTML = tocHtml;

toc.querySelectorAll('.toc-arrow').forEach(arrow => {
  arrow.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const group = toc.querySelector('.toc-h3-group[data-group="' + arrow.dataset.target + '"]');
    const collapsed = group.classList.toggle('collapsed');
    arrow.classList.toggle('open', !collapsed);
    if (collapsed) {
      const activeInGroup = group.querySelector('a.active');
      if (activeInGroup) {
        activeInGroup.classList.remove('active');
        const parentLink = toc.querySelector('a[href="#' + arrow.dataset.target + '"]');
        if (parentLink) parentLink.classList.add('active');
      }
    }
  });
});

const tocLinks = toc.querySelectorAll('a[href^="#"]');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(a => a.classList.remove('active'));
      let targetId = entry.target.id;
      if (h3ToH2[targetId]) {
        const group = toc.querySelector('.toc-h3-group[data-group="' + h3ToH2[targetId] + '"]');
        if (group && group.classList.contains('collapsed')) {
          targetId = h3ToH2[targetId];
        }
      }
      const active = toc.querySelector('a[href="#' + targetId + '"]');
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
headings.forEach(h => observer.observe(h));
</script>
</body>
</html>
