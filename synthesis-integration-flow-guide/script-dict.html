# 十、脚本字典

> 本页是后端流程脚本的对照字典，按脚本包 ground truth（对解压后的原始脚本逐一阅读）整理。脚本原始包不入库，本页只保留脱敏后的用法；其他页面中的脚本名可点击跳转到本页对应条目。项目名统一泛化为 `<TOP_NAME>` 或「某项目」，人名路径泛化为「环境 owner」「APR 工程师」等角色；脚本名、变量名、文件名、目录结构保持真实。

- 每个条目前的锚点 id 供跨页跳转使用（如 `./script-dict.html#run_dc`）。
- 查找脚本可用右侧 TOC 或浏览器页内搜索。

## 1. 主流程环境（综合 / LEC / Lint）

<a id="design_set"></a>
### design.set（综合主控，106 行）

综合环境总控 tcl 配置。被 `compile_dc.tcl`、`compile_genus.tcl`、`rtl_gate.do`、`pt_setup.tcl` 以 `source ../design.set` 读入；各 `run_*` csh 用 `grep "set *TOP_NAME" ../design.set | sed ...` 动态提取 top name，再由 `genfilelist` 生成 filelist——「批量替换」的真实机制：top name 只写一处，运行时抓取。

关键变量：

| 变量 | 实例值 / 说明 |
|------|---------------|
| `TOP_NAME` / `SDC_NAME` | 换项目必改，只改这两行（不同项目 design.set 的 diff 实证） |
| `SYN_DIR` / `TCL_DIR` / `IP_CONS_DIR` / `TOP_CONS_DIR` / `UPF_DIR` / `HDL_DIR` | 各目录路径 |
| `SCAN_EN 0`、`INCR_OPT 1`、`BOND_OPT 1`、`USE_SAIF 0`、`USE_UPF 0` | 流程开关 |
| `LINK_LIB` / `TAR_LIB` | 实例 `nexchip_145_9t`，注释列各工艺候选 |
| `NET_DEFINE` | 实例 `[list "NETLIST" "nexchip_145_9t"]` |
| `ANA_EN 0`、`MEM_EN 0`、`LVT_EN 1`、`SVT_EN 0` | db / VT 开关 |
| `SYN_TOOL` | `"dc"`，可切 `genus` |
| `CORNER` | 实例 `"wcl_cmax_m40_setup"` |
| `SLACK_EN 0`、`DERATE_VAL 1.07`、`CORE_NUM 1`、`EC_R2V_EN 0`、`POSTPT_EN 0` | 其余开关 |

CORNER ↔ PVT ↔ RC_FILE 对照（注释）：`wc_cworst`=ss0p99v125c/cworst_125；`wcl_cworst`=ss0p99vn40c/cworst_m40；`lt_cbest`=ff1p21vn40c/cbest_m40；`ml_cbest`=ff1p21v125c/cbest_125；`tt_cbest`=tt1p1v25c/typical。

lane / mode 变体（`design.set_1lane` / `_2lane` / `_dplc` / `_drd`）：与主文件唯一 diff 是 `FSDB_FILE` 的 powerpro 目录名——是 PowerPro 功耗分析的 FSDB 配置变体，与时序 skew 分组无关。手工复制改一行即可。

<a id="run_dc"></a>
### run_dc（csh，35 行）

DC 综合入口：`cd dc && run_dc [参数]`。

- 流程：建 `rep_dir`；grep TOP_NAME；`genfilelist ${top_name}.f ./advanced`；写 `rep_dir/svn.info`（日期 + `svn info $PROJECT_PATH/HDL`）；`source /eda/env/syn1709.cshrc`（备选 syn1603）。
- **无参数** → `dc_shell-t -64bit -f compile_dc.tcl -x "set exit_flag 0"`，跑完留在交互 shell 调试；**有任意参数**（如 `1`）→ `exit_flag 1`，跑完自动 exit（batch 模式，bsub 必须加，否则 job 挂在交互 shell）。`run_lec` / `run_genus` / `run_pt` 同一机制。
- log tee 到 `rep_dir/dc.log`。

<a id="compile_dc_tcl"></a>
### compile_dc.tcl（215 行）

流程：`source design.set` → `$TCL_DIR/dc/dc_user_proc.tcl`、`basic_setup_all.tcl` → `read_filelist_all $FILELIST_DIR $NET_DEFINE`（check_error 保护，缺文件直接 quit）→ link → `check_design -multiple_designs` → design_rule / dont_use → `clk_period.tcl`、`kv_clkio.tcl` → **`source $IP_CONS_DIR/$TOP_NAME.tcl`（项目约束源文件）** + `input/output_delay.tcl` → `common_cons.tcl` → pre report → `kv_compile_unltra $INCR_OPT $USE_SAIF $BOND_OPT`（原文拼写 unltra）→ `kv_change_names` → 写出 `.gv_org` / `.ddc` / `.gv` / `_onlytop.v` + write_sdc → post report（area / power / clock_gating / timing / qor / vt_cell_usage、`kv_report_dff_num`、`kv_report_all_latch`）。

- `dont_touch.tcl` 自动生成：按约 50 个 cell 名通配 pattern（`*DTCLK_INV_1P_BUF*`、`*CG_CELL`、`*CLK_INV_BUF*`、`*BUF_N_RST*`、`*IDLY*`、`SCL_BUF`、`BUF_POWERON_CLK` 等）把匹配实例写进 `rep_dir/dont_touch.tcl`（实例 147 行）。
- 末尾 `exec netlist_reform.pl`（包外脚本）；`if {$exit_flag == 1} { exit }`；alias `rpt` / `rpt_pt` / `rpth` / `rpth_pt` / `h`。

<a id="run_genus"></a>
### run_genus

同 run_dc 骨架；`source /eda/env/genus1723.cshrc`；`genus -no_gui -64 -execute "set exit_flag 0|1" -files compile_genus.tcl`。

<a id="compile_genus_tcl"></a>
### compile_genus.tcl（238 行）

与 DC 版同构；`read_sdc $IP_CONS_DIR/${TOP_NAME}.tcl` + `echo $::dc::sdc_failed_commands`；`kv_upf_power $$USE_UPF`（原文双 `$` 笔误）；`kv_io_groups`；`kv_genus_compile "generic"/"map"/"opt"`；报告含 `report_timing -unconstrained`、`all_memory_final.rpt`、macro cell 面积 / leakage；`write_design -innovus`；`write_parasitics > $SPEF_FILE`。

<a id="run_lec"></a>
### run_lec

`source /eda/env/confrml17.cshrc`；清 `rep_dir`；genfilelist / svn.info 同骨架；`bsub -Ip "lec -xl -64 -do rtl_gate.do -nogui | tee ./rep_dir/lec.log &"`；有参数时 `lec_exit_flag=1`。变体目录：`lec_apr/`、`lec_apr_A1/`、`lec_rtl_eco/`、`lec_upf/`。

<a id="rtl_gate_do"></a>
### rtl_gate.do（157 行）

- golden = RTL（dc 流程先读 `ddc_lec.f` 再 `.sv.f` / `.f`）；revised：dc → `../dc/rep_dir/${TOP_NAME}.gv_org`；genus → `fv/fv_map.v.gz`（`EC_R2V_EN=0`，之后再做 fv_map vs .gv 第二趟）或直接 `.gv`（`=1`）。
- `compare -NONEQ_stop 999 -NONEQ_Print` → 输出 `unmapped.rpt` / `unreach.rpt` / `abort.rpt` / **`non_eq.rpt`（下划线！尾部 "No of diff points = N"）** / `r2g_bbox.rpt` → `analyze_abort -compare -threads 8`。
- **non_eq ≠ 0 且 `lec_exit_flag==0` 时 `set_gui on`（弹 GUI），否则 exit**——「没弹窗 ≠ 通过」的脚本依据。
- 变体：`lec_apr` revised 改读 APR 返回网表（APR 工程师 release 路径）；`lec_rtl_eco` 读 ECO 目录网表；各 `run_lec` 变体相同。
- `lec_upf`：`run_lec_lp`（perl）按时间戳建 `rep_dir/<ts>` 并 link latest；`lec -verify -64 -LP -NOGui -tclmode -dofile dofile_lp_check.tcl`；dofile 里 `set_lowpower_option -native_1801 -analysis_style pre_syn`，读 `.f` + `common/upf/${TOP_NAME}.upf`；自动生成文件叫 **`settings.upf`（有 s）**。

### design.set（prePT 版，91 行）

与综合主 design.set 同族；`VOLTAGE 0p9`、`top_cons_en 1`、`CK_FLT_EN 1 / CK_TIM_EN 1`、`LVT_EN 0 / SVT_EN 1`、`CORNER "wc_cworst"`。

<a id="sdc_pr"></a>
### sdc_pr 展开产物

`sdc_pr/<TOP_NAME>.tcl`（实例 1321 行）：文件头 "Created by PrimeTime write_sdc"，`sdc_version 2.1`，单位 ns——prePT 展开产物，供 APR 使用。

实测时钟表（校对依据）：

| clock | 周期 (ns) | uncertainty setup / hold (ns) |
|-------|-----------|-------------------------------|
| RX0_CLK | 9.5 | 0.475 / 0.15 |
| RX1_CLK | 17.1 | 0.855 / 0.15 |
| RX0_OD_CLK | 4.75 | **0.4** / 0.15 |
| RX1_OD_CLK | 8.55 | 0.4275 / 0.15 |
| STB_CLK | 6.43 | **0.4** / 0.15 |
| VS / LS / POWERON_CLK | 100 | 2 / 0.15 |
| OSC_CLK_IN | 20 | 1 / 0.15 |
| I2C_CLK | 500 | 2 / 0.15 |
| RX0_CLK_DIV1P5_1P | — | 0.95 / 0.15 |

generated clock：`DIV2`（`-edges {2 4 6}`）、`DIV1P5`（`-edges {1 3 4}`）等。

结论：**hold uncertainty 全部 0.15 ns = 150 ps 统一；setup 400 ps 只对高速 lane 时钟成立，其余 0.4275 ~ 2 ns 不等**。全包 grep 无 1.8 GHz、无 spread / 展频写法；包内最快时钟 4.75 ns ≈ 210 MHz。

<a id="pt_setup_post"></a>
### pt_setup.tcl（postPT 核心，345 行）

- 按 `$pwd` 分 `scan_atspeed` / `scan_stuck` / `func`；自动编号建 `log_DATE_N`、`rpt_DATE_N`（下设 `summary/setup/hold/skew/trans/analog`）、`whole_session_DATE_N`，并 `ln -s rpt_... latest`。
- CRPR 开启（threshold 10ps）；`SI_CHECK==1`：`si_enable_analysis true`、`composite_aggr statistical`、`double_switching clock_network`、`all_path_edges` 等（注释留备选 SI 配置）。

- `CONS_CHECK==1`：check_timing、report_disable_timing、report_exceptions、report_analysis_coverage 等 + `pt_report.tcl` + `report_timing_prj.tcl` → 非 scan 时 `report_timing_trans.tcl` → max 跑 skew_isprx / skew_sd / skew_io / 1P5 → min 再跑 isprx / sd / io（**1P5 只跑 max**）→ save_session。`QUIT==1` 跑完直接 quit。

<a id="report_timing_prj_tcl"></a>
### report_timing_prj.tcl（41 行，主 report 定义）

- setup：`report_timing -pba_mode path -delay_type max -path_type full_clock_expanded -crosstalk_delta -derate -slack_lesser_than 0.5 -max_paths 1000 > setup/report_timing_setup.rpt`；每 clock 单独一份（slack < 0.2）；async / clock_gating 组。hold 同构。
- trans：`report_constraint -all_violators -verbose` 全量 + max_transition / max_capacitance / min_pulse_width / min_period → `trans/` 5 份；另写 `${PROJECT}.sum.rpt`、`.drv.rpt`、`.clk.sum.rpt`。

### skew 报告四件套

<a id="skew_sd"></a>
#### report_timing_skew_sd.tcl（172 行）—— SD data/clock skew（L/R × A/B）

完整路径 `SYNTHESIS/top/sta/post/common/report_timing_skew_sd.tcl`；脚本内容截图与 `-max_path` 取舍经验见 <a href="./pt-intro.html" target="_blank">PT 介绍</a> skew 章节。

<a id="get_pl"></a>

| 脚本 | 输入 → 输出 |
|------|-------------|
| `get_violate.pl <dir>` | 扫 `*.rpt` 抓 slack ≤ -0.001 → CSV `clock名,violation数,最大违规` |

<a id="merge_pl"></a>
### merge_*.pl（perl 合并层）

| 脚本 | 产物 |
|------|------|
| `merge_violate.pl` | 各 corner csv 横向合并 → `report_setup.csv` / `report_hold.csv` / `report_trans.csv` |
| `merge_sd_busskew.pl` | → `report_sd_busskew.csv`（**行 = 72 个分组指标，含 margin 标注规格 [-1:6]；列 = corner**）——「Excel 上半 latency 下半 skew/margin」的真实形态，实际产物是 CSV |
| `merge_phy_busskew.pl` | → `report_phy_busskew.csv` |
| `grep_trans_path.pl` | 从 cons.rpt max_transition 段抽违规 pin 生成 report_timing 行 |

  <div class="lightbox" id="lightbox">
    <span class="close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
    <div class="hint">滚轮缩放 · 拖拽移动 · Esc 或点击空白处关闭</div>

  <script>

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;

function openLightbox(src) {
  lbImg.src = src;
  scale = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
  lightbox.classList.add('active');
}

function closeLightbox() {
  lightbox.classList.remove('active');
}

function updateTransform() {
  lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

document.addEventListener('click', (e) => {
  const img = e.target.closest('img');
  if (!img || img.id === 'lightbox-img' || !img.closest('.article')) return;
  openLightbox(img.src);
});

lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

lightbox.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  scale = Math.min(Math.max(0.5, scale + delta), 4);
  updateTransform();
});

lbImg.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  lbImg.classList.add('grabbing');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  updateTransform();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.classList.remove('grabbing');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
});

  </script>

  <script>
const article = document.getElementById('article');
article.innerHTML = marked.parse(document.getElementById('md').textContent, {gfm:true, breaks:false});
applyGlossary(article);

// Render mermaid diagrams (applyGlossary skips pre/code, so sources stay intact)
(function () {
  const blocks = article.querySelectorAll('pre > code.language-mermaid');
  if (!blocks.length || typeof mermaid === 'undefined') return;
  blocks.forEach(code => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    code.parentElement.replaceWith(div);
  });
  mermaid.initialize({
    startOnLoad: false,
    theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
  });
  mermaid.run({ nodes: article.querySelectorAll('.mermaid') });
})();
const toc = document.getElementById('toc');
const h1 = article.querySelector('h1');
const headings = article.querySelectorAll('h2, h3');
headings.forEach((h, i) => { h.id = 'sec-' + i; });

// 标题统一自动编号：h2 = "N."，h3 = "N.M"；先剥离手写编号再重排，只改首个文本节点以保留标题内链接
let h2No = 0, h3No = 0;
headings.forEach(h => {
  if (h.firstChild && h.firstChild.nodeType === 3) {
    h.firstChild.nodeValue = h.firstChild.nodeValue.replace(/^\s*\d+(\.\d+)*[.、]?\s+/, '');
  }
  if (h.tagName === 'H2') {
    h2No++; h3No = 0;
    h.prepend(document.createTextNode(h2No + '. '));
  } else {
    h3No++;
    h.prepend(document.createTextNode(h2No + '.' + h3No + ' '));
  }
});

let tocHtml = '';
if (h1) {
  tocHtml += `<a class="toc-h1" href="#">${h1.textContent}</a>`;
}
tocHtml += '<ul style="list-style:none;padding:0;margin:0;">';
const h3ToH2 = {};
for (let i = 0; i < headings.length; i++) {
  const h = headings[i];
  if (h.tagName !== 'H2') continue;
  const children = [];
  let j = i + 1;
  while (j < headings.length && headings[j].tagName === 'H3') {
    children.push(headings[j]);
    h3ToH2[headings[j].id] = h.id;
    j++;
  }
  const arrow = children.length > 0
    ? `<span class="toc-arrow open" data-target="${h.id}">▸</span>`
    : '<span class="toc-arrow-spacer"></span>';
  tocHtml += `<li class="toc-h2-item">${arrow}<a href="#${h.id}">${h.textContent}</a></li>`;
  if (children.length > 0) {
    tocHtml += `<li class="toc-h3-group" data-group="${h.id}"><ul style="list-style:none;padding:0;margin:0;">`;
    children.forEach(c => {
      tocHtml += `<li><a class="toc-h3" href="#${c.id}">${c.textContent}</a></li>`;
    });
    tocHtml += '</ul></li>';
  }
}
tocHtml += '</ul>';
toc.innerHTML = tocHtml;

toc.querySelectorAll('.toc-arrow').forEach(arrow => {
  arrow.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const group = toc.querySelector('.toc-h3-group[data-group="' + arrow.dataset.target + '"]');
    const collapsed = group.classList.toggle('collapsed');
    arrow.classList.toggle('open', !collapsed);
    if (collapsed) {
      const activeInGroup = group.querySelector('a.active');
      if (activeInGroup) {
        activeInGroup.classList.remove('active');
        const parentLink = toc.querySelector('a[href="#' + arrow.dataset.target + '"]');
        if (parentLink) parentLink.classList.add('active');
      }
    }
  });
});

const tocLinks = toc.querySelectorAll('a[href^="#"]');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(a => a.classList.remove('active'));
      let targetId = entry.target.id;
      if (h3ToH2[targetId]) {
        const group = toc.querySelector('.toc-h3-group[data-group="' + h3ToH2[targetId] + '"]');
        if (group && group.classList.contains('collapsed')) {
          targetId = h3ToH2[targetId];
        }
      }
      const active = toc.querySelector('a[href="#' + targetId + '"]');
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
headings.forEach(h => observer.observe(h));
</script>
