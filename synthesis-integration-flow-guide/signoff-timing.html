# 五、Signoff、时序与流程依赖

&gt; 综合和 LEC 通过后，进入 signoff、时序分析和最终交付阶段。

## 1. Signoff 与交付

### 1.1 Signoff 检查
在自己的 IP 路径下运行 signoff 脚本（脚本本体在脚本包外）时，会自动：
- 收集 CKF、nLint、DC、LEC 等各环节的 log / report（`signoff.rpt` 样本中 LEC 环节写作 **EC**，并收集 Top name / 路径 / Project path 及各环节的 SVN Version 与 run Date）
- check 综合相关目录对应的版本号，确保 CKF / nLint / DC / LEC 等步骤基于同一 RTL 版本
- 输出 `signoff.rpt`，汇总所有 error 与 check 信息；每一项报错都需要修掉
- 界面逐项显示 check 结果，全部通过显示 signoff pass；有 error 会明确指出具体环节
- 把当前版本全部 log / report 自动备份，可追溯上一版结果
- 全部通过后，自动 release 到指定目录并指向 `latest`

WARNING:
- `signoff fake` 仅限中间调试版本使用——明知有 error 暂不想修时，仅做备份保存。

- <span class="badge badge-rtl">严禁</span> 最终交付版本使用 `signoff fake`，必须走全量校验；silver netlist 后通常不允许 `signoff fake`，紧急情况需单独申请。

![Signoff 检查输出示例](./image_02.png)

### 1.2 交付物示例

| 交付物 | 说明 |
|--------|------|
| netlist (`*.v` / `*.gv`) | 综合后的门级网表 |
| SDC | 时序约束 |
| UPF | 电源意图文件 |
| `dont_touch.tcl` | 不被优化的单元列表 |
| `signoff.rpt` | signoff 检查报告 |
| release 目录 | 按版本归档的完整结果 |

![Signoff PASS 与 release 示例](./image_03.png)

交付 APR 的内容：netlist、SDC、UPF（如有）、don't touch 列表。self report 放自己的路径；release 目录现统一放到公共 database 路径。

NOTE: <span class="badge badge-tx">必须</span> 正式 Silver / Golden netlist release 时，必须填写 netlist release check Excel 确认表，逐项检查并签字确认（纯人工流程）。

### 1.3 交付前检查要点

跨部门交付 APR 前，pre-delivery check 一定要做好——APR 开工后发现问题会直接找回来。

- unconstrained（未约束）路径交付 = 重大 bug；constraint 下错（如过紧）还可以改，未约束路径无法事后补救。
- floating 信号在 APR 可能被优化剪掉、整路逻辑消失，需确认是否有意保留。
- <span class="badge badge-tx">必须</span> 确保 DC 和 PT 均无 violation 才能交付。

---

## 2. 时序分析（PrimeTime）

### 2.1 Pre-PT

```bash
cd pt
run_pt
```

prePT 的作用：把 constraint 展开成完整形式、检查 SDC 语法、做简单的 timing check。

- <a href="./script-dict.html#pt_setup_pre" target="_blank">pt_setup.tcl</a> 一般无需修改；其中 `set auto_wire_load_selection false` 是刻意关掉的——开着时 pre_pt 的 timing 会比 DC 的 timing 差得多。IP 级环境下 pt_setup.tcl 对应的是 `common_pt.tcl`。
- `common_db_pvt.tcl` 选择与实际综合一致的 corner（如 `wc_cworst`）。
- 注意 memory / analog 的 PVT 可能与标准单元不同。

检查项：
- `pt.log` 无 Error
- `*.rpt` 中 timing slack &gt; 0

运行路径：IP 路径和 TOP 路径下都有 prePT 脚本（两套环境的工具版本不同：IP 级用 pt1706，TOP 级用 pt1806），当前一般使用 TOP 路径下的版本；IP 路径下的脚本目前跑不过、待排查（在 IP 下跑的好处是 signoff 时 PT log / report 可以一起 signoff）。

prePT 产物中还可以查到（真实文件名）：
- unconstrained（未约束）路径列表——在 `pt_rpt/${TOP_NAME}_cons.rpt`
- SDC 语法错误——`read_sdc.log`
- 每个 clock 域下挂的 DFF 数量——`report_dff_num.rpt`
- floating 信号列表（APR 对接工程师有时需要）——`pt_input_float.log`

### 2.2 prePT 报告的下游应用：后仿 notimingcheck 配置

prePT 报告除了看时序，还有一个重要下游用途：**给 gate-level 后仿生成 notimingcheck 名单**。

![notimingcheck_DIG.cfg 实例](./image/pre_pt之后notimingcheck.jpg)

配置文件（真实路径）：

```text
HV2M23/DV_TCON_C/script/notimingcheck_DIG.cfg
```

格式为逐行列 instance 的完整仿真层次：

```text
instance {chip_tb_top.u_<TOP>.u_<TOP>_digital_top.u_LOGIC_CENTER.LINK_LOGIC.U_SYNC_L0L1.<...>_reg} {noTiming};
```

**为什么在 prePT 之后做（而不是 DC 之后）：**

- 这个 cfg 是后仿（带 SDF 的 gate-level 仿真）用的，`noTiming` 让仿真工具不对这些 instance 做 setup / hold 等 timing check。
- 「哪些 instance 不需要 check」必须由**完整约束下的 STA 报告**判定——prePT 是第一个拿综合网表 + 完整展开 SDC 做全量 STA 的节点，异步跨域、同步器、准静态路径只有在 prePT 报告里才看得全。
- DC 阶段的 timing 只是 wireload 估计、约束未完整展开，不能作为「这条路径不用 check」的依据。
- 图中实例名单自己也证明了来源：`U_SYNC_L0L1`（同步器）、`U_L0_CIRC_DELAY_BUF`（环形 delay buffer）、`BLANK_EN_ASYNC`、`CSPI_CMD_ALIGN` 等，全是 STA 报告里「刻意不做时序检查」的异步 / 延时链寄存器。

**为什么需要它：** 后仿带 SDF 时，这些异步 / 延时 instance 会刷出大量假的 setup / hold violation 甚至 X 传播，把真实问题淹没；用 `noTiming` 屏蔽后仿真 log 才干净，真实 violation 才看得见。

**操作步骤：**

1. 跑完 prePT，看报告中的异步跨域 / unconstrained / 准静态路径；
2. 确认属于「不 check」的 instance（同步器、delay buffer、async 控制信号）；
3. 按仿真层次写进 `notimingcheck_DIG.cfg`；
4. 后仿环境读取该 cfg，仿真时这些 instance 不做 timing check。

注意：名单必须与 STA 报告逐条对应，漏加会被假 violation 淹没，错加会把真实时序问题掩盖掉——和 false path 一样需要人工逐条确认。

### 2.3 Post-PT

基于 APR 后端输出进行 signoff 级时序分析：

```bash
cd sta/post/pt
run_pt
```

每个 corner 目录下各有一份入口脚本 <a href="./script-dict.html#run_pt_post" target="_blank">run_pt</a>（只跑当前 corner）。

需修改：
- <a href="./script-dict.html#corner_set_tcl" target="_blank">corner_set.tcl</a>：每个 corner 下各有一份；corner 配置基本不动，换库时需照 foundry 提供的 PVT 文档（含 OCV）逐项更换。当前 <a href="./script-dict.html#run_summary" target="_blank">run_summary</a> 实际跑 10 个 corner：`wc_cworst_125` / `wc_cbest_125` / `wc_typical_125` / `lt_cworst_m40` / `lt_cbest_m40` / `lt_typical_m40` / `ml_cbest_125` / `tt_cworst_25` / `tt_cbest_25` / `tt_typical_25`——无 wcl（脚本中已整段注释掉）、无 bc（bc 是旧命名，只出现在旧版串行脚本 `run_all` 中）

  - `wc`：ss 低压高温（LVHT）
  - `wcl`：ss 低压低温（LVLT）
  - `lt`：ff 高压低温（HVLT）
  - `ml`：ff 高压高温（HVHT）
  - `tt`：典型温压
- <a href="./script-dict.html#pt_setup_post" target="_blank">pt_setup.tcl</a>：最核心的脚本，内含大量需要 check 的 report 定义（slack、clock path 等）；读取 APR 吐出的网表（`.v` / `.gv`）与 spef；`set_operating_conditions` 必须与 `DataBase/Analog/DB` 下对应 `.lib` 中的 operating_conditions 保持一致；约束读的是 APR 返回的 postcts SDC（`${SDC_PATH}/${SDC_NAME}_postcts.sdc`），不是 prePT `sdc_pr/` 的展开产物直接喂入
- `pt/design.set`：路径、LINK_LIB、TAR_LIB、NET_DEFINE、POSTPT_EN=1 等
  - `POSTPT_EN` 必须为 1
  - `PT_HOLD` 仅针对特定工艺（如 22nm）
- `common_db_pvt.tcl`

注意 memory / analog 的 PVT 可能与标准单元不同。

使用经验：
- 打开 postPT 环境第一件事先改 top name；SDC / 网表路径可在配置中搜索 APR 对接工程师的标识快速定位（APR 网表路径固定），并确认路径为最新。
- 附加自研脚本：抓 worst slack、批量跑 PT、跑完后 merge 结果。

WARNING: corner 配置里有 dump SDF 开关（真实变量名是 corner_set.tcl 里的 <a href="./script-dict.html#dump_sdf" target="_blank">DUMP_SDF</a>，打开则专门生成 SDF，供后仿使用）。真实机理：`DUMP_SDF==1` 的那趟 run 只执行 `write_sdf` 并跳过全部 report——两个分支互斥，结果并非被删除，而是 `latest` 软链指向了这趟只产 SDF 的 run，run summary 自然抓到空。run summary 里发现某 corner 结果为空，基本就是这个原因；关掉后重跑该 corner 即可恢复。

## 3. 流程依赖关系

各步骤的并行与串行关系如下：

- CKF、nLint、lec_upf、DC/Genus 原则上可并行。
- 为保证 signoff 的版本一致性检查，DC/Genus 需在 CKF、nLint 之后运行。
- Pre-PT 与 LEC 可并行。

整体执行顺序：CKF + nLint（语法通过）→ DC → LEC 和 prePT → 逐个查看 report 确认无 error → DC / PT 均无 violation → 交付。

```mermaid
flowchart TD
  CKF["CKF 连接检查"] -->|"需先通过"| SYN["DC/Genus 综合"]
  LINT["nLint 语法检查"] -->|"需先通过"| SYN
  SYN --> LEC["LEC"]
  SYN --> PRE["prePT"]
  LEC --> RPT["逐个看 report 确认无 error"]
  PRE --> RPT
  RPT --> SO["signoff"]
  SO --> APR["交付 APR"]
  APR --> POST["postPT"]
```

  <div class="lightbox" id="lightbox">
    <span class="close" id="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="">
    <div class="hint">滚轮缩放 · 拖拽移动 · Esc 或点击空白处关闭</div>

  <script>

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;

function openLightbox(src) {
  lbImg.src = src;
  scale = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
  lightbox.classList.add('active');
}

function closeLightbox() {
  lightbox.classList.remove('active');
}

function updateTransform() {
  lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

document.addEventListener('click', (e) => {
  const img = e.target.closest('img');
  if (!img || img.id === 'lightbox-img' || !img.closest('.article')) return;
  openLightbox(img.src);
});

lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

lightbox.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  scale = Math.min(Math.max(0.5, scale + delta), 4);
  updateTransform();
});

lbImg.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  lbImg.classList.add('grabbing');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  updateTransform();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.classList.remove('grabbing');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
});

  </script>

  <script>
const article = document.getElementById('article');
article.innerHTML = marked.parse(document.getElementById('md').textContent, {gfm:true, breaks:false});
applyGlossary(article);

// Render mermaid diagrams (applyGlossary skips pre/code, so sources stay intact)
(function () {
  const blocks = article.querySelectorAll('pre > code.language-mermaid');
  if (!blocks.length || typeof mermaid === 'undefined') return;
  blocks.forEach(code => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    code.parentElement.replaceWith(div);
  });
  mermaid.initialize({
    startOnLoad: false,
    theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
  });
  mermaid.run({ nodes: article.querySelectorAll('.mermaid') });
})();
const toc = document.getElementById('toc');
const h1 = article.querySelector('h1');
const headings = article.querySelectorAll('h2, h3');
headings.forEach((h, i) => { h.id = 'sec-' + i; });

// 标题统一自动编号：h2 = "N."，h3 = "N.M"；先剥离手写编号再重排，只改首个文本节点以保留标题内链接
let h2No = 0, h3No = 0;
headings.forEach(h => {
  if (h.firstChild && h.firstChild.nodeType === 3) {
    h.firstChild.nodeValue = h.firstChild.nodeValue.replace(/^\s*\d+(\.\d+)*[.、]?\s+/, '');
  }
  if (h.tagName === 'H2') {
    h2No++; h3No = 0;
    h.prepend(document.createTextNode(h2No + '. '));
  } else {
    h3No++;
    h.prepend(document.createTextNode(h2No + '.' + h3No + ' '));
  }
});

let tocHtml = '';
if (h1) {
  tocHtml += `<a class="toc-h1" href="#">${h1.textContent}</a>`;
}
tocHtml += '<ul style="list-style:none;padding:0;margin:0;">';
const h3ToH2 = {};
for (let i = 0; i < headings.length; i++) {
  const h = headings[i];
  if (h.tagName !== 'H2') continue;
  const children = [];
  let j = i + 1;
  while (j < headings.length && headings[j].tagName === 'H3') {
    children.push(headings[j]);
    h3ToH2[headings[j].id] = h.id;
    j++;
  }
  const arrow = children.length > 0
    ? `<span class="toc-arrow open" data-target="${h.id}">▸</span>`
    : '<span class="toc-arrow-spacer"></span>';
  tocHtml += `<li class="toc-h2-item">${arrow}<a href="#${h.id}">${h.textContent}</a></li>`;
  if (children.length > 0) {
    tocHtml += `<li class="toc-h3-group" data-group="${h.id}"><ul style="list-style:none;padding:0;margin:0;">`;
    children.forEach(c => {
      tocHtml += `<li><a class="toc-h3" href="#${c.id}">${c.textContent}</a></li>`;
    });
    tocHtml += '</ul></li>';
  }
}
tocHtml += '</ul>';
toc.innerHTML = tocHtml;

toc.querySelectorAll('.toc-arrow').forEach(arrow => {
  arrow.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const group = toc.querySelector('.toc-h3-group[data-group="' + arrow.dataset.target + '"]');
    const collapsed = group.classList.toggle('collapsed');
    arrow.classList.toggle('open', !collapsed);
    if (collapsed) {
      const activeInGroup = group.querySelector('a.active');
      if (activeInGroup) {
        activeInGroup.classList.remove('active');
        const parentLink = toc.querySelector('a[href="#' + arrow.dataset.target + '"]');
        if (parentLink) parentLink.classList.add('active');
      }
    }
  });
});

const tocLinks = toc.querySelectorAll('a[href^="#"]');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(a => a.classList.remove('active'));
      let targetId = entry.target.id;
      if (h3ToH2[targetId]) {
        const group = toc.querySelector('.toc-h3-group[data-group="' + h3ToH2[targetId] + '"]');
        if (group && group.classList.contains('collapsed')) {
          targetId = h3ToH2[targetId];
        }
      }
      const active = toc.querySelector('a[href="#' + targetId + '"]');
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
headings.forEach(h => observer.observe(h));
</script>
