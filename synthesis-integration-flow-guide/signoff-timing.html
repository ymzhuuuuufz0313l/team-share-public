# 五、Signoff、时序与流程依赖

&gt; 综合和 LEC 通过后，进入 signoff、时序分析和最终交付阶段。

signoff 是综合、时序、形式验证等关键检查全部通过后的最终确认与交付流程。

## 1. Signoff 与交付

### 1.1 Signoff 检查
运行 signoff 脚本时，会：
- check 综合相关目录对应的版本号，确保 CKF / nLint / DC / LEC 等步骤基于同一 RTL 版本
- 输出 `signoff.rpt`，汇总所有 error 与 check 信息；每一项报错都需要修掉
- 全部通过后，自动 release 到指定目录并指向 `latest`

WARNING:
- 若 CKF / nLint / DC / LEC 无法全部 pass，可申请 `signoff fake`。

  signoff fake 指部分检查项未完全通过时，经项目审批后执行的临时性或有条件签核。

- silver netlist 后通常不允许 `signoff fake`，紧急情况需单独申请。

  silver netlist 是项目流程中某一阶段释放的中间版本网表，通常接近最终版用于下游提前开展工作。

![Signoff 检查输出示例](./image_02.png)

### 1.2 交付物示例

| 交付物 | 说明 |
|--------|------|
| netlist (`*.v` / `*.gv`) | 综合后的门级网表 |
| SDC | 时序约束 |
| UPF | 电源意图文件 |
| `dont_touch.tcl` | 不被优化的单元列表 |
| `signoff.rpt` | signoff 检查报告 |
| release 目录 | 按版本归档的完整结果 |

![Signoff PASS 与 release 示例](./image_03.png)

---

## 2. 时序分析（PrimeTime）

PrimeTime 是 Synopsys 静态时序分析工具，用于验证综合后或 APR 后门级网表的时序收敛。

### 2.1 Pre-PT

Pre-PT 是基于综合后网表进行的预布局布线静态时序分析，用于评估综合阶段时序质量。

```bash
cd pt
run_pt
```

- `pt_setup.tcl` 一般无需修改。
- `common_db_pvt.tcl` 选择与实际综合一致的 corner（如 `wc_cworst`）。
- 注意 memory / analog 的 PVT 可能与标准单元不同。

检查项：
- `pt.log` 无 Error
- `*.rpt` 中 timing slack &gt; 0

### 2.2 Post-PT

Post-PT 是基于 APR 后端输出网表进行的 signoff 级静态时序分析，是最终时序验收环节。

基于 APR 后端输出进行 signoff 级时序分析：

```bash
cd sta/post/pt
run_pt
```

需修改：
- `corner_set.tcl`：wc / wcl / lt / ml / tt 等 corner

  wc、wcl、lt、ml、tt 是典型 PVT corner 缩写，分别对应低压高温、低压低温、高压低温、高压高温、典型温压。

  - `wc`：低压高温（LVHT）
  - `wcl`：低压低温（LVLT）
  - `lt` / `bc`：高压低温（HVLT）
  - `ml`：高压高温（HVHT）
  - `tt`：典型温压
- `pt_setup.tcl`：读取 APR 吐出的网表、设置 operating conditions
- `pt/design.set`：路径、LINK_LIB、TAR_LIB、NET_DEFINE、POSTPT_EN=1 等
  - `POSTPT_EN` 必须为 1
  - `PT_HOLD` 仅针对特定工艺（如 22nm）
- `common_db_pvt.tcl`

注意 memory / analog 的 PVT 可能与标准单元不同。

## 3. 流程依赖关系

各步骤的并行与串行关系如下：

- CKF、nLint、lec_upf、DC/Genus 原则上可并行。
- 为保证 signoff 的版本一致性检查，DC/Genus 需在 CKF、nLint 之后运行。
- Pre-PT 与 LEC 可并行。

  <script>

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;

function openLightbox(src) {
  lbImg.src = src;
  scale = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
  lightbox.classList.add('active');
}

function closeLightbox() {
  lightbox.classList.remove('active');
}

function updateTransform() {
  lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

document.querySelectorAll('img').forEach(img => {
  if (img.id === 'lightbox-img') return;
  img.addEventListener('click', () => openLightbox(img.src));
});

lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

lightbox.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  scale = Math.min(Math.max(0.5, scale + delta), 4);
  updateTransform();
});

lbImg.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  lbImg.classList.add('grabbing');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  updateTransform();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.classList.remove('grabbing');
});

  </script>

  <script>
document.getElementById('article').innerHTML = marked.parse(document.getElementById('md').textContent, {gfm:true, breaks:false});

const article = document.getElementById('article');
const toc = document.getElementById('toc');
const h1 = article.querySelector('h1');
let tocHtml = '';
if (h1) {
  tocHtml += `<a class="toc-h1" href="#">${h1.textContent}</a>`;
}
tocHtml += '<ul style="list-style:none;padding:0;margin:0;">';
const headings = article.querySelectorAll('h2, h3');
headings.forEach((h, i) => {
  const id = 'sec-' + i;
  h.id = id;
  const cls = h.tagName === 'H2' ? '' : 'toc-h3';
  tocHtml += `<li><a class="${cls}" href="#${id}">${h.textContent}</a></li>`;
});
tocHtml += '</ul>';
toc.innerHTML = tocHtml;

const tocLinks = toc.querySelectorAll('a[href^="#"]');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(a => a.classList.remove('active'));
      const active = toc.querySelector('a[href="#' + entry.target.id + '"]');
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
headings.forEach(h => observer.observe(h));
</script>
