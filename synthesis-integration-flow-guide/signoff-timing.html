# 五、APR SIGNOFF（Signoff、时序与流程依赖）

&gt; 综合和 LEC 通过后，进入 signoff、时序分析和最终交付阶段。整个流程有**两个阶段的 signoff**：第一阶段 **APR SIGNOFF**（本章：交付 APR 前的版本一致性检查与 release、postPT 全 corner 时序验收）；第二阶段 **TO SIGNOFF**（APR 修改全部完成后的最终确认，见 <a href="./to-signoff.html" target="_blank">TO SIGNOFF</a> 章）。

## 1. Signoff 检查与交付

### 1.1 Signoff 检查
在自己的 IP 路径下运行 signoff 脚本（脚本本体在脚本包外）时，会自动：
- 收集 CKF、nLint、DC、LEC 等各环节的 log / report（`signoff.rpt` 样本中 LEC 环节写作 **EC**，并收集 Top name / 路径 / Project path 及各环节的 SVN Version 与 run Date）
- check 综合相关目录对应的版本号，确保 CKF / nLint / DC / LEC 等步骤基于同一 RTL 版本
- 输出 `signoff.rpt`，汇总所有 error 与 check 信息；每一项报错都需要修掉
- 界面逐项显示 check 结果，全部通过显示 signoff pass；有 error 会明确指出具体环节
- 把当前版本全部 log / report 自动备份，可追溯上一版结果
- 全部通过后，自动 release 到指定目录并指向 `latest`

WARNING:
- `signoff fake` 仅限中间调试版本使用——明知有 error 暂不想修时，仅做备份保存。

- <span class="badge badge-rtl">严禁</span> 最终交付版本使用 `signoff fake`，必须走全量校验；silver netlist 后通常不允许 `signoff fake`，紧急情况需单独申请。

![Signoff 检查输出示例](./image/03_signoff_check.png)

### 1.2 交付物示例

| 交付物 | 说明 |
|--------|------|
| netlist (`*.v` / `*.gv`) | 综合后的门级网表 |
| SDC | 时序约束 |
| `dont_touch.tcl` | 不被优化的单元列表 |
| `signoff.rpt` | signoff 检查报告 |
| release 目录 | 按版本归档的完整结果 |

![Signoff PASS 与 release 示例](./image/04_signoff_pass_release.png)

交付 APR 的内容：netlist、SDC、don't touch 列表。self report 放自己的路径；release 目录现统一放到公共 database 路径。

WARNING: <span class="badge badge-tx">必须</span> 正式 Silver / Golden netlist release 时，必须填写 netlist release check Excel 确认表，逐项检查并签字确认（纯人工流程）。

### 1.3 交付前检查要点

跨部门交付 APR 前，pre-delivery check 一定要做好——APR 开工后发现问题会直接找回来。

KEY: unconstrained（未约束）路径交付 = 重大 bug；constraint 下错（如过紧）还可以改，未约束路径无法事后补救。交付前必须确认 unconstrained paths 清零（在 prePT 的 `${TOP_NAME}_cons.rpt` 中查）。

- floating 信号在 APR 可能被优化剪掉、整路逻辑消失，需确认是否有意保留。
- <span class="badge badge-tx">必须</span> 确保 DC 和 PT 均无 violation 才能交付。

### 1.4 交付落盘：DataBase 目录与 update_latest

signoff 通过、全部 run 完成后，交付物要到 DataBase 公共目录落盘确认：

**① 开通目录权限**：DataBase 目录默认无写权限，联系 DataBase 管理员（顾老师）开通；开通后用 `newgrp` 提权切换到项目管理员组：

```bash
newgrp HV2M23_adm
```

**② 进入交付目录**（注意是 `Release`，每项目一个 `<TOP>_to_APR` 目录）：

```bash
cd /HV2M23/DataBase/Digital/Release/HV2M23_digital_top_to_APR
```

**③ 运行 `update_latest`**：刷新 `latest` 指向最新交付版本。跑完后 `latest/` 下应看到完整交付文件清单：

![update_latest 跑完后 latest 目录下的文件清单](./image/05_update_latest_filelist.jpg)

| 文件 | 说明 |
|------|------|
| `<TOP>.gv` | 综合后门级网表 |
| `<TOP>.sdc` / `<TOP>_postcts.sdc` | 时序约束（postcts 为 APR 返回版本） |
| `dont_touch.tcl` | 不被优化的单元列表 |
| `add_on.tcl` / `add_on_nomulti.tcl` | 附加约束脚本 |

清单与 §1.2 交付物一一对应，缺任何一样都说明 release 流程没走完，回上一步排查。

---

## 2. 时序分析（PrimeTime）

&gt; prePT / postPT 的**运行与配置**（什么时候做、怎么跑、corner 配置、notimingcheck、SDF 生成）以及 **postPT 方法论**（约束、skew、报告解读）均见 <a href="./pt-intro.html" target="_blank">「POSTPT」</a>章。

与本章强相关的时序交付纪律（保留备查）：

- 交付 APR 前必须确认 unconstrained 清零——在 prePT 的 `${TOP_NAME}_cons.rpt` 中查（见 §1.3）。
- DC 和 PT 均无 violation 才能交付。


## 3. 流程依赖关系

各步骤的并行与串行关系如下：

- CKF、nLint、lec_upf、DC/Genus 原则上可并行。
- 为保证 signoff 的版本一致性检查，DC/Genus 需在 CKF、nLint 之后运行。
- Pre-PT 与 LEC 可并行。

整体执行顺序：CKF + nLint（语法通过）→ DC → LEC 和 prePT → 逐个查看 report 确认无 error → DC / PT 均无 violation → 交付。

```mermaid
flowchart TD
  CKF["CKF 连接检查"] -->|"需先通过"| SYN["DC/Genus 综合"]
  LINT["nLint 语法检查"] -->|"需先通过"| SYN
  SYN --> LEC["LEC"]
  SYN --> PRE["prePT"]
  LEC --> RPT["逐个看 report 确认无 error"]
  PRE --> RPT
  RPT --> SO["signoff"]
  SO --> APR["交付 APR"]
  APR --> POST["postPT"]
```

    <img id="lightbox-img" src="" alt="">
    <div class="hint">滚轮缩放 · 拖拽移动 · Esc 或点击空白处关闭</div>
  </div>

  <script>

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;

function openLightbox(src) {
  lbImg.src = src;
  scale = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
  lightbox.classList.add('active');
}

function closeLightbox() {
  lightbox.classList.remove('active');
}

function updateTransform() {
  lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

document.addEventListener('click', (e) => {
  const img = e.target.closest('img');
  if (!img || img.id === 'lightbox-img' || !img.closest('.article')) return;
  openLightbox(img.src);
});

lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

lightbox.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  scale = Math.min(Math.max(0.5, scale + delta), 4);
  updateTransform();
});

lbImg.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  lbImg.classList.add('grabbing');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  updateTransform();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.classList.remove('grabbing');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
});

  </script>

  <script>
const article = document.getElementById('article');
article.innerHTML = marked.parse(document.getElementById('md').textContent, {gfm:true, breaks:false});
applyGlossary(article);

// Render mermaid diagrams (applyGlossary skips pre/code, so sources stay intact)
(function () {
  const blocks = article.querySelectorAll('pre > code.language-mermaid');
  if (!blocks.length || typeof mermaid === 'undefined') return;
  blocks.forEach(code => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    code.parentElement.replaceWith(div);
  });
  mermaid.initialize({
    startOnLoad: false,
    theme: window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default'
  });
  mermaid.run({ nodes: article.querySelectorAll('.mermaid') });
})();
const toc = document.getElementById('toc');
const h1 = article.querySelector('h1');
const headings = article.querySelectorAll('h2, h3');
headings.forEach((h, i) => { h.id = 'sec-' + i; });

// 标题统一自动编号：h2 = "N."，h3 = "N.M"；先剥离手写编号再重排，只改首个文本节点以保留标题内链接
let h2No = 0, h3No = 0;
headings.forEach(h => {
  if (h.firstChild && h.firstChild.nodeType === 3) {
    h.firstChild.nodeValue = h.firstChild.nodeValue.replace(/^\s*\d+(\.\d+)*[.、]?\s+/, '');
  }
  if (h.tagName === 'H2') {
    h2No++; h3No = 0;
    h.prepend(document.createTextNode(h2No + '. '));
  } else {
    h3No++;
    h.prepend(document.createTextNode(h2No + '.' + h3No + ' '));
  }
});

let tocHtml = '';
if (h1) {
  tocHtml += `<a class="toc-h1" href="#">${h1.textContent}</a>`;
}
tocHtml += '<ul style="list-style:none;padding:0;margin:0;">';
const h3ToH2 = {};
for (let i = 0; i < headings.length; i++) {
  const h = headings[i];
  if (h.tagName !== 'H2') continue;
  const children = [];
  let j = i + 1;
  while (j < headings.length && headings[j].tagName === 'H3') {
    children.push(headings[j]);
    h3ToH2[headings[j].id] = h.id;
    j++;
  }
  const arrow = children.length > 0
    ? `<span class="toc-arrow open" data-target="${h.id}">▸</span>`
    : '<span class="toc-arrow-spacer"></span>';
  tocHtml += `<li class="toc-h2-item">${arrow}<a href="#${h.id}">${h.textContent}</a></li>`;
  if (children.length > 0) {
    tocHtml += `<li class="toc-h3-group" data-group="${h.id}"><ul style="list-style:none;padding:0;margin:0;">`;
    children.forEach(c => {
      tocHtml += `<li><a class="toc-h3" href="#${c.id}">${c.textContent}</a></li>`;
    });
    tocHtml += '</ul></li>';
  }
}
tocHtml += '</ul>';
toc.innerHTML = tocHtml;

toc.querySelectorAll('.toc-arrow').forEach(arrow => {
  arrow.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const group = toc.querySelector('.toc-h3-group[data-group="' + arrow.dataset.target + '"]');
    const collapsed = group.classList.toggle('collapsed');
    arrow.classList.toggle('open', !collapsed);
    if (collapsed) {
      const activeInGroup = group.querySelector('a.active');
      if (activeInGroup) {
        activeInGroup.classList.remove('active');
        const parentLink = toc.querySelector('a[href="#' + arrow.dataset.target + '"]');
        if (parentLink) parentLink.classList.add('active');
      }
    }
  });
});

const tocLinks = toc.querySelectorAll('a[href^="#"]');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(a => a.classList.remove('active'));
      let targetId = entry.target.id;
      if (h3ToH2[targetId]) {
        const group = toc.querySelector('.toc-h3-group[data-group="' + h3ToH2[targetId] + '"]');
        if (group && group.classList.contains('collapsed')) {
          targetId = h3ToH2[targetId];
        }
      }
      const active = toc.querySelector('a[href="#' + targetId + '"]');
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
headings.forEach(h => observer.observe(h));
</script>
</body>
</html>
