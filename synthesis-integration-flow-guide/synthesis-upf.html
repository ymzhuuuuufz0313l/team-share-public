# 三、综合

&gt; 本章介绍 DC / Genus 综合。UPF 准备与检查仅作参考保留——**当前 Driver 项目不做该步骤**。

## 1. UPF 准备与检查（当前 Driver 项目不做该步骤）

NOTE: UPF 用于定义电源域，只有做了电源域划分的大芯片才需要。**当前 Driver 类项目均不使用 UPF、不做该步骤**；仅个别大型项目有 UPF 实例，本节内容仅供需要时参考。

### 1.1 lec_upf（当前 Driver 项目不做该步骤）

`lec_upf` 用于检查 UPF 文件本身的正确性。

- UPF 文件通常放在 `SYNTHESIS/common/upf/` 下。
- 输入 `report_top.txt` 需逐行检查：
  - library PG pin 定义是否正确
  - analog 电源域是否缺失
  - power port 电压定义是否合理
- 即使 UPF 已修正，仍可能存在 Error / Warning，需与模拟设计同事确认。

NOTE: 对需要做 UPF 的项目，`lec_upf` 与 CKF、nLint 一样，建议在综合前完成。

### 1.2 genus_upf 生成 final.upf（当前 Driver 项目不做该步骤）

部分 flow 需要借助 Genus 生成最终的 `*_final.upf`：

1. 从 genus 目录复制并新建 `*_genus_upf` 目录。
2. 修改 `compile_genus.tcl`：
   - 注释掉 `kv_genus_compile &quot;generic&quot;`
   - 增加 read UPF 相关命令
3. filelist 引用网表（`*.gv`）而非 RTL。
4. 顶层约束 `.tcl` 中的层级分隔符需与工具要求一致。
5. `settings.upf`（lec_upf 自动生成的文件名带 s）一般无需修改。
6. 运行 `run_genus`，检查 `genus.log` 与报告。

WARNING: 综合时代码中的 output / inout 不能直接接常量，否则 `genus_upf` 可能报错。

---

## 2. 综合（DC / Genus）

### 2.1 Design Compiler

```bash
cd dc
run_dc
```

前置条件：CKF、nLint、lec_upf 问题已清理。

`run_dc` 与 `compile_dc.tcl` 一般无需修改；Top synthesis 场景下可能需要修改 `compile_dc.tcl` 以生成 `dont_touch.tcl`，配合 APR 使用。

约束文件（通常位于 `SYNTHESIS/common/ip_cons/`）应包括：
- `kv_clock` / `kv_v_clock`：clock 点需为 macro 或 standard cell pin
- `kv_reset`
- `kv_inout`
- `kv_2clklist_group_path`
- `set_multicycle_path`

- `set_false_path`

- `set_dont_touch`：analog macro、standard cell、IO 等，防止被 DC 优化掉

部分项目还会有统一的公共 cons（如对 MEM scan_mode 等的 setting），可放在公共 tcl 中，也可放在 IP constraint 中。

下约束前必须非常了解 clock gen 的设计意图——约束只有下对地方，路径才能被全部 consume（覆盖）；下错地方会留下大量 unconstrained paths。

主要检查项：
- `dc.log`：无 Error、无 unresolved
- `*.chk_design`：无 undrive
- `*.rpt`：
  - area 符合预期
  - timing slack ≥ 0（signoff 版本必须 slack &gt; 0）
- constraint coverage：必须查看 unconstrained paths report，确认哪些路径没有被约束到

WARNING: DC 综合完成后必须确认没有未收敛的 timing violation——DC 修不下去时会自动放弃，此时面积数据是假的，给到 APR 的面积不准，交付前必须清零 violation。

margin 经验值：综合时序 margin 一般按 0.8 把握（曾尝试过 0.6），原则是"对自己紧一点、对后端松一点"，留太多或太少都未必好。

### 2.2 don't touch 使用纪律

compile 时必须加 don't touch，防止关键 cell（buffer、时钟生成单元等）被优化掉导致节点消失；但不能乱加——加错会导致后面 clock tree 出问题。

- 仅对需要保留的时钟生成单元、关键 buffer 加 don't touch；约束范围过大会让后续 timing 修调没有优化空间。
- don't touch 限制较大，实际需要的往往只是 `set_size_only`（sizing only）——更自由，允许 DC 调整 size。
- 手塞（hand-instantiated）cell：input 会被强制插 buffer、output 按与 APR 的沟通也强制加 output buffer，理论上代码里不必手塞；但有些手塞 delay 带有时序考虑（如错开 base），不能乱动。

### 2.3 Genus

```bash
cd genus
run_genus
```

若使用 DC，通常不需要运行 Genus。若项目指定使用 Genus，则需配置 `design.set` 中 `SYN_TOOL=genus`。

Genus 是与 DC 不同家的综合工具，目前基本不用，但脚本保留。历史用途：大芯片上 DC 综合后 LEC 一直过不了时，换 Genus 重新综合可以规避（不同家工具，避免"球员兼裁判"）。使用 Genus 时仍用 LEC 验证一致性（flow 未引入 formal）。

TIP: RTL 不要写得太复杂（如复杂组合回环），否则容易导致 LEC 不过。

主要检查项：
- `genus.log` 无 Error
- `*.rpt` 中 area、timing 符合预期

  <script>

const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbClose = document.getElementById('lightbox-close');
let scale = 1;
let isDragging = false;
let startX = 0, startY = 0, translateX = 0, translateY = 0;

function openLightbox(src) {
  lbImg.src = src;
  scale = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
  lightbox.classList.add('active');
}

function closeLightbox() {
  lightbox.classList.remove('active');
}

function updateTransform() {
  lbImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
}

document.addEventListener('click', (e) => {
  const img = e.target.closest('img');
  if (!img || img.id === 'lightbox-img' || !img.closest('.article')) return;
  openLightbox(img.src);
});

lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

lightbox.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.1 : 0.1;
  scale = Math.min(Math.max(0.5, scale + delta), 4);
  updateTransform();
});

lbImg.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  lbImg.classList.add('grabbing');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  translateX = e.clientX - startX;
  translateY = e.clientY - startY;
  updateTransform();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  lbImg.classList.remove('grabbing');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
});

const toc = document.getElementById('toc');
const h1 = article.querySelector('h1');
const headings = article.querySelectorAll('h2, h3');
headings.forEach((h, i) => { h.id = 'sec-' + i; });

// 标题统一自动编号：h2 = "N."，h3 = "N.M"；先剥离手写编号再重排，只改首个文本节点以保留标题内链接
let h2No = 0, h3No = 0;
headings.forEach(h => {
  if (h.firstChild && h.firstChild.nodeType === 3) {
    h.firstChild.nodeValue = h.firstChild.nodeValue.replace(/^\s*\d+(\.\d+)*[.、]?\s+/, '');
  }
  if (h.tagName === 'H2') {
    h2No++; h3No = 0;
    h.prepend(document.createTextNode(h2No + '. '));
  } else {
    h3No++;
    h.prepend(document.createTextNode(h2No + '.' + h3No + ' '));
  }
});

let tocHtml = '';
if (h1) {
  tocHtml += `<a class="toc-h1" href="#">${h1.textContent}</a>`;
}
tocHtml += '<ul style="list-style:none;padding:0;margin:0;">';
const h3ToH2 = {};
for (let i = 0; i < headings.length; i++) {
  const h = headings[i];
  if (h.tagName !== 'H2') continue;
  const children = [];
  let j = i + 1;
  while (j < headings.length && headings[j].tagName === 'H3') {
    children.push(headings[j]);
    h3ToH2[headings[j].id] = h.id;
    j++;
  }
  const arrow = children.length > 0
    ? `<span class="toc-arrow open" data-target="${h.id}">▸</span>`
    : '<span class="toc-arrow-spacer"></span>';
  tocHtml += `<li class="toc-h2-item">${arrow}<a href="#${h.id}">${h.textContent}</a></li>`;
  if (children.length > 0) {
    tocHtml += `<li class="toc-h3-group" data-group="${h.id}"><ul style="list-style:none;padding:0;margin:0;">`;
    children.forEach(c => {
      tocHtml += `<li><a class="toc-h3" href="#${c.id}">${c.textContent}</a></li>`;
    });
    tocHtml += '</ul></li>';
  }
}
tocHtml += '</ul>';
toc.innerHTML = tocHtml;

toc.querySelectorAll('.toc-arrow').forEach(arrow => {
  arrow.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const group = toc.querySelector('.toc-h3-group[data-group="' + arrow.dataset.target + '"]');
    const collapsed = group.classList.toggle('collapsed');
    arrow.classList.toggle('open', !collapsed);
    if (collapsed) {
      const activeInGroup = group.querySelector('a.active');
      if (activeInGroup) {
        activeInGroup.classList.remove('active');
        const parentLink = toc.querySelector('a[href="#' + arrow.dataset.target + '"]');
        if (parentLink) parentLink.classList.add('active');
      }
    }
  });
});

const tocLinks = toc.querySelectorAll('a[href^="#"]');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      tocLinks.forEach(a => a.classList.remove('active'));
      let targetId = entry.target.id;
      if (h3ToH2[targetId]) {
        const group = toc.querySelector('.toc-h3-group[data-group="' + h3ToH2[targetId] + '"]');
        if (group && group.classList.contains('collapsed')) {
          targetId = h3ToH2[targetId];
        }
      }
      const active = toc.querySelector('a[href="#' + targetId + '"]');
      if (active) active.classList.add('active');
    }
  });
}, { rootMargin: '-80px 0px -60% 0px', threshold: 0 });
headings.forEach(h => observer.observe(h));
</script>
</body>
</html>
