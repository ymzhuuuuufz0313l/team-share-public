:root{--bg:#f4f1ea;--surface:#fffdf7;--text:#1c2534;--muted:#667180;--accent:#b45309;--accent-strong:#92400e;--accent-soft:#f7e8d4;--ink:#0d1526;--ink2:#131f38;--line:#ddd6c8;--chip:#efe9db;--shadow:0 12px 32px rgba(28,37,52,.10);--pos:#15803d;--neg:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0e1420;--surface:#161f31;--text:#e9e5d9;--muted:#9aa4b5;--accent:#f0a137;--accent-strong:#f6b95c;--accent-soft:#3a2f1a;--line:#2b3852;--chip:#1e2a44;--shadow:0 12px 32px rgba(0,0,0,.45);--pos:#4ade80;--neg:#f87171}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.75}
a{color:var(--accent)}a:hover{color:var(--accent-strong)}
nav{position:sticky;top:0;z-index:50;background:var(--ink);display:flex;gap:2px;padding:0 16px;align-items:center;overflow-x:auto;box-shadow:0 2px 12px rgba(0,0,0,.25)}
nav .brand{color:#f0a137;font-weight:600;padding:12px 12px 12px 4px;white-space:nowrap;font-family:"IBM Plex Mono",monospace;letter-spacing:.08em}
nav a{color:#c8cede;text-decoration:none;padding:12px 11px;white-space:nowrap;font-size:13.5px;border-radius:8px 8px 0 0}
nav a:hover{color:#fff}
nav a.active{background:var(--accent);color:#fff}
.hero{background:linear-gradient(135deg,var(--ink),var(--ink2));color:#e9e5d9;padding:58px 24px 76px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 55px,rgba(240,161,55,.05) 55px 56px),repeating-linear-gradient(90deg,transparent 0 55px,rgba(240,161,55,.05) 55px 56px)}

.hero .inner{max-width:1020px;margin:0 auto;position:relative;z-index:1}
.kicker{font-family:"IBM Plex Mono",monospace;color:#f0a137;letter-spacing:.2em;font-size:12px;text-transform:uppercase;margin-bottom:14px}
.kicker::before{content:"—— "}
h1.display{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(30px,5vw,52px);line-height:1.25;margin:0 0 14px}
h1.display .thin{color:#f0a137}
.lead{color:#c8cede;max-width:680px;margin:0 0 18px}
.meta{font-family:"IBM Plex Mono",monospace;color:#9aa4b5;font-size:12px;letter-spacing:.08em}
.chips{margin-top:16px}
.chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#f0a137;border:1px solid rgba(240,161,55,.45);background:rgba(240,161,55,.08);border-radius:99px;padding:3px 12px;margin:0 8px 8px 0;letter-spacing:.05em}
.stats{max-width:1020px;margin:-54px auto 0;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;position:relative;z-index:2}
.stat{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;border-left:4px solid var(--accent)}
.stat .num{font-family:"IBM Plex Mono",monospace;font-size:21px;font-weight:600}
.stat .num.pos{color:var(--pos)}.stat .num.neg{color:var(--neg)}
.stat .lbl{color:var(--muted);font-size:12px;margin-top:2px}
main{max-width:1020px;margin:0 auto;padding:36px 24px 64px}
h1.page{font-family:"Noto Serif SC",serif;font-weight:900;font-size:30px;margin:0 0 6px}

h2.sec::after{content:"";display:inline-block;width:120px;height:1px;background:var(--line);margin-left:12px;vertical-align:middle}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.card .no{font-family:"IBM Plex Mono",monospace;color:var(--accent);font-size:12px;letter-spacing:.15em}
.card .t{font-weight:700;font-size:16px;margin:4px 0}
.card .d{color:var(--muted);font-size:13px}
.card a{color:inherit;text-decoration:none}
.card a:hover{color:var(--accent)}
.list{list-style:none;padding:0;margin:0}
.list li{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:10px 0;transition:transform .15s,box-shadow .15s}
.list li:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.list a{display:block;padding:14px 18px;color:var(--text);text-decoration:none;font-weight:600}
.list a:hover{color:var(--accent-strong)}
.list .d{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--chip);color:var(--accent-strong);border-radius:99px;padding:2px 10px;margin-left:8px}
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
table.data{border-collapse:collapse;width:100%;font-size:13px}
table.data th{background:var(--ink);color:#e9e5d9;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.05em;padding:10px 12px;position:sticky;top:0;cursor:pointer;white-space:nowrap;user-select:none}
table.data th:hover{color:#f0a137}
table.data th.sa::after{content:" ▲";color:#f0a137}
table.data th.sd::after{content:" ▼";color:#f0a137}
table.data td{border-bottom:1px solid var(--line);padding:8px 12px;white-space:nowrap}
table.data tbody tr:nth-child(even) td{background:rgba(0,0,0,.02)}
table.data tbody tr:hover td{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace}
.pos{color:var(--pos);font-weight:600}.neg{color:var(--neg);font-weight:600}
.bar{height:6px;background:var(--accent-soft);border-radius:4px;min-width:60px}
.bar i{display:block;height:6px;border-radius:4px;background:var(--accent)}
.search{width:100%;max-width:340px;padding:9px 16px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--text);font-size:14px;margin:0 0 14px;display:block}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.crumb{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin:18px 0 10px;padding:0 24px;max-width:1020px}
.crumb a{color:var(--accent)}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 30px;box-shadow:var(--shadow);margin-bottom:24px}
article h1{font-family:"Noto Serif SC",serif;font-size:25px;border-bottom:2px solid var(--line);padding-bottom:10px}
article h2{font-family:"Noto Serif SC",serif;font-size:20px;margin-top:30px;border-left:4px solid var(--accent);padding-left:10px}
article h3{font-family:"Noto Serif SC",serif;font-size:17px;margin-top:22px}
article table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px}
article th,article td{border:1px solid var(--line);padding:7px 10px;text-align:left}
article th{background:var(--chip);font-family:"IBM Plex Mono",monospace;font-size:12px}
article code{font-family:"IBM Plex Mono",monospace;background:var(--chip);color:var(--accent-strong);padding:1px 6px;border-radius:4px;font-size:.9em}
article pre{background:var(--ink);color:#e9e5d9;padding:14px 16px;border-radius:10px;overflow-x:auto}
article pre code{background:none;color:inherit}
article blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 16px;background:var(--accent-soft);border-radius:0 8px 8px 0}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center;padding:22px;font-family:"IBM Plex Mono",monospace;margin-top:30px}

<script>
document.querySelectorAll('table.data').forEach(function(tb){
  var head = tb.querySelector('thead');
  if(!head) return;
  head.querySelectorAll('th').forEach(function(th,col){
    th.title='点击排序';
    th.addEventListener('click',function(){
      head.querySelectorAll('th').forEach(function(o){o.classList.remove('sa','sd')});
      var tbody=tb.querySelector('tbody');
      var rows=[].slice.call(tbody.rows), dir=th.dataset.dir=-(th.dataset.dir||-1);
      th.classList.add(dir===1?'sa':'sd');
      rows.sort(function(a,b){
        var x=a.cells[col].textContent.trim().replace(/[+,%]/g,'').replace(/[,]/g,''), y=b.cells[col].textContent.trim().replace(/[+,%]/g,'').replace(/[,]/g,'');
        var nx=parseFloat(x), ny=parseFloat(y);
        if(!isNaN(nx)&&!isNaN(ny)) return (nx-ny)*dir;
        return x.localeCompare(y,'zh')*dir;
      });
      for(var i=0;i<rows.length;i++) tbody.appendChild(rows[i]);
    });
  });
});
document.querySelectorAll('.search').forEach(function(inp){
  inp.addEventListener('input',function(){
    var q=this.value.trim().toUpperCase();
    var tb=this.dataset.target;
    document.querySelectorAll(tb+' tbody tr').forEach(function(tr){
      tr.style.display = tr.textContent.toUpperCase().includes(q)?'':'none';
    });
  });
});
</script>
